# Classes and specializations. Since 0.31 (D-225): 6 classes × 2 roles with the chain combat (system: chain,
# diseno/04-combate/combate-en-cadena.md); the 15 classes and 46 specs below them are retired (retired: true, migrate_to).
# [ES] 0.31: arriba van las 12 especializaciones nuevas (las únicas que se juegan); abajo, las viejas retiradas. Lo de
# abajo (8 habilidades, puntos que las abren, barra elegible) vale solo para las retiradas.
# [ES] Clases y especializaciones. Cada entrada es una spec; "group" es su clase.
# El orden del archivo es el orden en que se muestran las clases y sus specs (el del diseño).
# Cada spec tiene 8 habilidades (D-79): se desbloquean con puntos de talento (balance.yaml talents.unlock)
# y el jugador lleva 3 en su barra de combate (Atacar + 3, D-46), siempre con una "respuesta" al aviso.
# Las 3 primeras son las de siempre; las 5 nuevas se inspiran en World of Warcraft y son algo más fuertes.
# Para qué sirve: definir las clases como datos; agregar una clase no requiere programar.
# Lo usan: engine/combat, engine/hero, engine/service (creación del héroe).
# Textos: content/locales/es.yaml (guerrero, picaro, sacerdote) y content/locales/es_clases.yaml (el resto).
# Si cambias esto, revisa: los IDs (de spec y de habilidad) son estables, nunca se renombran;
# cambiar números mueve el balance (anotarlo en el registro de balance: diseno/03-personaje/balance.md §7; medir con tools/sim.py --summary --real y --boss).
# D-110: medir también con tools/balance_report.py (rol por rol del nivel 1 al 100): el ataque mata más rápido, la defensa termina con más vida que
# el ataque de su clase y tiene más armadura base que él (tests/test_balance_d110.py), la curación es la que más vida deja, el soporte queda en medio.
# Las vidas y ataques por nivel que cambió D-110 movieron su base para que al nivel 6 (el Guardián) o al 3 (primeras peleas) queden igual.
# IDs viejos: guerrero = Guerrero Protección, picaro = Pícaro Asesinato, sacerdote = Sacerdote Disciplina.
# Campos de habilidad: kind =
#   strike (power; lifesteal opcional: parte del daño que te cura) | finisher (power + per_combo; gasta combos)
#   (las que no son respuesta aceptan también gain = recurso que dan; las que golpean, combo = combos que suman)
#   heal (value × vida máx.) | dot (power, rounds) | interrupt (power; corta un golpe interruptible si actúas antes)
#   response: block (frena value del golpe) | dodge (evita golpes esquivables) | shield (escudo de value × vida máx.)
#   empower (pegas más) | expose (el enemigo recibe más) | weaken (el enemigo pega menos) | hot (cura por ronda): value, rounds
# Opcionales: cost, cooldown, gain (recurso que da una respuesta).

# ======================================================================================================================
# 0.31 (D-225 a D-232): las 6 clases del parche de clases, combate y balance (diseno/04-combate/combate-en-cadena.md).
# 0.32 (D-233): el Paladín reemplaza al Chamán; quedan dos por armadura: Guerrero y Paladín (placa), Druida y
# Cazador (cuero), Sacerdote y Mago (tela), en ese orden (el de la creación del héroe).
# [ES] Cada clase tiene 2 roles (2 especializaciones). Todas juegan la misma cadena (system: chain): 4 botones, Básico
# (el "attack", link B), H1 Constructor, H2 Preparador y H3 Gastador; la energía, los costos, el orden de cada rol, las
# marcas y el premio están en balance.yaml chain. Aquí solo va qué hace cada botón.
# Regla madre (D-232): las clases de un mismo rol comparten el mismo esqueleto: la misma vida, ataque, armadura e iniciativa
# base y por nivel, y los mismos números en los botones; solo cambia el sabor (tests/test_clases_031.py lo vigila). Lo que
# separa a dos personajes del mismo rol es su equipo y su nivel.
# Los nombres de las habilidades y los porcentajes son borrador del parche (se pueden ajustar); la cadena, los costos y los
# combos son firmes. En una pelea solo, lo que elige un aliado, cura a varios o potencia al grupo cae en el héroe, y lo
# que pega a varios enemigos pega al de enfrente (engine/combat/chain_round.py).
# Campos de los botones (system: chain): link (B, H1, H2, H3); kind = strike (power) | dot (power por ronda, rounds) |
#   guard (value: frena esa parte de cada golpe, rounds; style aguante o esquiva: mismos números, D-232) | heal (value ×
#   vida máx.; split, group, hot, chain_free) | shield (value × vida máx., rounds) | empower | expose | weaken (value,
#   rounds; mark) | debuff (expose, weaken, interrupt). Extras: school, low_hp, vs_mark, consume_dot, per_dot_age,
#   counter_per_dodge, dodge_marks, charge, next_bonus, heal_boost, extend, weaken, interrupt, targets, threat (solo en grupo).
# Si cambias esto, revisa: la regla madre (mismos números por rol), tools/sim.py --summary --real y --boss, el registro de
# balance (diseno/03-personaje/balance.md) y los textos en content/locales/es_clases_031.yaml.

