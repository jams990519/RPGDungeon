# Classes and specializations: 15 classes, 46 specs (diseno/03-personaje/clases-y-especializaciones.md).
# [ES] Clases y especializaciones. Cada entrada es una spec; "group" es su clase.
# El orden del archivo es el orden en que se muestran las clases y sus specs (el del diseño).
# Cada spec tiene Atacar + 3 habilidades (D-46), al menos una "respuesta" al aviso, y un recurso.
# Para qué sirve: definir las clases como datos; agregar una clase no requiere programar.
# Lo usan: engine/combat, engine/hero, engine/service (creación del héroe).
# Textos: content/locales/es.yaml (guerrero, picaro, sacerdote) y content/locales/es_clases.yaml (el resto).
# Si cambias esto, revisa: los IDs (de spec y de habilidad) son estables, nunca se renombran;
# cambiar números mueve el balance (anotarlo en el registro de balance).
# IDs viejos: guerrero = Guerrero Protección, picaro = Pícaro Asesinato, sacerdote = Sacerdote Disciplina.
# Campos de habilidad: kind =
#   strike (power; lifesteal opcional: parte del daño que te cura) | finisher (power + per_combo; gasta combos)
#   heal (value × vida máx.) | dot (power, rounds) | interrupt (power; corta un golpe interruptible si actúas antes)
#   response: block (frena value del golpe) | dodge (evita golpes esquivables) | shield (escudo de value × vida máx.)
#   empower (pegas más) | expose (el enemigo recibe más) | weaken (el enemigo pega menos) | hot (cura por ronda): value, rounds
# Opcionales: cost, cooldown, gain (recurso que da una respuesta).


