prof:
  variant: "{name} · con {item}"   # [ES] D-183: receta que hace lo mismo que otra con un recurso del terreno ("🧪 Poción de vida ×2 · con ⏳ Arena fina")

node:                           # [ES] D-181, D-184: nodos de recursos del mapa (lugar fijo; de qué son, se sabe al llegar)
  icon_unknown: "✨"            # [ES] símbolo genérico del 🗺️ Mapa: hay un nodo, no sabes de qué (al llegar, el emoji de su recurso)
  arrive: "✨ ¡Encontraste un nodo de recursos! Es de {item}: aquí {effect}."
  effect: "su recurso rinde ×{mult} al recolectar y se agota más despacio"
  effect_rare: ", y a veces da {item}"
  zone_line: "{icon} Nodo de {item}: {effect}."
  map_unknown: "{icon} ({x}, {y}) · a {zones} {zones|zona|zonas}: un nodo de recursos, llega para saber de qué es"
  map_known: "{icon} ({x}, {y}) · a {zones} {zones|zona|zonas}: nodo de {item}"
  map_here: "{icon} Estás en un nodo de {item}: recolecta aquí."
  batch: "{icon} El nodo de {item} te dio +{n} de más."
  batch_rare: "{icon} En el nodo encontraste {item} ×{n}."
  grow_mark: " {icon}{emoji}"
