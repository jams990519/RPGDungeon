# Terrain resources (D-180, D-183) and resource nodes (D-181, D-184). Numbers live in content/balance.yaml (blocks
# resources.terrain and nodes); the catalog of each terrain in content/biomes.yaml ("own", "node_rare"); the items in
# content/items.yaml; their recipes in content/professions.yaml (the ones with "variant").
# [ES] Textos de los recursos propios de cada terreno (0.27, y la 🖤 obsidiana de la 0.28: nombre y "para qué sirve" en 📦 Recursos) y de los nodos de
# recursos del mapa (el símbolo genérico ✨ del 🗺️ Mapa, sus líneas, el aviso al llegar, la línea de 📍 Zona, lo que dio en el
# resumen de 🪓 Recolectar y la marca en ⬆️ Agrandar campamento). También prof.variant: el nombre de una receta que hace lo mismo
# que otra con un recurso del terreno. Se junta con es.yaml y los demás es_*.yaml al cargar (engine/core/content.py: las
# claves que ya existen, como item, resources o prof, se completan, no se pisan).
# Documento de diseño: diseno/02-mundo/mapa-infinito-y-viaje.md §1.12.2 (catálogo de cada terreno) y §1.16 (nodos de recursos)
# Lo leen: engine/service/game.py (sección "resource nodes": _node_discover, _node_effect_text, _node_icon, _node_map_lines,
#     _node_zone_lines, _node_batch_lines, _node_grow_mark; _recipe_name con prof.variant; _resources_view con resources.use).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Los números los pone el motor. Si cambias una clave, búscala
# en game.py: una clave que falta se ve como [clave] (tests/test_nodos_y_terrenos.py revisa que no falte ninguna).
# Si cambias node.icon_unknown, que no sea un símbolo que ya usa el mapa (🧍 👑 👹 🏕️ 🕳️ 🌀 ▪️ ▫️ ni un color de terreno).

