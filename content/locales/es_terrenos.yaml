  chatarra: "Chatarra"
  obsidiana: "Obsidiana"         # [ES] 0.28 (D-188): propia del 🌋 volcán

resources:
  use:                          # [ES] D-183: para qué sirve cada recurso del terreno (📦 Recursos); todos se venden al mercader
    bayas: "🍲 raciones con carne y el festín de la Cocina"
    setas: "🍲 raciones con carne en la Cocina"
    miel: "🩺 botiquines de la Medicina y 🍲 el festín de la Cocina"
    mazorca: "🍲 pescado asado con mazorca en la Cocina"
    lino: "la 🧶 Tejeduría lo vuelve tela"
    juncos: "la 🧶 Tejeduría lo vuelve tela (con fibra)"
    nenufar: "⚗️ pociones mayores sin flor de luna"
    cactus: "🩺 ungüentos de la Medicina (con tela)"
    datiles: "🍲 guiso del cazador en la Cocina"
    flor_escarcha: "⚗️ pociones mayores sin flor de luna (con cuarzo)"
    musgo: "🩺 ungüentos de la Medicina (con extracto)"
    raiz_amarga: "la 💧 Destilación la vuelve extracto (con hierba)"
    tomillo: "🍲 guiso del cazador en la Cocina"
    resina: "⚗️ sella frascos: pociones de vida con extracto"
    corteza: "la 🪣 Curtiduría: 3 pieles y corteza dan 2 cueros"
    carbon: "la 🔥 Fundición: 3 piezas de metal y carbón dan 2 lingotes"
    sal: "🍲 pescado a la sal y conservas en la Cocina"
    cuarzo: "⚗️ frascos de pociones mayores"
    arena: "⚗️ frascos de vidrio para pociones; 🗿 sillares con menos piedra"
