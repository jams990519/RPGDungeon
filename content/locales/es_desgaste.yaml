faq:                           # [ES] D-333: ❓ /d63 (content/faq.yaml); los números salen de balance.yaml durability (_repair_faq_values)
  d63:
    q: "🔧 ¿Por qué mi equipo dice ⚠️ o 🔧 84/100?"
    a: "Es su durabilidad: cada pelea gasta un poco lo que llevas puesto (más si huyes o caes). Al bajar del {wear_low} % de su máximo se marca ⚠️ y te avisamos; en 0 queda dañado: sigue puesto, pero no da bonos hasta que lo repares. En 🛡️ Equipo → 🔧 Reparar (/reparar) lo reparas tú con el oficio que hace esa pieza (rango desde su nivel − {repair_margin}, en su estación, con un refinado y ⚡), el herrero de cualquier 🔥 fogata por monedas, o un 📜 encargo a un artesano, que cobra por su trabajo (dura {repair_days} días; si nadie lo toma, te devolvemos las monedas). Cada reparación le baja {repair_loss} al máximo; después de {repairs} reparaciones ({repairs_mw} una ✒️ obra maestra), la próxima vez que llega a 0 se rompe para siempre: antes de la última te preguntamos. Tu equipo de antes empezó lleno."
