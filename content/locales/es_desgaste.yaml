# Texts of gear durability and repairs (D-139, confirmed; how it was applied: D-333, provisional; 0.57).
# [ES] Textos de la durabilidad del equipo y de 🔧 Reparar (D-139, confirmada por el dueño en E-23; cómo se aplicó: D-333,
# provisional). Se junta con es.yaml al cargar (engine/core/content.py). Lo lee: engine/service/repair.py (los avisos de desgaste
# al terminar una pelea, la pantalla 🔧 Reparar, la de cada pieza, la confirmación de la última reparación, los 📜 encargos de
# reparación y sus avisos a otros jugadores) y las marcas de durabilidad de 🛡️ Equipo, 🔁 Equipar, 🔽 Desequipar, la pieza, la
# ficha del héroe, el 🛒 Mercader, el 🏛️ Mercado y la ⚔️ Armería (engine/service/game.py, market.py, gremio.py).
# Una clave nueva va también en en_desgaste.yaml (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave
# que falta se ve como [clave].

