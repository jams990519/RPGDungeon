  quest:
    c1_m1:
      title: "La fogata que no se apaga"
      hablar: "Junto a la fogata, una mujer de brazos curtidos alimenta las llamas sin mirar a nadie. Dicen que se llama Marta y que ese fuego ya ardía antes del Colapso."
      ronda: "Marta: «Esta llama no se apagó cuando el mundo se rompió. Si se apaga ahora, se apaga el Claro. Recorre los alrededores: quiero saber qué ronda cerca.»\n🔎 Explora con 🧭 Explorar → 🔎 Explorar."
      lena: "Marta: «Nada se acerca… por ahora. Tráeme cuatro troncos de 🪵 madera: con eso pasamos la noche.»\n🪓 La madera se junta con 🧭 Explorar → 🪓 Recolectar."
      done: "Marta echa la leña al fuego y la llama sube, alta y quieta. «Ya eres del Claro», dice. «Aquí nadie pregunta de dónde vienes. Pero todos miran hacia dónde vas.»"
    c1_m2:
      title: "Todo vale algo"
      hablar: "Entre cajas y sacos remendados, un hombre flaco cuenta monedas que nadie le ve guardar. Es Odo, el mercader. Te mira como quien tasa una bota vieja."
      vender: "Odo: «¿Sin recuerdos y sin nada? Mal negocio. Pero todo vale algo, hasta lo roto. Tráeme lo que encuentres y véndemelo: tres cosas, para empezar.»\n🛒 El mercader está en 🏕️ Campamento, en el Claro."
      volver: "Odo guarda lo que le vendiste con un cuidado que no esperabas. Te hace una seña: tiene algo que contarte de antes del Colapso."
      done: "Odo baja la voz: «Antes había caminos de piedra que iban hasta el borde del mundo. El borde se fue lejos y los caminos se rompieron. La Cofradía vive de esos pedazos. Si te interesa, ya sabes dónde estoy.»"
    c1_m3:
      title: "Hierbas que recuerdan"
      hablar: "En una tienda que huele a humo dulce, una mujer joven muele hojas en silencio. Es Iria, la sanadora. Levanta la vista antes de que digas nada."
      hierbas: "Iria: «Las hierbas del Claro ya no alcanzan. Las que crecen más lejos curan más… y a veces hacen soñar cosas que no viviste. Tráeme cuatro manojos de 🌿 hierba curativa.»\n🌿 Crece en praderas, bosques y pantanos, fuera del Claro."
      entregar: "Ya tienes las hierbas. Algunas brillan apenas cuando cae la tarde, como si guardaran luz. Llévale tres a Iria."
      done: "Iria huele las hojas y cierra los ojos. «Vienen de lejos: tienen un brillo que el Claro no tiene. El Colapso no solo rompió el mundo; dejó algo suelto allá afuera. El Círculo del Umbral quiere entender qué.»"
    c1_m4:
      title: "Huellas al este"
      hablar: "Un viejo de barba gris remienda un mapa lleno de agujeros junto al fuego. Cojea al levantarse. «Anselmo», se presenta. «Fui más lejos que nadie y volví. Casi entero.»"
      salir: "Anselmo: «Las bestias cambiaron después del Colapso. Algo las empuja desde el bosque. Sal del Claro: ve al menos a dos zonas de distancia y mira con tus propios ojos.»\n🚶 Muévete desde 📍 Zona; cada zona toma su tiempo."
      bestias: "Aquí la tierra está revuelta: huellas de lobo, de jabalí… y algo que arrastra raíces. Vence a tres bestias de estas tierras.\n🏹 Puedes salir a cazar desde 🧭 Explorar."
      contar: "Viste lo suficiente. Vuelve al Claro y cuéntale a Anselmo lo de las raíces."
      done: "Anselmo escucha sin interrumpir. «Raíces que se arrastran… Entonces es cierto: el viejo del bosque despertó. Lo llaman Raigambre. Guardaba este lugar mucho antes de que hubiera Claro. Si se enoja, no habrá fogata que alcance.»"
    c1_m5:
      title: "El ámbar que canta"
      hablar: "El yunque suena desde lejos. Una mujer ancha, con el pelo atado y quemaduras viejas en los brazos, golpea un hierro al rojo. Es Brena, la herrera."
      fabricar: "Brena: «Nadie sabe hacer nada en este Claro. Demuéstrame que tú sí: fabrica algo en una estación. Lo que sea. Un tablón, una venda, una poción.»\n⚒️ Las estaciones están en 🏕️ Campamento → 🛠️ Fabricar."
      ambar: "Brena te muestra una astilla de ámbar del tamaño de un dedo. Zumba bajito, como una colmena lejana. «Salió entre la chatarra que le compré a Odo. De noche canta. No sé qué es.»\n🌿 Iria la estudiaría para el Círculo del Umbral.\n⚒️ Brena la fundiría en el yunque para la Llama Común.\n🪙 Odo pagaría bien por ella para la Cofradía."
      opt_iria: "🌿 Dársela a Iria"
      opt_brena: "⚒️ Que Brena la funda"
      opt_odo: "🪙 Vendérsela a Odo"
      ambar_done_iria: "Iria toma la astilla con las dos manos, como si quemara. «Esto es un pedazo de algo vivo», susurra. «Lo voy a escuchar.»"
      ambar_done_brena: "Brena tira la astilla al crisol. El ámbar chilla al fundirse y el hierro sale con vetas doradas. «Ahora sirve para algo», gruñe."
      ambar_done_odo: "Odo la mira a contraluz y silba. «Esto no es ámbar común.» Te paga sin regatear, y eso te preocupa más que nada."
      done: "Brena vuelve al yunque. «Lo que hiciste con esa astilla no se olvida», dice sin mirarte. «En el Claro todos se enteran de todo.»"
    c1_m6:
      title: "Raíces en el camino"
      hablar: "Anselmo tiene el mapa abierto sobre las rodillas. Marcó con carbón un punto al este, en un bosque. «Ahí duerme Raigambre. O dormía. Necesito saber si sus raíces llegan a los caminos.»"
      bosque: "Anselmo: «Las bestias del bosque y del pantano son las primeras en sentirlo. Vence a tres en esas tierras y fíjate de qué huyen.»\n🌲 Busca zonas de 🌲 bosque o 🐸 pantano en tu 🗺️ Mapa."
      herido: "Entre los árboles encuentras a un chatarrero de la Cofradía atrapado por raíces que se mueven solas. Se llama Tano y está muy herido. Las raíces se retiran hacia el este y dejan un rastro fresco que nadie volverá a ver tan claro."
      opt_cargar: "🫂 Cargar a Tano al Claro"
      opt_rastro: "🌀 Seguir el rastro"
      herido_done_cargar: "Cargas a Tano todo el camino. Pesa, se queja, sangra. Pero llega vivo. Odo lo recibe sin decir nada y te aprieta el hombro."
      herido_done_rastro: "Dejas a Tano con agua y sigues el rastro. Donde las raíces se hunden en la tierra crecen dos 🌸 flores de luna que brillan solas. Cuando vuelves por Tano, ya no está."
      informe: "Tienes lo que Anselmo necesitaba saber. Vuelve al Claro y cuéntale lo que viste en el bosque."
      done: "Anselmo marca en el mapa la guarida del Guardián. «Ya no hay dudas: Raigambre está despierto y su raíz llega hasta el Claro. Alguien tiene que ir a verlo de frente.» No te mira. No hace falta."
    c1_m7:
      title: "El corazón de ámbar"
      hablar: "Esa noche, alrededor de la fogata, nadie habla de otra cosa. Marta te hace una seña desde el fuego: «Ven. Hay que decidir quién va al bosque.»"
      hablar_done_cargar: "Junto al fuego está Tano, vendado y pálido. Te pone una bolsa en la mano: «Te debo la vida. Es poco, pero es todo lo que tengo.»"
      hablar_done_rastro: "Alguien dice que vio a Tano entrar solo al bosque, de noche. Nadie lo volvió a ver. Marta no te mira."
      ayuda: "Marta: «Ya está decidido: vas tú. Pero no vas sin ayuda.»"
      ayuda_iria: "Marta: «Iria quiere verte antes de que salgas. Dice que la astilla le habló.»"
      ayuda_brena: "Marta: «Brena te espera en la forja. Dice que tiene algo para ti.»"
      ayuda_odo: "Marta: «Odo pregunta por ti. Dice que te debe algo, y eso no pasa nunca.»"
      ayuda_done_iria: "Iria: «La astilla canta una sola palabra: corazón. Raigambre tiene un corazón de ámbar. Llévate esto: el bosque muerde.»"
      ayuda_done_brena: "Brena: «Con el hierro del ámbar fundido saqué estos lingotes. Úsalos o véndelos, pero vuelve.»"
      ayuda_done_odo: "Odo: «Ese ámbar lo vendí lejos, a gente que pregunta poco. Esta es tu parte. No la gastes toda en el bosque.»"
      guarida: "Todo está listo. La guarida de Raigambre queda al este, en lo hondo del bosque. Ve hasta allí.\n👑 Aparece en 🗺️ Mapa y en 📒 Lugares cuando alguien la descubre."
      guardian: "El bosque se calla de golpe. Entre los troncos, algo enorme abre los ojos: un cuerpo de raíz y corteza, con un brillo de ámbar en el pecho. Raigambre.\n⚔️ Desafíalo desde 🧭 Explorar. Lee sus avisos: los golpes grandes se anuncian."
      regreso: "Raigambre cae de rodillas y se hunde en la tierra, sin morir del todo. Donde latía su corazón ves la boca de un camino de piedra que baja hacia el este. Vuelve al Claro y cuéntaselo a Marta."
      done: "Marta te escucha junto a la fogata y, por primera vez, la llama tiembla. «Un camino bajo las raíces…», murmura. «Entonces Raigambre no atacaba el Claro: lo estaba tapando.» Muy lejos, algo responde con un sonido grave. El Capítulo 2 abrirá ese camino."

    o_desertor_1:
      title: "Botas de soldado"
      hablar: "Marta se fija en tus botas antes que en tu cara. «Botas de soldado», dice. «Ayer un jinete preguntó por desertores.»"
      buscar: "Marta: «Buscaba a alguien con una cicatriz en la mano y miedo en los ojos. No le dije nada. Recorre los alrededores y fíjate si sigue cerca.»"
      volver: "No viste jinetes, pero sí huellas de herradura que se van hacia el este. Vuelve con Marta."
      done: "Marta asiente. «Aquí no hay banderas, solo una fogata. Si alguien viene por ti, tendrá que pasar primero por mí.»"
    o_desertor_2:
      title: "Herraduras al este"
      hablar: "Anselmo conoce todas las huellas que pasan por el Claro. «Herraduras de guerra», dice al verlas. «Hace años que no veía caballos así.»"
      salir: "Anselmo: «Iban hacia el este, a dos zonas o más. Si quieres saber quién te busca, tendrás que salir.»"
      bestias: "Encuentras una fogata apagada, una bandera rota y un escudo que conoces: el de tu antiguo capitán. Algo lo atacó aquí. Vence a las bestias que rondan el lugar."
      done: "Entre las cenizas hay una carta a medio quemar con tu nombre. Solo se lee una frase: «…no fue culpa tuya. Ven a buscarme.»"
    o_desertor_3:
      title: "Una medalla en venta"
      hablar: "Odo hace girar una medalla entre los dedos. «Me la vendió un chatarrero. La encontró en el bosque, junto a un hombre que ya no respiraba.» Es la medalla de tu capitán."
      pieles: "Odo: «No regalo nada, ya me conoces. Pero un cambio es un cambio: tráeme dos 🦌 pieles y es tuya.»\n🦌 Las bestias sueltan piel al vencerlas."
      marta: "Con la medalla en la mano vuelves a la fogata. Marta es la única que conoce tu historia."
      done: "Marta mira la medalla y te cierra el puño sobre ella. «Tu capitán murió buscándote, o buscando perdón. Ahora tú decides qué eres: alguien que huyó o alguien que se quedó a cuidar este fuego.»"
    o_aprendiz_1:
      title: "Manos que recuerdan"
      hablar: "Brena te ve mirar el yunque. «Tienes manos de taller», gruñe. «¿De quién aprendiste?» No recuerdas su nombre, pero sí sus manos."
      hacer: "Brena: «Si aprendiste algo, se nota en el trabajo, no en la boca. Haz algo en una estación y te digo de qué escuela vienes.»\n⚒️ Las estaciones están en 🏕️ Campamento → 🛠️ Fabricar."
      mostrar: "Ya hiciste algo con tus manos. Muéstraselo a Brena."
      done: "Brena da vuelta tu trabajo y se queda quieta. «Esta forma de cerrar la juntura solo la enseñaba un maestro: Teodoro el Alto. Partió lejos del Claro hace dos inviernos. No volvió.»"
    o_aprendiz_2:
      title: "Las herramientas del maestro"
      hablar: "Anselmo recuerda a Teodoro. «Iba con un carro lleno de herramientas. Lo vi pasar hacia el este, por los caminos rotos.»"
      salir: "Anselmo: «Si dejó algo, lo dejó en el camino. Ve a dos zonas de distancia o más y busca restos de un carro.»"
      carro: "Encuentras huellas de ruedas que se pierden entre la hierba. Explora con calma: un carro no desaparece así nomás."
      done: "Bajo unas raíces aparece una caja de herramientas con tu marca de aprendiz grabada en la tapa. Adentro, una nota: «Para cuando estés listo.»"
    o_aprendiz_3:
      title: "Para cuando estés listo"
      hablar: "Iria acerca la nota de tu maestro a la vela. Aparecen letras nuevas, escritas con jugo de hierba. «Tinta de sanador», sonríe."
      hacer: "La nota dice: «Un artesano no espera a que el mundo se arregle: lo arregla. Haz dos cosas más con tus manos y sigue mis pasos hacia el este.»"
      brena: "Hiciste lo que pedía tu maestro. Cuéntaselo a Brena."
      done: "Brena te da una palmada en la espalda que casi te tira. «Teodoro estaría orgulloso. Su taller vacío ahora es tuyo: llénalo.»"
    o_huerfano_1:
      title: "Ojos de la calle"
      hablar: "Odo te reconoce por cómo miras sus cajas. «Tú eres de los túneles», dice. «Se nota: miras primero dónde está la salida.»"
      vender: "Odo: «Los de abajo siempre fueron buenos para encontrar lo que otros pierden. Véndeme dos cosas y hablamos de negocios.»"
      volver: "Vendiste lo tuyo. Odo te hace una seña para que te acerques."
      done: "Odo baja la voz. «Los túneles bajo el Claro son más viejos que el Colapso. Algunos se movieron solos. Ten cuidado con lo que encuentres ahí abajo.»"
    o_huerfano_2:
      title: "Los túneles se mueven"
      hablar: "Anselmo extiende su mapa: tiene marcadas bocas de túnel por todo el Claro. «Antes había una sola. Ahora hay muchas. Algo cava desde abajo.»"
      claro: "Anselmo: «Conoce el Claro entero, palmo a palmo. Si hay bocas nuevas, las vas a ver.»"
      bestias: "En el borde del Claro, una boca de túnel nueva respira aire tibio. Algo salió de ahí. Vence a dos bestias de los alrededores."
      done: "Junto a la boca del túnel encuentras un juguete de madera tallado con tu nombre. Alguien te conocía antes del Colapso."
    o_huerfano_3:
      title: "Un nombre propio"
      hablar: "Le muestras el juguete a Marta. Lo mira mucho rato. «Este juguete lo talló mi hermano», dice al fin. «Para los chicos de los túneles. Para ti.»"
      juntar: "Marta: «Mi hermano se perdió en el Colapso, y los chicos que cuidaba quedaron sin nadie. Si quieres honrarlo, ayuda al Claro: junta seis cosas útiles, lo que sea.»"
      volver: "Juntaste lo que pedía Marta. Vuelve a la fogata."
      done: "Marta te pone una mano en el hombro. «Ya tienes un nombre propio, y una casa. No vuelvas a esconderte bajo tierra.»"
    o_noble_1:
      title: "Un sello en la plata"
      hablar: "Odo muerde tu moneda de plata y levanta una ceja. «Sello de casa noble. Hace años que no veía uno. ¿Sabías que tu casa le debía a medio Claro?»"
      vender: "Odo: «Tranquilidad: las deudas murieron con el Colapso. Pero si quieres que te traten bien, empieza a hacer negocios como todos: véndeme dos cosas.»"
      volver: "Odo te espera con una sonrisa de mercader."
      done: "Odo: «Tu casa tenía tierras al norte, junto a un río. El Colapso las dejó lejos del Claro. Dicen que tu escudo sigue en pie en algún lado.»"
    o_noble_2:
      title: "Tierras que se fueron"
      hablar: "Anselmo conoce tu escudo. «Lo vi tallado en una piedra, en un cerro. Las tierras se van, pero las piedras se quedan.»"
      salir: "Anselmo: «Sal a dos zonas o más del Claro, hacia donde te lleve el camino. Las piedras de tu casa están en algún lugar.»"
      piedras: "Encuentras una piedra tallada con medio escudo, cubierta de musgo. Explora los alrededores: puede haber más."
      done: "Más allá aparecen los cimientos de una torre. No queda nada que heredar: solo el nombre, y lo que hagas con él."
    o_noble_3:
      title: "Lo que hagas con él"
      hablar: "Marta escucha tu historia sin impresionarse. «Aquí los nobles comen la misma sopa que los demás», dice. «Pero hay algo que la buena sangre sabe hacer: dar.»"
      dar: "Marta: «Los recién despertados llegan sin nada, como llegaste tú. Tráeme 🧵 fibra y 🪵 madera para ellos: cuatro de cada una.»"
      done: "Marta reparte la leña y la fibra entre los recién llegados. Nadie sabe que vino de ti, y está bien así. «Ahora sí eres de buena sangre», dice."
    o_curandero_1:
      title: "Manos que saben"
      hablar: "Iria te mira las manos: tienen manchas verdes que no se van. «Manos de curandero», dice. Recuerdas una fiebre gris que vaciaba casas."
      fibra: "Iria: «Para vendar hace falta fibra. Junta tres manojos de 🧵 fibra y te cuento lo que sé de la fiebre gris.»"
      entregar: "Ya tienes la fibra. Llévasela a Iria."
      done: "Iria trenza la fibra con hierbas mientras habla. «La fiebre gris llegó también aquí, después del Colapso. Venía del este. Como todo lo raro.»"
    o_curandero_2:
      title: "Lo que trae el viento"
      hablar: "Anselmo tose al recordarlo. «La fiebre gris. Yo la tuve, allá lejos. Me curó una flor que brillaba de noche.»"
      salir: "Anselmo: «Si quieres entender la fiebre, ve hacia donde nace el viento del este: a dos zonas o más.»"
      hojas: "Las hierbas de aquí tienen un tono gris en la punta de las hojas. Junta tres 🌿 hierbas curativas para estudiarlas."
      done: "Al frotar las hojas grises, el olor te devuelve un recuerdo entero: tu aldea, tu maestra, la cura que no llegó a tiempo. No fue tu culpa. Pero aprendiste."
    o_curandero_3:
      title: "La cura que faltó"
      hablar: "Iria examina las hojas grises. «La fiebre y la flor vienen del mismo lugar», dice. «Lo que dejó el Colapso enferma y cura.»"
      remedio: "Iria: «Preparemos remedios para el Claro, por si vuelve la fiebre. Haz algo en una estación: una venda, una poción, lo que sepas.»"
      marta: "Hiciste tu parte. Marta quiere agradecerte en nombre del Claro."
      done: "Marta guarda tus remedios en la posada, junto al fuego. «Si vuelve la fiebre, esta vez no nos agarra desprevenidos. Gracias a ti.»"
    o_minero_1:
      title: "Polvo de mina"
      hablar: "Brena huele el polvo de tu ropa. «Polvo de veta honda», dice. «De mineros no quedan muchos. ¿Qué viste allá abajo?»"
      terreno: "Brena: «Antes de contarme, aprende el terreno. Recorre los alrededores: un minero que no conoce el suelo dura poco.»"
      metal: "Brena: «Y tráeme metal: dos ⚙️ piezas. Quiero ver qué vetas hay cerca.»\n⚙️ El metal sale explorando, o recolectando en colinas, montañas y ruinas."
      done: "Brena hace sonar el metal contra el yunque. «Metal viejo, de antes del Colapso. Las vetas nuevas suenan distinto. Como si algo las hubiera movido.»"
    o_minero_2:
      title: "El sonido en lo hondo"
      hablar: "«El sonido en lo hondo», repite Anselmo, serio. «Lo oí en una mina del este. Como un corazón muy grande que late despacio.»"
      salir: "Anselmo: «Ve a dos zonas o más del Claro y apoya la oreja en la roca. Si late, sabremos que no lo imaginaste.»"
      piedra: "Junta cuatro 🪨 piedras de estas tierras. Algunas están tibias, como si algo respirara debajo."
      done: "Al partir una piedra tibia aparece una veta dorada, casi ámbar. Late. Muy despacio."
    o_minero_3:
      title: "Una veta que late"
      hablar: "Odo ve la piedra con la veta dorada y deja de sonreír. «Eso no lo vendas», dice. «Hay gente que mataría por saber dónde lo encontraste.»"
      bestias: "Odo: «Algo te siguió desde la mina. Vi bestias rondando el camino. Encárgate de dos antes de que lleguen al Claro.»"
      brena: "Vuelve con Brena: ella sabrá qué hacer con la veta."
      done: "Brena guarda la piedra en un cajón con llave. «Esto es lo que despertó en tu mina: ámbar vivo, como el corazón del Guardián. Algún día sabremos qué significa.»"
