# Story and roleplay texts (D-117, provisional). Structure, numbers and ids live in content/story.yaml.
# [ES] Textos de la historia y el rol: orígenes, personajes, facciones, misiones del Capítulo 1 y de cada origen,
# encargos, diario y gestos. El motor solo usa las claves (las arma con los ids de content/story.yaml).
# Lo leen: engine/core/content.py (se junta con es.yaml) y engine/service/story.py.
# Estilo: español neutro, de tú, frases cortas para el teléfono (2 a 5 líneas por paso). El héroe no tiene género
# guardado: evitar adjetivos que lo marquen ("listo", "solo") y escribir el diario en tercera persona neutra.
# Si cambias una clave, búscala en engine/service/story.py y en content/story.yaml: una clave que falta se ve como [clave]
# (tests/test_story.py revisa que toda misión, paso, opción, personaje, facción, encargo y título tenga su texto).

