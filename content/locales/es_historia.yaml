  # ---- Facciones
  faction:
    llama:
      name: "🔥 La Llama Común"
      desc: "Guardan la fogata del Claro y quieren levantar de nuevo lo que el Colapso rompió: casas, caminos, gente."
    umbral:
      name: "🌀 El Círculo del Umbral"
      desc: "Estudian el Colapso y su poder. Creen que entenderlo es la única forma de que no vuelva a pasar."
    restos:
      name: "⚙️ La Cofradía de los Restos"
      desc: "Chatarreros, mercaderes y gente de los túneles: viven de lo que quedó. Lo viejo se vende; lo roto se arregla."

  # ---- Personajes del Claro (un saludo por situación; gana el primero que se cumple en content/story.yaml)
  npc:
    marta:
      name: "Marta"
      role: "la posadera de la Fogata"
      lines:
        first: "¿Recién despertaste? Siéntate cerca del fuego. Aquí nadie pregunta de dónde vienes."
        default: "La fogata no se apaga sola, ¿sabes? Alguien tiene que cuidarla."
        known: "Ya eres del Claro. Si tienes frío, el fuego es de todos."
        friend: "Para ti siempre hay sopa caliente. La Llama no olvida a los suyos."
        night: "Esta noche la llama tiembla. Algo grande se mueve en el bosque."
        tano: "Tano no para de contar que lo cargaste hasta aquí. Ya es una leyenda, y tú con él."
        cold: "Calienta tus manos y sigue tu camino. La Llama no está contenta contigo."
        hero: "La llama está quieta desde que volviste del bosque. Nunca la vi así. Gracias."
    odo:
      name: "Odo"
      role: "el mercader"
      lines:
        first: "¿Sin recuerdos y sin nada? Mal negocio. Pero todo vale algo, hasta lo roto."
        default: "Compro, vendo y no pregunto. Bueno, pregunto un poco."
        known: "Mi cliente favorito. No se lo digas a nadie: arruinas mi fama."
        friend: "Para los amigos de la Cofradía, siempre hay un precio mejor… otro día."
        ambar_sold: "Ese ámbar que me vendiste ya está muy lejos. Mejor no preguntes dónde."
        tano: "Tano es mi sobrino, ¿sabías? Bueno, casi. Le salvaste la vida. Te debo una."
        tano_lost: "Tano no volvió del bosque. Alguien lo dejó atrás. No digo quién."
        cold: "Vendo, pero no fío. Y a ti, menos."
        hero: "Dicen que bajo las raíces hay un camino de piedra. Los caminos de piedra llevan a cosas viejas. Y lo viejo se vende."
    iria:
      name: "Iria"
      role: "la sanadora"
      lines:
        first: "Te estaba esperando. No me preguntes cómo lo supe."
        default: "Las hierbas de lejos curan más. Y a veces hacen soñar cosas que no viviste."
        known: "Las hojas que me trajiste siguen brillando de noche. El Colapso dejó algo vivo allá afuera."
        friend: "El Círculo te tiene en cuenta. Pocos miran tan lejos como tú."
        ambar_kept: "La astilla canta de noche. Creo que repite una palabra: corazón."
        ambar_melted: "Brena fundió algo que no entendía. Ojalá no lo lamentemos."
        cold: "Hay heridas que no curo. La desconfianza es una."
        hero: "Raigambre no murió: duerme. Y su sueño tapa algo. Ten cuidado con lo que despiertes."
    anselmo:
      name: "Anselmo"
      role: "el viejo explorador"
      lines:
        first: "Fui más lejos que nadie y volví. Casi entero. Siéntate, que la historia es larga."
        default: "Mi mapa tiene más agujeros que papel. Cuanto más lejos del Claro, menos sabemos."
        roots: "Raíces que se arrastran… Raigambre despertó. Hay que vigilar el bosque."
        lair: "La guarida está marcada. Cuando estés en condiciones, ve. No antes."
        friend: "Te mostraría mi mapa entero, si lo tuviera entero."
        cold: "Hay caminos que no se recorren con cualquiera."
        hero: "Un camino bajo las raíces. Lo sabía. Lo sabía y nadie me creía."
    brena:
      name: "Brena"
      role: "la herrera"
      lines:
        first: "Si vienes a mirar, mira. Si vienes a ayudar, agarra algo."
        default: "El hierro no miente. La gente sí."
        known: "Tus manos ya no son de recién llegado. Bien."
        friend: "Para la gente de la Llama, el yunque siempre está libre."
        ambar_forged: "El hierro con vetas de ámbar no se enfría nunca. Raro. Útil, pero raro."
        ambar_sold: "Esa astilla era del Claro y terminó en el bolsillo de Odo. Mal hecho."
        cold: "Mi yunque no es para cualquiera."
        hero: "Dicen que lo enfrentaste de frente. Así se hace. Sin vueltas."

  # ---- Orígenes
  origin:
    desertor:
      name: "🪖 Soldado desertor"
      intro: "Recuerdas botas de soldado, una bandera que quemaste y una guerra que ya no tiene bandos."
      trait: "sabes despiezar presas como en campaña: +15 % de experiencia de 🔪 Desollador."
      gift: "2 🩹 vendas de tu antiguo morral."
    aprendiz:
      name: "🛠️ Aprendiz de gremio"
      intro: "Recuerdas el olor de un taller, las manos de tu maestro guiando las tuyas y el día que partió lejos del Claro."
      trait: "aprendiste en un taller: +10 % de experiencia en los oficios de refinado y de fabricación."
      gift: "1 🟫 tablón y 1 🔩 lingote del taller de tu maestro."
    huerfano:
      name: "🕳️ Huérfano de las Ruinas"
      intro: "Recuerdas túneles oscuros bajo el Claro, pan robado y un nombre que nadie te dio."
      trait: "regateas como en la calle: el mercader del Claro te vende un 10 % más barato."
      gift: "20 🥉 escondidas en la suela."
    noble:
      name: "🏵️ Noble caído"
      intro: "Recuerdas salones fríos, un escudo de familia y tierras que el Colapso se tragó en una noche."
      trait: "sabes tratar con la gente: ganas un 10 % más de reputación con las facciones."
      gift: "1 🥈 de plata con el sello de tu casa."
    curandero:
      name: "⚕️ Curandero de aldea"
      intro: "Recuerdas una aldea con fiebre, hierbas que no alcanzaron y caras que todavía ves al cerrar los ojos."
      trait: "conoces las plantas que curan: +15 % de experiencia de 🌿 Herbolario."
      gift: "3 🌿 hierbas curativas envueltas en un pañuelo."
    minero:
      name: "⛏️ Minero de las vetas"
      intro: "Recuerdas el frío de la mina, el golpe del pico y un sonido en lo hondo que no era de piedra."
      trait: "leíste vetas toda tu vida: +15 % de experiencia de ⛏️ Minero."
      gift: "3 ⚙️ piezas de metal de tu última jornada."

