faq:                           # [ES] D-336: ❓ /d65 (content/faq.yaml); los números salen de balance.yaml permadeath (_oath_faq_values)
  d65:
    q: "💀 ¿Qué es la muerte permanente?"
    a: "Es un juramento opcional: en ⚙️ Opciones → 💀 Muerte permanente, hasta el nivel {oath_level} y con dos confirmaciones. No se puede deshacer. Desde ahí tu héroe tiene una sola vida: si pierde cualquier pelea, cae para siempre y queda en el 🪦 Salón de los caídos (/caidos) con todo lo que llevaba; sale de su campamento y de su gremio, y creas un héroe nuevo desde cero. Siguen tu cuenta, tu idioma, tus ⚙️ Opciones y tus 💎 diamantes. Mientras vive lleva la marca 💀 y gana títulos a los {oath_days} días: solo prestigio, sin estadísticas ni monedas. Quien la jura no lidera gremios ni campamentos."

batch:
  reason:
    auto_fell: "💀 Un {enemy} (nv {level}) te venció en una pelea automática."   # [ES] D-336: el lote termina con la caída para siempre

tend:                          # [ES] D-145, D-336: un oficio que recolecta en una zona hace que ese recurso vuelva más rápido un tiempo
  zone_line: "🌱 {emoji} {name} vuelve más rápido por {prof}: +{pct} % · {left}"

story:
  journal:
    oath: "💀 Juró la muerte permanente."
    fell: "🪦 Cayó para siempre ante {enemy}."
  titles:                      # [ES] los títulos de prestigio de la muerte permanente (balance.yaml permadeath.titles)
    hierro_7: "«Superviviente de hierro»"
    hierro_30: "«Veterano de hierro»"
    hierro_100: "«Leyenda de hierro»"
