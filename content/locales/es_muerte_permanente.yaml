# Texts of 0.60: the 💀 optional permadeath and the 🪦 hall of the fallen (D-147, confirmed; how it was applied: D-336,
# provisional), and the line of a zone that a profession tends (D-145, confirmed; D-336).
# [ES] Textos de la 💀 muerte permanente opcional (⚙️ Opciones → 💀 Muerte permanente, sus dos confirmaciones, la caída, el
# 🪦 Salón de los caídos y el aviso a los compañeros), de sus títulos de prestigio y de la línea 🌱 de 📍 Zona (los oficios
# aceleran lo que vuelve). Se junta con es.yaml al cargar (engine/core/content.py: las claves que ya existen, como story,
# se completan, no se pisan).
# Documento de diseño: diseno/05-salud/secuelas-y-muerte.md §4.2; diseno/02-mundo/mapa-infinito-y-viaje.md §1.12
# Lo leen: engine/service/permadeath.py (todo lo de oath.*), engine/service/story.py (📔 Diario: story.journal.oath y
#     story.journal.fell; los títulos story.titles.hierro_*) y engine/service/game.py (_tend_lines: tend.zone_line).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Una clave nueva va también en en_muerte_permanente.yaml
# (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se ve como [clave].

