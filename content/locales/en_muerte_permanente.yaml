faq:
  d65:
    q: "💀 What is permadeath?"
    a: "It is an optional oath: in ⚙️ Options → 💀 Permadeath, up to level {oath_level} and with two confirmations. It cannot be undone. From then on your hero has a single life: if they lose any fight, they fall for ever and stay in the 🪦 Hall of the Fallen (/fallen) with everything they carried; they leave their camp and guild, and you create a new hero from scratch. Your account, your language, your ⚙️ Options and your 💎 diamonds stay. While they live they carry the 💀 mark and earn titles at {oath_days} days: prestige only, no stats and no coins. Whoever swears it leads no guild or camp."

