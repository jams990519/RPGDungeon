        warn: The phoenix burns brighter, rising from its ASHES. If you let it finish, its next hit will be fierce. (Can be interrupted)
  wyrm_de_hielo:
    name: Ice Wyrm
    moves:
      mordida_de_hielo:
        name: Ice Bite
        warn: A white wyrm emerges from a crack in the glacier.
      aliento_glacial:
        name: Glacial Breath
        warn: 'The wyrm draws a breath and the cold bites your face: it''s about to blow ICE. (Can be dodged, or interrupted if you''re faster; can''t be fully blocked)'
      coletazo_de_hielo:
        name: Tail Swipe
        warn: The wyrm spins around… it's going to sweep you with its TAIL. (Can be blocked; can't be dodged)
  escorpion_emperador:
    name: Emperor Scorpion
    moves:
      tenaza_imperial:
        name: Pincer
        warn: A black scorpion the size of a cart opens its pincers.
      aguijon_imperial:
        name: Imperial Sting
        warn: The tail curls over its carapace… here comes the STING. (Can be dodged; can't be fully blocked)
      cerrar_la_coraza:
        name: Shell Up
        warn: The scorpion seals itself in its carapace and GATHERS strength. If you let it finish, its next hit will be fierce. (Can be interrupted)
  liche_errante:
    name: Wandering Lich
    moves:
      rayo_necrotico:
        name: Necrotic Bolt
        warn: A crowned skeleton raises a black staff. (Can't be fully blocked)
      palabra_de_muerte:
        name: Word of Death
        warn: The lich speaks a forbidden WORD. (Very strong. Can be interrupted if you're faster; can't be dodged or fully blocked)
      filacteria:
        name: Phylactery
        warn: The lich clutches its phylactery and GATHERS souls. If you let it finish, its next hit will be fierce. (Can be interrupted)
  engendro_del_umbral:
    name: Spawn of the Threshold
    moves:
      tentaculo:
        name: Tentacle
        warn: Something formless crawls out of a crack in the ground.
      grito_del_umbral:
        name: Threshold Scream
        warn: 'The spawn opens mouths all over its body: it''s going to SCREAM. (Can''t be dodged; can be blocked, or interrupted if you''re faster)'
      zarpa_del_vacio:
        name: Void Claw
        warn: The spawn stretches out an arm that wasn't there before… it's going to STRIKE. (Can be dodged; can't be fully blocked)
