        name: Forest Song
        warn: Raigambre closes its eyes and the forest SINGS with it. If you let it finish, its next hit will be fierce. (Can be interrupted)
      raices_atrapantes:
        name: Grasping Roots
        warn: 'The ground shakes under your feet: the ROOTS are about to burst out. (Can be dodged; can''t be fully blocked)'
      lluvia_de_astillas:
        name: Splinter Rain
        warn: 'Raigambre shakes its crown: SPLINTERS are about to rain down. (Can be blocked; can''t be dodged)'
      golpe_de_ambar:
        name: Amber Strike
        warn: The amber heart glows in its fist… it's going to STRIKE with everything. (Can be blocked; can't be dodged)
      furia_del_bosque:
        name: Fury of the Forest
        warn: 'Raigambre roars and the whole forest leans toward you: FURY OF THE FOREST! (Very strong. Can be dodged, or interrupted if you''re faster)'
    phases:
      raices: '🌱 Raigambre sinks its arms into the earth and the earth answers: the roots awaken around it.'
      corazon: 🔥 Raigambre's bark splits open, revealing a blazing amber heart. It flies into a rage and hits harder!
