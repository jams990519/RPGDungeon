# Player-facing texts in English (D-250). Same keys, same order as es.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es.yaml. Una clave nueva va
# primero en es.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

common:
  use_buttons: Use the buttons below.
  decimal_sep: .
language:
  name: 🇬🇧 English
  title: 🌐 Language
  ask: 🌐 Choose your language. You can change it anytime in ⚙️ Options.
  current: 'You are playing in: {name}'
  changed: '✅ Done: you now play in English.'
  button: '🌐 Language: {name}'
create:
  title: 🌅 Lost Realms · The Awakening
  intro: 'The world broke in the Collapse. You wake up beside a campfire in the Clearing, with no memories and nothing to your name. Beyond it, the land has no edge: no one knows what lies far away, and every step takes its time.'
  ask_name: ✍️ Type your hero's name (2 to 16 letters).
  bad_name: ⚠️ The name must be 2 to 16 characters long and start with a letter.
  name_taken: ⚠️ Another hero already uses that name. Try a different one.
  ask_class: '{name}, how do you fight? Your class sets your combat style. They''re all equally good: what makes the difference is your professions and what you learn.'
  rename: ✏️ Change name
  ask_spec: '{group}: choose your specialization. It sets your role, solo and in a group.'
  other_class: ↩️ Other class
  page: 'Classes (page {n} of {total}):'
  prev: ◀️ Previous
  next: ▶️ More classes
  rename_hint: ✏️ Want another name? Type it and I'll change it.
  confirm_class: '{group}: {desc}.'
  its_specs: 'Its specializations (you earn them with talent points):'
  spec_later: Your class is forever. You pick your specialization level by level, and you can change it later on.
  choose_class: ✅ Choose {group}
  back_to_classes: ↩️ Back to classes
  welcome: ✨ Welcome, {name}. Explore the land around the Clearing and blaze a trail into the unknown.
role:
  ataque: ⚔ Attack
  defensa: 🛡 Defense
  curacion: ✚ Healing
  soporte: ✦ Support
