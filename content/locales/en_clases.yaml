# Player-facing texts in English (D-250). Same keys, same order as es_clases.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es_clases.yaml. Una clave nueva va
# primero en es_clases.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

class_group:
  paladin:
    name: 🦁 Paladin
    desc: 'plate and Holy Power: judges, protects and heals from the front line'
  cazador:
    name: 🧝 Hunter
    desc: 'mail and focus: aims, commands their beast and sets traps'
  caballero_muerte:
    name: 💀 Death Knight
    desc: 'plate and runes: freezes, drains life and spreads plagues'
  chaman:
    name: ⚡ Shaman
    desc: 'mail and Maelstrom: lightning, tides and totems'
  mago:
    name: 🧙 Mage
    desc: 'cloth and mana: fire, frost and arcane magic'
  brujo:
    name: 🕯️ Warlock
    desc: 'cloth and soul shards: chaos, demons and curses'
  monje:
    name: ☯️ Monk
    desc: 'leather and chi: combos, stagger and healing mists'
  druida:
    name: 🌿 Druid
    desc: 'leather and forms: cat, bear, healer or astral; the only one with all 4 roles'
  cazador_demonios:
    name: 😈 Demon Hunter
    desc: 'leather and Fury: brimstone leaps, glyphs and souls'
  evocador:
    name: 🐉 Evoker
    desc: 'mail and Essence: dragon breath and time magic'
  nigromante:
    name: 🦴 Necromancer
    desc: 'cloth and reaped souls: plagues, skeletons and stolen life'
  bardo:
    name: 🎻 Bard
    desc: 'leather and Cadence: blade rhythm, ballads and tempo'
