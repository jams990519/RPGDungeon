# Player-facing texts in English (D-250). Same keys, same order as es_menus.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es_menus.yaml. Una clave nueva va
# primero en es_menus.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

