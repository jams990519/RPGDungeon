  line: '{name} · rank {rank} ({title}) {bar}  /{code}'
  none: 'You have no professions yet: explore (it rises on its own) or learn one in 📚 Learn professions.'
learn:
  title: 📚 Learn professions
  button: 📚 Learn professions
  intro: 'Each profession is learned once, by paying for its first recipe. Then it rises as you make recipes: each rank opens new recipes.'
  line: '{name} · {price}  /{code}'
  line_free: '{name} · free (you practised it)  /{code}'
  hint: Tap a profession's code to see what it does and learn it.
  none: ✅ You have learned every profession you can learn.
  first_recipe: '📜 First recipe: {recipe} ← {inputs}'
  unlocks: 'Once learned you can make its rank 1 recipes; the rest open as you rank up with every recipe you make.'
  unlocks_desollador: Once learned, beasts sometimes give you extra 🍖 meat and 🦌 hide, and the profession rises with each one.
  unlocks_comercio: Once learned, every sale gives you extra coins and the profession rises as you sell.
  unlocks_encantamiento: Once learned you can disenchant old gear into essences and enchant your pieces (/enchant).
  unlocks_construccion: Once learned, your contributions to your camp's works raise the profession, and its benefit applies to the whole camp.
  unlocks_gather: 'Once learned, gathering sometimes gives an extra unit, rare finds appear with rank, and the profession rises with each unit. Without it you still gather the base resources.'
