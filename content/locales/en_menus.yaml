trainer:
  title: 🧑‍🏫 Trainer
  intro: '«You learn a profession by doing it: you don''t pay for it or pick it, and you can have them all. Here''s what each family does:»'
  branch:
    gather: '🧺 Gathering: you collect materials in the zones. They level up as you gather (the 🔪 Skinner, by defeating beasts; the 🎣 Fisher, in zones with water).'
    explore: '🧭 Exploration: the 🧭 Explorer levels up by exploring and sees more on the map; from rank {recon} it lets you scout from afar.'
    refine: '🪚 Refining: you turn what you collect into better materials (planks, ingots, cloth, ashlar blocks…) at a station.'
    craft: '🛠️ Crafting: gear, potions, bandages, food and furniture, at a station. Sometimes a ✒️ masterwork comes out.'
    enchant: '✨ Enchanting: you break down old gear into essences and enchant your pieces (/enchant).'
    service: '🏗️ Services: 🏗️ Construction levels up by contributing to your camp''s works.'
  names: '   {list}'
  entry: '{name}'
  entry_rank: '{name} {rank}'
  now: '✅ Today you can start {n} more {n|profession|professions}: the ones in the list that don''t have a rank yet.'
  now_all: ✅ You've already started every profession within your reach.
  later_title: '🔒 Later on:'
  later_camp: '• 🏕️ With your own camp: {list} and the stations from its upgrades.'
  later_specs: • 🎓 At rank {first} of a profession you choose its first specialization, and at {second} the second.
  later_more: '• Each rank opens new recipes: the further you go, the more you''ll learn.'
  stations: '📍 There are stations for {n} {n|profession|professions} here: 🛠️ Craft and 🍲 Cook use them.'
  stations_none: '📍 There are no stations here: the Clearing has all the basic ones.'
  mine_button: ⚒️ My professions
  ench_button: ✨ Enchanting
  intro_learn: '«Each profession is learned once, by paying for its first recipe ({price}), here, in 📚 Learn professions. Then it rises as you make recipes, from rank 1 to 100, and each rank opens new recipes. Only 🧭 exploration rises on its own; 🧺 gathering is learned too (without the profession, gathering still gives the base resources).»'
  recommend: '⭐ For your {armor} armor: {name}. Tap /{code} to see it and learn it.'
  recommend_known: '⭐ For your {armor} armor: {name}, rank {rank}.'
  have: '✅ Your professions: {list}'
  have_none: '✅ You have no professions yet: explore (it rises on its own) and learn one below.'
  missing: '📚 Still to learn ({n} {n|profession|professions}): {list}'
  missing_none: '📚 You have learned every profession within your reach.'
