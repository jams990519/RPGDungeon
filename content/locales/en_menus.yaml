  learn_button_free: 📚 Learn · free
  see_button: '📚 See {name}'
  done: '✅ You learned {name}. {unlocks}'
  already: You already know {name}.
  no_gold: "💰 You can't afford it: it costs {price} and you have {gold}."
  camp_needed: 🏗️ {name} is learned as a member of a camp.
  auto: '{name} is not learned: it rises on its own. {how}'
  need: '🔒 For this, first learn {name} (🧑‍🏫 Trainer → 📚 Learn professions).'
