# Texts of 0.43 (D-306, the owner on 20-oct-2026; how it was done: D-316): 🎖️ profession titles bought at the 🧑‍🏫 Entrenador,
# learning prices by branch, 🎣 Pescar (a gathering mode that takes only 🐟 fish), 🧱 Mantenimiento (the camp work that
# repeats, for 🏗️ Construcción) and the trader buying potions and remedies for a little.
# [ES] Textos de la 0.43 (D-306, el dueño el 20-oct-2026; cómo se hizo: D-316, provisional): los 🎖️ títulos de oficio que se
# compran en el 🧑‍🏫 Entrenador como en WoW (al tope de tu título, rangos 20, 40, 60, 80 y 95, el oficio no sube hasta comprar
# el siguiente), los precios de aprender por rama (🥈1 fabricación, 🥉50 recolección y refinado), 🎣 Pescar (un modo de
# 🧺 Recolectar que junta solo 🐟 pescado, como 🪓 Talar), 🧱 Mantenimiento (la obra que se repite para subir la
# 🏗️ Construcción) y el mercader que compra pociones y remedios a poco. Se junta con es.yaml y los demás es_*.yaml al cargar
# (engine/core/content.py, mezcla profunda: las claves de batch.*, presence.*, hero.*, retreat.*, learn.* y shop.* de aquí se
# suman a las de los otros archivos sin pisarlas).
# Documento de diseño: diseno/07-economia/oficios-como-wow.md §3 y §4 (0.43), diseno/07-economia/profesiones.md §0.7
# Lo leen: engine/service/game.py (_titles_view, _buy_title, _title_lock_line, _title_prof_lines, _prof_list_lines,
#     _trainer_view, _prof_gain, _learn_prices_text, _explore_menu, _amount_view, _start_batch, _gather_blocked,
#     _gather_step, _batch_summary, _activity_view, _activity_word, _retreat_view, _works_view, _maintain, _shop_sell_view)
# Estilo: español neutro, de tú, frases cortas para el teléfono. Una clave nueva va también en en_titulos_pesca.yaml, en el
# mismo cambio (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se ve como [clave].

