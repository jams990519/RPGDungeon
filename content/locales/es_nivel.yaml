# Texts of the 0.41 camp patch (D-304): ⬆️ Mejorar campamento with ⏫ Siguiente nivel (a checklist of works that must be built,
# materials and 🪎 chests that fills in) and 🗺️ Agrandar territorio (where the camp grows: a mini-map and 8 directions, up to the
# zones of each stage), plus what every member sees in 🔨 Mejoras and the 🤝 assistants line of 👥 Miembros.
# [ES] Textos del parche 0.41 del campamento (pedido del dueño del 20-oct-2026: "ponme en el botón de mejorar dos opciones: una,
# siguiente nivel, y dos, agrandar territorio… debes construir esto, esto y esto a tal nivel para pasar al siguiente nivel, más
# los recursos, en formato de lista, y se va a ir completando"; y "cada mejora debe ser visible para todos los miembros… un
# asistente va a permitir definir hacia dónde va a avanzar el territorio junto contigo"). Se junta con es.yaml y los demás
# es_*.yaml al cargar (engine/core/content.py): las claves de "upgrades" y "helpers" se suman a las de es.yaml y
# es_servicios.yaml.
# Documento de diseño: diseno/09-construccion/escalera-del-asentamiento.md §0.5 y diseno/01-plataforma/menus-campamento-y-heroe.md
# Lo leen: engine/service/game.py (_camp_member_actions, _camp_manage_view, _camp_info_lines, _improve_view, _lvlup_rows,
#     _lvlup_view, _lvlup_give, _lvlup_go, _level_up, _grow_view, _grow_camp, _territory_map, _direction_label, _upgrades_view)
#     y engine/service/gremio.py (_camp_members_view: la línea de 🤝 asistentes del fundador)
# Estilo: español neutro, de tú, frases cortas para el teléfono (D-287/D-302: poco texto). Una clave nueva va también en
# en_nivel.yaml, en el mismo cambio (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se
# ve como [clave].

improve:                       # [ES] D-304: ⬆️ Mejorar campamento (desde 🏰 Gestionar)
  button: "⬆️ Mejorar campamento"
  title: "⬆️ Mejorar {name}"
  manage_line: "⬆️ Mejorar: nivel {level} ({stage}), territorio de {zones} {zones|zona|zonas} (hasta {cap}). Sube de nivel o agranda el territorio."
  level_line: "🏕️ Nivel {level} · {stage}"
  zones_line: "🗺️ Territorio: tu campamento ocupa {zones} de las {cap} zonas que permite la etapa {stage}."   # [ES] D-313: dicho entero (el dueño no entendía "1 de 3")
  zones_free: "Puedes sumarle {n} {n|zona|zonas} más en 🗺️ Agrandar territorio."
  zones_full: "Ya está en el tope: sube de nivel para agrandarlo más."
  next_title: "⏫ Para subir a nivel {level} ({stage}) necesitas:"   # [ES] D-313: la lista entera aquí, no "4 de 5 listos"
  all_button: "📜 Qué pide cada nivel"
  lvlup_button: "⏫ Siguiente nivel"
  grow_button: "🗺️ Agrandar territorio"

