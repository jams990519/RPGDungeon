# Solo dungeons (D-164, D-165, D-170, D-171): the 🕳️ small dungeon, the 🌀 deep dungeon by floors and the 🕳️ cave marks of the map (D-181).
# Numbers live in content/balance.yaml (block dungeons); the enemy families in content/dungeons.yaml.
# [ES] Textos de las mazmorras para uno: la 🕳️ chica (4 salas y el jefe, cofre modesto, una vez por día), la 🌀 profunda (pisos
# hacia abajo, la bolsa, 🚪 Salir con lo ganado, tu récord y la lista 🏆 del día), lo que se ve en 📍 Zona, en 🧭 Explorar y en
# el 🗺️ Mapa (🕳️ la cueva: hay una mazmorra, no se sabe cuál, D-171 y D-181), y los nombres de las familias que las llenan. Se junta con es.yaml al cargar
# (engine/core/content.py: las claves que ya existen se completan, no se pisan).
# Documento de diseño: diseno/06-contenido/mazmorras-y-bandas.md §0; diseno/02-mundo/mapa-infinito-y-viaje.md §1.15
# Lo leen: engine/service/game.py (sección "solo dungeons": _dng_view, _dng_go, _dng_fight_done, _dng_close, _dng_map_lines,
#     _dng_zone_lines, _dng_arrive_lines, _dng_explore_button, _dng_combat_lines; y el 🗺️ Mapa)
# Estilo: español neutro, de tú, frases cortas para el teléfono. Si cambias una clave, búscala en game.py: una clave que
# falta se ve como [clave] (tests/test_mazmorras.py revisa que no falte ninguna).

