# The guild from the first moment (D-269), 👥 Jugadores at the bonfire (D-265, D-274) and the works that take time (D-269.4).
# Numbers live in content/balance.yaml (blocks gremio, works, bonfire and presence.bonfire_seconds).
# [ES] Textos del gremio desde el inicio (crear, buscar, pedir entrar, invitar, oficiales, 📢 mensajes, 💰 fondo, 📍 punto de
# reunión, 🏕️ fundar con el gremio y la invitación al campamento), de la pantalla 👥 Jugadores de la fogata, del botón
# 🏗️ Moverte a la construcción de 📍 Zona y de las 🏗️ obras en curso de los campamentos. Se junta con es.yaml al cargar
# (engine/core/content.py): las claves de "hub" y "camps" se suman a las de es_menus.yaml y es.yaml.
# Documento de diseño: diseno/09-construccion/escalera-del-asentamiento.md §0; diseno/01-plataforma/menus-campamento-y-heroe.md
# Lo leen: engine/service/gremio.py (GremioMixin) y engine/service/game.py (_camp_hub_lines, _camp_requirements,
#     _camp_here_view, _upgrades_view, _give_to_work, _zone_view)
# Estilo: español neutro, de tú, frases cortas para el teléfono. Una clave nueva va también en en_gremio.yaml, en el mismo
# cambio (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se ve como [clave].

