# Texts of phase 2 of the profession network, gear side (D-115): ✨ Enchanting, the "⬆️ better piece" notice and the names of
# the crafted head, hands, legs and feet pieces. Numbers live in content/balance.yaml ("enchanting", "gear.score").
# [ES] Textos de la fase 2 de la red de oficios, lado del equipo (D-115): el ✨ Encantamiento (desencantar equipo en esencias y
# encantar las piezas), el aviso "⬆️ Tienes una pieza mejor" con su botón 🔁 Equipar, y los nombres del equipo de artesano de
# cabeza, manos, piernas y pies (content/items.yaml, al final). Sin números escritos a mano: los pone el motor.
# Lo leen: engine/core/content.py (se junta con es.yaml) y engine/service/game.py (sección "enchanting": _ench_view,
# _enchant_view, _enchant, _disenchant; _item_view, _gear_view, _worn_view, _end_combat, _auto_combat y _make para la pieza mejor).
# Si cambias una clave, búscala en engine/service/game.py: una clave que falta se ve como [clave]
# (tests/test_oficios_equipo.py revisa que no falte ninguna).

profession:
  encantamiento:
    name: "Encantamiento"
    how: "desencanta equipo viejo en ✨ esencias y encanta tus piezas: 🛡️ Equipo → una pieza → ✨ Encantamiento (o /encantar)"

prof:
  perk:
    disenchant: "+{v} % de esencias al desencantar"
  branch:
    enchant: "✨ Artes arcanas"

resources:
  use:
    esencia: "✨ Encantamiento: encantar tus piezas (sale de desencantar equipo)"
    esencia_mayor: "✨ Encantamiento: encantar piezas de nivel 50 o más (sale de desencantar piezas 🟣 épicas)"

ench:                         # [ES] ✨ Encantamiento (D-115, fase 2): pantalla general (/encantar), pantalla de una pieza, encantar y desencantar
  title: "✨ Encantamiento"
  intro: "Desencanta el equipo que ya no usas: la pieza se pierde y te da ✨ esencias. Con ellas y un material de otro oficio, encanta tus piezas: un encantamiento por pieza, que suma mientras la llevas puesta."
  rank_line: "✨ Encantamiento · rango {rank} ({title}) {bar}"
  essences_line: "Llevas: {items}"
  essences_none: "Todavía no llevas esencias: desencanta una pieza que no uses."
  table_title: "Un encantamiento por ranura (el valor sale de tu rango y queda en la pieza):"
  table_line: "{name} · {slots}: {stats} · pide {material}{lock}"
  lock: " · 🔒 rango {rank}"
  cost_rule: "Encantar pide ✨ {base} esencias y 1 más cada {per} niveles de la pieza, 🔮 1 esencia mayor desde el nivel {major} y el material (1, y 1 más cada {mat_per} niveles). ⚡{energy}"
  disenchant_rule: "Desencantar da ✨ esencias según la rareza (⚪ {comun} · 🟢 {poco_comun} · 🔵 {raro} · 🟣 {epico}) y 1 más cada {per} niveles; las 🟣 épicas, también 🔮 1 esencia mayor. ⚡{energy}"
  worn_title: "Lo que llevas encantado: {items}"
  worn_none: "Todavía no llevas nada encantado."
  how: "Elige una pieza en 🛡️ Equipo y toca ✨ Encantamiento."
  pick_button: "🛡️ Elegir pieza"
  piece_title: "✨ Encantar o desencantar"
  current: "Ahora: {enchant}"
  current_none: "Ahora: sin encantamiento."
  no_slot: "Esta pieza no se puede encantar."
  locked: "🔒 {name} pide rango {need} de ✨ Encantamiento (tienes {rank})."
  offer_best: "Ya tiene el mejor encantamiento que puedes hacer con tu rango. Sube de rango para mejorarlo."
  offer: "Puedes darle {name}: {stats} con tu rango."
  offer_replace: "Puedes darle {name}: {stats} con tu rango (reemplaza al de ahora)."
  needs: "Pide: {items} · ⚡{energy}"
  enchant_button: "✨ Encantar ({stats})"
  worn_cant: "💨 Para desencantarla, quítatela primero."
  disenchant_line: "💨 Desencantar: la pieza se pierde y te da {items}{bonus} · ⚡{energy}"
  disenchant_bonus: " (y hasta {pct} % más por tu rango)"
  disenchant_button: "💨 Desencantar"
  enchanted: "✨ Encantaste {item}: {enchant} (⚡ −{energy})."
  not_better: "Esa pieza ya tiene ese encantamiento o uno mejor. No gastaste nada."
  worn_no: "💨 No puedes desencantar lo que llevas puesto: quítatelo primero."
  confirm_title: "💨 ¿Desencantar una obra maestra?"
  confirm: "Es una ✒️ obra maestra{by}. Si la desencantas, se pierde para siempre."
  confirm_by: " de {name}"
  confirm_button: "💨 Sí, desencantar"
  cancel_button: "↩️ No"
  disenchanted: "💨 Desencantaste {item}: +{items} (⚡ −{energy})."
  unlocked: "🔓 Nuevo encantamiento: {items}."
