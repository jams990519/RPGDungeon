# Player-facing texts in English (D-250). Same keys, same order as es_clases_031.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es_clases_031.yaml. Una clave nueva va
# primero en es_clases_031.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

class_group:
  guerrero:
    name: 🤺 Warrior
    desc: plate · endurance Tank or strength DPS
  druida:
    name: 🍀 Druid
    desc: leather · dodge Tank (bear) or bleed DPS (cat)
  sacerdote:
    name: 🕊️ Priest
    desc: cloth · single-target Healer (the tank) or shadow DPS
  chaman:
    name: 🌩️ Shaman
    desc: 'leather · group Healer or lightning DPS (retired in 0.32: replaced by the Paladin)'
  paladin:
    name: 🦁 Paladin
    desc: plate · group Healer or holy DPS
  cazador:
    name: 🧝 Hunter
    desc: leather · Support who empowers allies or ranged DPS
  mago:
    name: 🧙 Mage
    desc: cloth · Support who weakens the enemy or fire DPS
