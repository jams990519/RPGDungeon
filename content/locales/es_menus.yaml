    refine: "🪚 Refinado: conviertes lo que juntas en materiales mejores (tablones, lingotes, telas, sillares…) en una estación."
    craft: "🛠️ Fabricación: equipo, pociones, vendas, comida y muebles, en una estación. A veces sale una ✒️ obra maestra."
    enchant: "✨ Encantamiento: desarmas equipo viejo en esencias y encantas tus piezas (/encantar)."
    service: "🏗️ Servicio: la 🏗️ Construcción sube aportando a las obras de tu campamento."   # [ES] D-298: el 💱 Comercio está bloqueado hasta las caravanas
  names: "   {list}"
  entry: "{name}"
  entry_rank: "{name} {rank}"
  now: "✅ Hoy puedes empezar {n} {n|oficio más|oficios más}: los que todavía no tienen rango en la lista."
  now_all: "✅ Ya empezaste todos los oficios que tienes a tu alcance."
  later_title: "🔒 Más adelante:"   # [ES] sin uso desde la 0.39 (D-287)
