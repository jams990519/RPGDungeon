  cook_unlearned: "🍲 Cocinar: primero aprende la 🍲 Cocina en 🧑‍🏫 Entrenador → 📚 Aprender oficios."   # [ES] D-257 (0.33): los oficios se aprenden; D-274.1: 🔬 Investigar ya no está en la fogata
  research_claro: "🔬 Investigar: en el Claro no; se investiga en tu propio campamento con la 📚 Biblioteca (nivel {level})."
  research_locked: "🔬 Investigar: con la 📚 Biblioteca, que se construye desde el nivel {level} (tu campamento es nivel {now})."   # [ES] sin uso desde la 0.39 (D-287)
