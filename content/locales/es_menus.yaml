  defend: "🛡️ ¡Oleada en curso! Toca 🛡️ Defender y pelea una vez."
  # [ES] botones (cortos: sin costos)
  cook_button: "🍲 Cocinar"
  research_button: "🔬 Investigar"
  make_button: "🛠️ Fabricar"
  trainer_button: "🧑‍🏫 Entrenador"
