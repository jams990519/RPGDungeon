# Texts of the 0.29 menus (D-190, D-191 confirmed; D-192 provisional): the 🏕️ Campamento hub (the Claro and your own camp),
# 🏰 Gestionar, the 👤 Héroe card, the 🧑‍🏫 Entrenador and the notice of the old 📖 Historia button.
# [ES] Textos de los menús nuevos de la 0.29 (estilo TowerWars "ampliado, detallado y separado"): el centro de 🏕️ Campamento
# (el Claro y tu propio campamento) con una línea por opción, 🏰 Gestionar (lo de tu campamento: agrandar, mejoras, despensa,
# gremio), la ficha nueva de 👤 Héroe (puntos arriba, tiempos de vida y energía), el 🧑‍🏫 Entrenador (presenta los oficios) y el
# aviso de 📖 Historia, que salió del menú (D-190). Se junta con es.yaml y los demás es_*.yaml al cargar (engine/core/content.py).
# Los textos de ❓ Dudas están en es_dudas.yaml.
# Documento de diseño: diseno/01-plataforma/menus-campamento-y-heroe.md
# Lo leen: engine/service/game.py (_claro_view, _camp_here_view, _camp_hub_lines, _camp_manage_view, _hero_view,
#     _trainer_view, _cook_view, _research, _idle_action "story") y engine/service/story.py (_origin_card_view)
# Estilo: español neutro, de tú, frases cortas para el teléfono. Los costos y tiempos van en el texto, nunca en el botón
#     (los teléfonos chicos cortan los botones largos).

