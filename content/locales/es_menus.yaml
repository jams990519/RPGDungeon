  make: "🛠️ Fabricar: 🪚 refinar y 🛠️ fabricar equipo, pociones y muebles · {n} {n|estación|estaciones} aquí · ⚡{energy}/{max}."
  make_none: "🛠️ Fabricar: aquí no hay estaciones ahora."   # [ES] D-288 (0.39): en tu campamento, hub.make_none_camp
