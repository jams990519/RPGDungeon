  stations: "📍 Aquí hay estaciones de {n} {n|oficio|oficios}: 🛠️ Fabricar y 🍲 Cocinar las usan."
  stations_none: "📍 Aquí no hay estaciones: en el Claro están todas las básicas."
  mine_button: "⚒️ Mis oficios"
  ench_button: "✨ Encantamiento"
  intro_learn: "«Cada oficio se aprende una vez, pagando su primera receta ({price}), aquí, en 📚 Aprender oficios. Después sube haciendo recetas, del rango 1 al 100, y cada rango abre recetas nuevas. Solo 🧭 la exploración sube sola; la 🪓 recolección también se aprende (sin el oficio, recolectar da igual los recursos base).»"   # [ES] D-257 (0.33), D-272 (0.35)
  recommend: "⭐ Para tu armadura de {armor}: {name}. Toca /{code} para verlo y aprenderlo."   # [ES] D-271 (0.34)
