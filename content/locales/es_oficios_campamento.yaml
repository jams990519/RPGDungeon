# Professions phase 2, camp side (D-115, D-116): 🎣 Pescador, 🍲 Cocina, 🗿 Cantería and 🏗️ Construcción, the fish of the
# zones with water, the cooked rations, the refined stone, the camp perks and the raid damage with its repair.
# [ES] Textos de la fase 2 de los oficios, lado del campamento: los cuatro oficios nuevos, el 🐟 pescado, las raciones de la
# Cocina, el 🧱 sillar, los 🏰 beneficios de campamento (rige el mejor rango entre los miembros) y las 🛠️ defensas que dañan
# las oleadas y se reparan desde 🔨 Obras. Se junta con es.yaml al cargar (engine/core/content.py: las claves que ya
# existen, como item, profession, prof o resources, se completan, no se pisan).
# Documento de diseño: diseno/07-economia/profesiones.md §0.4 y diseno/07-economia/red-de-oficios.md §5
# Lo leen: engine/service/game.py (secciones "camp professions, phase 2", "settlement pantry", "camp raids" y "camp
#     improvements": _camp_feed, _pantry_lines, _camp_here_view, _upgrades_view, _works_view, _repair_defenses,
#     _resolve_raid, _professions_view, _recipe_view, _perk_text, _resources_view).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Los números los pone el motor, salvo las raciones de cada
# comida en resources.use (como la carne en es.yaml): si cambias "food" en content/items.yaml, cámbialas aquí. Si cambias
# una clave, búscala en game.py: una clave que falta se ve como [clave] (tests/test_oficios_campamento.py revisa que no
# falte ninguna).

