# Textos del parche 0.31 de clases, combate y balance (D-225 a D-232): las 6 clases, sus 12 roles, sus 48 botones y el
# combate en cadena.
# [ES] Para qué sirve: lo que lee el jugador de las clases nuevas y de la cadena. Los nombres de las habilidades son borrador
# del parche (se pueden ajustar); los IDs nunca cambian (content/classes.yaml).
# Con qué se conecta: content/classes.yaml (system: chain), engine/combat/chain_round.py (claves chain.*),
# engine/service/game.py (_combat_view, _spec_view, _talents_view, creación del héroe) y content/locales/es.yaml (combat.*).
# Se carga después de es_clases.yaml: lo que repite (class_group) manda este archivo.
# Si cambias esto: los marcadores {n}, {pct}, {rounds}... tienen que seguir iguales; tests/test_cadena.py y
# tests/test_clases_031.py revisan que no falte ningún texto.

class_group:
  guerrero: {name: "🏰 Guerrero", desc: "placa · Tanque de aguante o DPS de fuerza"}
  druida: {name: "🌳 Druida", desc: "cuero · Tanque de esquiva (oso) o DPS de sangrado (felino)"}
  sacerdote: {name: "📿 Sacerdote", desc: "tela · Sanador de uno (el tanque) o DPS de sombra"}
  chaman: {name: "🌩️ Chamán", desc: "cuero · Sanador de grupo o DPS de rayo"}
  cazador: {name: "🏹 Cazador", desc: "cuero · Soporte que potencia aliados o DPS a distancia"}
  mago: {name: "🔮 Mago", desc: "tela · Soporte que debilita al enemigo o DPS de fuego"}

chain_role:
  tanque: "🛡️ Tanque"
  sanador: "✚ Sanador"
  dps: "⚔️ DPS"
  soporte: "✦ Soporte"

