# Texts of the 🎓 profession specializations (D-115, D-141): names and one-line descriptions of the 3 specializations of each
# profession, the effect phrases, the screens (⚒️ Oficios → 🎓 Especialización) and the exclusive pieces and furniture.
# Numbers live in content/balance.yaml ("specs") and content/professions.yaml ("specs" effects, recipes with "spec").
# [ES] Textos de las 🎓 especializaciones de oficio (red-de-oficios.md §3): el nombre y una frase de cada especialización
# (spec.<id>.name y spec.<id>.desc, ids de content/professions.yaml "specs"), las frases de cada tipo de efecto
# (spec.effect.<tipo>; los beneficios usan prof.perk.<clave>), las pantallas, los avisos y los nombres de las piezas y muebles
# exclusivos (content/items.yaml, "espec_*", paveses_roble y carro_viveres). Sin números escritos a mano: los pone el motor.
# Lo leen: engine/core/content.py (se junta con es.yaml) y engine/service/game.py (sección "profession specializations":
# _pspecs_view, _pspec_prof_view, _pspec_view, _pspec_switch_view, _pspec_pick, _pspec_switch, _pspec_gain, _pspec_effect_text; y
# _professions_view, _station_view, _recipe_view, _make, _trade_loot).
# Si cambias una clave, búscala en engine/service/game.py: una clave que falta se ve como [clave]
# (tests/test_especializaciones.py revisa que no falte ninguna).

item:
  espec_arco_1: "Arco largo de arquero"
  espec_arco_2: "Arco largo del maestro arquero"
  espec_espada_1: "Hoja de forjador"
  espec_espada_2: "Hoja del maestro forjador"
  espec_placas_1: "Coraza de armero"
  espec_placas_2: "Coraza del maestro armero"
  espec_cuero_1: "Jubón de cuero fino"
  espec_cuero_2: "Jubón del maestro peletero"
  espec_malla_1: "Cota de anillas finas"
  espec_malla_2: "Cota del maestro mallero"
  espec_tela_1: "Túnica rúnica"
  espec_tela_2: "Túnica del maestro arcano"
  espec_joya_gemas_1: "Collar de gemas talladas"
  espec_joya_gemas_2: "Collar del maestro tallador"
  espec_joya_oro_1: "Sello de orfebre"
  espec_joya_oro_2: "Sello del maestro orfebre"
  paveses_roble: "Paveses de roble"
  carro_viveres: "Carro de víveres"

furniture:                    # [ES] qué hace cada mueble exclusivo, en una frase (items.yaml desc_key)
  paveses_roble: "+1 de 🛡️ Defensa del campamento contra las oleadas"
  carro_viveres: "los miembros comen 5 % menos de la despensa"

resources:
  use:
    paveses_roble: "🪑 mueble: colócalo en tu campamento (🔨 Mejoras → 🔨 Obras) · +1 de 🛡️ Defensa"
    carro_viveres: "🪑 mueble: colócalo en tu campamento (🔨 Mejoras → 🔨 Obras) · los miembros comen 5 % menos"

spec:
  # ---- Recolección
  lenador_nobles:
    name: "Maderas nobles"
    desc: "Sabes qué tronco vale la pena: tu madera da mejores tablones cuando la aserras. (La 🌳 madera noble llegará más adelante.)"
  lenador_carbon:
    name: "Leña y carbón"
    desc: "Preparas leña y carbón para la fragua: tus lingotes rinden más cuando fundes."
  lenador_tala:
    name: "Tala rápida"
    desc: "Talas más rápido que nadie: más madera en cada vuelta."
  minero_metales:
    name: "Metales"
    desc: "Sigues las vetas de metal: más metal en cada vuelta."
  minero_gemas:
    name: "Gemas"
    desc: "Tu ojo encuentra las piedras preciosas: más gemas en bruto al minar."
  minero_cantera:
    name: "Cantera"
    desc: "Sacas piedra y arcilla a lo grande, para las obras del campamento."
  herbolario_medicinales:
    name: "Medicinales"
    desc: "Conoces cada hierba que cura: más hierba curativa en cada vuelta."
  herbolario_flores:
    name: "Flores raras"
    desc: "Sabes dónde se esconden las flores de luna: las encuentras más seguido."
  herbolario_fibras:
    name: "Fibras"
    desc: "Juntas fibra para los tejedores: más fibra en cada vuelta."
  desollador_pieles:
    name: "Pieles finas"
    desc: "Desuellas sin romper la piel: más piel de cada bestia."
  desollador_carniceria:
    name: "Carnicería"
    desc: "Aprovechas cada pieza de carne: más carne para la despensa."
  desollador_trofeos:
    name: "Trofeos"
    desc: "Guardas colmillos y cristales de las bestias: a veces son gemas para la Joyería."
  explorador_cartografo:
    name: "Cartógrafo de campo"
    desc: "Anotas todo lo que ves: exploras más rápido cada zona."
  explorador_rastreador:
    name: "Rastreador"
    desc: "Sigues el rastro del botín: más monedas cuando cae un campamento enemigo en el que peleaste."
  explorador_infiltrado:
    name: "Infiltrado"
    desc: "Te mueves como una sombra: cuesta más descubrirte cuando te infiltras."
  # ---- Refinado
  aserradero_nobles:
    name: "Tablones nobles"
    desc: "El maestro de la sierra: más tablones de la misma madera."
  aserradero_carbon:
    name: "Carbón"
    desc: "Haces carbón con los restos: tus tablones rinden algo más y tus lingotes también, si fundes."
  aserradero_papel:
    name: "Papel"
    desc: "Haces papel para mapas y apuntes: algo más de tablones y exploras un poco más rápido. (La Inscripción llegará más adelante.)"
  fundicion_hierro:
    name: "Hierro"
    desc: "El maestro del horno: más lingotes del mismo metal."
  fundicion_preciosos:
    name: "Metales preciosos"
    desc: "Separas lo valioso del mineral: algo más de lingotes y, a veces, una gema en bruto."
  fundicion_aleaciones:
    name: "Aleaciones"
    desc: "Mezclas metales para las armaduras: algo más de lingotes y más obras maestras en malla y placas, si las fabricas."
  destilacion_extractos:
    name: "Extractos"
    desc: "El maestro del alambique: más extractos de las mismas hierbas."
  destilacion_tintes:
    name: "Tintes y tinta"
    desc: "Preparas tintes: algo más de extractos y más obras maestras en tela y cuero, si las fabricas."
  destilacion_licores:
    name: "Licores"
    desc: "Destilas licores para las pociones: algo más de extractos y más pociones, si las preparas."
  tejeduria_lino:
    name: "Lino"
    desc: "Tejes lino limpio: algo más de tela y más vendas, si las coses."
  tejeduria_lana:
    name: "Lana"
    desc: "El maestro del telar: más tela de la misma fibra."
  tejeduria_seda:
    name: "Seda"
    desc: "Tejes la tela más fina: algo más de tela y más obras maestras en tela, si la coses."
  curtiduria_grueso:
    name: "Cuero grueso"
    desc: "El maestro de la curtiembre: más cuero de las mismas pieles."
  curtiduria_fino:
    name: "Cuero fino"
    desc: "Curtes el cuero más suave: algo más de cuero y más obras maestras en cuero, si las fabricas."
  curtiduria_pergamino:
    name: "Pergamino"
    desc: "Haces pergamino para mapas: algo más de cuero y exploras un poco más rápido. (La Inscripción llegará más adelante.)"
  # ---- Fabricación
  carpinteria_arqueria:
    name: "Arquería"
    desc: "Los mejores arcos salen de tus manos: más obras maestras en arcos y arcos que solo tú haces."
  carpinteria_escudos:
    name: "Escudos"
    desc: "Trabajas la madera dura: más obras maestras en bastones y paveses de roble para defender el campamento. (Los escudos llegarán con su ranura.)"
  carpinteria_mobiliario:
    name: "Mobiliario y carros"
    desc: "Haces muebles y carros: un carro de mano para cargar más y el carro de víveres para tu campamento."
  herreria_armas:
    name: "Forjador de armas"
    desc: "Forjas las mejores hojas: más obras maestras en espadas y dagas, y hojas que solo tú haces."
  herreria_armero:
    name: "Armero"
    desc: "Para placas, ven contigo: más obras maestras en placas y corazas que solo tú haces."
  herreria_herramientas:
    name: "Herramientas"
    desc: "Te haces buenas herramientas: un poco más de todo lo que recolectas o desuellas."
  peleteria_cuero:
    name: "Cuero ligero"
    desc: "Armaduras de cuero que no pesan: más obras maestras en cuero y jubones que solo tú haces."
  peleteria_malla:
    name: "Malla"
    desc: "Anilla por anilla: más obras maestras en malla y cotas que solo tú haces."
  peleteria_talabarteria:
    name: "Talabartería"
    desc: "Alforjas y mochilas a tu medida: llevas más cosas. (Las sillas de montar llegarán con las monturas.)"
  sastreria_tunicas:
    name: "Túnicas mágicas"
    desc: "Bordas runas en la tela: más obras maestras en túnicas y túnicas que solo tú haces."
  sastreria_clima:
    name: "Ropa de clima"
    desc: "Abrigo para cabeza, manos, piernas y pies: más obras maestras en esas piezas de tela. (El clima llegará más adelante.)"
  sastreria_medico:
    name: "Textil médico"
    desc: "Coses vendas limpias: más vendas en cada tanda."
  alquimia_pociones:
    name: "Pociones"
    desc: "El maestro de las pociones: más pociones en cada tanda."
  alquimia_elixires:
    name: "Elixires"
    desc: "Conoces la dosis justa: tus pociones curan más."
  alquimia_venenos:
    name: "Venenos"
    desc: "Untas tus armas con veneno: pegas un poco más fuerte. (Los venenos para otros llegarán más adelante.)"
  medicina_auxilios:
    name: "Primeros auxilios"
    desc: "Vendas como nadie: tus vendas y ungüentos curan más."
  medicina_cirugia:
    name: "Cirugía"
    desc: "Manos firmes: si eres sanador, tus curaciones curan más."
  medicina_farmacia:
    name: "Farmacia"
    desc: "Preparas remedios en cantidad: más ungüentos, botiquines y vendajes en cada tanda."
  joyeria_gemas:
    name: "Talla de gemas"
    desc: "Tallas cada gema a la perfección: más obras maestras en joyas y collares que solo tú haces."
  joyeria_orfebreria:
    name: "Orfebrería"
    desc: "Trabajas el metal fino: tus lingotes rinden más al fundir y haces sellos que solo tú haces."
  joyeria_vidrieria:
    name: "Vidriería"
    desc: "Soplas frascos de vidrio: más pociones en cada tanda, si las preparas."
  # ---- Servicio y artes arcanas
  comercio_abastecedor:
    name: "Abastecedor"
    desc: "Compras y vendes materiales: más monedas al venderle materiales al mercader."
  comercio_tratante:
    name: "Tratante de equipo"
    desc: "Sabes lo que vale cada pieza: más monedas al vender equipo."
  comercio_caravanero:
    name: "Caravanero"
    desc: "Negocias en los campamentos: más monedas en el trueque. (Las caravanas llegarán más adelante.)"
  encantamiento_armas:
    name: "Armas"
    desc: "Encantas filos: tu ⚔️ Filo suma más."
  encantamiento_armaduras:
    name: "Armaduras"
    desc: "Encantas armaduras y joyas: tu ❤️ Vigor y tu 🛡️ Guarda suman más."
  encantamiento_desencantar:
    name: "Desencantar"
    desc: "Le sacas todo al equipo viejo: más esencias al desencantar."

  # ---- Frases de los efectos (el número sale de tu dominio)
  effect:
    yield: "+{v} % de sacar una unidad más de {what}"
    find: "+{v} % de hallar {what}"
    masterwork: "+{v} % de ✒️ obra maestra en las piezas de {what}"
    coins: "+{v} % de monedas {what}"
    enchant: "+{v} punto en {what} al encantar"
    detect: "−{v} puntos de que te descubran al 🕵️ infiltrarte"
  sale:
    goods: "al venderle materiales al mercader"
    gear: "al vender equipo"
    barter: "en el 💱 trueque del campamento"
    ecamp: "de los ⛺ campamentos enemigos (cofre y parte)"
  slots_of: "{types} ({slots})"
  and: " y "

