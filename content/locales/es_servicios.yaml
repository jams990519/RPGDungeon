# Texts of the 0.39 camp patch: 🏘️ Servicios by type of building (D-288), one building per profession (D-288), works that the
# founder or a helper activates (D-291), the founder's 🤝 helpers (D-289), the camp's 💰 fund after founding (D-291) and the
# guild's ⚔️ Armería (D-290).
# [ES] Textos del parche 0.39 del campamento (pedido del dueño, 19-oct-2026): 🏘️ Servicios con un botón por tipo de construcción
# (🏠 Casas, ⚒️ Oficios, 🛡️ Defensas, 📚 Saber), un edificio por oficio, las obras que activa el fundador o un ayudante (▶️ Activar,
# ⏹️ Quitar), los 🤝 ayudantes, el 💰 fondo del campamento después de fundar y la ⚔️ Armería del gremio. Se junta con es.yaml y los
# demás es_*.yaml al cargar (engine/core/content.py): las claves de "hub", "upgrades" y "upgrade" se suman a las de es.yaml y
# es_menus.yaml.
# Documento de diseño: diseno/09-construccion/escalera-del-asentamiento.md y diseno/08-social/gremios-y-social.md (los actualiza
#     quien une el parche)
# Lo leen: engine/service/game.py (_camp_hub_lines, _upgrades_view, _works_view, _services_view, _service_type_view,
#     _activate_work, _stop_work, _give_to_work, _guild_view, _research) y engine/service/gremio.py (ayudantes, fondo del
#     campamento y armería)
# Estilo: español neutro, de tú, frases cortas para el teléfono. Una clave nueva va también en en_servicios.yaml, en el mismo
# cambio (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se ve como [clave].

