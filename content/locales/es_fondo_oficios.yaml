# Texts of the guild's fund for the professions (D-322, 0.47): the camp's 💰 fund feeds the works first; what is left over the
# members use at the camp's stations when they refine or craft, with a daily cap, a log and a switch.
# [ES] Textos del 💰 fondo del gremio para los oficios (pedido del dueño del 21-oct-2026: "que los jugadores del gremio puedan
# primero construir las estructuras y después poder utilizar los recursos para las profesiones de cada uno"). Se junta con
# es.yaml al cargar (engine/core/content.py). Lo leen: engine/service/gremio.py (_fund_pool_lines, _fund_take, _fund_log_lines,
# _fund_craft_lines, _fund_craft_toggle, _fund_log_view, _guild_funds_view) y engine/service/game.py (_station_view,
# _recipe_view, _make). Una clave nueva va también en en_fondo_oficios.yaml (tools/check_locales.py). Si cambias una clave,
# búscala en el código: una clave que falta se ve como [clave].

