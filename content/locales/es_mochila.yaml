    packs: "🎒 Mochilas de oficio"   # [ES] D-339: la 10.ª categoría de 🛍️ Comprar (engine/service/market.py MARKET_CATEGORIES)

faq:                           # [ES] D-338/D-339: ❓ /d67 (content/faq.yaml); los números salen de balance.yaml (_pack_faq_values)
  d67:
    q: "🎒 ¿Qué es una mochila de oficio?"
    a: "Una mochila que hace cada oficio de recolección (🪓 Leñador, ⛏️ Minero, 🌿 Herbolario, 🎣 Pescador y 🔪 Desollador) con su propio oficio, en cualquier 🔥 Fogata o en el 🔥 Fogón de tu campamento: la básica desde el rango {pbag_low_rank} y la grande desde el {pbag_high_rank}. Puesta, los recursos de su oficio (por ejemplo, las hierbas, las setas y el musgo del Herbolario) van aparte: no ocupan los {bag_types} tipos de la mochila y caben hasta {pbag_low} de cada uno (la grande, {pbag_high}) en vez de {bag_per_type}. Te pones hasta {pbag_slots}, de oficios distintos, en 🎒 Mochila → 🎒 Mochilas de oficio (/mochilas). Quitada es un objeto más: se vende en el 🏛️ Mercado o se encarga en 📜 Pedidos de fabricación."
