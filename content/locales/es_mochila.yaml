# Texts of the backpack by item types and the 🎒 profession backpacks (D-338, confirmed; how it was applied: D-339, provisional;
# 0.62).
# [ES] Textos de la mochila por tipos de artículo y de las 🎒 mochilas de oficio (D-338, confirmada por el dueño el 23-oct-2026:
# "quiero poder farmear mucho más, aunque tarde, y que el límite sea el inventario"; cómo se aplicó: D-339, provisional). Se junta
# con es.yaml al cargar (engine/core/content.py). Lo lee: engine/service/backpack.py (las líneas de la mochila, los avisos de qué
# tope frena, la pantalla 🎒 Mochilas de oficio y sus códigos /mp1 /mq1), engine/service/game.py (🎒 Mochila, 📦 Recursos,
# recolectar y sus lotes, el mercader, las recetas), market.py (📦 Recoger y la categoría 🎒 Mochilas) y ❓ /d67 (content/faq.yaml).
# Una clave nueva va también en en_mochila.yaml (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave
# que falta se ve como [clave].

