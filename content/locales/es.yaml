# Player-facing texts in Spanish. The engine only uses the keys.
# [ES] Todos los textos que ve el jugador. El motor solo usa las claves.
# Si cambias una clave, búscala en engine/ antes: una clave que falta se ve como [clave].

common:
  use_buttons: "Usa los botones de abajo."

create:
  title: "🌅 Lost Realms · El despertar"
  intro: "El mundo se rompió en el Colapso. Despiertas junto a una fogata en el Claro, sin recuerdos y sin nada. Más allá, la tierra no tiene borde: nadie sabe qué hay lejos, y cada paso toma su tiempo."
  ask_name: "✍️ Escribe el nombre de tu héroe (de 2 a 16 letras)."
  bad_name: "⚠️ El nombre debe tener de 2 a 16 caracteres y empezar con una letra."
  name_taken: "⚠️ Ese nombre ya lo usa otro héroe. Prueba con otro."
  ask_class: "{name}, ¿cómo peleas? La clase define tu forma de combatir. Todas valen lo mismo: la diferencia la hacen tus oficios y lo que aprendas."
  rename: "✏️ Cambiar nombre"
  welcome: "✨ Bienvenido, {name}. Explora los alrededores del Claro y abre camino hacia lo desconocido."

