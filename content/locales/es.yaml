    name: "Escorpión emperador"
    moves:
      tenaza_imperial: {name: "Tenaza", warn: "Un escorpión negro del tamaño de un carro abre las pinzas."}
      aguijon_imperial: {name: "Aguijón imperial", warn: "La cola se curva sobre la coraza… viene el AGUIJÓN. (Se puede esquivar; no se puede bloquear del todo)"}
      cerrar_la_coraza: {name: "Cerrar la coraza", warn: "El escorpión se cierra en su coraza y JUNTA fuerza. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  liche_errante:
    name: "Liche errante"
    moves:
      rayo_necrotico: {name: "Rayo necrótico", warn: "Un esqueleto con corona levanta un bastón negro. (No se puede bloquear del todo)"}
      palabra_de_muerte: {name: "Palabra de muerte", warn: "El liche pronuncia una PALABRA prohibida. (Muy fuerte. Se puede interrumpir si eres más rápido; no se esquiva ni se bloquea del todo)"}
      filacteria: {name: "Filacteria", warn: "El liche aprieta su filacteria y JUNTA almas. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  engendro_del_umbral:
    name: "Engendro del umbral"
    moves:
      tentaculo: {name: "Tentáculo", warn: "Algo sin forma sale de una grieta del suelo."}
      grito_del_umbral: {name: "Grito del umbral", warn: "El engendro abre bocas por todo el cuerpo: va a GRITAR. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      zarpa_del_vacio: {name: "Zarpa del vacío", warn: "El engendro estira un brazo que antes no estaba… va a GOLPEAR. (Se puede esquivar; no se puede bloquear del todo)"}

