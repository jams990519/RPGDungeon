enemy:
  lobo_ceniciento:
    name: "Lobo ceniciento"
    moves:
      mordisco: {name: "Mordisco", warn: "El lobo enseña los dientes y busca tu pierna."}
      salto: {name: "Salto", warn: "El lobo se agazapa… va a SALTAR sobre ti. (No se puede bloquear del todo)"}
      aullido: {name: "Aullido", warn: "El lobo levanta el hocico para AULLAR. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  jabali_espinoso:
    name: "Jabalí espinoso"
    moves:
      corneo: {name: "Corneo", warn: "El jabalí baja la cabeza y resopla."}
      embestida: {name: "Embestida", warn: "El jabalí escarba la tierra… va a EMBESTIR. (No se puede esquivar)"}
  rata_del_pantano:
    name: "Rata del pantano"
    moves:
      mordida: {name: "Mordida", warn: "La rata se acerca entre el barro."}
      chillido: {name: "Chillido", warn: "La rata infla el pecho para CHILLAR y llamar a la manada. (Se puede interrumpir)"}
  espectro_de_ruinas:
    name: "Espectro de las ruinas"
    moves:
      toque_helado: {name: "Toque helado", warn: "El espectro alarga una mano helada. (No se puede bloquear del todo)"}
      lamento: {name: "Lamento", warn: "El espectro abre la boca para un LAMENTO que hiela la sangre. (Se puede interrumpir; no se esquiva)"}
  oso_de_las_cumbres:
    name: "Oso de las cumbres"
    moves:
      zarpazo: {name: "Zarpazo", warn: "El oso se levanta en dos patas."}
      aplastar: {name: "Aplastar", warn: "El oso alza ambos brazos para APLASTARTE. (No se puede esquivar)"}
  escorpion_de_arena:
    name: "Escorpión de arena"
    moves:
      pinza: {name: "Pinza", warn: "El escorpión abre las pinzas."}
      aguijon: {name: "Aguijón", warn: "La cola del escorpión se curva… viene el AGUIJÓN. (No se puede bloquear del todo)"}
  bandido_errante:
    name: "Bandido errante"
    moves:
      tajo: {name: "Tajo", warn: "El bandido gira el cuchillo."}
      estocada: {name: "Estocada", warn: "El bandido toma impulso para una ESTOCADA. (No se puede esquivar)"}
      apuntar: {name: "Apuntar", warn: "El bandido estudia tu guardia, buscando un hueco. (Se puede interrumpir)"}

