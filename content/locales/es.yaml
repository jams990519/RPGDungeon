      mordida_esmeralda: {name: "Mordida", warn: "Una sierpe de escamas verdes se desliza entre las raíces."}
      aliento_toxico: {name: "Aliento tóxico", warn: "La sierpe hincha el cuello: va a escupir VENENO. (Se puede esquivar; no se puede bloquear del todo)"}
      coletazo_esmeralda: {name: "Coletazo", warn: "La sierpe gira entre las raíces… va a barrerte con la COLA. (Se puede bloquear; no se puede esquivar)"}
  caballero_de_la_corte_marchita:
    name: "Caballero de la corte marchita"
    moves:
      estocada_feerica: {name: "Estocada", warn: "Un caballero de armadura de espinas te saluda con la espada."}
      duelo: {name: "Duelo", warn: "El caballero te señala con la espada: te desafía a DUELO. (Se puede bloquear; no se puede esquivar)"}
      corona_de_espinas: {name: "Corona de espinas", warn: "La armadura del caballero se cubre de ESPINAS. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  abominacion_del_cieno:
    name: "Abominación del cieno"
    moves:
      golpe_podrido: {name: "Golpe podrido", warn: "Una masa de barro y huesos se arrastra hacia ti."}
      devorar: {name: "Devorar", warn: "La abominación abre una boca enorme… va a TRAGARTE. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      vomito_de_cieno: {name: "Vómito de cieno", warn: "La abominación se infla… va a escupir CIENO. (Se puede esquivar; no se puede bloquear del todo)"}
  salamandra_de_lava:
    name: "Salamandra de lava"
    moves:
      mordida_ardiente: {name: "Mordida ardiente", warn: "Una salamandra al rojo vivo deja huellas de fuego."}
      escupitajo_de_lava: {name: "Escupitajo de lava", warn: "La salamandra abre la boca: va a escupir LAVA. (Se puede esquivar; no se puede bloquear del todo)"}
      zarpazo_de_brasa: {name: "Zarpazo de brasa", warn: "La salamandra se para en dos patas… va a GOLPEAR con las garras encendidas. (Se puede bloquear; no se puede esquivar)"}
  mamut_de_guerra:
    name: "Mamut de guerra"
    moves:
      colmillazo_de_mamut: {name: "Colmillazo", warn: "El mamut sacude la trompa y los colmillos."}
      embestida_de_mamut: {name: "Embestida", warn: "El mamut levanta la trompa y BRAMA: va a embestir. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      pisoton_de_mamut: {name: "Pisotón", warn: "El mamut se alza sobre las patas traseras… va a PISAR. (Se puede esquivar; no se puede bloquear del todo)"}
  espectro_glacial:
    name: "Espectro glacial"
    moves:
      toque_glacial: {name: "Toque glacial", warn: "Una figura de hielo se forma en la ventisca. (No se puede bloquear del todo)"}
      tumba_de_hielo: {name: "Tumba de hielo", warn: "El espectro alza las manos: el hielo va a CERRARSE sobre ti. (Muy fuerte. Se puede interrumpir si eres más rápido; no se esquiva ni se bloquea del todo)"}
      viento_helado: {name: "Viento helado", warn: "El espectro sopla y el VIENTO se vuelve cuchillas. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  gusano_de_las_arenas:
    name: "Gusano de las arenas"
    moves:
      mordida_del_gusano: {name: "Mordida", warn: "La arena tiembla bajo tus pies."}
      tragar: {name: "Tragar", warn: "El suelo se abre: el gusano va a SALIR con la boca abierta. (Se puede esquivar; no se puede bloquear del todo)"}
      hundirse: {name: "Hundirse", warn: "El gusano se HUNDE en la arena y desaparece. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  centinela_runico:
    name: "Centinela rúnico"
    moves:
      golpe_runico: {name: "Golpe rúnico", warn: "Las runas del centinela brillan al moverse."}
      rayo_runico: {name: "Rayo rúnico", warn: "El centinela junta un RAYO entre sus runas. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      runa_de_poder: {name: "Runa de poder", warn: "Una runa se enciende en el pecho del centinela: está JUNTANDO poder. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  quimera:
    name: "Quimera"
    moves:
      zarpazo_de_quimera: {name: "Zarpazo", warn: "La quimera ruge con sus tres cabezas: león, cabra y serpiente."}
      llamarada: {name: "Llamarada", warn: "La cabeza de cabra abre la boca: va a escupir FUEGO. (Se puede esquivar; no se puede bloquear del todo)"}
      mordida_de_serpiente: {name: "Mordida de serpiente", warn: "La cola de serpiente se levanta… va a MORDER. (Se puede bloquear; no se puede esquivar)"}
      rugido_triple: {name: "Rugido triple", warn: "Las tres cabezas RUGEN a la vez. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  titan_de_las_llanuras:
    name: "Titán de las llanuras"
    moves:
      golpe_de_titan: {name: "Golpe de titán", warn: "El titán da un paso y tapa el sol."}
      terremoto: {name: "Terremoto", warn: "El titán levanta los dos puños: va a partir el SUELO. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      roca_del_cielo: {name: "Roca del cielo", warn: "El titán arranca media colina… va a ARROJARLA. (Se puede esquivar; no se puede bloquear del todo)"}
  gigante_de_las_nubes:
    name: "Gigante de las nubes"
    moves:
      palmada: {name: "Palmada", warn: "El gigante baja de entre las nubes."}
      soplido: {name: "Soplido", warn: "El gigante infla los cachetes: va a SOPLAR un huracán. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      granizo: {name: "Granizo", warn: "El gigante sacude su manto: va a caer GRANIZO. (Se puede esquivar; no se puede bloquear del todo)"}
  licantropo_alfa:
    name: "Licántropo alfa"
    moves:
      desgarro_alfa: {name: "Desgarro", warn: "El alfa camina erguido, más alto que un hombre."}
      salto_del_alfa: {name: "Salto del alfa", warn: "El alfa se encoge, con los músculos tensos… va a SALTAR. (Se puede esquivar; no se puede bloquear del todo)"}
      mordida_maldita: {name: "Mordida maldita", warn: "El alfa abre las fauces babeando… va a MORDER. (Se puede bloquear; no se puede esquivar)"}
      llamada_del_alfa: {name: "Llamada del alfa", warn: "El alfa AÚLLA y toda la manada le responde. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  polilla_lunar:
    name: "Polilla lunar"
    moves:
      aleteo: {name: "Aleteo", warn: "Una polilla enorme, pálida como la luna, revolotea."}
      polvo_lunar: {name: "Polvo lunar", warn: "La polilla sacude las alas: un POLVO plateado cae sobre ti. (Se puede bloquear; no se puede esquivar)"}
      vuelo_rasante: {name: "Vuelo rasante", warn: "La polilla baja de golpe en vuelo RASANTE. (Se puede esquivar; no se puede bloquear del todo)"}
  leviatan_del_cieno:
    name: "Leviatán del cieno"
    moves:
      coletazo_del_leviatan: {name: "Coletazo", warn: "El agua negra se agita: algo enorme nada debajo."}
      arrastre_al_fondo: {name: "Arrastre al fondo", warn: "El leviatán abre la boca bajo tus pies: va a ARRASTRARTE al fondo. (No se puede esquivar; se puede bloquear o interrumpir si eres más rápido)"}
      ola_de_cieno: {name: "Ola de cieno", warn: "El leviatán se sumerge… va a levantar una OLA. (Se puede esquivar; no se puede bloquear del todo)"}
  fenix_de_ceniza:
    name: "Fénix de ceniza"
    moves:
      ala_ardiente: {name: "Ala ardiente", warn: "Un ave de fuego cruza el cielo dejando ceniza. (No se puede bloquear del todo)"}
      lluvia_de_fuego: {name: "Lluvia de fuego", warn: "El fénix se eleva y abre las alas: va a llover FUEGO. (Muy fuerte. Se puede interrumpir si eres más rápido; no se esquiva ni se bloquea del todo)"}
      renacer: {name: "Renacer", warn: "El fénix arde más fuerte, renaciendo de sus CENIZAS. Si lo dejas, su próximo golpe será feroz. (Se puede interrumpir)"}
  wyrm_de_hielo:
    name: "Wyrm de hielo"
    moves:
      mordida_de_hielo: {name: "Mordida de hielo", warn: "Un wyrm blanco sale de una grieta del glaciar."}
      aliento_glacial: {name: "Aliento glacial", warn: "El wyrm toma aire y el frío te muerde la cara: va a soplar HIELO. (Se puede esquivar, o interrumpir si eres más rápido; no se bloquea del todo)"}
      coletazo_de_hielo: {name: "Coletazo", warn: "El wyrm gira sobre sí mismo… va a barrerte con la COLA. (Se puede bloquear; no se puede esquivar)"}
