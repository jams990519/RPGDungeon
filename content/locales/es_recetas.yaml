  button: "📚 Libros de recetas"
  title: "📚 Libros de recetas"
  intro: "Cada libro abre las recetas de un oficio desde su rango y es tuyo para siempre. Precios: {prices}."
  price_item: "rango {rank} {price}"
  book_name: "{name} {rank}"
  owned: "✅ Tus libros: {list}"
  owned_none: "Todavía no tienes libros de recetas."
  for_sale: "🛒 A la venta para ti:"
