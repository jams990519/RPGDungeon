  none_for_sale: "Por ahora no hay libros para ti: se venden cuando uno de tus oficios llega al rango 25, 50 o 75."
  buy_button: "📕 {name} · {price}"
  bought: "📚 Compraste el libro {name}: ya puedes hacer {n} {n|receta nueva|recetas nuevas}."
  already: "Ya tienes el libro {name}."
  rank_low: "🔒 Ese libro pide rango {rank} de {name} (tienes {have})."
  no_gold: "💰 No te alcanza: el libro cuesta {price} y tienes {gold}."
  missing_hint: "📚 Con el libro {name} {rank} se abren {n} {n|receta|recetas} más aquí (🧑‍🏫 Entrenador → 📚 Libros de recetas)."
  recipe_lock: "📕 Pide el libro de recetas {name} {rank}: cómpralo en 🧑‍🏫 Entrenador → 📚 Libros de recetas."
  rank_reached: "📚 Rango {rank}: el 🧑‍🏫 Entrenador ya te vende el libro {name} {rank} ({price}) con las recetas nuevas."

item:                          # [ES] D-306 (E-223): la primera pieza de 💍 Joyería, sin gema (content/items.yaml colgante_cobre)
  colgante_cobre: "Colgante de cobre"
