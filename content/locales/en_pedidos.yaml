faq:
  d64:
    q: "📜 How do I order something from an artisan?"
    a: "In 🏛️ Market → 📜 Crafting orders (/orders) tap 📜 Order, pick the profession and what you want (also what you cannot make yourself), and the quantity (up to {corder_units}). You put in the materials or pay the artisan to get them, plus their labor, which always goes apart: we suggest one and you change it within the market band. The coins and your materials are set aside. An artisan with the profession and the rank makes it at their station: what they make reaches your 📦 Deliveries (a ✒️ masterwork, with their signature) and they get paid minus the market tax. If nobody takes it within {corder_days} days, or you cancel it before, you get everything back. You can have {corder_orders} open orders. If you are an artisan, the orders you can make show up in 🔨 To make and at your station."
