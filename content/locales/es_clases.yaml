# Player-facing texts for the classes added after version 0.1 (merged with es.yaml).
# [ES] Textos de las clases y especializaciones nuevas. El motor mezcla este archivo con es.yaml.
# Para qué sirve: nombres de clases, specs, ataques básicos, habilidades y recursos.
# Lo usa: engine/core/content.py (_read_texts) y, por las claves, el servicio y el combate.
# Si cambias esto, revisa: cada spec de content/classes.yaml necesita class.<id>.name, .role y .attack_name;
# cada habilidad necesita ability.<id>.name; cada grupo, class_group.<id>.name y .desc.
# Los de guerrero, picaro y sacerdote (los IDs viejos) siguen en es.yaml.

class_group:
  paladin: {name: "⚜️ Paladín", desc: "placas y Poder Sagrado: juzga, protege y cura desde el frente"}
  cazador: {name: "🏹 Cazador", desc: "malla y foco: apunta, manda a su bestia y pone trampas"}
  caballero_muerte: {name: "💀 Caballero de la Muerte", desc: "placas y runas: congela, drena vida y esparce plagas"}
  chaman: {name: "⚡ Chamán", desc: "malla y Vorágine: rayos, mareas y tótems"}
  mago: {name: "🔮 Mago", desc: "tela y maná: fuego, hielo y magia arcana"}
  brujo: {name: "🕯️ Brujo", desc: "tela y fragmentos de alma: caos, demonios y maldiciones"}
  monje: {name: "☯️ Monje", desc: "cuero y chi: combos, tambaleo y nieblas que curan"}
  druida: {name: "🌿 Druida", desc: "cuero y formas: felino, oso, sanador o astral; el único con los 4 roles"}
  cazador_demonios: {name: "😈 Cazador de demonios", desc: "cuero y Furia: saltos viles, sigilos y almas"}
  evocador: {name: "🐉 Evocador", desc: "malla y Esencia: aliento de dragón y magia del tiempo"}
  nigromante: {name: "🦴 Nigromante", desc: "tela y almas cosechadas: plagas, esqueletos y vida robada"}
  bardo: {name: "🎻 Bardo", desc: "cuero y Compás: ritmo de espadas, baladas y tempo"}

class:
  guerrero_furia:
    name: "🛡 Guerrero · Furia"
    role: "abre una ventana con Golpe Colosal y la aprovecha"
    attack_name: "Doble tajo"
  guerrero_senor_guerra:
    name: "🛡 Guerrero · Señor de la Guerra"
    role: "planta estandartes: más daño o menos daño recibido"
    attack_name: "Golpe de mando"
  paladin_reprension:
    name: "⚜️ Paladín · Reprensión"
    role: "juzga al enemigo y lo castiga con luz"
    attack_name: "Golpe de cruzado"
  paladin_proteccion:
    name: "⚜️ Paladín · Protección"
    role: "escudo que silencia y auras que protegen"
    attack_name: "Martillo del justo"
  paladin_sagrado:
    name: "⚜️ Paladín · Sagrado"
    role: "cura desde la vanguardia con su Faro de Luz"
    attack_name: "Choque sagrado"
  cazador_punteria:
    name: "🏹 Cazador · Puntería"
    role: "apunta una ronda y el disparo siguiente no falla"
    attack_name: "Disparo firme"
  cazador_bestias:
    name: "🏹 Cazador · Bestias"
    role: "su mascota tanquea y él la dirige"
    attack_name: "Disparo de cobra"
  cazador_supervivencia:
    name: "🏹 Cazador · Supervivencia"
    role: "trampas y señuelos: le quita opciones al enemigo"
    attack_name: "Lanza de supervivencia"
  picaro_sutileza:
    name: "🗡️ Pícaro · Sutileza"
    role: "no bloquea, esquiva: tanque de riesgo y premio"
