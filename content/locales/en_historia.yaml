  quest:
    c1_m1:
      title: The Fire That Never Goes Out
      hablar: By the campfire, a woman with weathered arms feeds the flames without looking at anyone. They say her name is Marta and that this fire was already burning before the Collapse.
      ronda: 'Marta: “This flame didn''t go out when the world broke. If it goes out now, the Clearing goes out with it. Walk the surroundings: I want to know what''s prowling nearby.”

        🔎 Explore with 🧭 Explore → 🔎 Explore.'
      lena: 'Marta: “Nothing''s coming… for now. Bring me four logs of 🪵 wood: that''ll get us through the night.”

        🪓 Wood is collected with 🧭 Explore → 🪓 Chop wood (or 🧺 Gather).'
      done: Marta throws the wood on the fire and the flame rises, tall and still. “You're one of the Clearing now,” she says. “Nobody here asks where you come from. But everyone watches where you're going.”
    c1_m2:
      title: Everything Is Worth Something
      hablar: Among patched crates and sacks, a thin man counts coins that no one ever sees him put away. It's Odo, the merchant. He looks at you like someone appraising an old boot.
      vender: 'Odo: “No memories and nothing to your name? Bad business. But everything is worth something, even what''s broken. Bring me whatever you find and sell it to me: three things, to start.”

        🛒 The merchant is in 🏕️ Camp, in the Clearing.'
      volver: 'Odo puts away what you sold him with a care you didn''t expect. He beckons you over: he has something to tell you about the time before the Collapse.'
      done: 'Odo lowers his voice: “There used to be stone roads that ran to the edge of the world. The edge moved far away and the roads broke. The Brotherhood lives off those pieces. If you''re interested, you know where to find me.”'
    c1_m3:
      title: Herbs That Remember
      hablar: In a tent that smells of sweet smoke, a young woman grinds leaves in silence. It's Iria, the healer. She looks up before you say a word.
      hierbas: 'Iria: “The Clearing''s herbs aren''t enough anymore. The ones that grow farther away heal more… and sometimes they make you dream things you never lived. Bring me four bunches of 🌿 healing herb.”

        🌿 It grows in meadows, forests and swamps, outside the Clearing.'
      entregar: You have the herbs. Some of them glow faintly as evening falls, as if they held light. Take three to Iria.
      done: 'Iria smells the leaves and closes her eyes. “They come from far away: they have a glow the Clearing doesn''t. The Collapse didn''t just break the world; it left something loose out there. The Circle of the Threshold wants to understand what.”'
    c1_m4:
      title: Tracks to the East
      hablar: An old man with a grey beard mends a map full of holes by the fire. He limps as he stands. “Anselmo,” he introduces himself. “I went farther than anyone and came back. Almost in one piece.”
      salir: 'Anselmo: “The beasts changed after the Collapse. Something is driving them out of the forest. Leave the Clearing: go at least two zones away and see with your own eyes.”

        🚶 Move from 📍 Zone; each zone takes its time.'
      bestias: 'Here the ground is churned up: wolf tracks, boar tracks… and something that drags roots. Defeat three beasts in these lands.

        🏹 You can go hunting from 🧭 Explore.'
      contar: You've seen enough. Go back to the Clearing and tell Anselmo about the roots.
      done: 'Anselmo listens without interrupting. “Creeping roots… So it''s true: the old one of the forest has awakened. They call it Raigambre. It guarded this place long before there was a Clearing. If it gets angry, no campfire will be enough.”'
    c1_m5:
      title: The Singing Amber
      hablar: The anvil rings out from afar. A broad woman, her hair tied back and old burns on her arms, hammers a red-hot iron. It's Brena, the blacksmith.
      fabricar: 'Brena: “Nobody in this Clearing knows how to make anything. Show me you do: craft something at a station. Anything. A plank, a bandage, a potion.”

        ⚒️ The stations are in 🏕️ Camp → 🛠️ Craft. If you don''t know any profession yet, learn one in 🧑‍🏫 Trainer → 📚 Learn professions.'
      ambar: 'Brena shows you a shard of amber the size of a finger. It hums softly, like a distant beehive. “It turned up in the scrap I bought from Odo. It sings at night. I don''t know what it is.”

        🌿 Iria would study it for the Circle of the Threshold.

        ⚒️ Brena would melt it down on the anvil for the Common Flame.

        🪙 Odo would pay well for it, for the Brotherhood.'
      opt_iria: 🌿 Give it to Iria
      opt_brena: ⚒️ Let Brena melt it
      opt_odo: 🪙 Sell it to Odo
      ambar_done_iria: Iria takes the shard in both hands, as if it burned. “This is a piece of something alive,” she whispers. “I'm going to listen to it.”
      ambar_done_brena: Brena tosses the shard into the crucible. The amber shrieks as it melts and the iron comes out veined with gold. “Now it's good for something,” she grunts.
      ambar_done_odo: Odo holds it up to the light and whistles. “This isn't ordinary amber.” He pays you without haggling, and that worries you more than anything.
      done: Brena goes back to her anvil. “What you did with that shard won't be forgotten,” she says without looking at you. “In the Clearing, everyone finds out about everything.”
    c1_m6:
      title: Roots on the Road
      hablar: Anselmo has the map open on his knees. He's marked a spot to the east in charcoal, in a forest. “That's where Raigambre sleeps. Or slept. I need to know if its roots reach the roads.”
      bosque: 'Anselmo: “The beasts of the forest and the swamp are the first to feel it. Defeat three in those lands and see what they''re running from.”

        🌲 Look for 🌲 forest or 🐸 swamp zones on your 🗺️ Map.'
      herido: Among the trees you find a Brotherhood scavenger trapped by roots that move on their own. His name is Tano and he's badly hurt. The roots are retreating east, leaving a fresh trail that no one will ever see this clearly again.
      opt_cargar: 🫂 Carry Tano to the Clearing
      opt_rastro: 🌀 Follow the trail
      herido_done_cargar: You carry Tano the whole way. He's heavy, he groans, he bleeds. But he arrives alive. Odo takes him in without a word and squeezes your shoulder.
      herido_done_rastro: You leave Tano with water and follow the trail. Where the roots sink into the earth, two 🌸 moonflowers grow, glowing on their own. When you go back for Tano, he's gone.
      informe: You have what Anselmo needed to know. Go back to the Clearing and tell him what you saw in the forest.
      done: 'Anselmo marks the Guardian''s lair on the map. “No more doubts: Raigambre is awake and its roots reach all the way to the Clearing. Someone has to go and face it.” He doesn''t look at you. He doesn''t need to.'
    c1_m7:
      title: The Amber Heart
      hablar: 'That night, around the campfire, no one talks about anything else. Marta beckons you from the fire: “Come. We have to decide who goes to the forest.”'
      hablar_done_cargar: 'Tano is by the fire, bandaged and pale. He presses a pouch into your hand: “I owe you my life. It''s not much, but it''s all I have.”'
      hablar_done_rastro: Someone says they saw Tano walk into the forest alone, at night. No one saw him again. Marta doesn't look at you.
      ayuda: 'Marta: “It''s decided: you''re going. But you''re not going without help.”'
      ayuda_iria: 'Marta: “Iria wants to see you before you leave. She says the shard spoke to her.”'
      ayuda_brena: 'Marta: “Brena is waiting for you at the forge. She says she has something for you.”'
      ayuda_odo: 'Marta: “Odo is asking for you. He says he owes you something, and that never happens.”'
      ayuda_done_iria: 'Iria: “The shard sings a single word: heart. Raigambre has a heart of amber. Take this: the forest bites.”'
      ayuda_done_brena: 'Brena: “I got these ingots out of the iron from the melted amber. Use them or sell them, but come back.”'
      ayuda_done_odo: 'Odo: “I sold that amber far away, to people who don''t ask many questions. This is your share. Don''t spend it all in the forest.”'
      guarida: 'Everything is ready. Raigambre''s lair lies to the east, deep in the forest. Go there.

        👑 It appears on the 🗺️ Map and in 📒 Places once someone discovers it.'
      guardian: 'The forest falls silent all at once. Among the trunks, something enormous opens its eyes: a body of root and bark, with an amber glow in its chest. Raigambre.

        ⚔️ Challenge it from 🧭 Explore. Read its warnings: the big hits are announced.'
      regreso: Raigambre falls to its knees and sinks into the earth, not quite dead. Where its heart was beating, you see the mouth of a stone road leading down to the east. Go back to the Clearing and tell Marta.
      done: 'Marta listens to you by the campfire and, for the first time, the flame trembles. “A road beneath the roots…” she murmurs. “So Raigambre wasn''t attacking the Clearing: it was keeping that road covered.” Far away, something answers with a deep sound. Chapter 2 will open that road.'
    o_desertor_1:
      title: Soldier's Boots
      hablar: Marta notices your boots before your face. “Soldier's boots,” she says. “Yesterday a rider came asking about deserters.”
      buscar: 'Marta: “He was looking for someone with a scar on their hand and fear in their eyes. I told him nothing. Walk the surroundings and see if he''s still nearby.”'
      volver: You saw no riders, but you did see horseshoe tracks heading east. Go back to Marta.
      done: Marta nods. “There are no banners here, just a campfire. If someone comes for you, they'll have to get past me first.”
    o_desertor_2:
      title: Horseshoes to the East
      hablar: Anselmo knows every track that passes through the Clearing. “War horseshoes,” he says when he sees them. “I haven't seen horses like that in years.”
      salir: 'Anselmo: “They were heading east, two zones out or more. If you want to know who''s looking for you, you''ll have to go out there.”'
      bestias: 'You find a dead campfire, a torn banner and a shield you recognize: your old captain''s. Something attacked him here. Defeat the beasts prowling the place.'
      done: 'Among the ashes lies a half-burned letter with your name on it. Only one line can still be read: “…it wasn''t your fault. Come find me.”'
    o_desertor_3:
      title: A Medal for Sale
      hablar: Odo turns a medal between his fingers. “A scavenger sold it to me. He found it in the forest, next to a man who wasn't breathing anymore.” It's your captain's medal.
      pieles: 'Odo: “I don''t give anything away, you know me. But a trade is a trade: bring me two 🦌 hides and it''s yours.”

        🦌 Beasts drop hide when you defeat them.'
      marta: Medal in hand, you go back to the campfire. Marta is the only one who knows your story.
      done: 'Marta looks at the medal and closes your fist around it. “Your captain died looking for you, or looking for forgiveness. Now you decide what you are: someone who ran away, or someone who stayed to tend this fire.”'
    o_aprendiz_1:
      title: Hands That Remember
      hablar: Brena catches you eyeing the anvil. “You've got workshop hands,” she grunts. “Who taught you?” You don't remember the name, but you do remember the hands.
      hacer: 'Brena: “If you learned something, it shows in the work, not in the talk. Make something at a station and I''ll tell you what school you come from.”

        ⚒️ The stations are in 🏕️ Camp → 🛠️ Craft. If you don''t know any profession yet, learn one in 🧑‍🏫 Trainer → 📚 Learn professions.'
      mostrar: You've made something with your hands. Show it to Brena.
      done: 'Brena turns your work over and goes still. “Only one master taught this way of closing a joint: Teodoro the Tall. He left the Clearing for faraway lands two winters ago. He never came back.”'
    o_aprendiz_2:
      title: The Master's Tools
      hablar: Anselmo remembers Teodoro. “He traveled with a cart full of tools. I saw him pass by heading east, along the broken roads.”
      salir: 'Anselmo: “If he left anything, he left it on the road. Go two zones away or more and look for the remains of a cart.”'
      carro: 'You find wheel tracks that fade into the grass. Explore carefully: a cart doesn''t just vanish.'
      done: 'Under some roots, a toolbox turns up with your apprentice''s mark carved on the lid. Inside, a note: “For when you''re ready.”'
    o_aprendiz_3:
      title: For When You're Ready
      hablar: Iria holds your master's note up to the candle. New letters appear, written in herb juice. “Healer's ink,” she smiles.
      hacer: 'The note says: “An artisan doesn''t wait for the world to mend itself: they mend it. Make two more things with your hands and follow my steps east.”'
      brena: You did what your master asked. Tell Brena.
      done: 'Brena slaps you on the back so hard she nearly knocks you over. “Teodoro would be proud. His empty workshop is yours now: fill it.”'
    o_huerfano_1:
      title: Street Eyes
      hablar: 'Odo recognizes you by the way you look at his crates. “You''re from the tunnels,” he says. “It shows: you look for the exit first.”'
      vender: 'Odo: “Folks from down below were always good at finding what others lose. Sell me two things and we''ll talk business.”'
      volver: You sold your goods. Odo beckons you closer.
      done: Odo lowers his voice. “The tunnels under the Clearing are older than the Collapse. Some of them moved on their own. Be careful what you find down there.”
    o_huerfano_2:
      title: The Tunnels Are Moving
      hablar: 'Anselmo spreads out his map: he''s marked tunnel mouths all over the Clearing. “There used to be just one. Now there are many. Something is digging from below.”'
      claro: 'Anselmo: “Get to know the whole Clearing, inch by inch. If there are new openings, you''ll see them.”'
      bestias: At the edge of the Clearing, a new tunnel mouth breathes out warm air. Something came out of there. Defeat two beasts in the surroundings.
      done: Next to the tunnel mouth you find a wooden toy carved with your name. Someone knew you before the Collapse.
    o_huerfano_3:
      title: A Name of Your Own
      hablar: You show the toy to Marta. She looks at it for a long time. “My brother carved this toy,” she says at last. “For the children of the tunnels. For you.”
      juntar: 'Marta: “My brother was lost in the Collapse, and the children he looked after were left with no one. If you want to honor him, help the Clearing: gather six useful things, anything at all.”'
      volver: You gathered what Marta asked for. Go back to the campfire.
      done: Marta puts a hand on your shoulder. “Now you have a name of your own, and a home. Don't go hiding underground again.”
    o_noble_1:
      title: A Seal on the Silver
      hablar: Odo bites your silver coin and raises an eyebrow. “A noble house's seal. Haven't seen one in years. Did you know your house owed money to half the Clearing?”
      vender: 'Odo: “Relax: the debts died with the Collapse. But if you want to be treated well, start doing business like everyone else: sell me two things.”'
      volver: Odo is waiting for you with a merchant's smile.
      done: 'Odo: “Your house had lands to the north, by a river. The Collapse left them far from the Clearing. They say your coat of arms is still standing somewhere.”'
    o_noble_2:
      title: Lands That Slipped Away
      hablar: Anselmo knows your coat of arms. “I saw it carved in a stone, on a hill. Lands go, but stones stay.”
      salir: 'Anselmo: “Head out two zones or more from the Clearing, wherever the road takes you. The stones of your house are out there somewhere.”'
      piedras: 'You find a moss-covered stone carved with half a coat of arms. Explore the surroundings: there may be more.'
      done: 'Farther on, the foundations of a tower appear. Nothing is left to inherit: only the name, and what you do with it.'
    o_noble_3:
      title: What You Do With It
      hablar: 'Marta listens to your story without being impressed. “Here, nobles eat the same soup as everyone else,” she says. “But there''s one thing good blood knows how to do: give.”'
      dar: 'Marta: “The newly awakened arrive with nothing, just like you did. Bring me 🧵 fiber and 🪵 wood for them: four of each.”'
      done: Marta shares out the wood and fiber among the newcomers. Nobody knows it came from you, and that's fine. “Now you truly are of good blood,” she says.
    o_curandero_1:
      title: Hands That Know
      hablar: 'Iria looks at your hands: they have green stains that won''t wash off. “Healer''s hands,” she says. You remember a grey fever that emptied houses.'
      fibra: 'Iria: “To bandage, you need fiber. Gather three bunches of 🧵 fiber and I''ll tell you what I know about the grey fever.”'
      entregar: You have the fiber. Take it to Iria.
      done: Iria braids the fiber with herbs as she talks. “The grey fever came here too, after the Collapse. It came from the east. Like everything strange.”
    o_curandero_2:
      title: What the Wind Brings
      hablar: Anselmo coughs as he remembers. “The grey fever. I had it, far from here. A flower that glowed at night cured me.”
      salir: 'Anselmo: “If you want to understand the fever, go where the east wind is born: two zones away or more.”'
      hojas: The herbs here have a grey tinge at the tips of their leaves. Gather three 🌿 healing herbs to study them.
      done: 'As you rub the grey leaves, the smell brings back a whole memory: your village, your teacher, the cure that didn''t arrive in time. It wasn''t your fault. But you learned.'
    o_curandero_3:
      title: The Cure That Never Came
      hablar: Iria examines the grey leaves. “The fever and the flower come from the same place,” she says. “What the Collapse left behind both sickens and heals.”
      remedio: 'Iria: “Let''s prepare remedies for the Clearing, in case the fever returns. Make something at a station: a bandage, a potion, whatever you know.”'
      marta: You did your part. Marta wants to thank you on behalf of the Clearing.
      done: Marta keeps your remedies at the inn, by the fire. “If the fever comes back, this time it won't catch us off guard. Thanks to you.”
    o_minero_1:
      title: Mine Dust
      hablar: Brena smells the dust on your clothes. “Deep-vein dust,” she says. “There aren't many miners left. What did you see down there?”
      terreno: 'Brena: “Before you tell me, learn the land. Walk the surroundings: a miner who doesn''t know the ground doesn''t last long.”'
      metal: 'Brena: “And bring me metal: two ⚙️ scraps. I want to see what veins are nearby.”

        ⚙️ Metal turns up while exploring, or by gathering in hills, mountains and ruins.'
      done: Brena rings the metal against the anvil. “Old metal, from before the Collapse. New veins sound different. As if something had moved them.”
    o_minero_2:
      title: The Sound in the Deep
      hablar: “The sound in the deep,” Anselmo repeats, grave. “I heard it in a mine to the east. Like a very big heart beating slowly.”
      salir: 'Anselmo: “Go two zones or more from the Clearing and press your ear to the rock. If it beats, we''ll know you didn''t imagine it.”'
      piedra: Gather four 🪨 stones from these lands. Some are warm, as if something were breathing underneath.
      done: When you split a warm stone, a golden vein appears, almost amber. It beats. Very slowly.
    o_minero_3:
      title: A Vein That Beats
      hablar: Odo sees the stone with the golden vein and stops smiling. “Don't sell that,” he says. “There are people who'd kill to know where you found it.”
      bestias: 'Odo: “Something followed you from the mine. I saw beasts prowling the road. Deal with two before they reach the Clearing.”'
      brena: 'Go back to Brena: she''ll know what to do with the vein.'
      done: 'Brena locks the stone away in a drawer. “This is what woke up in your mine: living amber, like the Guardian''s heart. Someday we''ll know what it means.”'
