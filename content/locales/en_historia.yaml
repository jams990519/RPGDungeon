  faction:
    llama:
      name: 🔥 The Common Flame
      desc: 'They tend the Clearing''s campfire and want to rebuild what the Collapse broke: houses, roads, people.'
    umbral:
      name: 🌀 The Circle of the Threshold
      desc: They study the Collapse and its power. They believe understanding it is the only way to keep it from happening again.
    restos:
      name: ⚙️ The Brotherhood of Remnants
      desc: 'Scavengers, merchants and tunnel folk: they live off what was left. The old gets sold; the broken gets fixed.'
  npc:
    marta:
      name: Marta
      role: the innkeeper at the Campfire
      lines:
        first: Just woke up? Sit close to the fire. Nobody here asks where you come from.
        default: The campfire doesn't tend itself, you know? Someone has to look after it.
        known: You're one of the Clearing now. If you're cold, the fire belongs to everyone.
        friend: There's always hot soup for you. The Flame doesn't forget its own.
        night: The flame is trembling tonight. Something big is moving in the forest.
        tano: Tano won't stop telling everyone you carried him here. He's a legend now, and you along with him.
        cold: Warm your hands and be on your way. The Flame isn't happy with you.
        hero: The flame has been still since you came back from the forest. I've never seen it like this. Thank you.
    odo:
      name: Odo
      role: the merchant
      lines:
        first: No memories and nothing to your name? Bad business. But everything is worth something, even what's broken.
        default: I buy, I sell and I don't ask questions. Well, I ask a few.
        known: 'My favorite customer. Don''t tell anyone: you''ll ruin my reputation.'
        friend: For friends of the Brotherhood, there's always a better price… some other day.
        ambar_sold: That amber you sold me is very far away by now. Better not ask where.
        tano: Tano's my nephew, did you know? Well, almost. You saved his life. I owe you one.
        tano_lost: Tano never came back from the forest. Someone left him behind. I'm not saying who.
        cold: I sell, but I don't give credit. Least of all to you.
        hero: They say there's a stone road beneath the roots. Stone roads lead to old things. And old things sell.
    iria:
      name: Iria
      role: the healer
      lines:
        first: I've been waiting for you. Don't ask me how I knew.
        default: Herbs from far away heal more. And sometimes they make you dream things you never lived.
        known: The leaves you brought me still glow at night. The Collapse left something alive out there.
        friend: The Circle has its eye on you. Few look as far ahead as you do.
        ambar_kept: 'The shard sings at night. I think it repeats one word: heart.'
        ambar_melted: Brena melted down something she didn't understand. I hope we don't regret it.
        cold: There are wounds I can't heal. Distrust is one of them.
        hero: 'Raigambre didn''t die: it sleeps. And its sleep keeps something covered. Be careful what you wake.'
    anselmo:
      name: Anselmo
      role: the old explorer
      lines:
        first: I went farther than anyone and came back. Almost in one piece. Sit down, it's a long story.
        default: My map has more holes than paper. The farther from the Clearing, the less we know.
        roots: Creeping roots… Raigambre has awakened. We have to keep watch on the forest.
        lair: The lair is marked. When you're ready, go. Not before.
        friend: I'd show you my whole map, if I had the whole thing.
        cold: Some roads you don't walk with just anyone.
        hero: A road beneath the roots. I knew it. I knew it and nobody believed me.
    brena:
      name: Brena
      role: the blacksmith
      lines:
        first: If you came to look, look. If you came to help, grab something.
        default: Iron doesn't lie. People do.
        known: Your hands aren't a newcomer's anymore. Good.
        friend: For the people of the Flame, the anvil is always free.
        ambar_forged: Iron veined with amber never cools down. Strange. Useful, but strange.
        ambar_sold: That shard belonged to the Clearing and ended up in Odo's pocket. Badly done.
        cold: My anvil isn't for just anyone.
        hero: They say you faced it head-on. That's how it's done. No beating around the bush.
  origin:
    desertor:
      name: 🪖 Army Deserter
      intro: You remember soldier's boots, a banner you burned and a war that no longer has sides.
      trait: 'you can butcher prey like you did on campaign: +15% 🔪 Skinner experience.'
      gift: 2 🩹 bandages from your old knapsack.
    aprendiz:
      name: 🛠️ Guild Apprentice
      intro: You remember the smell of a workshop, your master's hands guiding yours and the day they left for lands far from the Clearing.
      trait: 'you learned in a workshop: +10% experience in the refining and crafting professions.'
      gift: 1 🟫 plank and 1 🔩 ingot from your master's workshop.
    huerfano:
      name: 🕳️ Orphan of the Ruins
      intro: You remember dark tunnels under the Clearing, stolen bread and a name nobody gave you.
      trait: 'you haggle like on the streets: the Clearing''s merchant sells to you 10% cheaper.'
      gift: 20 🥉 hidden in the sole of your boot.
    noble:
      name: 🏵️ Fallen Noble
      intro: You remember cold halls, a family crest and lands the Collapse swallowed in a single night.
      trait: 'you know how to deal with people: you gain 10% more reputation with the factions.'
      gift: 1 🥈 silver coin bearing your house's seal.
    curandero:
      name: ⚕️ Village Healer
      intro: You remember a village gripped by fever, herbs that weren't enough and faces you still see when you close your eyes.
      trait: 'you know the plants that heal: +15% 🌿 Herbalist experience.'
      gift: 3 🌿 healing herbs wrapped in a handkerchief.
    minero:
      name: ⛏️ Vein Miner
      intro: You remember the cold of the mine, the strike of the pick and a sound from the deep that wasn't stone.
      trait: 'you''ve read veins all your life: +15% ⛏️ Miner experience.'
      gift: 3 ⚙️ metal scraps from your last shift.
