  pescador_redes:
    name: Nets
    desc: 'You fish with a net: more fish on every run.'
  pescador_perlas:
    name: Pearls
    desc: 'You open every shell: sometimes there''s a pearl, which Jewelcrafting takes as a gem.'
  pescador_ahumado:
    name: Smoking and Salting
    desc: Your fish dishes and preserves go further in the pantry.
  cocina_guisos:
    name: Stews
    desc: Rations and hunter's stews that go further.
  cocina_conservas:
    name: Preserves
    desc: Preserves and roast fish that go further.
  cocina_banquetes:
    name: Banquets
    desc: Feasts and banquets that go further.
