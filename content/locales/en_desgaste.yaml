faq:
  d63:
    q: "🔧 Why does my gear say ⚠️ or 🔧 84/100?"
    a: "That is its durability: every fight wears what you are wearing a little (more if you flee or fall). Under {wear_low}% of its maximum it is marked ⚠️ and you get a notice; at 0 it is damaged: you still wear it, but it gives no bonuses until you repair it. In 🛡️ Gear → 🔧 Repair (/repair) you repair it yourself with the profession that makes that piece (rank from its level − {repair_margin}, at its station, with a refined material and ⚡), have the smith of any 🔥 campfire do it for coins, or place a 📜 order for an artisan, who gets paid for the work (it lasts {repair_days} days; if nobody takes it, you get the coins back). Every repair lowers its maximum by {repair_loss}; after {repairs} repairs ({repairs_mw} for a ✒️ masterwork), the next time it reaches 0 it breaks for good: we ask you before the last one. Your gear from before started full."
