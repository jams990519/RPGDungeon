# Player-facing texts in English (D-250). Same keys, same order as es_oficios_equipo.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es_oficios_equipo.yaml. Una clave nueva va
# primero en es_oficios_equipo.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

profession:
  encantamiento:
    name: Enchanting
    how: 'disenchant old gear into ✨ essences and enchant your pieces: 🛡️ Gear → a piece → ✨ Enchanting (or /enchant)'
prof:
  perk:
    disenchant: +{v}% essences when disenchanting
  branch:
    enchant: ✨ Arcane Arts
resources:
  use:
    esencia: '✨ Enchanting: enchant your pieces (comes from disenchanting gear)'
    esencia_mayor: '✨ Enchanting: enchant pieces of level 50 or higher (comes from disenchanting 🟣 epic pieces)'
ench:
  title: ✨ Enchanting
  intro: 'Disenchant the gear you no longer use: the piece is lost and gives you ✨ essences. With them and a material from another profession, enchant your pieces: one enchantment per piece, which adds its bonus while you wear it.'
  rank_line: ✨ Enchanting · rank {rank} ({title}) {bar}
  essences_line: 'You carry: {items}'
  essences_none: 'You don''t carry any essences yet: disenchant a piece you don''t use.'
  table_title: 'One enchantment per slot (the value comes from your rank and stays on the piece):'
  table_line: '{name} · {slots}: {stats} · needs {material}{lock}'
  lock: ' · 🔒 rank {rank}'
  cost_rule: Enchanting takes ✨ {base} essences and 1 more every {per} levels of the piece, 🔮 1 greater essence from level {major}, and the material (1, and 1 more every {mat_per} levels). ⚡{energy}
  disenchant_rule: Disenchanting gives ✨ essences by rarity (⚪ {comun} · 🟢 {poco_comun} · 🔵 {raro} · 🟣 {epico}) and 1 more every {per} levels; 🟣 epic pieces also give 🔮 1 greater essence. ⚡{energy}
  worn_title: 'Your enchanted gear: {items}'
  worn_none: You aren't wearing anything enchanted yet.
  how: Choose a piece in 🛡️ Gear and tap ✨ Enchanting.
  pick_button: 🛡️ Choose piece
  piece_title: ✨ Enchant or disenchant
  current: 'Now: {enchant}'
  current_none: 'Now: no enchantment.'
  no_slot: This piece can't be enchanted.
  locked: 🔒 {name} needs rank {need} in ✨ Enchanting (you have {rank}).
  offer_best: It already has the best enchantment you can make at your rank. Rank up to improve it.
  offer: 'You can give it {name}: {stats} at your rank.'
  offer_replace: 'You can give it {name}: {stats} at your rank (replaces the current one).'
  needs: 'Needs: {items} · ⚡{energy}'
  enchant_button: ✨ Enchant ({stats})
  worn_cant: 💨 To disenchant it, take it off first.
  disenchant_line: '💨 Disenchant: the piece is lost and gives you {items}{bonus} · ⚡{energy}'
  disenchant_bonus: ' (and up to {pct}% more from your rank)'
  disenchant_button: 💨 Disenchant
  enchanted: '✨ You enchanted {item}: {enchant} (⚡ −{energy}).'
  not_better: That piece already has that enchantment or a better one. You didn't spend anything.
  worn_no: '💨 You can''t disenchant what you''re wearing: take it off first.'
  confirm_title: 💨 Disenchant a masterwork?
  confirm: It's a ✒️ masterwork{by}. If you disenchant it, it's lost forever.
  confirm_by: ' by {name}'
  confirm_button: 💨 Yes, disenchant
  cancel_button: ↩️ No
  disenchanted: '💨 You disenchanted {item}: +{items} (⚡ −{energy}).'
  unlocked: '🔓 New enchantment: {items}.'
  mark: ' ✨'
  item_line: '✨ Enchantment: {enchant}'
  item_button: ✨ Enchanting
  name:
    filo: ⚔️ Edge
    vigor: ❤️ Vigor
    guarda: 🛡️ Ward
gear:
  better_mark: ' ⬆️'
  better_hint: ⬆️ = better than what you wear in that slot, and you can already use it.
  better_notice: '⬆️ You have a better piece! {item} beats what you wear in {slot}: {stats}.'
  better_button: 🔁 Equip {item}
  better_batch: '⬆️ You have a better piece: {item}. Put it on in 👤 Hero → 🎒 Backpack → 🛡️ Gear (the one with ⬆️).'
