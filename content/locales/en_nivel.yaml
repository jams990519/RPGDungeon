# Texts of the 0.41 camp patch (D-304), in English: ⬆️ Improve camp with ⏫ Next level (a checklist that fills in) and
# 🗺️ Expand territory (a mini-map and 8 directions, up to the zones of each stage), what every member sees in 🔨 Upgrades and the
# 🤝 assistants line of 👥 Members.
# [ES] Los textos de es_nivel.yaml en inglés (D-250): las mismas claves, los mismos huecos {nombre} y plurales
# (tools/check_locales.py). Lo leen engine/service/game.py y engine/service/gremio.py, como a es_nivel.yaml.

