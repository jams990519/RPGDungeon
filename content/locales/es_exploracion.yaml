# The 🧭 Explorador profession and the 👹 enemy camps that move every day (D-112). Numbers live in content/balance.yaml
# (blocks explorer and enemy_camps); the profession in content/professions.yaml.
# [ES] Textos del oficio 🧭 Explorador y de los 👹 campamentos enemigos de cada día: el menú de 🧭 Explorar en la zona de un
# campamento, ⚔️ Asaltar, 🕵️ Infiltrarse, lo que se ve en 📍 Zona, en el 🗺️ Mapa y en 📒 Lugares, el cofre y lo que ve el
# Explorador con cada rango. Se junta con es.yaml al cargar (engine/core/content.py: las claves que ya existen, como prof,
# batch o story, se completan, no se pisan).
# Documento de diseño: diseno/02-mundo/mapa-infinito-y-viaje.md §1.14; diseno/07-economia/profesiones.md §0.2 y §0.4
# Lo leen: engine/service/game.py (sección "enemy camps and the 🧭 Explorador": _ecamp_menu, _assault, _infiltrate,
#     _ecamp_fight_done, _ecamp_destroyed, _ecamp_map_lines, _places_view, _professions_view) y engine/service/story.py
#     (📔 Diario y el título).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Si cambias una clave, búscala en game.py: una clave que
# falta se ve como [clave] (tests/test_enemy_camps.py revisa que no falte ninguna).

