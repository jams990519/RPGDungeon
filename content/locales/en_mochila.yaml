faq:
  d67:
    q: "🎒 What is a profession backpack?"
    a: "A backpack each gathering profession (🪓 Lumberjack, ⛏️ Miner, 🌿 Herbalist, 🎣 Fisher and 🔪 Skinner) makes with its own trade, at any 🔥 Campfire or at your camp's 🔥 Hearth: the basic one from rank {pbag_low_rank} and the large one from {pbag_high_rank}. Worn, its profession's resources (for example the Herbalist's herbs, mushrooms and moss) go apart: they don't use the backpack's {bag_types} types and hold up to {pbag_low} of each (the large one, {pbag_high}) instead of {bag_per_type}. You wear up to {pbag_slots}, of different professions, in 🎒 Backpack → 🎒 Profession backpacks (/backpacks). Taken off it is just another item: it sells in the 🏛️ Market or can be ordered in 📜 Crafting orders."
