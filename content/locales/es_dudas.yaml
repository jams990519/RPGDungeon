# Texts of ❓ Dudas (D-191, confirmed; layout D-192, provisional): the screens (dudas.*) and every question and answer (faq.*).
# [ES] Textos del botón ❓ Dudas (🏕️ Campamento) y de /dudas: la pantalla principal, los temas, los resultados de una búsqueda y
# cada pregunta (faq.<código>.q) con su respuesta (faq.<código>.a). Los códigos, temas, palabras clave y relacionadas están en
# content/faq.yaml. Se junta con es.yaml y los demás es_*.yaml al cargar (engine/core/content.py).
# Números: las respuestas usan marcadores como {energy_max} que el motor llena con content/balance.yaml (_faq_values en
#     engine/service/game.py): nunca escribas un número de balance a mano en una respuesta.
# Documento de diseño: diseno/01-plataforma/menus-campamento-y-heroe.md §4
# Lo leen: engine/service/game.py (sección "❓ Dudas") y tests/test_menus_y_dudas.py (toda pregunta tiene q y a, y se llenan
#     todos sus marcadores).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Las preguntas son cortas (sirven de botón): hasta unos 32
#     caracteres.

dudas:
  button: "❓ Dudas"
  title: "❓ Dudas"
  intro: "Pregunta lo que quieras: escribe una palabra (por ejemplo «energía», «mapa» o «campamento») y te muestro las preguntas que ya tienen respuesta."
  codes: "Cada pregunta tiene su código: toca o escribe /d07 para ver su respuesta."
  popular: "⭐ Las más buscadas:"
  topics: "📚 O elige un tema:"
  topic_line: "{name}: {n} {n|pregunta|preguntas}"
  line: "/{code} · {question}"
  topic_title: "❓ Dudas · {name}"
  results_title: "🔎 «{query}»"
  results: "Encontré {n} {n|pregunta|preguntas}. Toca o escribe su código para ver la respuesta:"
  results_more: "… y {n} más: prueba con otra palabra más precisa."
  none: "🤔 No encontré nada con «{query}». Prueba con otra palabra (por ejemplo «energía», «oficios» o «mazmorra») o elige un tema."
  unknown_code: "🤔 No existe la pregunta {code}. Los códigos van de /d01 en adelante."
  answer_title: "❓ {question}"
  related: "🔗 Relacionadas:"
  again: "🔎 Escribe otra palabra para seguir buscando."
  back_button: "❓ Dudas"
  write_hint: "❓ ¿Una duda? Escribe /dudas y una palabra, o abre ❓ Dudas en 🏕️ Campamento."
  stopwords: [que, como, cual, cuales, donde, cuando, cuanto, cuanta, para, por, con, sin, los, las, una, uno, unos, unas, del, mas,
              hay, esto, eso, esta, este, puedo, puede, tengo, tiene, hago, sirve, sirven, quiero, mis, tus, sus, son, ser, the]
  topic:
    start: "🌱 Primeros pasos"
    world: "🧭 Mapa y exploración"
    fight: "⚔️ Peleas y salud"
    hero: "👤 Tu héroe"
    camp: "🏕️ Campamentos"
    trades: "⚒️ Oficios"
    money: "💰 Monedas y comercio"
  value:                        # [ES] pedacitos que el motor arma con números de balance.yaml (_faq_values)
    move_free: "no gasta energía"
    move_cost: "cuesta {n} ⚡"
    list_and: "{items} y {last}"

faq:
  # ---- 🌱 Primeros pasos
  d01:
    q: "🌱 ¿Qué hago al empezar?"
    a: "Despiertas en el 🔥 Claro, la fogata del inicio. Muévete a una zona vecina desde 📍 Zona, y ahí 🔎 explora, 🧺 recolecta, 🪓 tala y 🏹 caza. Vuelve al Claro a vender, dormir, cocinar y fabricar. El juego te guía paso a paso y te avisa cada vez que se abre algo nuevo."
  d02:
    q: "🧭 ¿Para qué sirve cada menú?"
    a: "Abajo tienes 5 botones: 📍 Zona (dónde estás y a dónde ir), 🧭 Explorar (explorar, recolectar, talar, cazar y el 🗺️ Mapa), 🏕️ Campamento (cocinar, los 👥 jugadores de la fogata, fabricar, el entrenador, el mercader y estas ❓ Dudas), 👤 Héroe (tu ficha, mochila, talentos, salud, oficios y diario) y ⚙️ Opciones."
  d03:
    q: "📖 ¿Dónde quedó la Historia?"
    a: "El botón 📖 Historia salió del menú: ahora la historia te guía paso a paso mientras juegas. Tu 📔 Diario, tus 🎯 Misiones y las ⚜️ Facciones están en 👤 Héroe → 📔 Diario. El 📜 Tablón de encargos y los personajes del Claro, en 🏕️ Campamento. /historia también te lleva al diario."
  d04:
    q: "⌨️ ¿Qué atajos puedo escribir?"
    a: "Escribe /zona, /hero, /inv (mochila), /stats, /salud, /habilidades, /oficios, /opciones, /diario, /encargos, /reconocer o /dudas. Con /dudas y una palabra buscas respuestas, y cada respuesta tiene su código, como /d05."
  d05:
    q: "⏱️ ¿Por qué hay que esperar?"
    a: "Viajar, explorar, recolectar y dormir toman minutos de verdad. Puedes cerrar el chat: tu héroe sigue y te aviso cuando termina. Nada se pierde mientras esperas."
  d54:
    q: "🆕 ¿Cómo sé qué hay de nuevo?"
    a: "Cuando el juego trae algo nuevo te llega una vez el aviso con las notas del parche. Si no ves el menú de abajo nuevo, escribe /start. Tu progreso se guarda para siempre."
  d55:
    q: "⚙️ ¿Qué cambio en Opciones?"
    a: "En ⚙️ Opciones eliges con cuánta vida te retiras ({retreat} %): con menos, no empiezas a explorar, recolectar ni talar hasta descansar. También cambias el 🌐 idioma y nos mandas 💬 Feedback. Queda guardado y lo cambias cuando quieras."   # [ES] D-308 (0.42)
  # ---- 🧭 Mapa y exploración
  d06:
    q: "🚶 ¿Cómo me muevo por el mapa?"
    a: "En 📍 Zona toca una dirección. Cada zona que cruzas toma {travel_first} min, cerca o lejos (10 zonas, 10 minutos), y {move_cost}. Con 🔗 Moverte armas un camino de varios pasos (hasta {walk_max}) y tu héroe lo camina solo. Al llegar a cada zona puede salirte un monstruo: si le ganas, sigues. Con 🗺️ Mapa → 📒 Lugares vuelves de una vez a un lugar que ya conoces."   # [ES] D-244 (0.33)
  d07:
    q: "⚡ ¿Qué es la energía?"
    a: "La ⚡ energía se gasta en lo que haces fuera de una pelea: explorar, recolectar, cazar, fabricar, cocinar y más. Tienes hasta {energy_max} y recuperas {energy_day} al día (1 cada {energy_every}). Pelear no gasta energía. Cada amigo que invitas te da más."
  d08:
    q: "🔎 ¿Qué es explorar?"
    a: "🔎 Explorar busca en tu zona: cada vuelta toma {explore_min} min y 1 ⚡, suma de {explore_low} a {explore_high} % de la zona y puede darte cosas, monedas o una pelea. Al {reveal} % descubres sus recursos de a uno. Con la zona al 100 % sigues con las vecinas sin moverte."
  d09:
    q: "🧺 ¿Cómo recolecto?"
    a: "🧺 Recolectar junta los recursos que ya descubriste en tu zona: cada vuelta toma {gather_min} min y 1 ⚡. Si juntas mucho, la zona se agota y vuelve sola con las horas (los 6 de base, unos {base_units} por hora). En el territorio de tu campamento no salen peleas; desde la 0.49 ahí juntas lo mismo que afuera y, con la 🧱 Muralla, la tierra cosecha sola para el 💰 fondo (/d61). Para juntar solo 🪵 madera, 🪓 Talar (/d57)."   # [ES] D-305 (0.42); D-309 (0.49): sin el +50 % de tu territorio
  d10:
    q: "🔢 ¿Qué son los lotes?"
    a: "Al explorar, recolectar o cazar eliges cuánta energía gastar seguido ({batches} o Todo). Tu héroe hace una vuelta tras otra y te aviso al final con el resumen. Si sale una pelea, el lote se corta y la peleas tú."
  d11:
    q: "🏹 ¿Cómo cazo?"
    a: "🏹 Cazar (en 🧭 Explorar) busca una presa de la zona: cuesta {hunt_energy} ⚡ cada una y solo da la pelea y su botín (carne, piel, monedas, a veces equipo). En el Claro no hay presas. Con un campamento puedes llamar a una 🏹 Partida de caza con tus compañeros."
  d12:
    q: "🎨 ¿Qué dicen los colores del mapa?"
    a: "En 🗺️ Mapa las zonas que no investigaste se ven en blanco ▫️. Cuando investigas una zona a la mitad (50 %) aparece el color de su terreno (🟩 pradera, 🟢 bosque, 🟫 colinas…) y ese terreno se suma a la leyenda de arriba. Cuenta también lo que exploras alrededor sin moverte. Las 🔥 fogatas se ven siempre; las zonas de tu campamento, como las demás, se ven en blanco hasta investigarlas a la mitad. El color no dice qué recursos hay: eso se sabe explorando."   # [ES] D-223 (0.30.2); D-324 (0.48): fogatas y tu territorio gris (D-311)
  d13:
    q: "🗺️ ¿Dónde veo las mazmorras?"
    a: "Ya no salen en el 🗺️ Mapa: ahí estás tú 🧍, las 🔥 fogatas, los 🏕️ campamentos de jugadores, tu gremio y el color de las zonas que investigaste. Las 🕳️ 🌀 mazmorras, los ✨ nodos, los 👹 campamentos enemigos y la 👑 guarida se descubren caminando. Lo que ya visitaste queda en 📒 Lugares, también los ✨ nodos que encontraste, para volver de una vez. Con el 🧭 Explorador, 🔭 Reconocer (/reconocer) lista los 👹 campamentos enemigos que tu rango deja ver."   # [ES] D-223 (0.30.2); D-324 (0.48): fogatas, ✨ Nodos en 📒 Lugares y 👹 en 🔭 Reconocer
  d14:
    q: "✨ ¿Qué es un nodo de recursos?"
    a: "Un ✨ nodo es una zona rica en un recurso. Al llegar a su zona sabes de qué es, para siempre. Ahí ese recurso rinde ×{node_yield}, se agota la mitad de rápido y a veces ({node_rare} %) da una 💠 gema en bruto o una 🌸 flor de luna. Lo puede usar cualquiera. Los que encontraste quedan en 🗺️ Mapa → 📒 Lugares → ✨ Nodos, para volver de una vez."
  d15:
    q: "🕳️ ¿Qué es una mazmorra?"
    a: "Las mazmorras son para uno y están siempre en el mismo lugar; lo de adentro cambia cada día. 🕳️ La chica tiene 4 salas, su jefe y un cofre que abres una vez al día. 🌀 La profunda se baja piso a piso: juntas una bolsa de premios y eliges 🚪 Salir con lo ganado; si pierdes, te queda la mitad."
  d16:
    q: "👹 ¿Qué es un campamento enemigo?"
    a: "Cada día aparecen 👹 campamentos enemigos en lugares distintos. Mientras uno sigue en pie, su zona no se explora ni se recolecta. Con ⚔️ Asaltar peleas contra sus guardias y al final su jefe, que suelta su cofre. Con 🕵️ Infiltrarse (🧭 Explorador rango {infiltrate_rank}) entras sin que te vean y anotas todo."
  d17:
    q: "👑 ¿Quién es el Guardián?"
    a: "El Guardián del Claro espera en su guarida 👑. Ve hasta su zona y toca ⚔️ Desafiar al Guardián en 🧭 Explorar: es una pelea dura, para uno. El primero que lo vence queda para siempre como Pionero. Si pierdes, puedes volver a intentarlo."
  d18:
    q: "🔭 ¿Qué es reconocer de lejos?"
    a: "Con el oficio 🧭 Explorador en rango {recon_rank} usas /reconocer: ves desde lejos qué hay en una mazmorra o en un 👹 campamento enemigo, sin ir ni pelear. Uno por lugar al día. La lista también trae los 👹 campamentos enemigos que tu rango deja ver, con su nombre, su tiempo de viaje y, con más rango, su fuerza; los que puedes reconocer ahora llevan su código (/rc1). El 🥷 Sigilo del Explorador a veces te evita una pelea al explorar a mano o al llegar de un viaje."
  d19:
    q: "🚫 ¿Por qué no puedo recolectar?"
    a: "Puede ser por la mochila llena (vende o usa cosas), la zona agotada (vuelve en unas horas), un 👹 campamento enemigo en pie en la zona, la guarida del Guardián, tu vida bajo el % de 🩹 Retirarse (descansa primero) o que todavía no descubriste sus recursos (explora primero). Si no se puede, nunca se cobra energía."   # [ES] D-308 (0.42): la vida bajo 🩹 Retirarse
  d20:
    q: "👥 ¿Veo a otros jugadores?"
    a: "En 📍 Zona ves quién anda en tu zona y qué hace; en la fogata, 🏕️ Campamento → 👥 Jugadores muestra quién jugó en el último minuto, con su tarjeta. Puedes saludar con /saludar o brindar con /brindar, y mostrar tu diario. Es solo para verse: no da premios ni peleas entre jugadores."
  # ---- ⚔️ Peleas y salud
  d21:
    q: "⚔️ ¿Cómo funciona una pelea?"
    a: "Las peleas son por rondas y tienes 4 botones: ⚔️ Básico (cuesta 0 y da +1 de energía), Constructor (2), Preparador (3) y 💥 Gastador (6). Arrancas con 5 de energía y ganas 2 por turno. Cada botón en el orden de tu rol suma una marca y el Gastador las cobra (hasta +50 %); romper el orden corta la cadena. 🛡️ Defenderse o una poción cuestan 1 y gastan el turno; 🏃 Huir está en 🎒 Mochila. Pelear no gasta ⚡."   # [ES] 0.31 (D-225, D-226)
  d22:
    q: "💀 ¿Qué pasa si pierdo?"
    a: "Si caes, despiertas malherido: pierdes el {defeat_pct} % de tus monedas y tu vida vuelve sola, como siempre (de 0 a llena en {downed_full}). Una poción o la 🛏️ Posada lo arreglan antes. No pierdes niveles, equipo ni zonas."
  d23:
    q: "❤️ ¿Cómo recupero vida?"
    a: "Fuera de pelea la vida vuelve sola: de 0 a llena en {hp_full}. Más rápido: 🧪 pociones y vendas (🎒 Mochila → 🧪 Pociones), la 🛏️ Posada del Claro o el 🛏️ Refugio de tu campamento. En 👤 Héroe → 🩺 Salud ves cuánto falta."
  d24:
    q: "🤖 ¿Qué son las peleas automáticas?"
    a: "Por ahora están apagadas: si sale una pelea en un lote de explorar, recolectar o cazar, el lote se corta y la peleas tú. Volverán más adelante."
  d25:
    q: "📊 ¿Qué son ataque y defensa?"
    a: "En 👤 Héroe → 📊 Estadísticas está cada número con lo que hace: ❤️ vida, ⚔️ ataque, 🛡 defensa (armadura) e iniciativa. Suben con el nivel, tus puntos de nivel y el equipo. Las clases de un mismo rol arrancan con los mismos números: lo que te separa es tu equipo y tu nivel."   # [ES] 0.31 (D-232)
  # ---- 👤 Tu héroe
  d26:
    q: "🎖 ¿Cómo subo de nivel?"
    a: "Ganas experiencia explorando, recolectando, cazando, fabricando y con los encargos. Todos los caminos llegan al nivel {max_level}, despacio: es un juego largo. En 👤 Héroe ves tu nivel y cuánto falta."
  d27:
    q: "🌟 ¿Qué son los talentos?"
    a: "Cada clase tiene 2 roles. Eliges el primero al crear tu héroe y el segundo lo aprendes al nivel {second_role}, gratis: cambias de rol cuando quieras en 👤 Héroe → 🌟 Talentos. Cada nivel te da 1 punto, que se pone solo en tu rol activo y te hace un poco más fuerte."   # [ES] 0.31 (D-230)
  d28:
    q: "🎛️ ¿Cómo elijo mis habilidades?"
    a: "Tus 4 botones están abiertos desde el principio: Básico, Constructor, Preparador y Gastador. Cada rol pide su orden (lo ves en 🌟 Talentos y en cada pelea). Desde el nivel {hybrid_level}, el 🔀 Modo híbrido (👤 Héroe → 🎛️ Barra de combate, o /hibrido) te deja cambiar el Constructor, el Preparador o el Gastador por el del mismo puesto de tu otro rol, gratis fuera de combate; el Básico y el orden de tu rol no cambian."   # [ES] 0.31 (D-225, D-230); 0.54 (D-312, D-330): el modo híbrido ya está en el juego
  d29:
    q: "🔀 ¿Qué es la doble especialización?"
    a: "Es tu segundo rol: al nivel {second_role} lo aprendes gratis y desde ahí cambias entre tus dos roles cuando quieras en 👤 Héroe → 🌟 Talentos. Tus puntos se reparten solos en el rol que juegas."   # [ES] 0.31 (D-230)
  d30:
    q: "🎒 ¿Cómo funciona la mochila?"
    a: "La 🎒 mochila tiene {bag_cap} de espacio: cada unidad ocupa 1 (el cinturón y lo que llevas puesto no cuentan). Lo que encuentras nunca se pierde aunque pase del espacio, pero con la mochila llena no recolectas ni compras hasta vender o usar cosas."
  d31:
    q: "🛡️ ¿Cómo me equipo?"
    a: "En 🎒 Mochila → 🛡️ Equipo ves lo que llevas y las piezas que encontraste, si te sirven y cuánto mejoran. 🔁 Equipar lista lo que no llevas puesto, cada pieza con su código (/e1): ⬆️ marca una mejor que la tuya; tócala y elige ✅ Equipar. 🔽 Desequipar lista lo puesto: su código (/q1) te lo quita. Cada pieza pide un nivel y un tipo."
  d32:
    q: "🎭 ¿Qué es el origen?"
    a: "El origen dice de dónde viene tu héroe: da un rasgo chico (nunca de combate), un regalo y su propia historia. Se elige una sola vez, cuando quieras, en 👤 Héroe → 🎭 Origen. Si ya lo elegiste, lo conservas."
  d33:
    q: "📔 ¿Qué es el diario?"
    a: "En 👤 Héroe → 📔 Diario están tu tarjeta, lo último que hiciste, tus 🎯 Misiones y las ⚜️ Facciones. Escribe /bio y un texto para tu biografía, o /diario y un nombre para ver la tarjeta de otro héroe."
  # ---- 🏕️ Campamentos
  d34:
    q: "🔥 ¿Qué hay en el Claro?"
    a: "El 🔥 Claro es la fogata del inicio, la base de todos: 🛒 mercader, 🛏️ posada, las estaciones para 🍲 cocinar y 🛠️ fabricar, el 🧑‍🏫 entrenador, el 📜 tablón de encargos y estas ❓ Dudas. El Claro no crece: para crecer, funda tu propio campamento."
  d35:
    q: "🏕️ ¿Cómo fundo mi campamento?"
    a: "Lo funda tu 🛡️ gremio. El líder va a una zona a Lejanía {camp_far} o más, la explora al 100 % y conoce {camp_known} de las 8 zonas de alrededor, sin otro campamento a {camp_gap} zonas o menos. Hacen falta {found_members} miembros del gremio ahí y {found_cost} en el 💰 fondo. El líder toca 🏕️ Campamento → 🏕️ Fundar campamento aquí: tarda {found_minutes} min con {found_members} miembros presentes y menos con más (nunca menos de {found_floor} min). El campamento se llama como el gremio y a cada miembro le llega la invitación."
  d36:
    q: "⬆️ ¿Cómo subo o agrando mi campamento?"
    a: "En tu campamento: 🏰 Gestionar → ⬆️ Mejorar. ⏫ Siguiente nivel muestra en una lista qué obras tienen que estar construidas y qué materiales faltan (desde el nivel {chests_from}, también 🪎 cofres); cualquier miembro aporta con 🤲 y se va completando. Cada subida pide también una 🎯 misión de grupo: una meta entre todos los miembros (vencer monstruos, juntar un recurso, llenar la despensa o ganar peleas de oleada) que suma lo que hace cada uno, esté donde esté; al cumplirla, el 💰 fondo recibe un premio chico y cualquier miembro puede subir. Pasa de campamento a aldea, pueblo, ciudad y castillo. 🗺️ Agrandar territorio suma una zona vecina: el fundador o un 🤝 asistente elige hacia dónde, y cada etapa tiene su tope de zonas."
  d37:
    q: "🙋 ¿Quién entra a mi campamento?"
    a: "Otro jugador va a tu campamento y toca 🙋 Pedir unirme; deciden el fundador o un 🤝 asistente (los oficiales). Cada etapa tiene su cupo: {members_stages} (campamento, aldea, pueblo, ciudad y castillo); las 🛖 Cabañas y las 🛏️ Literas suman lugares. Quien no juega {idle_days} días deja libre su lugar (se le avisa {idle_left} días antes; nunca al fundador): su héroe y sus cosas quedan y puede pedir entrar de nuevo. Los miembros comparten las mejoras, la despensa, las oleadas y el gremio."   # [ES] D-327 (0.51)
  d38:
    q: "🌾 ¿Qué es la despensa?"
    a: "Desde el nivel {pantry_level} tu campamento tiene 🌾 despensa: cada miembro que jugó en el día come 1 ración. Se llena con 🏰 Gestionar → 🌾 Aportar comida (carne, pescado, comida cocinada o 🥖 provisiones). Con hambruna el campamento no crece, pero nunca pierde niveles."
  d39:
    q: "🛡️ ¿Qué son las oleadas?"
    a: "{raids_week} veces por semana llega una oleada a tu campamento. Tienen {raid_window} min para tocar 🛡️ Defender y pelear una vez cada uno; hace falta que gane la mitad de los miembros activos. Si no alcanza, la despensa pierde el {raid_loss} % y nada más. La 🛡️ Defensa de tus mejoras debilita a los atacantes. Antes del castillo llegan las 🌊 oleadas crecientes: {castle_waves} oleadas seguidas, cada una un {castle_waves_pct} % más fuerte; hay que ganar {castle_waves_pass} (si no alcanzan, vuelven a empezar a los {castle_waves_retry} días)."   # [ES] D-329 (0.53): las oleadas crecientes del castillo (D-122)
  d40:
    q: "🔨 ¿Qué son las mejoras?"
    a: "En 🏘️ Servicios están las obras del campamento por tipo (🏠 Casas, ⚒️ Oficios con un edificio por oficio, 🛡️ Defensas, 📚 Saber). El fundador o un 🤝 asistente activa cada obra; entonces todos ven lo que falta y aportan con 🤲 o desde lejos con 💰 Depositar, hasta completarlas y después se construyen con el tiempo: {work_minutes} min por nivel de la obra con 2 miembros en el territorio (con 1, el doble; con más, menos). Lo construido queda para siempre y da servicios y defensa."
  d41:
    q: "🔬 ¿Cómo investigo?"
    a: "🔬 Investigar es el 📚 Conocimiento de tu campamento: con la 📚 Biblioteca (nivel {library_level}) estudian de a uno {studies}, y lo aprendido vale para siempre para todos los miembros. En el Claro no se investiga."
  d42:
    q: "🛡️ ¿Qué es el gremio?"
    a: "Cualquiera crea un gremio por {gremio_cost} (🏕️ Campamento → 👥 Jugadores → 🛡️ Gremio, o /gremio); caben {gremio_cap} antes del campamento. Se pide entrar y acepta el líder o un oficial. Sirve para ver dónde está cada miembro y qué hace, mandar 📢 mensajes y juntar un 💰 fondo desde donde estés; el líder marca el 📍 punto de reunión y funda el campamento. Después, sus miembros son los del campamento: sube de nivel con lo que exploran, ganan y juntan entre todos. Para llegar a castillo hace falta un gremio de nivel {guild_castle}, {castle_active} miembros que jugaron en los últimos {active_days} días y ganar {castle_waves_pass} de las {castle_waves} 🌊 oleadas crecientes."   # [ES] D-327 (0.51): los activos del castillo (D-253.2); D-329 (0.53): las oleadas crecientes
  d43:
    q: "📜 ¿Qué es el tablón?"
    a: "En el 📜 Tablón (🏕️ Campamento) hay 3 encargos nuevos cada día, uno de cada personaje: cumplirlos da experiencia, monedas y reputación con su facción. Si tienes campamento, ves también sus encargos de la semana, que se hacen entre todos."
  # ---- ⚒️ Oficios
  d44:
    q: "⚒️ ¿Cómo aprendo un oficio?"
    a: "Cada oficio se aprende una vez, pagando su primera receta ({learn_price}), en 🧑‍🏫 Entrenador → 📚 Aprender oficios. Después sube haciendo recetas, y cada rango abre recetas nuevas. Solo el 🧭 Explorador no se aprende: sube solo. La recolección también se aprende; sin el oficio, recolectar te da igual los recursos base. Al rango 20, 40, 60, 80 y 95 el oficio se frena hasta que compras el 🎖️ título siguiente en el 🧑‍🏫 Entrenador (/titulos). Tus oficios: /misoficios."
  d45:
    q: "🛠️ ¿Cómo fabrico?"
    a: "En 🏕️ Campamento → 🛠️ Fabricar eliges 🪚 Refinar (madera → tablón, metal → lingote…) o 🛠️ Fabricar (equipo, pociones, vendas, muebles). Cada receta muestra lo que pide, cuánta ⚡ gasta, cuánta experiencia de oficio te da y su color (🟧 entera, 🟨 la mitad, 🟩 un cuarto, ⬜ nada: para subir, haz lo de tu tramo; hay uno cada 5 rangos en todos los oficios). Las recetas de rango 25, 50 y 75 o más piden su 📚 libro de recetas (🧑‍🏫 Entrenador → 📚 Libros de recetas). El Claro tiene todas las estaciones básicas; tu campamento, las de sus mejoras."
  d46:
    q: "🍲 ¿Cómo cocino?"
    a: "🍲 Cocinar (🏕️ Campamento) usa la estación de la 🍲 Cocina: carne, pescado y lo que da cada terreno se vuelven raciones y guisos que rinden más en la 🌾 despensa. En el Claro ya se cocina; en tu campamento, con el 🔥 Fogón. El 🎣 pescado sale de las zonas con agua: 🎣 Pescar (en 🧭 Explorar) junta solo pescado."
  d47:
    q: "🎓 ¿Qué son las especializaciones?"
    a: "Cuando un oficio llega al rango {spec_first} eliges su primera 🎓 especialización, y al {spec_second} la segunda (nunca las tres). Dan bonos y recetas propias que crecen con el dominio. Se eligen en ⚒️ Oficios → 🎓 Especialización o con /especialidad."
  d48:
    q: "✨ ¿Qué es el encantamiento?"
    a: "Con /encantar desarmas equipo viejo en ✨ esencias y con ellas encantas una pieza para darle un bono chico. Es un oficio más: primero se aprende (📚 Aprender oficios) y sube encantando y desencantando."
  d49:
    q: "✒️ ¿Qué es una obra maestra?"
    a: "Al fabricar una pieza de equipo puede salir ✒️ obra maestra: más fuerte, única y con tu firma. Sale más seguido cuanto más rango tienes en ese oficio."
  # ---- 💰 Monedas y comercio
  d50:
    q: "💰 ¿Cómo funcionan las monedas?"
    a: "Hay 🥉 bronce, 🥈 plata y 🥇 oro: {rate} 🥉 = 1 🥈 y {rate} 🥈 = 1 🥇. También 💰 bolsas (se cosen), 🪎 cofres (se arman con bolsas) y 💎 diamantes. Todo está en 🎒 Mochila → 💰 Monedas."
  d51:
    q: "🛒 ¿Qué hago con el mercader?"
    a: "El 🛒 Mercader del Claro vende pociones, vendas y 🥖 provisiones (hasta {provisions_cap} por semana) y te compra materiales al {sell_pct} % de su precio, y las pociones y los remedios de la mochila a poco ({remedy_pct} %). El equipo que no usas se vende desde 🛡️ Equipo. La comida no se vende: es para la despensa."
  d52:
    q: "🪎 ¿Cómo hago bolsas y cofres?"
    a: "Una 💰 bolsa se cose con {bag_recipe} y {bag_coins}. Un 🪎 cofre se arma con {chest_bags} bolsas y {chest_items}. Se hacen en 🎒 Mochila → 💰 Monedas (en el Claro) o en la 🪡 Sastrería de tu campamento. Los cofres pagan los niveles altos del campamento."
  d53:
    q: "🔗 ¿Para qué sirve invitar?"
    a: "En 👤 Héroe está tu código de invitación. Cada amigo que entra con tu enlace y crea su héroe te da {invite_bonus} ⚡ extra."
  d56:
    q: "📌 ¿Cómo voy a una coordenada?"
    a: "Cada lugar dice sus coordenadas: (x, y). Tú estás donde dice 📍 Zona. El norte suma a la y y el este, a la x: (3, -2) está 3 zonas al este y 2 al sur del Claro, que es (0, 0). Para ir, escribe /ir x y (por ejemplo, /ir 3 -2): se arma el camino en 🔗 Moverte, primero este-oeste y después norte-sur, y tocas ✅ Terminar. Hasta {walk_max} pasos por vez."   # [ES] D-278 (0.36.1, pedido del dueño)
  d57:
    q: "🪓 ¿Cómo consigo madera?"
    a: "🪵 Hay madera en todas las zonas, y más en bosques, bosques oscuros y selvas. En 🧭 Explorar, 🪓 Talar junta solo madera: como 🧺 Recolectar ({gather_min} min y 1 ⚡ por vuelta, los mismos lotes), pero cada unidad es madera y sube al 🪓 Leñador. En un ✨ nodo de madera rinde ×{node_yield}. Se agota y vuelve sola: unas {base_units} por hora en cada zona."   # [ES] D-305 (0.42); D-309 (0.49): sin el +50 % de tu territorio
  d58:
    q: "🏛️ ¿Cómo vendo a otros jugadores?"
    a: "En una 🔥 fogata, 🛒 Mercader → 🏛️ Mercado (o /mercado; también en tu campamento con 🏪 Puesto de trueque). 🏷️ Vender: el equipo y lo fabricado (pociones, remedios, muebles, comida, bolsas y cofres) con su código (/s1); pones precio y cantidad y sale de tu mochila. Cuando alguien compra, cobras al momento menos el {market_tax} % de impuesto. Los recursos se venden en 📥 Pedidos de compra, a quien los pide. Hasta {market_orders} órdenes a la vez; duran {market_days} días y ❌ cancelar devuelve todo."   # [ES] D-320 (0.46)
  d59:
    q: "📦 ¿Cómo compro y cuándo me llega?"
    a: "🏛️ Mercado → 🛍️ Comprar: cada lista va de la oferta más barata a la más cara; toca el código (/c1) y compra. Para recursos, 📝 Pedir recursos: apartas las monedas y quien los tenga te vende. Lo comprado lo trae un transportista: llega a 📦 Entregas en {market_delivery} y lo recoges en cualquier 🔥 fogata o en tu campamento, hasta donde quepa en la mochila; el resto espera."   # [ES] D-320 (0.46)
  d60:
    q: "💰 ¿Uso el fondo del gremio en mi oficio?"
    a: "Sí, en las estaciones de tu campamento (no en las 🔥 fogatas). Primero las obras: el fondo da lo que les falta a las obras activas y a ⏫ Siguiente nivel, y eso queda guardado. Lo que sobra cuenta al refinar y fabricar como si lo llevaras: la receta toma primero de tu mochila y después del fondo (✅💰 en la lista), hasta {fund_cap} por día. Queda anotado en 🛡️ Gremio → 💰 Fondos → 📜 Quién usó qué, y el fundador o un 🤝 asistente puede cerrarlo ahí."   # [ES] D-322 (0.47)
  d61:
    q: "🌾 ¿Qué es la cosecha de la muralla?"
    a: "Con la 🧱 Muralla construida (desde el nivel {wall_level}, en 🏘️ Servicios → 🛡️ Defensas), cada zona del territorio de tu campamento cosecha sola el {harvest_pct} % de lo que vuelve a crecer (unas {harvest_zone} por día cada una), sin gastar energía y sin bajar los recursos de la zona. Se guarda hasta {harvest_cap} días y cada {harvest_days} días llega sola al 💰 fondo del campamento (nunca a la mochila de nadie), si algún miembro jugó esa semana; a cada miembro le llega un aviso. Va primero a las obras y a ⏫ Siguiente nivel, y lo que sobra, a los oficios (/d60). Reemplaza el +50 % que antes daba recolectar en tu territorio. Lo ves en 🏰 Gestionar → ⬆️ Mejorar y en 🛡️ Gremio → 💰 Fondos."   # [ES] D-309, D-325 (0.49)
