# Textos del 🗺️ pergamino de mapa del 🧭 Explorador (D-311 parte 5, confirmada por el dueño, E-180; cómo se aplicó: D-326,
# provisional; 0.50).
# [ES] Para qué sirve: todo lo que ve el jugador al hacer, mirar, usar y vender un pergamino de mapa (engine/service/map_scroll.py),
#     el botón 🗺️ Pergaminos del 🗺️ Mapa, la línea de la 🎒 Mochila y de 📍 Zona, la categoría 🗺️ Mapas del 🏛️ Mercado y lo que
#     abre el rango del 🧭 Explorador (explorer.what.map_scroll y explorer.short.map_scroll). Se junta con es.yaml y los demás
#     es_*.yaml al cargar (engine/core/content.py: las claves que ya existen, como item, market o explorer, se completan, no se
#     pisan). Cada clave va también en en_pergamino.yaml (D-250; python tools/check_locales.py en 0 errores). Los números salen
#     de content/balance.yaml (bloque map_scroll y map_view.fog.color_at).
# Documento de diseño: diseno/02-mundo/mapa-infinito-y-viaje.md §1.9.4
# Lo usan: engine/service/map_scroll.py, engine/service/market.py (market.cat.maps, market.scroll_mark, scroll.new_line,
#     scroll.nothing_new, scroll.use_explain) y engine/service/game.py (_map_view, _bag_view, _zone_view, _explorer_what,
#     _explorer_prof_lines).
# Estilo: español neutro, de tú, frases cortas para el teléfono. Si cambias una clave, búscala en el código: una clave que falta
#     se ve como [clave] (tests/test_pergamino_mapa.py revisa que no falte ninguna).

