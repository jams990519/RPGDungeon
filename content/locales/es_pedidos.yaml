# Texts of the crafting orders between players (D-140, confirmed; how it was applied: D-335, provisional; 0.59).
# [ES] Textos de los 📜 pedidos de fabricación entre jugadores (D-140, confirmada por el dueño en E-24: "le das al artesano los
# materiales, o le pagas para que los consiga, más su mano de obra"; cómo se aplicó: D-335, provisional). Se junta con es.yaml al
# cargar (engine/core/content.py). Lo lee: engine/service/craft_orders.py (📜 Pedidos de fabricación, 📜 Encargar, la lista de
# recetas para encargar, el borrador, tu pedido, 🔨 Para hacer, hacer un pedido, cancelar, vencer y los avisos a otros
# jugadores), y los ganchos de engine/service/game.py (_recipe_view, _station_view, _prof_detail_view) y market.py (el botón
# del 🏛️ Mercado). Una clave nueva va también en en_pedidos.yaml (tools/check_locales.py). Si cambias una clave, búscala en el
# código: una clave que falta se ve como [clave].

