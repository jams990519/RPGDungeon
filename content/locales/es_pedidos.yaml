faq:                           # [ES] D-335: ❓ /d64 (content/faq.yaml); los números salen de balance.yaml (_corder_faq_values)
  d64:
    q: "📜 ¿Cómo le encargo algo a un artesano?"
    a: "En 🏛️ Mercado → 📜 Pedidos de fabricación (/pedidos) toca 📜 Encargar, elige el oficio y lo que quieres (también lo que tú no sabes hacer), y la cantidad (hasta {corder_units}). Pones tú los materiales o le pagas al artesano para que los consiga, más su mano de obra, que va siempre aparte: te sugerimos una y la cambias dentro de la banda del mercado. Las monedas y tus materiales quedan apartados. Un artesano con el oficio y el rango lo hace en su estación: lo hecho te llega a 📦 Entregas (una ✒️ obra maestra, con su firma) y él cobra menos el impuesto del mercado. Si nadie lo toma en {corder_days} días, o lo cancelas antes, te devolvemos todo. Puedes tener {corder_orders} pedidos abiertos. Si eres artesano, los pedidos que puedes hacer salen en 🔨 Para hacer y en tu estación."
