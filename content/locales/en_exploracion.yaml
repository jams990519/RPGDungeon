# Player-facing texts in English (D-250). Same keys, same order as es_exploracion.yaml; the engine only uses the keys.
# [ES] Los textos que ve el jugador, en inglés (D-250): las mismas claves y en el mismo orden que es_exploracion.yaml. Una clave nueva va
# primero en es_exploracion.yaml y, en el mismo cambio, aquí. tools/check_locales.py compara los dos idiomas (tests/test_idiomas.py lo
# exige): mismas claves, mismos huecos {nombre} y {n|uno|varios}, mismas etiquetas HTML y el mismo largo en las listas
# que el motor lee por posición (nombres de zona, salas de mazmorra).

ecamp:
  icon: 👹
  arrive: 👹 An enemy camp! Its guards won't let you explore or gather here. 🧭 Explore → ⚔️ Assault.
  blocked: '👹 There''s an enemy camp in this zone: its guards won''t let you explore or gather until it falls. You didn''t spend anything.'
  zone_line: '👹 Enemy camp: no exploring or gathering here until it''s destroyed (🧭 Explore → ⚔️ Assault).'
  ruins: 🔥 An enemy camp fell here today ({name} finished it off). Tomorrow another one will appear somewhere else.
  route_mark: ' 👹'
  here: '👹 An enemy camp (level {level}) holds the zone: its guards won''t let you explore or gather until it falls.'
  progress: ⚔️ Together, everyone has already defeated {n} of its garrison today.
  untouched: ⚔️ No one has attacked it yet today.
  intel_hint: '🕵️ How many are left, who the boss is and what the chest holds: a 🧭 Explorer of rank {rank} who infiltrates it finds out.'
  how: '⚔️ Assault: each fight (⚡ {energy}) defeats one of the garrison, for everyone; the last one is the boss. When it falls, the chest goes to whoever finishes it, and everyone who fought today earns something.'
  assault_button: ⚔️ Assault · ⚡{energy}
  again_button: ⚔️ Keep assaulting · ⚡{energy}
  infiltrate_button: 🕵️ Infiltrate · ⚡{energy}
  infiltrate_locked_button: 🕵️ Infiltrate (rank {rank})
