  downed: '🤕 You''re badly wounded: heal before taking on an enemy camp (👤 Hero → 🩺 Health).'
  infiltrate_locked: 🕵️ Infiltrating needs 🧭 Explorer rank {need} (you have {rank}). Level it up by exploring.
  already_scouted: '🕵️ You already infiltrated this camp today: what you know is above.'
  assault_fight: '⚔️ You assault the camp: a {enemy} (lv {level}) comes out to fight.'
  detected_fight: 👀 You've been spotted! A {enemy} (lv {level}) from the camp jumps on you.
  chief_fight: '👑 The camp''s boss comes out: {enemy} (lv {level}), stronger than the rest! If it falls, the camp falls.'
  chief_badge: '👑 Camp boss: more health and more attack.'
  intel_title: 🕵️ You infiltrated
  infiltrated: 🕵️ You slipped in unseen and got out with everything noted down. The zone is now {pct}% explored.
  infiltrate_xp: '{name} +{xp}'
  guard_group: '{enemy} ×{n} (lv {level})'
  intel_left: '👹 {n} of {total} left: {guards} and the boss.'
  intel_no_guards: no guards
  intel_chief: '👑 Boss: {enemy} (lv {level}), elite: +{hp}% health and +{attack}% attack.'
  intel_chest: '🎁 Chest: {items} · {pct}% chance of a level {level} gear piece.'
  gone: '👹 The camp is gone: your fight didn''t count toward it, but what you earned is yours.'
  late: '👹 {name} had already finished off the camp: your fight didn''t count toward it, but what you earned is yours.'
  guard_down: '👹 A camp guard fell: that''s {n} so far.'
  chief_next: '👑 No guards left: the next fight is against the boss.'
  left: 👹 {n} left, counting the boss.
  no_guards_left: '👹 There were no guards left: only the boss remains.'
  still_standing: 👹 The camp is still standing ({n} defeated today).
  destroyed: 🔥 You destroyed the enemy camp at {name}! Tomorrow another one will appear somewhere else.
  chest: '🎁 Its chest is yours: {items} · ✨ {xp} experience.'
  shared: '🤝 {n} {n|other hero|other heroes} fought here today: each one earns {gold} and some experience.'
  news_title: 👹 An enemy camp fell
  news_body: 🔥 {hero} finished off the enemy camp at {name} ({x}, {y}), where you fought today.
  share: '🤝 Your share: {gold} · ✨ {xp} experience.'
  map_legend: '👹 today''s enemy camp: its zone can''t be explored or gathered until it falls'
  map_line: 👹 ({x}, {y}) · {zones} zones away
  map_strength: ' · 💪 {left} left · lv {level} · boss: {chief}'
  map_more: …and {n} more, farther away.
  map_sight_next: 🔭 You see enemy camps up to {n} {n|zone|zones} around you. With 🧭 Explorer rank {rank}, farther.
  map_sight_all: 🔭 You see the enemy camps across your whole map.
  go_button: 👹 Go to the nearest
  go_button_time: 👹 Go to the nearest · {time}
  move_button: 👹 Move to the camp · {time}
