# Questions of ❓ Dudas (D-191, confirmed; layout D-192, provisional): keyword search, never a real AI (E-129).
# Each question has a stable code (d01, d02...), the topic it is listed under, the keywords that find it and its related codes.
#
# [ES]
# Para qué sirve: el catálogo de las preguntas ya respondidas del botón ❓ Dudas (🏕️ Campamento) y de /dudas. El jugador
#     escribe una palabra ("energía", "mapa", "campamento") y salen las preguntas cuyas palabras clave coinciden, cada una
#     con su código; /d07 (o tocar la pregunta) muestra la respuesta con sus preguntas relacionadas. Es un buscador por
#     palabras (E-129, recomendado): no es una IA de verdad ni cuesta nada por mensaje.
# Documento de diseño: diseno/01-plataforma/menus-campamento-y-heroe.md §4 (❓ Dudas)
# Lo leen: engine/service/game.py (sección "❓ Dudas": _faq_entries, _faq_search, _dudas_view, _duda_view) y
#     tests/test_menus_y_dudas.py. Los textos (la pregunta y la respuesta) van en content/locales/es_dudas.yaml como
#     faq.<código>.q y faq.<código>.a; los temas, como dudas.topic.<tema>.
# IDs: los códigos son estables (los jugadores los escriben y se comparten): nunca se renombran, se borran ni se reutilizan.
#     Para retirar una pregunta se marca retired: true. Una pregunta nueva toma el siguiente código libre.
# Números: las respuestas no escriben números a mano: los toman de content/balance.yaml al mostrarse (_faq_values), así
#     un cambio de balance no deja una respuesta vieja. Si una respuesta pide un número nuevo, se agrega en _faq_values.
# Regla: cada sistema nuevo del juego agrega aquí su pregunta en el mismo cambio (como las pistas de TowerWars).
# Si cambias esto, revisa: content/locales/es_dudas.yaml (cada código con q y a; cada tema con su nombre) y
#     tests/test_menus_y_dudas.py (todas las entradas tienen textos, temas existentes y relacionadas válidas).

