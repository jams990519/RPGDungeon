# Enemy families that fill the solo dungeons (D-164, D-170). Every day each dungeon is filled by one family (any family,
# never tied to the biome of its zone); the family's strongest enemy of the dungeon's level is its boss.
# [ES] Familias de enemigos que llenan las mazmorras para uno (D-164, D-170). Cada día, cada mazmorra la llena una familia
# (cualquiera, nunca atada al bioma de su zona): hoy duendes, mañana limos, pasado dragones. El jefe es el más fuerte de esa
# familia que cabe en el nivel de la mazmorra, en versión élite. Todo tipo de enemigo tiene así su jefe (D-164).
# Campos de cada familia:
#   name_key: el nombre que ve el jugador (content/locales/es_mazmorras.yaml, dungeon.family.<id>).
#   emoji: su icono en la pantalla de la mazmorra.
#   members: ids de content/enemies.yaml (nunca jefes de mundo ni retirados: si uno se retira, la familia sigue con los demás).
#     En cada sala sale uno de los que tienen el nivel de la mazmorra en su franja (o la franja más cercana, como D-108),
#     pero con el nivel de la mazmorra: las franjas de enemies.yaml escalan parejo (D-110), así un lobo de nivel 30 es tan
#     duro como cualquier enemigo común de nivel 30.
#   materials: material de content/items.yaml → peso. Lo que suelta su cofre (🕳️) o su bolsa (🌀). D-165: hay materiales de
#     otros oficios (💠 gema en bruto, 🌸 flor de luna, 🔩 lingote...) para vender a quien los use.
# Documento de diseño: diseno/06-contenido/mazmorras-y-bandas.md §0 ("En el juego: mazmorras para uno")
# Lo usan: engine/core/content.py (Content.dungeons), engine/service/game.py (sección "solo dungeons") con las cuentas de
#     engine/world/dungeons.py (family_of_day, level_pool, delve_rooms, floor_plan, delve_chest, floor_pot)
# Si cambias esto, revisa:
#   - Los ids de familia son estables: solo se agregan; para retirar una, retired: true. Agregar o retirar una familia
#     cambia el orden de las familias de cada mazmorra desde ese día (nada guardado se rompe: el día y la familia salen de
#     la semilla).
#   - Un enemigo nuevo puede sumarse a una familia; tests/test_mazmorras.py revisa que todo miembro exista y no sea jefe.
#   - Los materiales mueven cuánto entra al juego por mazmorra (registro en diseno/03-personaje/balance.md §7).

families:
  manada:                       # [ES] lobos y otros cánidos
    name_key: dungeon.family.manada
    emoji: "🐺"
    members: [lobo_ceniciento, chacal_del_desierto, zorro_polar, lobo_gris, lobo_de_las_nieves, lobo_bicefalo, hiena_rayada,
              licantropo_salvaje, licantropo_alfa]
    materials: {piel: 3, carne: 3, hierba_curativa: 1}
