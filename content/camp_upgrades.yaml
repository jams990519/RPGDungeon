# Camp improvements and camp knowledge (D-101, provisional). Only for player camps: the Claro never grows (D-98).
#
# [ES]
# Para qué sirve: el catálogo de 🔨 Mejoras de los campamentos de jugadores y del 📚 Conocimiento que se estudia
#     con la Biblioteca. Agregar una mejora aquí la mete en el juego (con sus textos upgrade.<id>.name y .desc en
#     content/locales/es.yaml); si su efecto es nuevo, también hay que programarlo en engine/service/game.py.
# Documento de diseño: diseno/02-mundo/fundacion-y-cisma.md §2.5 y §3 (qué abre cada nivel);
#     diseno/09-construccion/defensa-y-protecciones.md §0 (las defensas del campamento en el juego)
# Lo leen: engine/core/content.py (Content.camp_upgrades) y engine/service/game.py (sección "camp improvements":
#     _upgrade_catalog, _camp_effect, _camp_defense, _upgrades_view, _works_view, _knowledge_view...)
# IDs: estables. Nunca se renombran, nunca se borran, nunca se reutilizan: los campamentos guardan los IDs de lo
#     que construyeron (espacio "upgrades" del almacén). Para retirar una se marca retired: true; lo ya
#     construido sigue contando para el castillo.
# Campos de cada mejora:
#     emoji, name_key, desc_key: lo que se muestra.
#     kind: el tipo de construcción (D-288, 0.39): casa 🏠, oficio ⚒️, defensa 🛡️ o saber 📚. 🏘️ Servicios muestra un botón
#         por tipo (GameService._services_view y _service_type_view, textos services.kind.<tipo>). Toda mejora lleva uno.
#     level: nivel del campamento desde el que se puede construir (1 a 8; el castillo es el 9). D-287 (0.39): una obra de
#         un nivel que el campamento todavía no tiene no se muestra en ninguna pantalla.
#     cost: materiales de la mochila (ids de items.yaml) que juntan entre todos los miembros.
#     coins: monedas (en 🥉 bronce) que también pide; 0 o ausente = ninguna.
#     cost_before: (D-317, 0.45) lo que pedía la obra antes de la 0.45. Lo siguen pidiendo las obras que ya estaban
#         activadas o tenían materiales dados antes de la 0.45 (GameService._work_base); desde la 0.45 cada obra guarda su
#         costo al activarse (espacio "upgrades", clave "cost"), así que un cambio posterior (la 0.45.1, D-319) no le cambia
#         lo que pide a una obra ya activada. Lo llevan los 13 edificios de oficio (D-317: 90 % en materiales de su oficio y
#         10 % en madera y piedra, con el mismo valor en crudo) y las obras de nivel 5 a 8 que mezclan oficios (D-318).
#         Nunca se cambia: es lo de antes de la 0.45, aunque el "cost" de hoy cambie otra vez.
#     defense: puntos de 🛡️ Defensa que suma (refuerzan los alrededores contra las oleadas); ausente = 0.
#     effect: modificadores que se SUMAN entre mejoras (los lee GameService._camp_effect).
#     service: lo que abre para usar en el campamento (Refugio, Trueque, Sastrería: bolsas y cofres, Forja: vender equipo,
#         Biblioteca). Las estaciones de oficio que abre cada mejora están en content/professions.yaml stations.camp.
# D-288 (0.39, pedido del dueño: "un edificio por profesión"): el 🧵 Taller y la 🔨 Herrería quedan retirados (retired: true).
#     Los campamentos que ya los construyeron los conservan con todas sus estaciones y servicios; si tenían materiales dados a
#     uno de los dos, pueden terminarlo (GameService._open_works). Los campamentos nuevos tienen un edificio por oficio:
#     refinado en los niveles 1 y 2 (aserradero, tejeduria, canteria, curtiduria, alambique, fundicion) y fabricación en los
#     niveles 3 a 5 (carpinteria, sastreria, peleteria, alquimia, botica, forja, joyeria). Costos de Claude, modestos.
# D-291 (0.39): una obra pide materiales solo después de que el fundador o un 🤝 ayudante la activa (▶️ Activar); la lista
#     de activas se guarda en el espacio "upgrades" del campamento ("active").
# Si cambias esto, revisa:
#     - El castillo pide balance.yaml upgrades.castle_min_built mejoras construidas: con menos de esa cantidad en el
#       catálogo, ningún campamento llega a castillo (tests/test_camp_upgrades.py lo comprueba). Desde la 0.39 hay 31 para
#       construir (y 2 retiradas): las 15 más baratas cuestan mucho menos que antes (los edificios de oficio son chicos).
#     - Los costos mueven el ritmo de los campamentos hasta castillo y la demanda de cada material (registro de balance
#       en diseno/03-personaje/balance.md §7, "las mejoras del campamento").
#     - Los efectos tocan la vida que se recupera (fogon, enfermeria), la despensa (granero, ahumadero, huerto), la
#       recolección y la exploración en el territorio (conocimiento), el cupo de miembros (cabanas) y las defensas
#       que leerán las incursiones (GameService._camp_defense).
#     - D-116: los 🪑 muebles de la Carpintería (content/items.yaml, kind: furniture) usan los mismos nombres de efecto
#       ("members", y "defense" para la 🛡️ Defensa) y se suman a los de las mejoras (GameService._furniture_effect). No
#       cuentan como mejoras construidas para el castillo.
#     - D-115 (fase 2 de los oficios): desde el nivel 7 (ciudad) las mejoras piden también refinados (🧱 sillar de la
#       Cantería, 🟫 tablón del Aserradero) en lugar de una parte de lo crudo, con el mismo valor en crudo (1 sillar = 3
#       piedras, 1 tablón = 3 maderas) más la energía de refinar. Lo ya construido no cambia; lo crudo que una obra ya
#       tenía de más cuenta como refinado (GameService._credit_raw). Los beneficios de campamento de la Cantería (−15 % de
#       piedra y sillar) y de la 🏗️ Construcción (−20 % de todo) bajan lo que pide cada obra (GameService._upgrade_need);
#       las monedas no. Las defensas que dañan las oleadas se reparan aparte (balance.yaml camp_professions).
#     - D-319 (0.45.1, Claude, provisional): las obras que pide ⏫ Siguiente nivel (balance.yaml camps.level_up) solo piden
#       cosas que un miembro hace con rango 10 o menos (rango 15 las del paso a castillo), sin 🎓 especialización, sin 📚
#       libro y sin título comprado; si no, un campamento se traba en ese nivel hasta que alguien llegue al rango
#       (tests/test_costos_edificios.py). El ritmo hasta castillo y la demanda de piel y metal: `python tools/camp_costs.py`.
#     - D-309, D-325 (0.49): la 🧱 muralla construida abre la 🌾 cosecha de la muralla (balance.yaml harvest.wall): todo el
#       territorio cosecha solo para el 💰 fondo. Su "level" es el de la pista de ⬆️ Mejorar y de ❓ /d61 ({wall_level}) y
#       mueve desde cuándo llega la cosecha en tools/camp_costs.py (tests/test_cosecha_muralla.py).
#     - Pruebas: tests/test_camp_upgrades.py, tests/test_masterwork.py (muebles), tests/test_oficios_campamento.py,
#       tests/test_costos_que_suben.py, tests/test_costos_edificios.py.

upgrades:
  # ---- Nivel 1 (campamento): lo primero, al alcance de 2 jugadores en un día o dos
  fogon:
    emoji: "🔥"
    kind: oficio
    name_key: upgrade.fogon.name
    desc_key: upgrade.fogon.desc
    level: 1
    cost: {madera: 20, piedra: 15}        # [ES] 35 unidades
    effect: {regen_mult: 0.5}             # [ES] los miembros en el territorio recuperan vida un 50 % más rápido (×1,5)
  empalizada:
    emoji: "🪵"
    kind: defensa
    name_key: upgrade.empalizada.name
    desc_key: upgrade.empalizada.desc
    level: 1
    cost: {madera: 30, fibra: 10}         # [ES] 40 unidades
    defense: 1                            # [ES] primera defensa: frena a las alimañas
  # [ES] D-288 (0.39): un edificio por oficio. Los de refinado, baratos, en los niveles 1 y 2; cada uno abre su estación
  # (content/professions.yaml stations.camp)
  aserradero:
    emoji: "🪚"
    kind: oficio
    name_key: upgrade.aserradero.name
    desc_key: upgrade.aserradero.desc
    level: 1
    cost: {tablon: 10, madera: 2, piedra: 2}        # [ES] D-317 (0.45): 90 % del material de su oficio y 10 % de madera y piedra; 34 en crudo
    cost_before: {madera: 25, piedra: 10}        # [ES] D-317: lo que pedía antes de la 0.45; lo siguen pidiendo las obras activadas o empezadas antes
  tejeduria:
    emoji: "🧶"
    kind: oficio
