# Camp knowledge: needs the Biblioteca. One study at a time, paid by the members together.
# [ES] El 📚 Conocimiento del campamento: se abre con la Biblioteca. Un estudio a la vez, lo pagan entre todos los
# miembros y queda para siempre. Rige solo para los miembros y solo en el territorio del campamento (Rastreo, también
# en las zonas que lo tocan: en el territorio no hay peleas, D-81). Números modestos a propósito.
# effect: gather_bonus (+ fracción de lo recolectado), explore_points (+ puntos de exploración por vuelta),
# loot_bonus (+ probabilidad de cada objeto del botín).
knowledge:
  herramientas:
    emoji: "⚒️"
    name_key: tech.herramientas.name
    desc_key: tech.herramientas.desc
    cost: {madera: 150, pieza_metal: 50}  # [ES] 200 unidades
    coins: 300                            # [ES] 3 🥈
    effect: {gather_bonus: 0.10}          # [ES] +10 % de recursos al recolectar en el territorio (hasta la 0.48, encima del +50 % de gather.own_land_bonus; desde la 0.49, D-309, ese bono vale 1,0 y queda solo este +10 %)
  cartografia:
    emoji: "🗺️"
    name_key: tech.cartografia.name
    desc_key: tech.cartografia.desc
    cost: {fibra: 150, arcilla: 80}       # [ES] 230 unidades
    coins: 300
    effect: {explore_points: 5}           # [ES] +5 puntos de exploración por vuelta en el territorio (balance.yaml exploration.per_step da 15-30)
  rastreo:
    emoji: "🐾"
    name_key: tech.rastreo.name
    desc_key: tech.rastreo.desc
    cost: {fibra: 100, hierba_curativa: 60, carne: 40}   # [ES] 200 unidades
    coins: 300
    near: true                            # [ES] también en las zonas que tocan el territorio (en el territorio no hay peleas)
    effect: {loot_bonus: {carne: 0.10}}   # [ES] +10 % de probabilidad de 🍖 carne en el botín (de 50 % a 60 %, por ejemplo)
