    desc_key: upgrade.tejeduria.desc
    level: 1
    cost: {tela_tejida: 12, madera: 2, piedra: 2}        # [ES] D-317 (0.45): 90 % del material de su oficio y 10 % de madera y piedra; 40 en crudo
    cost_before: {fibra: 20, madera: 20}        # [ES] D-317: lo que pedía antes de la 0.45; lo siguen pidiendo las obras activadas o empezadas antes
  canteria:
    emoji: "🗿"
    kind: oficio
    name_key: upgrade.canteria.name
    desc_key: upgrade.canteria.desc
    level: 1
    cost: {sillar: 12, madera: 2, piedra: 2}        # [ES] D-317 (0.45): 90 % del material de su oficio y 10 % de madera y piedra; 40 en crudo
    cost_before: {piedra: 25, madera: 15}        # [ES] D-317: lo que pedía antes de la 0.45; lo siguen pidiendo las obras activadas o empezadas antes

