# Story and roleplay, simple layer (D-117, provisional): origins, campaign chapters, named characters, factions,
# daily tasks and camp tasks. The engine only runs this file; the prose lives in content/locales/es_historia.yaml.
#
# [ES]
# Para qué sirve: la historia del juego como datos: los 6 orígenes (rasgo, regalo y cadena de misiones), el Capítulo 1
#     de la campaña (7 misiones en el Claro y sus alrededores, con 2 decisiones), los 5 personajes del Claro (facción y
#     saludos que cambian), las 3 facciones con lo que da cada rango, los encargos del tablón (uno por facción cada
#     día) y los encargos de campamento (semanales, entre todos los miembros). Agregar una misión o un encargo aquí lo
#     mete en el juego; sus textos van en content/locales/es_historia.yaml con las claves de abajo.
# Documento de diseño: diseno/06-contenido/historia-y-rol.md §1 y "En el juego"; orígenes: diseno/03-personaje/
#     creacion-de-personaje.md §4; tipos de misión: diseno/06-contenido/misiones-y-exploracion.md §2
# Lo leen: engine/core/content.py (Content.story), engine/story/rules.py y engine/service/story.py (StoryMixin)
# IDs: estables. Nunca se renombran, nunca se borran, nunca se reutilizan: los héroes guardan su origen, sus misiones
#     hechas, el paso en que van, sus decisiones (por el id de la decisión y de la opción), su reputación por facción,
#     sus títulos y lo que ya cobraron. Para retirar una misión o un encargo se marca retired: true.
# Claves de texto (es_historia.yaml):
#     story.origin.<id>.name / .intro / .trait / .gift · story.npc.<id>.name / .role / .lines.<línea>
#     story.faction.<id>.name / .desc · story.chapter.<id> · story.quest.<id>.title / .<paso> / .<paso>_<opción>
#     (texto que depende de una decisión) / .<paso>_done y .<paso>_done_<opción> (lo que pasa al cumplir el paso,
#     si existe) / .opt_<opción> (botón de una decisión) / .done (epílogo) · story.daily.<id> · story.camp_task.<id>
#     story.titles.<id> (títulos)
# Campos de una misión:
#     chain: origin o el capítulo (c1). level: nivel desde el que empieza. giver: personaje que la da.
#     energy: ⚡ que pide más o menos (de ahí sale su experiencia: balance.yaml story.xp_per_energy × energy,
#         × (1 + 0,15 × (level − 1)), como matar, D-108). reward: coins (🥉), items, rep {facción: puntos}, title.
#     steps: la lista de pasos; cada uno con id y goal (el objetivo). Un paso puede tener by: <decisión> (su texto,
#         su personaje y su premio cambian según lo que elegiste), reward (al cumplirlo) o rewards {opción: premio}.
# Objetivos (goal.kind):
#     talk {npc} (hablar en el Claro) · deliver {npc, items} (llevarle cosas: se las das al hablar)
#     explore {n, claro?, outside?} (vueltas de exploración) · explored {zone, pct} (zona explorada a ese %, estado)
#     gather {n, item?} · win {n, biomes?, hunt?} (peleas ganadas; hunt: solo presas de 🏹 Cazar)
#     guardian {enemy} (vencer al Guardián) · craft {n, profession?} (veces fabricadas o refinadas)
#     sell {n} (cosas vendidas) · visit {lair | lejania | zone} (llegar a un lugar) · camp (tener campamento, estado)
#     level {n} (estado) · feed {n} (raciones a la despensa) · build {n} (materiales a una obra)
#     choice {id, options, effects} (una decisión: id para recordarla, sus opciones y qué cambia cada una)
# Condiciones de los saludos (when): done, active, choice, rank_min, rank_max, origin, met. Gana la primera que se cumple.
# Si cambias esto, revisa:
#     - Rasgos de origen: nunca poder de combate (D-49): experiencia de oficio, precio del mercader o reputación.
#     - La experiencia de las misiones y encargos va al registro de balance (diseno/03-personaje/balance.md §7,
#       "historia y encargos"): tiene que quedar al ritmo de D-108, sin atajos.
#     - Los premios de rango (rank_rewards) son títulos, consumibles y materiales que ya existen en content/items.yaml.
#     - Pruebas: tests/test_story.py (todo id tiene sus textos; las misiones se pueden cumplir con acciones reales).

# The three factions (historia-y-rol.md §1.4). [ES] Las tres facciones del Claro y su líder.
factions:
  llama: {emoji: "🔥", leader: marta}      # [ES] La Llama Común: guardar el fuego y reconstruir
  umbral: {emoji: "🌀", leader: iria}      # [ES] El Círculo del Umbral: el poder y la verdad del Colapso, para que no vuelva a pasar (D-127, D-128: la Lejanía es solo distancia)
  restos: {emoji: "⚙️", leader: odo}       # [ES] La Cofradía de los Restos: vivir de lo que quedó

# What each reputation rank gives, once, the first time it is reached (thresholds: balance.yaml story.ranks).
# [ES] Lo que da cada rango de reputación, una sola vez, la primera vez que se llega. Títulos y cosas que ya existen.
rank_rewards:
  llama:
    conocido: {title: llama_conocido}
    apreciado: {items: {pocion_vida: 2, venda: 3}}
    honrado: {title: llama_honrado, items: {pocion_mayor: 1, botiquin: 1}}
    heroe: {title: llama_heroe, items: {vendaje_maestro: 1}}
  umbral:
    conocido: {title: umbral_conocido}
    apreciado: {items: {extracto: 2, flor_luna: 1}}
    honrado: {title: umbral_honrado, items: {flor_luna: 2, unguento: 2}}
    heroe: {title: umbral_heroe, items: {gema_bruta: 2}}
  restos:
    conocido: {title: restos_conocido}
    apreciado: {items: {lingote: 2}, coins: 50}
    honrado: {title: restos_honrado, items: {gema_bruta: 1}, coins: 150}
    heroe: {title: restos_heroe, coins: 500}

# Named characters of the Claro (historia-y-rol.md §1.3). [ES] Los personajes del Claro: viven junto a la fogata.
npcs:
  marta:
    emoji: "🍲"
    faction: llama
    lines:
      - {when: {done: c1_m7}, key: hero}
      - {when: {choice: {herido: cargar}, done: c1_m6}, key: tano}
      - {when: {rank_max: mal_visto}, key: cold}
      - {when: {active: c1_m7}, key: night}
      - {when: {rank_min: apreciado}, key: friend}
      - {when: {done: c1_m1}, key: known}
      - {when: {met: false}, key: first}
      - {key: default}
  odo:
    emoji: "🪙"
    faction: restos
    lines:
      - {when: {done: c1_m7}, key: hero}
      - {when: {choice: {herido: cargar}, done: c1_m6}, key: tano}
      - {when: {choice: {herido: rastro}, done: c1_m6}, key: tano_lost}
      - {when: {choice: {ambar: odo}}, key: ambar_sold}
      - {when: {rank_max: mal_visto}, key: cold}
      - {when: {rank_min: apreciado}, key: friend}
      - {when: {done: c1_m2}, key: known}
      - {when: {met: false}, key: first}
      - {key: default}
  iria:
    emoji: "🌿"
    faction: umbral
    lines:
      - {when: {done: c1_m7}, key: hero}
      - {when: {choice: {ambar: iria}}, key: ambar_kept}
      - {when: {choice: {ambar: brena}}, key: ambar_melted}
      - {when: {rank_max: mal_visto}, key: cold}
      - {when: {rank_min: apreciado}, key: friend}
      - {when: {done: c1_m3}, key: known}
      - {when: {met: false}, key: first}
      - {key: default}
  anselmo:
    emoji: "🧭"
    faction: umbral
    lines:
      - {when: {done: c1_m7}, key: hero}
      - {when: {rank_max: mal_visto}, key: cold}
      - {when: {done: c1_m6}, key: lair}
      - {when: {done: c1_m4}, key: roots}
      - {when: {rank_min: apreciado}, key: friend}
      - {when: {met: false}, key: first}
      - {key: default}
  brena:
    emoji: "⚒️"
    faction: llama
    lines:
      - {when: {done: c1_m7}, key: hero}
      - {when: {choice: {ambar: brena}}, key: ambar_forged}
      - {when: {choice: {ambar: odo}}, key: ambar_sold}
      - {when: {rank_max: mal_visto}, key: cold}
      - {when: {rank_min: apreciado}, key: friend}
      - {when: {done: c1_m5}, key: known}
      - {when: {met: false}, key: first}
      - {key: default}

# Origins (creacion-de-personaje.md §4): a small trait that never gives combat power, a one-time gift and a chain.
# [ES] Orígenes: rasgo chico (de oficio, de precio o de reputación; nunca de combate), regalo de una vez y su cadena.
#     trait.prof_xp: +% de experiencia de esos oficios · trait.prof_xp_branch: +% en todos los oficios de esa rama
#     (refine, craft) · trait.shop_discount: −% al comprar al mercader del Claro · trait.rep_bonus: +% de reputación ganada
origins:
  desertor:
    emoji: "🪖"
    trait: {prof_xp: {desollador: 0.15}}
    gift: {items: {venda: 2}}
    chain: [o_desertor_1, o_desertor_2, o_desertor_3]
  aprendiz:
    emoji: "🛠️"
    trait: {prof_xp_branch: {refine: 0.10, craft: 0.10}}
    gift: {items: {tablon: 1, lingote: 1}}
    chain: [o_aprendiz_1, o_aprendiz_2, o_aprendiz_3]
  huerfano:
    emoji: "🕳️"
    trait: {shop_discount: 0.10}
    gift: {coins: 20}
    chain: [o_huerfano_1, o_huerfano_2, o_huerfano_3]
  noble:
    emoji: "🏵️"
    trait: {rep_bonus: 0.10}
    gift: {coins: 100}
    chain: [o_noble_1, o_noble_2, o_noble_3]
  curandero:
    emoji: "⚕️"
    trait: {prof_xp: {herbolario: 0.15}}
    gift: {items: {hierba_curativa: 3}}
    chain: [o_curandero_1, o_curandero_2, o_curandero_3]
  minero:
    emoji: "⛏️"
    trait: {prof_xp: {minero: 0.15}}
    gift: {items: {pieza_metal: 3}}
    chain: [o_minero_1, o_minero_2, o_minero_3]

# Campaign chapters, in order (one per big patch). [ES] Capítulos de la campaña, en orden; se escribe uno por parche grande.
chapters:
  c1:
    quests: [c1_m1, c1_m2, c1_m3, c1_m4, c1_m5, c1_m6, c1_m7]

quests:
  # ------------------------------------------------------------------ Capítulo 1 · Las brasas del Claro (niveles 1-8)
  c1_m1:
    chain: c1
    level: 1
    giver: marta
    energy: 5
    steps:
      - {id: hablar, goal: {kind: talk, npc: marta}}
      - {id: ronda, goal: {kind: explore, n: 2}}
      - {id: lena, goal: {kind: deliver, npc: marta, items: {madera: 4}}}
    reward: {coins: 10, rep: {llama: 15}}
  c1_m2:
    chain: c1
    level: 1
    giver: odo
    energy: 4
    steps:
      - {id: hablar, goal: {kind: talk, npc: odo}}
      - {id: vender, goal: {kind: sell, n: 3}}
      - {id: volver, goal: {kind: talk, npc: odo}}
    reward: {coins: 15, rep: {restos: 15}}
  c1_m3:
    chain: c1
    level: 2
    giver: iria
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: iria}}
      - {id: hierbas, goal: {kind: gather, item: hierba_curativa, n: 4}}
      - {id: entregar, goal: {kind: deliver, npc: iria, items: {hierba_curativa: 3}}}
    reward: {coins: 10, items: {venda: 2}, rep: {umbral: 15}}
  c1_m4:
    chain: c1
    level: 2
    giver: anselmo
    energy: 10
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: salir, goal: {kind: visit, lejania: 2}}
      - {id: bestias, goal: {kind: win, n: 3}}
      - {id: contar, goal: {kind: talk, npc: anselmo}}
    reward: {coins: 20, rep: {umbral: 10, llama: 5}}
  c1_m5:                                   # [ES] DECISIÓN 1: quién se queda la astilla de ámbar (y quién te ayuda en la c1_m7)
    chain: c1
    level: 3
    giver: brena
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: brena}}
      - {id: fabricar, goal: {kind: craft, n: 1}}
      - id: ambar
        goal:
          kind: choice
          id: ambar
          options: [iria, brena, odo]
          effects:
            iria: {rep: {umbral: 25, llama: -5}}
            brena: {rep: {llama: 25, restos: -5}}
            odo: {rep: {restos: 25, umbral: -5}, coins: 30}
    reward: {coins: 15, rep: {llama: 10}}
  c1_m6:                                   # [ES] DECISIÓN 2: salvar a Tano (reputación) o seguir el rastro (2 🌸 flores de luna)
    chain: c1
    level: 4
    giver: anselmo
    energy: 12
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: bosque, goal: {kind: win, n: 3, biomes: [bosque, pantano]}}
      - id: herido
        goal:
          kind: choice
          id: herido
          options: [cargar, rastro]
          effects:
            cargar: {rep: {restos: 20, llama: 10}}
            rastro: {rep: {umbral: 20, restos: -10}, items: {flor_luna: 2}}
      - {id: informe, goal: {kind: talk, npc: anselmo}}
    reward: {coins: 20, rep: {umbral: 10}}
  c1_m7:                                   # [ES] FINAL: quien elegiste en la decisión 1 te ayuda; Tano (decisión 2) te paga si lo salvaste
    chain: c1
    level: 5
    giver: marta
    energy: 14
    steps:
      - id: hablar
        by: herido
        goal: {kind: talk, npc: marta}
        rewards: {cargar: {coins: 50}}
      - id: ayuda
        by: ambar
        goal: {kind: talk, npc: "@choice"}  # [ES] "@choice": el personaje que elegiste en la decisión (iria, brena u odo)
        rewards:
          iria: {items: {unguento: 2}}
          brena: {items: {lingote: 3}}
          odo: {coins: 100}
      - {id: guarida, goal: {kind: visit, lair: true}}
      - {id: guardian, goal: {kind: guardian, enemy: raigambre}}
      - {id: regreso, goal: {kind: talk, npc: marta}}
    reward: {coins: 50, rep: {llama: 15, umbral: 15, restos: 15}, title: c1_brasa}

  # ------------------------------------------------------------------ Orígenes (3 misiones cada uno, niveles 1-3)
  o_desertor_1:
    chain: origin
    level: 1
    giver: marta
    energy: 4
    steps:
      - {id: hablar, goal: {kind: talk, npc: marta}}
      - {id: buscar, goal: {kind: explore, n: 2}}
      - {id: volver, goal: {kind: talk, npc: marta}}
    reward: {coins: 8, rep: {llama: 10}}
  o_desertor_2:
    chain: origin
    level: 2
    giver: anselmo
    energy: 8
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: salir, goal: {kind: visit, lejania: 2}}
      - {id: bestias, goal: {kind: win, n: 2}}
    reward: {coins: 12, rep: {umbral: 10}}
  o_desertor_3:
    chain: origin
    level: 3
    giver: odo
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: odo}}
      - {id: pieles, goal: {kind: deliver, npc: odo, items: {piel: 2}}}
      - {id: marta, goal: {kind: talk, npc: marta}}
    reward: {coins: 15, rep: {llama: 15}, title: o_desertor}

  o_aprendiz_1:
    chain: origin
    level: 1
    giver: brena
    energy: 4
    steps:
      - {id: hablar, goal: {kind: talk, npc: brena}}
      - {id: hacer, goal: {kind: craft, n: 1}}
      - {id: mostrar, goal: {kind: talk, npc: brena}}
    reward: {coins: 8, rep: {llama: 10}}
  o_aprendiz_2:
    chain: origin
    level: 2
    giver: anselmo
    energy: 8
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: salir, goal: {kind: visit, lejania: 2}}
      - {id: carro, goal: {kind: explore, n: 3, outside: true}}
    reward: {coins: 12, rep: {umbral: 10}}
  o_aprendiz_3:
    chain: origin
    level: 3
    giver: iria
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: iria}}
      - {id: hacer, goal: {kind: craft, n: 2}}
      - {id: brena, goal: {kind: talk, npc: brena}}
    reward: {coins: 15, rep: {llama: 15}, title: o_aprendiz}

  o_huerfano_1:
    chain: origin
    level: 1
    giver: odo
    energy: 3
    steps:
      - {id: hablar, goal: {kind: talk, npc: odo}}
      - {id: vender, goal: {kind: sell, n: 2}}
      - {id: volver, goal: {kind: talk, npc: odo}}
    reward: {coins: 8, rep: {restos: 10}}
  o_huerfano_2:
    chain: origin
    level: 2
    giver: anselmo
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: claro, goal: {kind: explored, zone: [0, 0], pct: 100}}
      - {id: bestias, goal: {kind: win, n: 2}}
    reward: {coins: 12, rep: {umbral: 10}}
  o_huerfano_3:
    chain: origin
    level: 3
    giver: marta
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: marta}}
      - {id: juntar, goal: {kind: gather, n: 6}}
      - {id: volver, goal: {kind: talk, npc: marta}}
    reward: {coins: 15, rep: {llama: 15}, title: o_huerfano}

  o_noble_1:
    chain: origin
    level: 1
    giver: odo
    energy: 3
    steps:
      - {id: hablar, goal: {kind: talk, npc: odo}}
      - {id: vender, goal: {kind: sell, n: 2}}
      - {id: volver, goal: {kind: talk, npc: odo}}
    reward: {coins: 8, rep: {restos: 10}}
  o_noble_2:
    chain: origin
    level: 2
    giver: anselmo
    energy: 8
    steps:
      - {id: hablar, goal: {kind: talk, npc: anselmo}}
      - {id: salir, goal: {kind: visit, lejania: 2}}
      - {id: piedras, goal: {kind: explore, n: 3, outside: true}}
    reward: {coins: 12, rep: {umbral: 10}}
  o_noble_3:
    chain: origin
    level: 3
    giver: marta
    energy: 6
    steps:
      - {id: hablar, goal: {kind: talk, npc: marta}}
      - {id: dar, goal: {kind: deliver, npc: marta, items: {fibra: 4, madera: 4}}}
    reward: {coins: 15, rep: {llama: 15}, title: o_noble}

  o_curandero_1:
    chain: origin
    level: 1
    giver: iria
    energy: 4
    steps:
      - {id: hablar, goal: {kind: talk, npc: iria}}
