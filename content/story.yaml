# Daily tasks of the Claro board: every day one per faction (drawn from the world seed and the day, the same for all).
# Progress counts anywhere; the reward is paid once, as soon as it is done. [ES] Encargos del tablón: uno por facción
# cada día real, iguales para todos. Cuentan en cualquier lugar y pagan una vez, apenas se cumplen. energy: ⚡ que piden
# más o menos (experiencia = balance.yaml story.task_xp_per_energy × energy × escala de nivel); coins: 🥉 base (+10 % por
# nivel del héroe); rep: reputación con la facción del personaje que lo da.
daily:
  d_lena: {giver: marta, goal: {kind: gather, item: madera, n: 8}, energy: 4, coins: 8, rep: 10}
  d_fibra: {giver: marta, goal: {kind: gather, item: fibra, n: 8}, energy: 4, coins: 8, rep: 10}
  d_metal: {giver: brena, goal: {kind: gather, item: pieza_metal, n: 3}, energy: 4, coins: 10, rep: 10}
  d_piedra: {giver: brena, goal: {kind: gather, item: piedra, n: 6}, energy: 4, coins: 8, rep: 10}
  d_forja: {giver: brena, goal: {kind: craft, n: 1}, energy: 2, coins: 10, rep: 10}
  d_hierbas: {giver: iria, goal: {kind: gather, item: hierba_curativa, n: 5}, energy: 4, coins: 10, rep: 10}
