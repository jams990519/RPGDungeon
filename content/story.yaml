      - {id: hablar, goal: {kind: talk, npc: iria}}
      - {id: remedio, goal: {kind: craft, n: 1}}
      - {id: marta, goal: {kind: talk, npc: marta}}
    reward: {coins: 15, rep: {llama: 15}, title: o_curandero}

  o_minero_1:
    chain: origin
    level: 1
    giver: brena
    energy: 4
    steps:
      - {id: hablar, goal: {kind: talk, npc: brena}}
      - {id: terreno, goal: {kind: explore, n: 2}}
      - {id: metal, goal: {kind: deliver, npc: brena, items: {pieza_metal: 2}}}
