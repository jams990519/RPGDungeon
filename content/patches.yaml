# Patch notes announced to every player once, when a new version starts (newest last).
# [ES] Notas de cada parche. Al arrancar una versión nueva, el bot avisa a todos los jugadores una sola vez.
# Lo usan: engine/service/game.py (pending_announcement), adapters/telegram/bot.py (envío).
# Si cambias esto, revisa: la versión nueva debe ser distinta de la anterior; si no, no se avisa.

v0_4:
  version: "0.4"
  title: "🌅 Lost Realms 0.4: el mundo empieza de nuevo"
  notes:
    - "El juego se reinició una única vez para que todos empiecen de cero con todo disponible. Desde ahora tu progreso se guarda para siempre."
    - "⚔️ Las 15 clases y sus 46 especializaciones: Guerrero, Paladín, Cazador, Pícaro, Sacerdote, Caballero de la Muerte, Chamán, Mago, Brujo, Monje, Druida, Cazador de demonios, Evocador, Nigromante y Bardo. Cada una con roles de Ataque, Defensa, Curación o Soporte."
    - "🧭 Menú nuevo abajo: Zona, Explorar, Campamento y Héroe."
    - "⚡ Energía para viajar: 20 como máximo, se recuperan 20 al día. Viajar a una zona vecina toma de 5 a 10 minutos."
    - "🪓 Recolecta madera, piedra, fibra, hierbas y metal, y ayuda a levantar el campamento del Claro, de fogata a castillo."
    - "📜 Un tutorial con pistas te enseña lo básico, y 👥 tu enlace de invitación te da energía por cada amigo que entre."
    - "Toca /start para crear tu héroe."

v0_5:
  version: "0.5"
  title: "🌟 Lost Realms 0.5: talentos y campamentos"
  notes:
    - "🌟 La especialización se gana con el tiempo: al crear tu héroe eliges la clase, y cada nivel te da 1 punto de talento para la especialización que quieras (👤 Héroe → 🌟 Talentos). Con 1, 3 y 6 puntos desbloqueas sus habilidades. Tu progreso se respeta: si ya tenías nivel, recibiste tus puntos."
    - "🎭 Cada especialización tiene su ícono único, que te representa en todo el juego."
    - "Cada clase tiene como máximo 3 especializaciones. Druida · Equilibrio se retiró; si la tenías, recuperaste tus puntos."
    - "🏕️ Funda tu propio campamento lejos del Claro: explora la zona y conoce sus alrededores. Si alguien llega a tu campamento, te aviso para que decidas si es 🤝 amistoso o ⚔️ hostil."
    - "📌 Cada lugar muestra sus coordenadas."

v0_5_1:
  version: "0.5.1"
  title: "⚖️ Lost Realms 0.5.1: roles más parejos"
  notes:
    - "Cada clase cumple al menos dos roles, y los roles están mejor repartidos entre todas."
    - "🌑 Pícaro · Sutileza ahora es de Soporte: golpea desde las sombras y ciega al enemigo con Polvo Cegador."
    - "🐺 Cazador · Bestias ahora es de Soporte: su bestia marca la presa y todos pegan más fuerte."
    - "🌨️ Mago · Escarcha ahora es de Soporte: Escarcha Paralizante hace que el enemigo pegue más flojo."
    - "📿 Sacerdote · Disciplina vuelve a ser de Curación."

v0_5_2:
  version: "0.5.2"
  title: "🔧 Lost Realms 0.5.2: arreglos de botones y cambio de especialización"
  notes:
    - "Al elegir clase ahora ves su descripción y sus especializaciones, con ↩️ Volver a las clases por si quieres mirar otra."
    - "🔄 Puedes cambiar de especialización: en 👤 Héroe → 🌟 Talentos, reinicia tus puntos por oro y repártelos de nuevo. La clase es para siempre."
    - "Revisamos que todos los botones funcionen. Más adelante llegará la doble especialización."

v0_5_3:
  version: "0.5.3"
  title: "🔧 Lost Realms 0.5.3: pantallas más limpias"
  notes:
    - "Como máximo 4 botones en cada mensaje (el combate mantiene sus 6) y hasta 6 en el menú de abajo."
    - "Las clases se ven de a 3, con ▶️ Ver más clases. El botón ↩️ para volver a las clases funciona."
    - "💱 El mercader compra todos tus materiales de una vez."
    - "🔄 Reiniciar especialización está dentro de cada especialización, en 🌟 Talentos."

v0_5_4:
  version: "0.5.4"
  title: "👤 Lost Realms 0.5.4: tu ficha de héroe"
  notes:
    - "👤 Nueva ficha de héroe: nivel con porcentaje, experiencia, vida, ataque y defensa, energía, tu recurso de combate y tus monedas (💰 Oro · 👝 Bolsas · 💎 Gemas)."
    - "📊 /stats explica para qué sirve cada característica. /inv abre tu mochila y /habilidades tus talentos."
    - "🧪 Pociones más baratas en el mercader del campamento: poción de vida 6 💰 y venda 3 💰."
    - "📿 Sacerdote: Sombra es daño, Sagrado es curación y Disciplina vuelve a ser soporte, con Penitencia."

v0_6:
  version: "0.6"
  title: "🛡️ Lost Realms 0.6: equipo y botín"
  notes:
    - "🛡️ Llegó el equipo: arma, armadura y joya. Todos reciben gratis un arma y una armadura básicas de su clase, ya puestas."
    - "🎁 Los enemigos a veces sueltan piezas al ganar: ⚪ común, 🟢 poco común, 🔵 rara y 🟣 épica."
    - "✅ Cada pieza te dice si es para ti, 🔒 si es para ti más adelante (pide nivel) o ❌ si no es para tu clase. Al mirarla la comparas con lo que llevas."
    - "Cada clase usa su armadura (tela, cuero, malla o placas) y sus armas. Lo que no te sirve se vende en el Claro."
    - "Míralo con /equipo, en tu ficha o en 🎒 Mochila → 🛡️ Equipo."

v0_6_1:
  version: "0.6.1"
  title: "⚡ Lost Realms 0.6.1: más energía, viajes más cortos"
  notes:
    - "⚡ La energía ahora llega a 50 y se recuperan 40 al día. ¡Todos empiezan con 50!"
    - "Moverte, explorar y recolectar gastan 1 de energía cada uno. Pelear no gasta."
    - "🧭 Viajes más cortos: las 2 primeras zonas desde el Claro o tu campamento toman 2 minutos, las 2 siguientes 3, y así. Tu campamento reinicia la cuenta."
    - "🎖 Hay 100 niveles. Subir es lento a propósito: cada nivel cuenta."
    - "⏳ En combate, usar algo de la mochila gasta tu turno."

v0_7:
  version: "0.7"
  title: "💰 Lost Realms 0.7: cinco monedas"
  notes:
    - "🥉 Bronce, 🥈 Plata y 🥇 Oro: 100 de una son 1 de la siguiente. Tus monedas de antes ahora cuentan como bronce: no perdiste nada."
    - "👝 Bolsas: se cosen en el Claro con 4 de fibra, 1 pieza de metal y 1 🥈. Pronto servirán para la doble especialización."
    - "💎 Gemas: la tienda tiene ⭐ experiencia +50 % por 7 días y 🚩 un estandarte único de beta tester al lado de tu nombre. Las gemas se venderán muy pronto."
    - "Míralo todo con /monedas o en 🎒 Mochila → 💰 Monedas."

v0_7_1:
  version: "0.7.1"
  title: "🏕️ Lost Realms 0.7.1: campamentos que crecen"
  notes:
    - "⬆️ Ya puedes agrandar tu campamento: al fundarlo ocupa 1 zona, y cada mejora suma otra (2, 3, 4…)."
    - "🛡️ En el territorio de un campamento o del Claro no te atacan al llegar."
    - "🧭 El viaje cuenta la distancia desde el borde de tu campamento: mientras más grande, más cerca queda todo."
    - "🔥 El Claro también crece con cada etapa de la obra común."

v0_7_2:
  version: "0.7.2"
  title: "🛡️ Lost Realms 0.7.2: equipo libre y recuperación"
  notes:
    - "💗 Tu vida vuelve sola con el tiempo, y tu ficha dice cuánto falta. Si caes en combate quedas 🤕 malherido: te recuperas mucho más lento (unas 8 horas), salvo que bebas pociones o duermas en la posada."
    - "🛡️ El equipo ahora está en 👤 Héroe → 🛡️ Equipo. Ahí ves lo que te cayó (🆕), qué te da y si te sirve. El juego te aconseja, pero tú decides: puedes ponerte cualquier pieza de tu nivel; si no es de tu clase, rinde la mitad."
    - "🎁 Si cae una pieza y no llevabas nada en ese lugar, te la pones sola (aunque no sea la mejor para ti)."
    - "⛑️🧤👖🥾 Nuevas ranuras: cabeza, manos, piernas y pies."

v0_7_3:
  version: "0.7.3"
  title: "🏕️ Lost Realms 0.7.3: tu campamento, tu gente"
  notes:
    - "✏️ Al fundar un campamento escribes su nombre. El fundador lo puede cambiar."
    - "🙋 Otros jugadores pueden pedir unirse a tu campamento y tú decides si los aceptas. Al agrandarlo caben más personas."
    - "🪙 La plata ahora tiene su moneda, las bolsas son 💰 y las gemas pasan a llamarse 💎 diamantes."
    - "🪪 Llega la credencial de oficio: tu carta de presentación cuando lleguen las profesiones."

v0_7_4:
  version: "0.7.4"
  title: "👤 Lost Realms 0.7.4: pantallas más simples"
  notes:
    - "👤 Tu ficha ahora es más corta y clara. Tus monedas se ven así: 🥉 · 🪙 · 🥇 · 💰 · 💎, cada una con su cantidad."
    - "🎒 La Mochila tiene tres partes: 🛡️ Equipo, 🧪 Pociones (cada una con lo que cura) y 💰 Monedas."
    - "🛡️ En Equipo ves lo que llevas puesto. Con 🔁 Equipar eliges qué ponerte o quitarte, viendo sus bonos y si te sirve."
    - "🌟 En Talentos, lo primero es escoger tu especialización."

v0_8:
  version: "0.8"
  title: "👑 Lost Realms 0.8: el primer Guardián"
  notes:
    - "👑 Raigambre, el Guardián del Claro, despertó en su guarida, en las coordenadas (5, 2). Desafíalo desde 🧭 Explorar cuando estés allí."
    - "🔥 Pelea por fases: a medida que pierde vida, cambia sus golpes y se enfurece. De un Guardián no se huye, solo se esquiva."
    - "🌰 Tu primera victoria te da su Recuerdo: cámbialo en 🎒 Mochila → 🛡️ Equipo por una pieza 🟣 única hecha para ti."
    - "🏅 El primero del mundo en vencerlo será Pionero del Claro para siempre, y todos se enterarán."

v0_8_1:
  version: "0.8.1"
  title: "🔎 Lost Realms 0.8.1: explorar de verdad"
  notes:
    - "⚡ Al explorar o recolectar eliges cuánta energía gastar seguido: 5, 10, 20, 40 o toda. Si te equivocaste, ❌ Cancelar; y en marcha puedes ❌ Detener: la vuelta en curso te devuelve su energía."
    - "🔎 Cada zona se explora por porcentaje hasta el 100 %. Así descubres qué recursos tiene, y en tu 🗺️ Mapa se pinta del color de su recurso principal."
    - "🪵🪨🧵🌿⚙️🏺 Seis recursos en regiones de distintos tamaños: cada zona tiene de 1 a 3. Si se recolecta mucho en un lugar, se agota por un tiempo."
    - "🎒 La mochila tiene espacio: 60. Llena, ya no recolectas."
    - "🏰 Al agrandar tu campamento eliges qué zona toma: en tu territorio recolectas un 50 % más. Crece de campamento a aldea, pueblo, ciudad y castillo."

v0_9:
  version: "0.9"
  title: "🌟 Lost Realms 0.9: 8 habilidades por especialización"
  notes:
    - "🌟 Cada especialización tiene ahora 8 habilidades inspiradas en WoW. Se abren con tus puntos de talento a lo largo de los niveles (con 1, 3, 6, 10, 16, 24, 34 y 46 puntos)."
    - "🎛️ Tú eliges tu barra de combate: casilla 1, tu respuesta (bloquear, esquivar o escudo); casillas 2 y 3, lo que quieras. Está en 🌟 Talentos → tu especialización → 🎛️ Barra de combate."
    - "📖 Cada especialización muestra sus 8 habilidades, qué hace cada una y cuántos puntos te faltan para la siguiente."
    - "⚖️ Los números son más bajos al inicio: cada punto suma alrededor de 1 %, para que crecer se note durante los 100 niveles."

v0_9_1:
  version: "0.9.1"
  title: "🔀 Lost Realms 0.9.1: doble especialización"
  notes:
    - "🔀 Cuando tengas 10 puntos en tu especialización, puedes desbloquear la doble especialización pagando 3 💰 bolsas."
    - "Tendrás dos configuraciones de talentos, cada una con sus puntos, habilidades y barra. Cambias entre ellas con /doble."

v0_9_2:
  version: "0.9.2"
  title: "⚖️ Lost Realms 0.9.2: clases más parejas"
  notes:
    - "⚖️ Ajustamos las 45 especializaciones para que todas puedan con los primeros enemigos y tengan opciones reales contra Raigambre al nivel 6."
    - "💪 Las que sufrían (Cazador · Puntería, Guerrero Señor de la Guerra, Bardo Estratega y otras) tienen más vida y algunas, más golpe."
    - "✚ Las de curación curan un poco menos: seguían ganando casi todo sin esfuerzo."
    - "🐻 El Oso de las cumbres pega un poco menos fuerte con Aplastar."

v0_9_3:
  version: "0.9.3"
  title: "🛠️ Lost Realms 0.9.3: arreglos"
  notes:
    - "🧪 Ya no gastas pociones ni pagas la posada con la vida llena. Una poción termina el estado de 🤕 malherido."
    - "🪓 Si la mochila está llena o la zona agotada, recolectar te avisa antes de empezar y no gasta energía."
    - "🎒 La mochila cuenta igual en todas las pantallas."
    - "🏕️ Tocar otro botón mientras te piden el nombre del campamento cancela la fundación (ya no se funda sin querer)."
    - "⚔️ En combate, el menú de abajo te avisa que termines la pelea primero."

v0_9_4:
  version: "0.9.4"
  title: "✍️ Lost Realms 0.9.4: textos más cuidados"
  notes:
    - "✍️ Los textos ponen singular o plural según el número: ahora dice \"Exploraste 1 vez\" en vez de \"1 veces\"."

v0_10:
  version: "0.10"
  title: "🌾 Lost Realms 0.10: la despensa"
  notes:
    - "🌾 Desde aldea, el Claro necesita comida: cada jugador activo come 1 ración por día."
    - "🍖 Las bestias sueltan carne (2 raciones) y el mercader vende 🥖 provisiones (1 ración, caras). Llévalas a 🔥 Obra → 🌾 Aportar comida."
    - "😟 Sin comida, la posada no cura y la obra no sube. Si la obra está pagada pero falta comida, la etapa espera y sube sola cuando llega."
    - "🏕️ Los campamentos de nivel 3 o más tienen su propia despensa y no pueden agrandarse si está vacía. Nunca pierden niveles ni zonas."
    - "💱 \"Vender materiales\" ya no vende la carne: es comida."

v0_10_1:
  version: "0.10.1"
  title: "🏕️ Lost Realms 0.10.1: el Claro no se mantiene"
  notes:
    - "🔥 El Claro es de todos y no tiene dueño: ya no necesita comida. Su posada siempre cura y la obra sube apenas se paga."
    - "🌾 La despensa queda solo para los campamentos de jugadores de nivel 3 o más: ahí sí hay que llevar 🍖 carne o 🥖 provisiones para poder agrandarlos."

v0_11:
  version: "0.11"
  title: "🎒 Lost Realms 0.11: mochila, cofres y jugadores a la vista"
  notes:
    - "🎒 La mochila ya no lista todo: te explica qué hay en cada botón. Nuevo botón 📦 Recursos con tus materiales y comida, de a páginas, y para qué sirve cada uno. Para volver usa 👤 Héroe del menú de abajo."
    - "🎁 Lo que encuentras nunca se pierde, aunque la mochila esté llena. Con la mochila llena no puedes recolectar ni comprar hasta vender o usar cosas."
    - "🪎 Nueva moneda: el cofre. Se arma en el Claro con 10 💰 bolsas, 10 de madera y 5 piezas de metal, y paga agrandar campamentos desde el nivel 6."
    - "👥 En 📍 Zona ves a los otros jugadores activos que están ahí y qué hacen. Al explorar o recolectar a veces te cruzas con ellos."
    - "🔥 El Claro es el campamento base y ya no crece: su obra común terminó. Todo el crecimiento es para tus campamentos. El tutorial ahora te pide vender lo que te sobra al mercader."

v0_12:
  version: "0.12"
  title: "🛡️ Lost Realms 0.12: gremios y monedas de medalla"
  notes:
    - "🛡️ Gremios: si fundaste un campamento, ahí puedes crear tu gremio (🏕️ Campamento → 🛡️ Gremio). Sus miembros son los del campamento."
    - "⬆️ El gremio sube de nivel con lo que hacen juntos: exploraciones, peleas ganadas y recursos recolectados. Cada nivel deja entrar a más gente."
    - "🏰 Para que un campamento llegue a castillo hace falta un gremio de nivel 5 con 10 miembros."
    - "🥉🥈🥇 Las monedas ahora son medallas: bronce, plata y oro. La plata deja de verse como 🪙."

v0_12_1:
  version: "0.12.1"
  title: "🗺️ Lost Realms 0.12.1: mapa más grande"
  notes:
    - "🗺️ El mapa ahora es un cuadrado de 13 × 13: ocupa el ancho del mensaje y es igual de alto, así ves más mundo de una vez."

v0_13:
  version: "0.13"
  title: "🌊 Lost Realms 0.13: oleadas, salud y explorar con experiencia"
  notes:
    - "🌊 Tu campamento recibe oleadas de enemigos cada 7 días desde que lo fundas. Te llega un aviso con 🛡️ Defender: cada miembro pelea una vez, esté donde esté. Si resisten, cada defensor gana experiencia y 🥉; si no, la despensa pierde parte de su comida y nada más."
    - "🌙 Para que un campamento llegue a castillo, además del gremio, hay que ganar la Noche de prueba: un enemigo élite que se vence entre varios."
    - "🩺 Nuevo botón Salud en 👤 Héroe: tu vida, cómo está tu cuerpo, cuánto falta para curarte solo y con qué curarte. También con /salud."
    - "❤️ La vida vuelve completa en 4 horas fuera de combate (si caíste, tarda más)."
    - "🧭 Explorar ahora da experiencia: 3 por vuelta y 15 más al dejar una zona al 100 %."

v0_13_1:
  version: "0.13.1"
  title: "🔭 Lost Realms 0.13.1: explorar sigue alrededor"
  notes:
    - "🔭 Al explorar eliges cuánta energía gastar, y el lote ya no se corta cuando tu zona llega al 100 %: sigue con las 8 zonas de alrededor, una por una, sin moverte. Sus recursos aparecen en tu 🗺️ Mapa."
    - "🏕️ Las zonas que exploras desde al lado cuentan como conocidas para fundar un campamento."

v0_13_2:
  version: "0.13.2"
  title: "⛏️ Lost Realms 0.13.2: recolectar también te hace subir"
  notes:
    - "⛏️ Recolectar ahora da experiencia: 14 por vuelta, y más cuanto más alto el nivel de la zona. Cada camino (explorar, recolectar, pelear y pronto cazar) alcanza por sí solo para llegar al nivel 100."

v0_14:
  version: "0.14"
  title: "🔨 Lost Realms 0.14: mejoras del campamento y cacería"
  notes:
    - "🔨 Tu campamento tiene 20 mejoras para construir entre todos los miembros con materiales: 🔥 Fogón, 🛏️ Refugio, 🌾 Granero, 🧵 Taller, 🔨 Herrería, 🏥 Enfermería, 📚 Biblioteca y más. Cada nivel del campamento abre nuevas."
    - "🛡️ 8 de ellas son defensas (Empalizada, Torre de vigía, Trampas, Muralla, Foso…). Cada punto de defensa les quita vida y ataque a los enemigos de las oleadas, y la 🗼 Torre de vigía te avisa 2 horas antes de que lleguen."
    - "📚 La Biblioteca abre el conocimiento: herramientas (más recursos), cartografía (exploras más rápido) y rastreo (más carne)."
    - "🏰 Para llegar a castillo ahora hacen falta 15 mejoras construidas, además del gremio y la Noche de prueba."
    - "✨ Aportar materiales a una mejora te da experiencia y mérito."
    - "🏹 Nuevo en 🧭 Explorar: Cazar. Buscas presa en la zona y peleas enseguida (2 ⚡ por presa): solo pelea y botín, sin explorar ni recolectar. Después de ganar, 🏹 Otra presa."
    - "🏹 Partida de caza: si tienes campamento, llamas a los miembros que estén en tu misma zona. Durante 30 minutos, cada presa da más experiencia y botín por cada compañero, y si llegan a la meta todos ganan un premio."
    - "📒 Lugares ahora está dentro de 🗺️ Mapa."

v0_14_1:
  version: "0.14.1"
  title: "⏱️ Lost Realms 0.14.1: tiempo estimado"
  notes:
    - "⏱️ Al elegir cuánta energía gastar explorando o recolectando, cada opción dice cuánto tardará en total, y la pantalla te dice cuánto tardarías con toda tu energía."

v0_15:
  version: "0.15"
  title: "⚒️ Lost Realms 0.15: los oficios"
  notes:
    - "⚒️ Llegan los oficios, como en World of Warcraft: recolectar → refinar → fabricar. Míralos en el Claro (⚒️ Oficios) o con /oficios."
    - "🪓⛏️🌿🔪 Leñador, Minero, Herbolario y Desollador suben recolectando y desollando bestias. Con el rango juntas un poco más, y desde el rango 10 aparecen 💠 gemas en bruto y 🌸 flores de luna. Las bestias ahora también sueltan 🦌 piel."
    - "🪚 Refina en una estación: madera → tablón, metal → lingote, hierba → extracto, fibra → tela, piel → cuero."
    - "🛠️ Fabrica con materiales de varios oficios: arcos y bastones, espadas y placas, cuero y malla, túnicas y vendas, joyas, pociones y la nueva 🍷 poción mayor. El equipo de artesano de rango alto es el mejor del juego por ahora."
    - "🏕️ El 🧵 Taller y la 🔨 Herrería de tu campamento también son estaciones, y ahí refinas un poco mejor."
    - "💱 Vender todo ya no vende lo refinado ni los raros: esos se venden de a uno."
    - "✨ Refinar y fabricar también te suben de nivel, al mismo ritmo que los otros caminos."

v0_16:
  version: "0.16"
  title: "🐉 Lost Realms 0.16: bichos hasta el nivel 100 y el beneficio de cada oficio"
  notes:
    - "🐉 87 bichos nuevos: cada bioma tiene enemigos propios en cada franja de nivel, del 1 al 100. Pelear y cazar ya no es siempre lo mismo a nivel alto."
    - "✨ Cada oficio te da su beneficio, y crece con tu rango: el Minero más vida, la Herrería armadura si llevas placas, la Peletería y la Sastrería ataque según tu armadura, la Alquimia pociones más fuertes, el Herbolario vida que vuelve más rápido, el Leñador más espacio en la mochila… Míralo en ⚒️ Oficios."
    - "🩺 Nuevo oficio: Medicina. Haz 🫙 ungüentos, 🧰 botiquines y 🩻 vendajes de maestro, que curan sin toxicidad. Si eres sanador, tus curaciones curan más con su rango."
    - "🦌 Las bestias nuevas también sueltan piel para el Desollador."

v0_17:
  version: "0.17"
  title: "💱 Lost Realms 0.17: el Comercio"
  notes:
    - "💱 Nuevo oficio: Comercio. No te ayuda en la pelea, pero cobras más: hasta +20 % de monedas al vender al mercader, al trueque de tu campamento o tu equipo viejo. Sube vendiendo."
    - "⚒️ No todos los oficios son para pelear: unos ayudarán a tu campamento o castillo, otros a ganar dinero y otros a fabricar piezas exclusivas. Irán llegando por partes."

v0_18:
  version: "0.18"
  title: "⚙️ Lost Realms 0.18: opciones y peleas automáticas"
  notes:
    - "⚙️ Nuevo botón Opciones en el menú de abajo (también /opciones). Si no ves el botón, toca /start."
    - "⚔️ Elige qué pasa si sale una pelea en medio de un lote: ✋ Manual (el lote se corta y peleas tú) o ⚔️ Automática (tu héroe pelea solo y el lote sigue si gana)."
    - "🩹 Elige con cuánta vida se retira tu héroe de las peleas automáticas (30, 50 o 70 %) y si usa las pociones del cinturón."
    - "🏹 Con las peleas automáticas puedes cazar en lote: varias presas seguidas, con el tiempo estimado en cada botón."
    - "📜 Al volver, un solo mensaje te cuenta cuántas peleas ganó tu héroe y qué consiguió."

v0_19:
  version: "0.19"
  title: "⚖️ Lost Realms 0.19: equipo hasta el nivel 100 y clases que cumplen su rol"
  notes:
    - "🛡️ Equipo nuevo cada 10 niveles hasta el 100, en todas las ranuras: siempre hay algo mejor que buscar."
    - "⚒️ Lo mejor de cada nivel lo fabrican los artesanos: 90 recetas nuevas de armas, armaduras y joyas épicas (rangos 55 a 100). El botín de nivel alto llega como mucho a raro."
    - "🧱 Los tanques ahora aguantan más: terminan las peleas con más vida que los de ataque. Los sanadores se sostienen mejor y el ataque sigue matando más rápido."
    - "⚔️ Los enemigos pegan más a medida que sube su nivel: las peleas normales tienen algo de riesgo. Revisa tu equipo si llevas tiempo sin cambiarlo."

v0_20:
  version: "0.20"
  title: "📖 Lost Realms 0.20: historia y rol"
  notes:
    - "📖 Nuevo botón Historia en el menú de abajo (también /historia). Si no lo ves, toca /start."
    - "🎭 Elige el origen de tu héroe: soldado desertor, aprendiz de gremio, huérfano de las Ruinas, noble caído, curandero de aldea o minero de las vetas. Cada uno tiene su propia historia de 3 misiones, un rasgo y un regalo."
    - "🔥 Capítulo 1, «Las brasas del Claro»: 7 misiones con Marta, Odo, Iria, Anselmo y Brena, y decisiones que ellos recuerdan. Termina frente a Raigambre."
    - "⚜️ Tres facciones: la Llama Común, el Círculo del Umbral y la Cofradía de los Restos. Sube tu reputación para ganar títulos y premios."
    - "📜 Encargos diarios en el tablón del Claro (/encargos) y encargos semanales para hacer con los miembros de tu campamento."
    - "📔 Tu diario de héroe (/diario), que puedes mostrar a otros. Escribe tu biografía con /bio y saluda o brinda con quien esté en tu zona: /saludar, /brindar."

v0_21:
  version: "0.21"
  title: "✒️ Lost Realms 0.21: obras maestras y muebles del campamento"
  notes:
    - "✒️ Al fabricar armas, armaduras o joyas puede salir una obra maestra: +10 % en todo, un bono más según la ranura y tu firma de artesano. El mercader la paga un 25 % más."
    - "🪑 La Carpintería ahora es el oficio de las obras maestras: hasta un 15 % de probabilidad en sus arcos y bastones a rango 100 (los demás artesanos, hasta un 5 %). Ya no da ataque extra."
    - "🛏️ Muebles para tu campamento, solo de Carpintería: Literas de roble (rango 40, +1 plaza de miembro) y Armero de roble (rango 70, +1 de defensa). Se colocan en 🔨 Mejoras → 🔨 Obras → 🪑 Colocar."
    - "📜 La receta te muestra tu probabilidad de obra maestra con tu rango actual."

v0_22:
  version: "0.22"
  title: "🧭 Lost Realms 0.22: el Explorador y los campamentos enemigos"
  notes:
    - "🧭 Explorar ahora es un oficio: el Explorador sube de rango explorando. Con más rango ves más del mapa: tiempos de viaje (10), campamentos enemigos cerca (25) y en todo el mapa (50), y su fuerza (75). Al 100, el título «Gran Explorador»."
    - "⛺ Cada día aparecen campamentos enemigos en otros lugares del mapa. Mientras están en pie, en su zona no se explora ni se recolecta."
    - "⚔️ Asáltalos desde 🧭 Explorar: cada pelea vence a uno de la guarnición para todos, y el último es el jefe. Quien lo termina se lleva el cofre (monedas, materiales y quizás una pieza de equipo); los demás que pelearon ese día también ganan algo."
    - "🕵️ Desde el rango 30 de Explorador puedes infiltrarte: si no te descubren, sacas información de la zona sin pelear."
    - "🗺️ El mapa marca los ⛺ campamentos que ves y tiene un botón para ir al más cercano. 📒 Lugares muestra hasta 8 lugares con su tiempo."

v0_22_1:
  version: "0.22.1"
  title: "🛠️ Lost Realms 0.22.1: ajustes pedidos por el dueño"
  notes:
    - "🌊 Las oleadas contra los campamentos llegan 3 veces por semana (antes, una cada 7 días). Refuerza tus defensas y llena la despensa."
    - "🩹 En las peleas automáticas, tu héroe se retira por defecto con menos de 30 % de vida (antes 50 %): el lote se corta menos. Lo cambias en ⚙️ Opciones."
    - "🥖 El mercader vende como mucho 20 provisiones por semana a cada jugador. La comida del campamento la dan la caza, la pesca y la cocina."
    - "🌀 El Círculo del Umbral ahora estudia el poder del Colapso, para que no vuelva a pasar. La Lejanía es solo qué tan lejos del Claro estás."

v0_23:
  version: "0.23"
  title: "🍲 Lost Realms 0.23: oficios nuevos para el campamento y el equipo"
  notes:
    - "✨ Nuevo oficio: Encantamiento. Desencanta el equipo viejo de tu mochila para sacar esencias arcanas, y úsalas para encantar tus piezas: ⚔️ Filo (ataque), ❤️ Vigor (vida) o 🛡️ Guarda (armadura), según la ranura. Entra desde una pieza en 🛡️ Equipo o con /encantar."
    - "⬆️ Cuando consigues una pieza mejor que la que llevas (botín, cofre, Guardián o lo que fabricas), el juego te avisa y te ofrece 🔁 Equipar. En 🔁 Equipar, las mejores salen primero."
    - "🛠️ Los artesanos ahora fabrican cabeza, manos, piernas y pies para todos los tipos de armadura, cada 10 niveles hasta el 100: 208 recetas nuevas en Sastrería, Peletería y Herrería."
    - "🎣 Nuevo oficio: Pescador. Sale 🐟 pescado en las zonas con agua (todo el pantano y algunos ríos del bosque y la pradera), y llena la despensa del campamento."
    - "🍲 Nuevo oficio: Cocina. Seis platos, del rango 1 al 100, que rinden mucho más en la despensa que la comida cruda. Se cocina en el Claro o en el 🔥 Fogón del campamento."
    - "🗿 Nuevo oficio: Cantería. Convierte piedra en 🧱 sillares. Las obras más altas del campamento (nivel 7 y 8) ahora piden sillares y tablones; lo que ya aportaste no se pierde."
    - "🏗️ Nuevo oficio: Construcción. Sube aportando a las obras de tu campamento, y con más rango las obras piden menos materiales y reparar cuesta la mitad."
    - "🛡️ Las oleadas dañan las defensas del campamento (−1 si la defienden, −2 si se pierde). Repáralas entre todos en 🔨 Obras → 🛠️ Reparar defensas."
    - "🏰 Los beneficios de campamento valen para todos sus miembros: rige el mejor rango del grupo en cada oficio. Los ves en la pantalla del campamento."

v0_24:
  version: "0.24"
  title: "🎓 Lost Realms 0.24: especializaciones de oficio"
  notes:
    - "🎓 Al llegar al rango 25 en un oficio eliges tu primera especialización, y al rango 75 una segunda. Nunca las tres: siempre hará falta otro jugador. Entra por ⚒️ Oficios → 🎓 Especialización (o /especialidad)."
    - "📈 Cada especialización crece con tu dominio: la experiencia que ganas en ese oficio mientras la tienes. Si la cambias, lo aprendido queda guardado por si vuelves."
    - "🛠️ Cada oficio tiene 3 especializaciones: más rendimiento en su línea, hallazgos raros, más obras maestras o más monedas, según el oficio."
    - "📜 Los artesanos especializados abren recetas exclusivas: piezas mejores que las normales, la mejor de su línea al nivel 100, y dos muebles nuevos para el campamento."
    - "🔄 Elegir es gratis; cambiar una por otra cuesta monedas que suben con el rango."

v0_25:
  version: "0.25"
  title: "🕳️ Lost Realms 0.25: mazmorras para jugar solo"
  notes:
    - "❓ En el mapa aparecen marcas de algo escondido cerca de las zonas que conoces. Al llegar o estudiar la zona sabes qué es: una 🕳️ mazmorra chica o una 🌀 mazmorra profunda."
    - "🕳️ Mazmorra chica: 4 salas y un jefe. Cada día la llena otra familia de enemigos, con su propio jefe, otras salas y otro botín. Al terminarla, un cofre una vez al día (monedas, materiales y a veces una pieza de equipo de cualquier clase, para usar o vender)."
    - "🌀 Mazmorra profunda: baja piso por piso hasta donde aguantes. Cada piso es más difícil y cada 5 hay un jefe. Entre pisos no hay curación: solo lo de tu cinturón. Después de cada piso eliges ⬇️ Bajar o 🚪 Salir con lo ganado; si caes, te quedas con la mitad."
    - "🏆 La mazmorra profunda guarda tu récord y muestra los 3 que más bajaron en el día."
    - "🧭 En una zona con mazmorra, Explorar muestra 🕳️ Entrar o 🌀 Descender, y la cacería pasa adentro de la mazmorra."

v0_25_1:
  version: "0.25.1"
  title: "✍️ Lost Realms 0.25.1: nombres propios para las habilidades"
  notes:
    - "✍️ Las habilidades de todas las clases tienen nombres nuevos, propios de este mundo. Hacen exactamente lo mismo que antes: solo cambia el nombre del botón."
    - "🔥 Por ejemplo: Sed de Sangre ahora es Acero Sediento, Imposición de Manos es Milagro a Tiempo y Toque Vampírico es Beso Vampírico."
    - "😈 Lo demoníaco ahora huele a azufre: los Cazadores de demonios tienen glifos y brincos de azufre."

v0_26:
  version: "0.26"
  title: "🔭 Lost Realms 0.26: el Explorador reconoce y se esconde"
  notes:
    - "🔭 Nuevo comando /reconocer (Explorador desde el rango 10): mira de lejos qué esconde una ❓ mazmorra o un ⛺ campamento enemigo sin ir. Ves la familia y el jefe del día, el récord a batir o cuántos guardias quedan. Cuesta 2 ⚡, da experiencia y monedas, y se hace una vez por lugar al día."
    - "📏 Más rango, más alcance: 1 zona al rango 10, 2 al 30 y 3 al 50."
    - "🗺️ Lo que reconoces queda marcado en el mapa: la mazmorra deja de ser ❓ para siempre, y ese día ves qué la llena."
    - "🥷 Sigilo: con más rango de Explorador, a veces evitas las peleas al explorar a mano o al llegar de un viaje (hasta 25 % al rango 100). La especialización Infiltrado suma más."

v0_26_1:
  version: "0.26.1"
  title: "🗺️ Lost Realms 0.26.1: el mapa se pinta por terreno"
  notes:
    - "🎨 El mapa ahora se pinta según el terreno: 🟩 pradera, 🟢 bosque, 🟫 colinas, ⬜ montaña, 🟦 tundra, 🟨 desierto, 🟪 pantano y ⬛ ruinas. El color no dice qué recursos hay: eso solo lo sabes explorando."
    - "🕳️ Las mazmorras se marcan con una cueva apenas andas cerca, y ahora hay más: 2 o 3 en cada parte del mapa. Las que ya conocías siguen en su lugar."
    - "👹 Los campamentos de monstruos tienen su propio icono, para no confundirlos con los 🏕️ campamentos de los jugadores."
    - "✅ En ⚙️ Opciones, cada interruptor muestra una palomita verde cuando está activo y una gris ☑️ cuando está apagado."

v0_26_2:
  version: "0.26.2"
  title: "🎨 Lost Realms 0.26.2: el mapa es un tablero de colores"
  notes:
    - "🎨 El mapa ahora se ve entero: es un tablero de manchas de colores, cada una de un terreno distinto y de tamaño variado. Ya no hay cuadritos en blanco."
    - "🗺️ Los terrenos se reparten de otra forma, más mezclados: la tundra sale más al norte y el desierto más al sur, pero puede salir cualquiera en cualquier parte."
    - "⛏️ Los recursos de cada zona no cambiaron: el color dice el terreno, no lo que hay. Eso solo se sabe explorando."
    - "🐸 Al cambiar el terreno de una zona cambian también sus enemigos, y un pantano siempre tiene agua para pescar."

v0_26_3:
  version: "0.26.3"
  title: "🧩 Lost Realms 0.26.3: el mapa, como jugando Tetris"
  notes:
    - "🧩 Los terrenos del mapa ahora son como piezas de Tetris: grupos de 4 zonas con formas distintas (en línea, en L, en T, en cuadrado, en zigzag), cada uno de un color, encajados unos con otros."
    - "🎨 Colores, orden y posición cambian por todo el mapa. Cuando dos piezas del mismo terreno quedan juntas, se ven como una mancha más grande."
    - "⛏️ Los recursos de cada zona siguen siendo los mismos: el color dice el terreno, no lo que hay."

v0_27:
  version: "0.27"
  title: "✨ Lost Realms 0.27: cada terreno con sus recursos y nodos por descubrir"
  notes:
    - "🌍 Cada terreno tiene ahora sus propios recursos: setas y resina en el bosque, juncos y nenúfares en el pantano, sal y carbón en las colinas, dátiles y cactus en el desierto... Cada zona trae de 4 a 6, y solo explorando sabes cuáles: a veces aparece uno de otro terreno, como resina en el desierto. Lo que ya conocías de tus zonas sigue igual."
    - "🛠️ Los recursos nuevos sirven: tela de lino, lingotes con carbón, pociones con frasco de arena, ungüentos de musgo, raciones con setas o bayas y más. También se venden al mercader."
    - "✨ En el mapa aparecen nodos de recursos. Al principio solo ves ✨: llega a su zona para saber de qué son, y desde ahí verás su recurso en el mapa para siempre."
    - "🪓 En un nodo su recurso rinde el doble, se agota más despacio y a veces da una 💠 gema o una 🌸 flor de luna. Lo puede usar cualquiera que llegue."
    - "🔎 Explorar descubre los recursos de una zona de a uno: al 1, 20, 40, 60 y 80 %, y todos al 100 %."

v0_27_1:
  version: "0.27.1"
  title: "🔢 Lost Realms 0.27.1: elegir cuánto, de un vistazo"
  notes:
    - "🔢 Al explorar, recolectar, cazar en lote o fabricar, todas las cantidades salen juntas en botoncitos (5, 10, 20, 40, Todo) y abajo un botón grande para cancelar o volver. Ya no hay que pasar de página."
    - "⏱️ Cuánto tarda cada cantidad ahora está en el texto, todo en una línea."

v0_28:
  version: "0.28"
  title: "🌋 Lost Realms 0.28: terrenos nuevos"
  notes:
    - "🎨 El mapa tiene 6 terrenos nuevos, cada uno con su color: 🟣 selva, 🟧 sabana, 🟥 volcán, 🟤 cañón, ⚫ bosque oscuro y 🔵 lago. La selva y la sabana salen más al sur, el bosque oscuro más al norte, y el volcán es raro y el más peligroso."
    - "🧩 Como en el Tetris, unas 3 de cada 10 piezas del mapa pasaron a ser de un terreno nuevo, con sus enemigos y sus recursos propios. Las demás zonas siguen igual, y los recursos de base de todas también."
    - "🦆 En el lago se pesca en cada zona, y en muchos ríos de la selva y el cañón también."
    - "🖤 En el volcán aparece la obsidiana: con ella, la 🗿 Cantería hace sillares con menos piedra."

v0_29:
  version: "0.29"
  title: "🧭 Lost Realms 0.29: el camino guiado, el campamento y el héroe en orden"
  notes:
    - "🧭 El menú de abajo queda con 5 botones: 📍 Zona, 🧭 Explorar, 🏕️ Campamento, 👤 Héroe y ⚙️ Opciones. 📖 Historia salió: tu diario, tus misiones y las facciones están en 👤 Héroe → 📔 Diario."
    - "🏕️ El Campamento muestra todo de una vez, con una línea por opción: 🍲 Cocinar, 🔬 Investigar, 🛠️ Fabricar, 🧑‍🏫 Entrenador, 🛒 Mercader, 🛏️ Posada, 📜 Tablón y ❓ Dudas. En tu propio campamento, agrandar, mejoras, despensa y gremio están en 🏰 Gestionar."
    - "👤 El Héroe trae una ficha más completa (vida y energía con cuánto falta) y todos sus botones juntos, también 📔 Diario y 🎭 Origen. Al crear un héroe solo eliges nombre y clase: el origen, cuando quieras."
    - "🧑‍🏫 El Entrenador te presenta los oficios: qué hace cada familia, cuáles puedes empezar hoy y qué aprenderás más adelante."
    - "❓ Dudas: escribe una palabra (por ejemplo «energía») y te muestro las preguntas ya respondidas. Cada una tiene su código: toca /d07 para ver la respuesta. También funciona /dudas."
    - "🧭 Camino guiado: al crear tu héroe, el juego te lleva paso a paso (moverte, explorar, recolectar, cazar, el mapa, el campamento, el entrenador y tu héroe), con el botón exacto y un premio en cada paso. /guia lo muestra de nuevo."
    - "🚶 Moverte entre zonas ya no gasta energía: solo toma tiempo. La energía queda para explorar, recolectar y cazar."
    - "💡 La primera vez que encuentras algo (una mazmorra, un nodo, un campamento enemigo, la mochila llena...) te explicamos lo justo, una sola vez."
    - "🏕️ Al salir del Claro te guiamos para encontrar un buen lugar y fundar tu propio campamento. El origen de tu héroe se elige cuando quieras, con /origen o en 👤 Héroe → 🎭 Origen."

v0_29_1:
  version: "0.29.1"
  title: "🚶 Lost Realms 0.29.1: viajes más cortos y energía de entrada"
  notes:
    - "🚶 Viajar es más rápido: cada zona que cruzas toma 1 minuto, cerca o lejos del Claro. 10 zonas, 10 minutos. Moverte sigue sin gastar energía."
    - "⚡ Las mazmorras piden toda su energía de entrada: la 🕳️ chica, la de todas las peleas que te faltan hoy (10 ⚡ al empezar), y cada piso de la 🌀 profunda, la de todas sus peleas. Se sigue cobrando pelea por pelea, pero nadie se queda a medias."


v0_30:
  version: "0.30"
  title: "🗺️ Lost Realms 0.30: el mapa gris se descubre investigando"
  notes:
    - "▫️ El mapa vuelve a los puntos grises: las zonas que no investigaste no muestran su color ni qué terreno son. Solo el 🔥 Claro se ve siempre."
    - "◽ Al explorar una zona, su punto crece: ◽ con rastros desde el primer paso y ◻️ reconocida desde el 25 %. Al 50 % aparece el color de su terreno."
    - "🎨 La leyenda del mapa solo muestra los terrenos que ya conoces (cuántos de cuántos). Cada terreno nuevo que descubres te lo avisa."
    - "🔭 Lo que exploras alrededor sin moverte también cuenta: si estudias una zona vecina a la mitad, aparece con su color. Nadie pierde lo que ya exploró."


v0_30_1:
  version: "0.30.1"
  title: "📍 Lost Realms 0.30.1: pantallas más ordenadas y viajes solo a lo que ya visitaste"
  notes:
    - "📍 La pantalla de Zona ahora va en bloques cortos: dónde estás, lo explorado con un recurso por renglón, lo que hay aquí, las rutas y tu estado. Ya no se ve todo amontonado."
    - "🗺️ El mapa muestra solo el mapa: las coordenadas están en 📍 Zona, y la lista de cuevas, mazmorras, nodos y campamentos enemigos cercanos pasó a 📒 Lugares."
    - "🌀 El botón de la mazmorra ahora dice «Moverte a la mazmorra» con su tiempo, y solo aparece si ya estuviste ahí. A un lugar nuevo se llega caminando; después puedes volver de una vez."


v0_30_2:
  version: "0.30.2"
  title: "🗺️ Lost Realms 0.30.2: el mapa en blanco y viajes con confirmación"
  notes:
    - "🗺️ El mapa se ve en blanco: cada zona aparece con su color cuando la investigas a la mitad. Solo se ven tú y el 🔥 campamento; las mazmorras, los nodos y los campamentos se descubren caminando."
    - "📒 Lugares muestra los lugares importantes que ya visitaste (el campamento, mazmorras, campamentos de jugadores), cada uno con su código: escribe /ir1, /ir2… o toca el botón."
    - "🧭 Antes de viajar te pregunta si quieres ir, con cuánto tardas. Confirmas y tu héroe va solo."


v0_31:
  version: "0.31"
  title: "⚔️ Lost Realms 0.31: seis clases nuevas y el combate en cadena"
  notes:
    - "⚔️ Llegan las 6 clases nuevas, cada una con 2 roles: 🏰 Guerrero (tanque o DPS), 🌳 Druida (tanque o DPS), 📿 Sacerdote (sanador o DPS), 🌩️ Chamán (sanador o DPS), 🏹 Cazador (soporte o DPS) y 🔮 Mago (soporte o DPS). Tu héroe ya pasó a la más parecida a la que tenía, con su nivel, su equipo, sus monedas y sus oficios."
    - "🔗 Todas pelean igual: 4 botones (Básico, Constructor, Preparador y Gastador) y energía que arranca en 5 y sube 2 por turno. Cada botón en el orden de tu rol suma una marca, y el Gastador las cobra: hasta +50 % si juntas 5 o más. Romper el orden corta la cadena; el Básico nunca la corta."
    - "🛡️ Defenderse y tomar una poción cuestan 1 de energía y gastan tu turno. 🏃 Huir está en 🎒 Mochila."
    - "🔄 Al nivel 5 aprendes tu segundo rol, gratis: cámbialo cuando quieras en 👤 Héroe → 🌟 Talentos. Tus puntos de nivel se ponen solos en tu rol."


v0_32:
  version: "0.32"
  title: "⚜️ Lost Realms 0.32: llega el Paladín"
  notes:
    - "⚜️ El Paladín reemplaza al Chamán: guerrero sagrado de placa, ☀️ sanador de grupo (Luz sagrada, Choque sagrado y Luz del alba) o 🔆 DPS sagrado (Golpe de cruzado, Sentencia y Tormenta divina)."
    - "🌩️ Si tu héroe era Chamán, ya es Paladín del mismo rol, con su nivel, su equipo, sus monedas y sus oficios. Pelea igual que antes; cambian los nombres y ahora usa placa."
    - "🛡️ Las clases van de dos en dos por armadura: Guerrero y Paladín (placa), Druida y Cazador (cuero), Sacerdote y Mago (tela). Así salen al crear un héroe."


# D-250: from 0.33 on, every patch also carries title_en and notes_en (each player reads the notes in their language;
# a patch without them is shown in Spanish to everybody). [ES] Desde la 0.33 cada parche lleva también su título y sus
# notas en inglés: el bot le manda a cada jugador las de su idioma (GameService.announcement_view).
v0_33:
  version: "0.33"
  title: "🌐 Lost Realms 0.33: el juego, también en inglés"
  title_en: "🌐 Lost Realms 0.33: the game, now in English too"
  notes:
    - "🌐 Lost Realms ya se juega en español o en inglés. Cada jugador elige su idioma y todo sale en ese idioma: pantallas, botones, combate, historia, avisos y ❓ Dudas."
    - "🇪🇸 🇬🇧 Al empezar, la primera pantalla te deja elegir Español o English. Si ya juegas, cámbialo cuando quieras en ⚙️ Opciones → 🌐 Idioma, o escribe /idioma."
    - "💬 Los avisos te llegan en tu idioma aunque los mande alguien que juega en el otro: un saludo, el informe de una oleada o lo que pasa en tu campamento."
    - "⌨️ Los atajos también tienen nombre en inglés (/coins, /help, /greet…) y los de siempre siguen funcionando."
    - "⏱️ Al recolectar en lote ves el tiempo total, no solo el de cada vuelta. La energía de combate ya no sale en tu ficha: se ve en la pelea."
    - "🔗 Nuevo botón Moverte en 📍 Zona: suma pasos en las direcciones que quieras (hasta 50) y tu héroe los camina solo, también por tierra nueva."
    - "⚔️ Si te sale un enemigo a mitad de un viaje, gánale y sigues tu camino. Antes el viaje se cortaba ahí."
    - "📦 Recursos más corto: cada recurso con su cantidad y su código (/07). Toca el código para ver para qué sirve."
    - "📒 Ya puedes ir a la fogata o a otro lugar aunque estés explorando o de viaje: lo que hacías se corta o cambias el rumbo."
    - "📚 Los oficios ahora se aprenden: paga su primera receta en 🔬 Investigar del Claro o en 🧑‍🏫 Entrenador → 📚 Aprender oficios. La recolección y la exploración suben solas. Si ya practicabas un oficio, lo aprendes gratis y conservas tu rango."
    - "📋 Mis oficios, corto: una línea por oficio con su código (/minero). Toca el código para ver todo lo que da."
    - "🛒 El mercader tiene 🛒 Comprar y 💱 Vender: vende lo que traes, todo de una cosa con su código (/v02)."
    - "📜 Cada personaje del Claro te da un encargo por día: entrégale lo que pide o cuéntale lo que hiciste y te paga. Con tu propio campamento, los cobras desde ahí."
    - "🛏️ La posada tarda según la vida que te falta: de 0 a llena, una hora."
    - "⚙️ Opciones: salen las peleas y las pociones automáticas (por ahora, toda pelea la peleas tú) y entra 💬 Feedback para contarnos lo que quieras."
    - "📔 El Diario abierto desde el campamento vuelve al campamento."
  notes_en:
    - "🌐 Lost Realms can now be played in Spanish or English. Each player picks a language and everything follows it: screens, buttons, combat, story, notices and ❓ Help."
    - "🇪🇸 🇬🇧 When you start, the first screen lets you choose Español or English. If you already play, switch anytime in ⚙️ Options → 🌐 Language, or type /language."
    - "💬 Notices reach you in your language even when they come from someone playing in the other one: a greeting, a wave report or news from your camp."
    - "⌨️ Shortcuts have English names too (/coins, /help, /greet…), and the old ones still work."
    - "⏱️ Batch gathering now shows the total time, not just each round. Combat energy no longer shows on your hero sheet: you see it in the fight."
    - "🔗 New Move button in 📍 Zone: add steps in any directions you like (up to 50) and your hero walks them alone, even across new land."
    - "⚔️ If an enemy jumps you halfway through a trip, beat it and you go on your way. Before, the trip stopped there."
    - "📦 Shorter Resources: each resource with its amount and its code (/07). Tap the code to see what it's for."
    - "📒 You can now head to the bonfire or another place even while exploring or travelling: what you were doing stops, or you change course."
    - "📚 Professions are now learned: pay for the first recipe in the Clearing's 🔬 Research or in 🧑‍🏫 Trainer → 📚 Learn professions. Gathering and exploration rise on their own. If you already practised a profession, you learn it for free and keep your rank."
    - "📋 Short My professions: one line per profession with its code (/minero). Tap the code to see everything it gives."
    - "🛒 The merchant has 🛒 Buy and 💱 Sell: sell what you carry, all of one thing with its code (/v02)."
    - "📜 Each character of the Clearing gives you one task a day: bring what they ask or tell them what you did and they pay you. With your own camp, you cash them in from there."
    - "🛏️ The inn takes as long as the health you lack: from empty to full, one hour."
    - "⚙️ Options: automatic fights and potions are gone (for now you fight every fight yourself) and 💬 Feedback is in, to tell us anything."
    - "📔 The Journal opened from the camp goes back to the camp."

v0_33_1:
  version: "0.33.1"
  title: "🔒 Lost Realms 0.33.1: el juego, solo por privado"
  title_en: "🔒 Lost Realms 0.33.1: the game, only in private"
  notes:
    - "🔒 Lost Realms se juega solo por privado, en tu chat con el bot. En los grupos el bot ya no juega: si escribes un comando ahí, te lleva a tu chat con él."
  notes_en:
    - "🔒 Lost Realms is played only in private, in your chat with the bot. The bot no longer plays in groups: if you type a command there, it points you to your chat with it."

v0_34:
  version: "0.34"
  title: "🗺️ Lost Realms 0.34: viajes más seguros, monstruos de tu nivel y campamentos a la vista"
  title_en: "🗺️ Lost Realms 0.34: safer trips, monsters at your level and camps in sight"
  notes:
    - "⚔️ Al viajar sale una pelea mucho menos seguido: de 6 a 14 % por zona según el terreno (antes, de 25 a 55 %). 📍 Zona te dice cuánto."
    - "🐺 Los monstruos de afuera (al moverte, explorar, recolectar y cazar) salen de tu nivel, a veces un poco más fuertes. Ir lejos ya no es una trampa. Las mazmorras siguen con su propio peligro."
    - "🏕️ Ves los campamentos que otros jugadores empezaron: en el 🗺️ Mapa y en 📒 Lugares, los más cercanos, aunque nunca hayas ido. Puedes viajar a ellos desde ahí."
    - "🗺️ Botón Mapa en 📍 Zona y mientras viajas, para ver dónde estás."
    - "🧑‍🏫 El Entrenador te recomienda el oficio que hace la armadura de tu clase."
    - "🔒 Aclaración: en los grupos de Telegram el bot no juega, pero dentro del juego sigues viendo y cruzándote con los demás jugadores."
  notes_en:
    - "⚔️ Fights while travelling happen much less often: 6 to 14% per zone depending on the terrain (before, 25 to 55%). 📍 Zone tells you how much."
    - "🐺 Monsters outside (when you move, explore, gather and hunt) match your level, sometimes a bit stronger. Going far is no longer a trap. Dungeons keep their own danger."
    - "🏕️ You see the camps other players started: on the 🗺️ Map and in 📒 Places, the nearest ones, even if you have never been there. You can travel to them from there."
    - "🗺️ Map button in 📍 Zone and while travelling, to see where you are."
    - "🧑‍🏫 The Trainer recommends the profession that makes your class's armor."
    - "🔒 To be clear: the bot does not play in Telegram groups, but inside the game you still see and meet the other players."

v0_35:
  version: "0.35"
  title: "🔄 Lost Realms 0.35: cambia de clase, y los oficios de recolección se aprenden"
  title_en: "🔄 Lost Realms 0.35: change your class, and gathering professions are learned"
  notes:
    - "🔄 Ya puedes cambiar de clase en 👤 Héroe → 🌟 Talentos → 🔄 Cambiar de clase (o /cambiarclase). El primer cambio es gratis; después cuesta 🥈1, 🥈10, 🥈30 y luego 🥈50 cada vez. Conservas tu nivel, tus oficios, tus monedas y tu equipo."
    - "⛏️ Leñador, Minero, Herbolario y Pescador ahora se aprenden, como los demás oficios: solo la 🧭 exploración sube sola. Sin el oficio recolectas igual los recursos base. Si ya los practicabas, siguen aprendidos y conservas tu rango."
    - "💬 Feedback: primero eliges el tipo (🐞 Error, 💡 Idea, ⚖️ Balance, ❓ No se entiende u 💬 Otro) y después escribes. El equipo sigue cada mensaje y, cuando lo resuelve, te avisa."
  notes_en:
    - "🔄 You can now change class in 👤 Hero → 🌟 Talents → 🔄 Change class (or /changeclass). The first change is free; then it costs 🥈1, 🥈10, 🥈30 and then 🥈50 each time. You keep your level, professions, coins and gear."
    - "⛏️ Lumberjack, Miner, Herbalist and Fisher are now learned, like the other professions: only 🧭 exploration rises on its own. Without the profession you still gather the base resources. If you already practised them, they stay learned and you keep your rank."
    - "💬 Feedback: first choose the type (🐞 Bug, 💡 Idea, ⚖️ Balance, ❓ Unclear or 💬 Other), then write. The team follows every message and lets you know when it is solved."

v0_36:
  version: "0.36"
  title: "🛡️ Lost Realms 0.36: gremios desde el primer día y 👥 Jugadores en la fogata"
  title_en: "🛡️ Lost Realms 0.36: guilds from day one and 👥 Players at the bonfire"
  notes:
    - "👥 Nuevo botón Jugadores en el campamento de la fogata (en lugar de 🔬 Investigar): ves quién jugó ahí en el último minuto, con su clase, nivel y gremio, y cuántos hay en la fogata (👥 N/20). Toca su código (/j1) para ver su tarjeta, invitarlo o pedir entrar a su gremio."
    - "🛡️ Ya puedes crear un gremio desde el primer momento, por 🥉20 (/gremio). Caben 5. Se entra pidiendo, y aceptan el líder o un oficial. Ves dónde está cada miembro y si está en línea, le mandas 📢 mensajes a todos y depositan en el 💰 fondo desde donde estén, con el código del material (/f02)."
    - "📍 El líder marca el punto de reunión. Desde entonces, en 📍 Zona sale el botón 🏗️ Moverte a la construcción, que te lleva por el camino de verdad (sin diagonales)."
    - "🏕️ Un campamento lo funda un gremio: el líder, con al menos 2 miembros en la zona, y el fondo paga. Tarda 1 hora con 2 y menos con más (nunca menos de 10 min). Al terminar, el gremio pasa a ser el del campamento y a cada miembro le llega la invitación."
    - "🏗️ Las mejoras del campamento, con sus materiales completos, se construyen con el tiempo: más rápido cuantos más miembros estén dentro del territorio. Lo que ya estaba construido sigue igual."
  notes_en:
    - "👥 New Players button in the bonfire camp (instead of 🔬 Research): see who played there in the last minute, with their class, level and guild, and how many are at the bonfire (👥 N/20). Tap their code (/j1) to see their card, invite them or ask to join their guild."
    - "🛡️ You can now create a guild from the very start, for 🥉20 (/guild). It holds 5. You join by asking, and the leader or an officer accepts. You see where each member is and whether they are online, you send 📢 messages to everyone, and members deposit into the 💰 fund from wherever they are, with the material's code (/f02)."
    - "📍 The leader sets the meeting point. From then on, 📍 Zone shows the 🏗️ Move to the construction button, which takes you along the real path (no diagonals)."
    - "🏕️ A camp is founded by a guild: the leader, with at least 2 members in the zone, and the fund pays. It takes 1 hour with 2 and less with more (never under 10 min). When it is done, the guild becomes the camp's guild and every member gets the invitation."
    - "🏗️ Camp upgrades, once their materials are complete, are built over time: faster the more members are inside the territory. What was already built stays as it was."

v0_36_1:
  version: "0.36.1"
  title: "📌 Lost Realms 0.36.1: coordenadas en todo lugar e invitar con /inv_"
  title_en: "📌 Lost Realms 0.36.1: coordinates everywhere and inviting with /inv_"
  notes:
    - "📌 Cada lugar dice sus coordenadas (x, y): las rutas de 📍 Zona, el 🗺️ Mapa, 📒 Lugares y los avisos del viaje. El norte suma a la y y el este, a la x; el Claro es (0, 0)."
    - "🧭 Para ir a una coordenada escribe /ir x y (por ejemplo, /ir 12 -3): se arma el camino en 🔗 Moverte, primero este-oeste y después norte-sur, y tocas ✅ Terminar."
    - "🆔 Cada jugador tiene su código de jugador (lo ves en 👤 Héroe). El líder o un oficial de un gremio te invita escribiendo /inv_ y tu código, desde cualquier lugar. Con el campamento ya fundado, invita su fundador."
    - "🛡️ El botón Gremio está en 🏕️ Campamento también donde todavía no hay campamento: crea o busca tu gremio desde cualquier lugar."
  notes_en:
    - "📌 Every place shows its coordinates (x, y): the routes in 📍 Zone, the 🗺️ Map, 📒 Places and the travel notices. North adds to y and east adds to x; the Clearing is (0, 0)."
    - "🧭 To go to a coordinate type /go x y (for example, /go 12 -3): the way is laid out in 🔗 Move, first east-west, then north-south, and you tap ✅ Finish."
    - "🆔 Every player has a player code (you see yours in 👤 Hero). A guild's leader or an officer invites you by typing /inv_ and your code, from anywhere. Once the camp is founded, its founder invites."
    - "🛡️ The Guild button is in 🏕️ Camp also where there is no camp yet: create or find your guild from anywhere."

v0_37:
  version: "0.37"
  title: "🔥 Lost Realms 0.37: nueve hogueras y 🛡️ Gremio en el menú"
  title_en: "🔥 Lost Realms 0.37: nine campfires and 🛡️ Guild in the menu"
  notes:
    - "🔥 Ahora hay 9 hogueras: el Claro y 8 más a 12 zonas, la Fogata del Norte, del Este, del Sur, del Oeste y las 4 de las esquinas. Cada una tiene todo: Mercader, Posada, Entrenador, Tablón, los Personajes y 👥 Jugadores. La despensa del Claro es una sola para todas."
    - "👥 Cada hoguera recibe hasta 20 jugadores. Los nuevos nacen en la más cercana al Claro que tenga lugar. Si viajas a una llena, sigues solo hasta la más cercana con lugar. A nadie que ya está se lo mueve."
    - "🛡️ El peligro se cuenta desde la hoguera más cercana: alrededor de cada una vuelve a ser tierra fácil (mazmorras, campamentos enemigos y recursos), y se pone difícil al alejarte."
    - "📒 Las 9 hogueras están en 📒 Lugares desde el primer día, aunque nunca hayas ido, y puedes viajar a cualquiera."
    - "🛡️ Nuevo botón Gremio en el menú de abajo, al lado de ⚙️ Opciones: tu gremio a un toque, desde cualquier lugar."
    - "⚠️ Cerca de las hogueras nuevas el mapa cambió: algunas mazmorras y nodos de recursos de esas zonas se movieron."
  notes_en:
    - "🔥 There are now 9 campfires: the Clearing and 8 more, 12 zones away: the North, East, South and West Campfires and the 4 in the corners. Each one has everything: Merchant, Inn, Trainer, Board, the Characters and 👥 Players. The Clearing's pantry is one for all of them."
    - "👥 Each campfire takes up to 20 players. New players are born at the one nearest the Clearing that has room. If you travel to a full one, you go on by yourself to the nearest with room. Nobody already there is moved."
    - "🛡️ Danger counts from the nearest campfire: around each one the land is easy again (dungeons, enemy camps and resources), and it gets harder as you go away."
    - "📒 The 9 campfires are in 📒 Places from day one, even if you have never been there, and you can travel to any of them."
    - "🛡️ New Guild button in the bottom menu, next to ⚙️ Options: your guild one tap away, from anywhere."
    - "⚠️ Near the new campfires the map changed: some dungeons and resource nodes in those zones moved."

v0_38:
  version: "0.38"
  title: "🗺️ Lost Realms 0.38: lo que explora tu gremio, lo saben todos"
  title_en: "🗺️ Lost Realms 0.38: what your guild explores, everyone knows"
  notes:
    - "🗺️ Lo que explora un miembro de tu gremio (o de tu campamento) lo saben todos: en 📍 Zona ves sus recursos y cuánto se conoce, y en el 🗺️ Mapa se ve su color, sin investigarla de nuevo. También vale para fundar el campamento."
    - "⭐ La experiencia sigue siendo de quien explora: si exploras una zona que tu gremio ya conoce, igual ganas la tuya. Si sales del gremio, te quedas con lo que exploraste tú."
    - "🧑 Tus compañeros del gremio se ven en el 🗺️ Mapa."
    - "❤️ La vida vuelve sola mucho más rápido: de 0 a llena en 30 minutos (antes 4 horas), también si caíste en una pelea. Las pociones y la posada siguen siendo más rápidas."
    - "📋 Nueva pantalla 🗺️ Zonas del gremio, en 🛡️ Gremio: las zonas que conoce tu gremio, las más cercanas primero, con sus recursos y quién la exploró. Escribe un recurso (por ejemplo, hierro) para ver dónde hay, y toca /z1 para armar el camino."
  notes_en:
    - "🗺️ What one member of your guild (or camp) explores, everyone knows: in 📍 Zone you see its resources and how well it is known, and the 🗺️ Map shows its colour, without investigating it again. It also counts for founding the camp."
    - "⭐ The experience still goes to whoever explores: if you explore a zone your guild already knows, you still earn yours. If you leave the guild, you keep what you explored yourself."
    - "🧑 Your guild mates show on the 🗺️ Map."
    - "❤️ Health comes back on its own much faster: 0 to full in 30 minutes (before, 4 hours), also if you fell in a fight. Potions and the inn are still faster."
    - "📋 New 🗺️ Guild zones screen, in 🛡️ Guild: the zones your guild knows, nearest first, with their resources and who explored them. Type a resource (for example, iron) to see where there is some, and tap /z1 to lay out the way."

v0_38_1:
  version: "0.38.1"
  title: "💬 Lost Realms 0.38.1: el chat del gremio"
  title_en: "💬 Lost Realms 0.38.1: the guild chat"
  notes:
    - "💬 Si tienes gremio (o campamento), todo lo que escribes en el chat del juego le llega a todo tu gremio, desde donde estés. Los últimos mensajes quedan en 🛡️ Gremio. Los comandos con / y las pantallas que te piden escribir algo siguen igual."
    - "🗺️ En el mapa, cada compañero de tu gremio se ve con el emoji de su clase (🏰, 📿, 🌳…), y 👥 si hay varios en la misma zona. Arriba del mapa, una línea por compañero dice quién es, su clase y sus coordenadas."
  notes_en:
    - "💬 If you have a guild (or a camp), everything you type in the game chat reaches your whole guild, from wherever you are. The latest messages stay in 🛡️ Guild. Commands with / and the screens that ask you to type something work as before."
    - "🗺️ On the map, each of your guild mates shows with their class's emoji (🏰, 📿, 🌳…), and 👥 if several are in the same zone. Above the map, one line per mate says who it is, their class and their coordinates."

v0_38_2:
  version: "0.38.2"
  title: "🗡️ Lost Realms 0.38.2: el Guerrero con su espada"
  title_en: "🗡️ Lost Realms 0.38.2: the Warrior with a sword"
  notes:
    - "🗡️ El Guerrero ahora se ve con una espada en todo el juego: en el mapa, en 👥 Jugadores y en su ficha."
  notes_en:
    - "🗡️ The Warrior now shows with a sword everywhere: on the map, in 👥 Players and on their card."

v0_38_3:
  version: "0.38.3"
  title: "🧙 Lost Realms 0.38.3: cada clase con su propio ícono"
  title_en: "🧙 Lost Realms 0.38.3: every class with its own icon"
  notes:
    - "🧙 Cada clase y cada rol tienen ahora un ícono que no se usa para nada más del juego, para reconocerlos de un vistazo en el mapa, en 👥 Jugadores y en las peleas: 🤺 Guerrero, 🦁 Paladín, 🍀 Druida, 🧝 Cazador, 🕊️ Sacerdote y 🧙 Mago."
    - "🎭 Roles: 🐢 y 🦏 Guerrero, 🌞 y 🔱 Paladín, 🦬 y 🐅 Druida, 🪶 y 🦊 Cazador, 🙏 y 🌚 Sacerdote, 🧿 y 🌠 Mago (tanque o sanador o soporte primero, DPS después)."
  notes_en:
    - "🧙 Every class and every role now has an icon nothing else in the game uses, so you can tell them apart at a glance on the map, in 👥 Players and in fights: 🤺 Warrior, 🦁 Paladin, 🍀 Druid, 🧝 Hunter, 🕊️ Priest and 🧙 Mage."
    - "🎭 Roles: 🐢 and 🦏 Warrior, 🌞 and 🔱 Paladin, 🦬 and 🐅 Druid, 🪶 and 🦊 Hunter, 🙏 and 🌚 Priest, 🧿 and 🌠 Mage (tank, healer or support first, DPS second)."

v0_39:
  version: "0.39"
  title: "🏘️ Lost Realms 0.39: el campamento por tipos, ayudantes y armería"
  title_en: "🏘️ Lost Realms 0.39: the camp by types, helpers and armory"
  notes:
    - "🙈 Menos texto: lo que todavía no es para tu nivel ya no se muestra (recetas, especializaciones, talentos, obras, misiones). Aparece cuando lo puedes usar; al subir de nivel te avisa \"📖 Nueva misión\"."
    - "🏘️ Servicios ahora tiene un botón por tipo de obra: 🏠 Casas, ⚒️ Oficios, 🛡️ Defensas y 📚 Saber. Cada uno muestra lo construido, lo que falta en las obras activas y las que esperan."
    - "🪣 Cada oficio tiene su propio edificio: 🪚 Aserradero, 🧶 Tejeduría y 🗿 Cantería desde el nivel 1, 🪣 Curtiduría, 💧 Alambique y 🏭 Fundición desde el 2, y más hasta el 5. Si tu campamento ya tenía el 🧵 Taller o la Herrería, conserva todo."
    - "▶️ El fundador o un 🤝 ayudante activa cada obra; todos la ven y aportan a las activas. Cada obra nueva cuesta un poco más que la anterior."
    - "🤝 Ayudantes: el fundador nombra 1 cada 5 miembros. Activan obras, invitan con /inv_ y aceptan a quien pide entrar."
    - "💰 Después de fundar, 🛡️ Gremio no pierde nada: 📢 Mensaje, 💰 Depositar desde cualquier lugar (llena solo las obras activas), 🗺️ Zonas y la lista de miembros."
    - "⚔️ Nueva Armería del gremio: deja con /a1 el equipo que no usas y toma con /t1 el que dejaron otros. Queda anotado quién dejó y quién tomó."
    - "⏳ Con el campamento lleno, puedes invitar al gremio a quien no tiene campamento (hasta 10 esperan). Tienen todo lo del gremio, y entran al campamento cuando hay lugar y el fundador o un ayudante los une."
  notes_en:
    - "🙈 Less text: what isn't for your level yet is no longer shown (recipes, specializations, talents, works, quests). It appears when you can use it; when you level up you get \"📖 New quest\"."
    - "🏘️ Services now has one button per type of work: 🏠 Homes, ⚒️ Crafts, 🛡️ Defenses and 📚 Knowledge. Each one shows what is built, what the active works still need and the ones waiting."
    - "🪣 Every profession has its own building: 🪚 Sawmill, 🧶 Weaving shed and 🗿 Stonemason's yard from level 1, 🪣 Tannery, 💧 Still and 🏭 Smelter from 2, and more up to 5. If your camp already had the 🧵 Workshop or the Smithy, it keeps everything."
    - "▶️ The founder or a 🤝 helper activates each work; everyone sees it and gives to the active ones. Each new work costs a bit more than the last."
    - "🤝 Helpers: the founder names 1 for every 5 members. They activate works, invite with /inv_ and accept those who ask to join."
    - "💰 After founding, 🛡️ Guild loses nothing: 📢 Message, 💰 Deposit from anywhere (it only fills the active works), 🗺️ Zones and the member list."
    - "⚔️ New guild Armory: leave the gear you don't use with /a1 and take what others left with /t1. Who left and who took what is recorded."
    - "⏳ With the camp full, you can invite into the guild someone without a camp (up to 10 can wait). They get everything of the guild, and join the camp when there is room and the founder or a helper adds them."

v0_39_1:
  version: "0.39.1"
  title: "🔎 Lost Realms 0.39.1: buscador de recursos"
  title_en: "🔎 Lost Realms 0.39.1: resource finder"
  notes:
    - "🔎 Nuevo buscador de recursos, en 🛡️ Gremio y en 🏰 Gestionar: escribe un recurso (por ejemplo, madera) y te dice en qué zonas investigadas al 50 % o más está, la más cercana primero, con cuánto queda. Toca /z1 para armar el camino."
    - "🛡️ Con gremio, cuenta lo que exploraron todos; sin gremio, lo que exploraste tú. También puedes escribir /buscar madera desde cualquier lugar."
  notes_en:
    - "🔎 New resource finder, in 🛡️ Guild and in 🏰 Manage: type a resource (for example, wood) and it tells you which zones investigated to 50% or more have it, nearest first, with how much is left. Tap /z1 to lay out the way."
    - "🛡️ With a guild, what everyone explored counts; without one, what you explored. You can also type /search wood from anywhere."

v0_39_2:
  version: "0.39.2"
  title: "💱 Lost Realms 0.39.2: el Comercio, en pausa hasta las caravanas"
  title_en: "💱 Lost Realms 0.39.2: Trade, paused until the caravans"
  notes:
    - "💱 El oficio de Comercio queda bloqueado por ahora: va a cambiar y volverá con las caravanas. Vender al mercader y al trueque sigue igual para todos. Si ya tenías rango, queda guardado."
  notes_en:
    - "💱 The Trade profession is locked for now: it will change and come back with the caravans. Selling to the merchant and at the Trading Post works as before for everyone. If you already had a rank, it is kept."

v0_39_3:
  version: "0.39.3"
  title: "📚 Lost Realms 0.39.3: guías para aprender a jugar"
  title_en: "📚 Lost Realms 0.39.3: guides to learn the game"
  notes:
    - "📚 Nuevas guías en ❓ Dudas: una por cada clase, cómo encontrar y juntar recursos, los oficios, y cómo funciona cada cosa (energía, mapa, peleas, gremio, campamento, mazmorras y misiones). En español y en inglés."
    - "❓ Dudas ahora también está en ⚙️ Opciones, para encontrarla más fácil."
  notes_en:
    - "📚 New guides in ❓ Help: one for each class, how to find and gather resources, professions, and how everything works (energy, map, fights, guild, camp, dungeons and quests). In Spanish and in English."
    - "❓ Help is now also in ⚙️ Options, so it's easier to find."

v0_39_4:
  version: "0.39.4"
  title: "🛡️ Lost Realms 0.39.4: equipar más claro"
  title_en: "🛡️ Lost Realms 0.39.4: clearer equipping"
  notes:
    - "🔁 Equipar ahora es una lista con solo lo que no llevas puesto: cada pieza tiene su código (/e1) para verla y ponértela."
    - "🔽 Nuevo botón Desequipar, al lado de Equipar: la lista de lo que llevas puesto, y con su código (/q1) te lo quitas."
  notes_en:
    - "🔁 Equip is now a list with only what you are not wearing: each piece has its code (/e1) to see it and put it on."
    - "🔽 New Unequip button, next to Equip: the list of what you wear, and its code (/q1) takes it off."

v0_40:
  version: "0.40"
  title: "🪵 Lost Realms 0.40: más madera, Lugares ordenados y un gremio más claro"
  title_en: "🪵 Lost Realms 0.40: more wood, tidier Places and a clearer guild"
  notes:
    - "🪵 Hay más madera: los bosques, bosques oscuros y selvas siempre tienen, aparece en algunas zonas más y vuelve el doble de rápido."
    - "📒 Lugares ahora tiene botones: primero tu campamento, después 🕳️ Mazmorras, 🔥 Fogatas y los demás. Cada uno con su lista y sus códigos /ir."
    - "🏕️ Tu campamento muestra solo lo que puedes hacer; la información (nivel, miembros, mejoras, próxima oleada…) está en 🏰 Gestionar → ℹ️ Información."
    - "🛡️ El gremio está más ordenado: arriba su nivel y lo que falta; abajo 👥 Miembros, 💰 Fondos del campamento (cada recurso con su código), 📢 Chat (los mensajes del último día), ⚔️ Armería y 🔎 Buscar recursos."
  notes_en:
    - "🪵 There is more wood: forests, dark forests and jungles always have it, it shows up in a few more zones and it grows back twice as fast."
    - "📒 Places now has buttons: your camp first, then 🕳️ Dungeons, 🔥 Campfires and the rest. Each one with its list and its /go codes."
    - "🏕️ Your camp shows only what you can do; the information (level, members, upgrades, next wave…) is in 🏰 Manage → ℹ️ Information."
    - "🛡️ The guild is tidier: its level and what's missing at the top; below, 👥 Members, 💰 Camp funds (each resource with its code), 📢 Chat (the last day's messages), ⚔️ Armory and 🔎 Find resources."


v0_41:
  version: "0.41"
  title: "⏫ Lost Realms 0.41: sube de nivel tu campamento y elige hacia dónde crece"
  title_en: "⏫ Lost Realms 0.41: level up your camp and choose where it grows"
  notes:
    - "⬆️ En 🏰 Gestionar, Agrandar ahora es ⬆️ Mejorar campamento, con dos botones: ⏫ Siguiente nivel y 🗺️ Agrandar territorio."
    - "⏫ Siguiente nivel te muestra en una lista lo que falta para subir: qué obras tienen que estar construidas y qué materiales hacen falta. Cada línea se marca ✅ cuando está lista; todos aportan con 🤲 y, con lo último, el campamento sube solo."
    - "🗺️ Agrandar territorio tiene un minimapa: eliges hacia dónde crece (norte, este…) viendo los recursos de cada zona. Cada etapa tiene su tope de zonas (campamento 3, aldea 5, pueblo 9, ciudad 15, castillo 25). Tus campamentos conservan su nivel y sus zonas."
    - "🤝 Los ayudantes ahora se llaman asistentes: activan obras y eligen con el fundador hacia dónde crece el territorio. El fundador los nombra en 🛡️ Gremio → 👥 Miembros."
    - "🔨 Todos los miembros ven las obras: las activas, las que están en obra, las que faltan activar y cuánto falta para el siguiente nivel."
  notes_en:
    - "⬆️ In 🏰 Manage, Expand is now ⬆️ Improve camp, with two buttons: ⏫ Next level and 🗺️ Expand territory."
    - "⏫ Next level shows a list of what is missing to go up: which works must be built and which materials are needed. Each line gets a ✅ when it is done; everyone gives with 🤲 and, with the last thing, the camp goes up by itself."
    - "🗺️ Expand territory has a mini-map: you choose where it grows (north, east…) seeing each zone's resources. Each stage has its zone cap (camp 3, village 5, town 9, city 15, castle 25). Your camps keep their level and their zones."
    - "🤝 Helpers are now called assistants: they activate works and choose with the founder where the territory grows. The founder names them in 🛡️ Guild → 👥 Members."
    - "🔨 Every member sees the works: the active ones, the ones being built, the ones still to activate and how much is missing for the next level."

v0_41_1:
  version: "0.41.1"
  title: "⏫ Lost Realms 0.41.1: subir de nivel más claro y madera en todas las zonas"
  title_en: "⏫ Lost Realms 0.41.1: clearer leveling up and wood in every zone"
  notes:
    - "⬆️ Mejorar campamento ahora dice todo con palabras: cuántas zonas ocupa tu territorio y cuántas más puedes sumar, y la lista entera de lo que pide el siguiente nivel."
    - "📋 Cada línea dice lo que le falta: la obra sin activar (quién la activa), la activa (qué materiales le faltan), la que está en obra (cuándo termina) y cada material (\"🪵 Madera: 11 de 30, faltan 19\")."
    - "💰 Lo que depositas en el fondo ahora también llena el siguiente nivel, después de las obras activas; con lo último, el campamento sube solo. Los materiales no llegan solos: dalos con 🤲 Aportar o 💰 Depositar."
    - "📜 Nuevo botón Qué pide cada nivel: todas las subidas hasta castillo, con sus obras y materiales."
    - "🪵 Ahora hay madera en todas las zonas: en los bosques, bosques oscuros y selvas hay mucha y la ves desde que empiezas a explorar; en las montañas, praderas y demás hay menos, pero hay."
    - "🔎 Al buscar un recurso, salen primero las zonas cercanas donde hay más."
  notes_en:
    - "⬆️ Improve camp now says everything in words: how many zones your territory takes and how many more you can add, and the whole list of what the next level needs."
    - "📋 Each line says what it lacks: the work not active yet (who activates it), the active one (which materials it lacks), the one being built (when it ends) and each material (\"🪵 Wood: 11 of 30, 19 missing\")."
    - "💰 What you deposit in the fund now also fills the next level, after the active works; with the last thing, the camp goes up by itself. Materials do not arrive by themselves: give them with 🤲 Give or 💰 Deposit."
    - "📜 New button What each level needs: every step up to the castle, with its works and materials."
    - "🪵 There is wood in every zone now: forests, dark forests and jungles have plenty, and you see it as soon as you start exploring; mountains, grasslands and the rest have less, but they have some."
    - "🔎 When you look for a resource, nearby zones that have more of it come first."

v0_42:
  version: "0.42"
  title: "🪓 Lost Realms 0.42: botón Talar y recursos que vuelven más rápido"
  title_en: "🪓 Lost Realms 0.42: a Chop wood button and resources that grow back faster"
  notes:
    - "🪓 Nuevo botón Talar en 🧭 Explorar, al lado de Recolectar: junta solo 🪵 madera. Cuesta y tarda lo mismo que recolectar, va en lotes y sube al 🪓 Leñador; en un ✨ nodo de madera rinde el doble."
    - "🧺 Recolectar ahora lleva la canasta 🧺, para no confundirlo con 🪓 Talar."
    - "🌱 Los 6 recursos de base (madera, piedra, fibra, hierba, metal y arcilla) vuelven 3 por hora en cada zona, en vez de 1. Los propios de cada terreno y el pescado siguen igual."
    - "🩹 Con la vida por debajo de tu % de Retirarse (⚙️ Opciones) no empiezas a explorar, recolectar ni talar: el juego te avisa que descanses y te muestra cómo (🛏️ Posada en la fogata, 🩺 Salud o cambiar el % en ⚙️ Opciones). Las peleas siguen igual."
  notes_en:
    - "🪓 New Chop wood button in 🧭 Explore, next to Gather: it collects only 🪵 wood. It costs and takes the same as gathering, runs in batches and raises the 🪓 Lumberjack; on a ✨ wood node it yields double."
    - "🧺 Gather now has the basket 🧺, so it is not mixed up with 🪓 Chop wood."
    - "🌱 The 6 base resources (wood, stone, fiber, herb, metal and clay) grow back 3 per hour in each zone, instead of 1. Each terrain's own resources and fish stay the same."
    - "🩹 With your health below your Retreat % (⚙️ Options) you do not start exploring, gathering or chopping wood: the game tells you to rest and shows you how (🛏️ Inn at the campfire, 🩺 Health or changing the % in ⚙️ Options). Fights stay the same."

v0_43:
  version: "0.43"
  title: "🎖️ Lost Realms 0.43: títulos de oficio en el Entrenador y 🎣 Pescar"
  title_en: "🎖️ Lost Realms 0.43: profession titles at the Trainer and 🎣 Fish"
  notes:
    - "🎖️ Los títulos de oficio ahora se compran en el 🧑‍🏫 Entrenador, como en WoW: al rango 20, 40, 60, 80 y 95 un oficio se frena hasta que compras el título siguiente. Oficial 🥉50 (héroe de nivel 10), Experto 🥈2 (nivel 20), Artesano 🥈10 (nivel 30), Maestro 🥈30 (nivel 40) y Gran Maestro 🥈50 (nivel 50). En el tope, la experiencia del oficio no se guarda. Míralos con /titulos."
    - "🎁 Si ya pasabas un tope, conservas tu rango y tienes gratis los títulos hasta él: solo compras los que vienen. El 🧭 Explorador sigue subiendo solo."
    - "📚 Aprender un oficio cuesta 🥈1 los de fabricación (y ✨ Encantamiento) y 🥉50 los de recolección, refinado y 🏗️ Construcción. Sigue gratis si ya lo practicabas."
    - "🎣 Nuevo botón Pescar en 🧭 Explorar, donde la zona tiene agua (en el pantano siempre; en los ríos, cuando ya sabes que hay pescado): junta solo 🐟 pescado, va en lotes y sube al 🎣 Pescador."
    - "🦌 Las bestias sueltan 2,5 veces más piel, y el 🔪 Desollador gana +3 de experiencia por cada bestia que desuella."
    - "🧱 Nueva obra que se repite en 🔨 Obras: Mantenimiento. Cada vuelta pide madera, piedra y fibra y sube la 🏗️ Construcción; al completarla empieza otra."
    - "🧪 El 🛒 Mercader ahora te compra pociones y remedios de la mochila, a poco (un cuarto de su precio), hasta que haya mercado entre jugadores. Lo del cinturón no se vende."
  notes_en:
    - "🎖️ Profession titles are now bought at the 🧑‍🏫 Trainer, as in WoW: at rank 20, 40, 60, 80 and 95 a profession stops until you buy the next title. Journeyman 🥉50 (hero level 10), Expert 🥈2 (level 20), Artisan 🥈10 (level 30), Master 🥈30 (level 40) and Grandmaster 🥈50 (level 50). At the cap, profession experience is not kept. See them with /titles."
    - "🎁 If you were already past a cap, you keep your rank and get the titles up to it for free: you only buy the ones ahead. The 🧭 Explorer still rises on its own."
    - "📚 Learning a profession costs 🥈1 for crafting ones (and ✨ Enchanting) and 🥉50 for gathering, refining and 🏗️ Construction. Still free if you already practised it."
    - "🎣 New Fish button in 🧭 Explore, where the zone has water (always in the swamp; on rivers, once you know there are fish): it collects only 🐟 fish, runs in batches and raises the 🎣 Fisher."
    - "🦌 Beasts drop 2.5 times more hide, and the 🔪 Skinner gets +3 experience for every beast it skins."
    - "🧱 A new work that repeats in 🔨 Works: Upkeep. Each round asks for wood, stone and fiber and raises 🏗️ Construction; when it is complete another one starts."
    - "🧪 The 🛒 Merchant now buys potions and remedies from your backpack, for a little (a quarter of their price), until there is a player market. What is on your belt is not sold."

v0_44:
  version: "0.44"
  title: "📚 Lost Realms 0.44: oficios como en WoW, con tramos, colores y libros de recetas"
  title_en: "📚 Lost Realms 0.44: WoW-style professions, with tiers, colors and recipe books"
  notes:
    - "🛠️ Los oficios de equipo (🪑 Carpintería, 🔨 Herrería, 🪡 Sastrería, 🦺 Peletería y 💍 Joyería) abren recetas nuevas cada 5 rangos, y la pieza que sale es de tu rango: con rango 30 haces equipo de nivel 30. Hay 180 piezas nuevas."
    - "🟧 Colores de receta como en WoW: 🟧 naranja te da la experiencia de oficio entera, 🟨 amarilla la mitad, 🟩 verde un cuarto y ⬜ gris nada. Para seguir subiendo hay que fabricar lo nuevo. En 🛠️ Fabricar cada receta muestra su color y cuánta experiencia te da."
    - "⚡ Las piezas de rango alto dan más experiencia de oficio (hasta 24) y cuestan más energía (3 ⚡ desde el rango 55 y 4 desde el 85)."
    - "📚 Libros de recetas en 🧑‍🏫 Entrenador: las recetas de rango 25, 50 y 75 o más piden su libro (🥈2, 🥈10 y 🥈25). Si ya tenías ese rango en un oficio, te regalamos sus libros: sigues haciendo todo lo que hacías."
    - "📿 La 💍 Joyería empieza con el Colgante de cobre, sin gema: lingote y cuero."
    - "⛓️ Ya no se fabrica malla (no la usa ninguna clase). Las piezas de malla que tienes siguen en tu mochila."
  notes_en:
    - "🛠️ The gear professions (🪑 Carpentry, 🔨 Blacksmithing, 🪡 Tailoring, 🦺 Leatherworking and 💍 Jewelcrafting) open new recipes every 5 ranks, and the piece you make matches your rank: at rank 30 you make level 30 gear. There are 180 new pieces."
    - "🟧 WoW-style recipe colors: 🟧 orange gives you the full profession experience, 🟨 yellow half, 🟩 green a quarter and ⬜ grey none. To keep rising you have to craft the new things. In 🛠️ Craft each recipe shows its color and how much experience it gives you."
    - "⚡ High-rank pieces give more profession experience (up to 24) and cost more energy (3 ⚡ from rank 55 and 4 from rank 85)."
    - "📚 Recipe books at the 🧑‍🏫 Trainer: recipes of rank 25, 50 and 75 or more need their book (🥈2, 🥈10 and 🥈25). If you already had that rank in a profession, its books are a gift: you keep making everything you made."
    - "📿 💍 Jewelcrafting starts with the Copper Pendant, no gem needed: an ingot and leather."
    - "⛓️ Mail is no longer crafted (no class uses it). The mail pieces you have stay in your backpack."

v0_45:
  version: "0.45"
  title: "🛠️ Lost Realms 0.45: los edificios de oficio se construyen con lo de su oficio"
  title_en: "🛠️ Lost Realms 0.45: profession buildings are built with their profession's goods"
  notes:
    - "🛠️ Los 13 edificios de oficio del campamento ahora piden sobre todo lo que trabaja su oficio y solo un poco de madera y piedra: la 🪑 Carpintería, tablones; la 🪡 Sastrería, tela; la 🔨 Forja, lingotes y cuero; la ⚗️ Alquimia, extracto… Cuestan lo mismo contado en crudo."
    - "🔥 En el Claro puedes refinar todo eso desde el primer día: madera en tablones, fibra en tela, piel en cuero, metal en lingotes, hierbas en extracto y piedra en sillares."
    - "🏥 Desde el nivel 5 los edificios mezclan oficios: la 🏥 Enfermería pide 🪑 Literas de la Carpintería, ungüentos de la Medicina y vendas de la Sastrería; la 🧱 Muralla, 🪑 Paveses; las 🏹 Torres de arqueros, un 🪑 Armero… Un campamento grande necesita de todos sus oficios."
    - "🔒 Las obras que tu campamento ya había activado siguen pidiendo lo de antes: nadie pierde lo que ya entregó."
  notes_en:
    - "🛠️ The camp's 13 profession buildings now ask mostly for what their profession works with and only a little wood and stone: 🪑 Carpentry, planks; 🪡 Tailoring, cloth; 🔨 the Forge, ingots and leather; ⚗️ Alchemy, extract… They cost the same counted in raw materials."
    - "🔥 At the Clearing you can refine all of that from day one: wood into planks, fiber into cloth, hide into leather, metal into ingots, herbs into extract and stone into ashlar blocks."
    - "🏥 From level 5 buildings mix professions: the 🏥 Infirmary asks for 🪑 Bunks from Carpentry, ointments from Medicine and bandages from Tailoring; the 🧱 Wall, 🪑 Pavises; the 🏹 Archer towers, a 🪑 Weapon rack… A big camp needs all of its professions."
    - "🔒 Works your camp had already activated keep asking for what they did before: nobody loses what they already gave."

v0_45_1:
  version: "0.45.1"
  title: "🔧 Lost Realms 0.45.1: ningún campamento se traba y las recetas en lista"
  title_en: "🔧 Lost Realms 0.45.1: no camp gets stuck, and recipes as a list"
  notes:
    - "🪑 Las 🛏️ Literas de roble se hacen desde el rango 10 de la Carpintería (antes 40) y el 🗄️ Armero de roble desde el 15 (antes 70). La 🏥 Enfermería y las 🏹 Torres de arqueros los siguen pidiendo, pero ahora tu carpintero llega a tiempo."
    - "🧱 La Muralla de piedra y el 🥬 Huerto ya no piden muebles de especialista (Paveses y Carro de víveres): piden tablones, lingotes y, la Muralla, sillares. Para subir de nivel nunca hace falta una 🎓 especialización ni un 📚 libro de recetas."
    - "🔨 La Forja se construye solo con lingotes (antes también 15 de cuero): la piel queda para la Curtiduría, la Peletería y tus armaduras."
    - "🔒 Las obras que tu campamento ya había activado siguen pidiendo lo mismo: nadie pierde lo que ya entregó."
    - "📜 🛠️ Fabricar, 🪚 Refinar y 🍲 Cocinar son ahora una lista: una línea por receta con su código (/r1), su color, si la puedes hacer (✅ lo llevas todo, 🔸 te falta algo, ▫️ nada) y la experiencia que da, agrupadas por oficio. Toca el código para abrirla, o ✅ Solo las que puedo hacer."
  notes_en:
    - "🪑 🛏️ Oak Bunks are made from Carpentry rank 10 (was 40) and the 🗄️ Oak Weapon Rack from rank 15 (was 70). The 🏥 Infirmary and the 🏹 Archer Towers still ask for them, but now your carpenter gets there in time."
    - "🧱 The Stone Wall and the 🥬 Garden no longer ask for specialist furniture (Oak Pavises and Supply Cart): they ask for planks, ingots and, the Wall, ashlar blocks. Levelling your camp up never needs a 🎓 specialization or a 📚 recipe book."
    - "🔨 The Forge is built with ingots only (it also asked for 15 leather): hide is left for the Tannery, the Leatherworks and your armor."
    - "🔒 Works your camp had already activated keep asking for the same: nobody loses what they already gave."
    - "📜 🛠️ Craft, 🪚 Refine and 🍲 Cook are now a list: one line per recipe with its code (/r1), its color, whether you can make it (✅ you carry it all, 🔸 something is missing, ▫️ none) and the experience it gives, grouped by profession. Tap the code to open it, or ✅ Only what I can make."

v0_46:
  version: "0.46"
  title: "🏛️ Lost Realms 0.46: el mercado entre jugadores"
  title_en: "🏛️ Lost Realms 0.46: the player market"
  notes:
    - "🏛️ Nuevo 🏛️ Mercado: un solo mercado para todos. Ábrelo en cualquier 🔥 fogata (🛒 Mercader → 🏛️ Mercado), en tu campamento con 🏪 Puesto de trueque, o escribe /mercado."
    - "🏷️ Vende a otros jugadores el equipo que encuentras o fabricas, y también pociones, remedios, muebles, comida, 💰 bolsas y 🪎 cofres: eliges qué (/s1), pones el precio en 🥉 y la cantidad, y cuando alguien compra cobras al momento."
    - "📝 ¿Te faltan recursos? Pídelos en 📝 Pedir recursos (/b07, el mismo código de 📦 Recursos): apartas las monedas y quien los tenga te los vende. Y si tú los tienes, véndelos en 📥 Pedidos de compra."
    - "🐴 Lo que compras lo trae un transportista: llega a 📦 Entregas en 30 minutos y lo recoges en cualquier fogata o en tu campamento. Si la mochila está llena, el resto espera: nada se pierde."
    - "💸 Quien cobra paga un impuesto del 5 %. Tienes hasta 10 órdenes a la vez; duran 7 días y ❌ cancelar devuelve todo. Las ✒️ obras maestras se venden con la firma de quien las hizo."
  notes_en:
    - "🏛️ New 🏛️ Market: one market for everyone. Open it at any 🔥 campfire (🛒 Merchant → 🏛️ Market), at your camp with a 🏪 Trading Post, or type /market."
    - "🏷️ Sell other players the gear you find or craft, and also potions, remedies, furniture, food, 💰 bags and 🪎 chests: pick what (/s1), set the price in 🥉 and the quantity, and when someone buys you get paid at once."
    - "📝 Short of resources? Ask for them in 📝 Ask for resources (/b07, the same code as in 📦 Resources): you set the coins aside and whoever has them sells them to you. And if you have them, sell them in 📥 Buy orders."
    - "🐴 A transporter brings what you buy: it reaches 📦 Deliveries in 30 minutes and you collect it at any campfire or at your camp. If your backpack is full, the rest waits: nothing is lost."
    - "💸 Whoever gets the coins pays a 5% tax. You can have up to 10 orders at a time; they last 7 days and ❌ cancelling gives everything back. ✒️ Masterworks are sold with their maker's signature."

v0_46_1:
  version: "0.46.1"
  title: "⏳ Lost Realms 0.46.1: quien espera lugar entra solo al campamento"
  title_en: "⏳ Lost Realms 0.46.1: whoever waits for room joins the camp by themselves"
  notes:
    - "⏳ Si esperabas lugar en el gremio de un campamento lleno, ahora entras solo en cuanto hay lugar (cuando el campamento sube de nivel, con 🛖 Cabañas o 🛏️ Literas, o si alguien sale), por orden de llegada. Te llega un aviso, y al fundador y a sus asistentes también."
    - "✅ Si aceptas esperar y ya hay lugar, entras en el momento. Quien ya esperaba desde antes también entra, si su campamento tiene lugar."
  notes_en:
    - "⏳ If you were waiting for room in the guild of a full camp, you now join by yourself as soon as there is room (when the camp goes up a level, with 🛖 Cabins or 🛏️ Bunks, or if someone leaves), first come first in. You get a notice, and so do the founder and the assistants."
    - "✅ If you accept to wait and there is already room, you join at once. Whoever was already waiting also joins, if their camp has room."

v0_47:
  version: "0.47"
  title: "💰 Lost Realms 0.47: el fondo del gremio también para tu oficio"
  title_en: "💰 Lost Realms 0.47: the guild fund for your profession too"
  notes:
    - "🏗️ Primero las obras: el 💰 fondo del campamento sigue dando a las obras activas y a ⏫ Siguiente nivel lo que les falta, y eso queda guardado para ellas."
    - "🛠️ Lo que sobra es para los oficios: en las estaciones de tu campamento, al refinar o fabricar, la receta toma primero de tu mochila y lo que falta del fondo. En la lista sale ✅💰 lo que puedes hacer con ayuda del fondo, y cada receta dice cuánto pondría."
    - "📏 Cada miembro toma hasta 40 por día del fondo para sus oficios; mañana se renueva."
    - "📜 En 🛡️ Gremio → 💰 Fondos ves qué está guardado para las obras, qué sobra y 📜 Quién usó qué. El fundador o un 🤝 asistente puede 🔒 cerrar el fondo para oficios (empieza 🔓 abierto)."
  notes_en:
    - "🏗️ Works come first: the camp's 💰 fund still gives the active works and the ⏫ Next level what they lack, and that is kept for them."
    - "🛠️ What is left over is for professions: at your camp's stations, when you refine or craft, the recipe takes from your backpack first and the rest from the fund. The list shows ✅💰 for what you can make with the fund's help, and each recipe says how much it would put in."
    - "📏 Each member takes up to 40 a day from the fund for their professions; it resets the next day."
    - "📜 In 🛡️ Guild → 💰 Funds you see what is kept for the works, what is left over and 📜 Who used what. The founder or a 🤝 assistant can 🔒 close the fund for professions (it starts 🔓 open)."

v0_48:
  version: "0.48"
  title: "🔥 Lost Realms 0.48: fogatas, 🔭 Reconocer y ✨ nodos en Lugares"
  title_en: "🔥 Lost Realms 0.48: campfires, 🔭 Scout and ✨ nodes in Places"
  notes:
    - "🔥 Las hogueras ahora se llaman fogatas en todo el juego: el Claro y las otras 8. Campamento es solo el que funda tu gremio."
    - "🔭 Reconocer (/reconocer) también lista los 👹 campamentos enemigos que tu rango de 🧭 Explorador deja ver: a 1 zona, a 3 desde el rango 25 y en todo tu mapa desde el 50, con su nombre, su tiempo de viaje y, desde el rango 75, su fuerza. Lo que puedes reconocer ahora trae su código (/rc1)."
    - "🗺️ Las zonas de tu campamento también se ven en blanco en el mapa hasta que tú o tu gremio las investiguen a la mitad, como cualquier otra zona."
    - "✨ 📒 Lugares tiene un botón nuevo, ✨ Nodos: los nodos de recursos que encontraste, con su recurso, su zona y su código (/ir1), para volver de una vez."
  notes_en:
    - "🔥 The 9 campfires (the Clearing and the other 8) are called campfires on every screen, and a camp is only the one your guild founds."
    - "🔭 Scout (/recon) also lists the 👹 enemy camps your 🧭 Explorer rank lets you see: 1 zone away, 3 from rank 25 and your whole map from rank 50, with their name, their travel time and, from rank 75, their strength. What you can scout now carries its code (/rc1)."
    - "🗺️ Your camp's zones also show white on the map until you or your guild investigate them halfway, like any other zone."
    - "✨ 📒 Places has a new button, ✨ Nodes: the resource nodes you found, with their resource, their zone and their code (/go1), so you can go straight back."

v0_49:
  version: "0.49"
  title: "🌾 Lost Realms 0.49: la muralla cosecha sola"
  title_en: "🌾 Lost Realms 0.49: the wall harvests by itself"
  notes:
    - "🌾 Con la 🧱 Muralla construida, cada zona del territorio de tu campamento cosecha sola el 20 % de lo que vuelve a crecer, sin gastar energía y sin bajar los recursos de la zona."
    - "💰 La cosecha se guarda hasta 7 días y cada semana llega sola al fondo del campamento (nunca a la mochila de nadie), si algún miembro jugó esa semana. A cada miembro le llega un aviso."
    - "📋 En 🏰 Gestionar → ⬆️ Mejorar y en 🛡️ Gremio → 💰 Fondos ves cuánto da por día, cuánto hay guardado y cuándo llega. Más en ❓ /d61."
    - "⚖️ La cosecha reemplaza el +50 % que daba recolectar en tu territorio: ahora ahí juntas lo mismo que afuera, y la tierra trabaja para todo el campamento."
  notes_en:
    - "🌾 With the 🧱 Wall built, every zone of your camp's territory harvests by itself 20% of what grows back, without spending energy and without lowering the zone's resources."
    - "💰 The harvest is kept for up to 7 days and every week it reaches the camp's fund by itself (never anyone's backpack), if some member played that week. Every member gets a notice."
    - "📋 In 🏰 Manage → ⬆️ Improve and in 🛡️ Guild → 💰 Funds you see how much it gives a day, how much is stored and when it arrives. More in ❓ /d61."
    - "⚖️ The harvest replaces the +50% that gathering in your territory used to give: now you gather there the same as outside, and the land works for the whole camp."

v0_50:
  version: "0.50"
  title: "🗺️ Lost Realms 0.50: el pergamino de mapa del Explorador"
  title_en: "🗺️ Lost Realms 0.50: the Explorer's map scroll"
  notes:
    - "🗺️ Desde el rango 15 de 🧭 Explorador haces pergaminos de mapa: 🗺️ Mapa → 🗺️ Pergaminos → 🗺️ Hacer pergamino. Lleva las zonas que investigaste tú a la mitad o más en tu región de 6 × 6 (al menos 6). Cuesta ⚡5 y 1 🦌 piel, y da experiencia de Explorador."
    - "🏛️ Véndelo al precio que quieras en el 🏛️ Mercado (🏷️ Vender), de 1 🥉 a 1 🥇. Los compradores lo encuentran en 🛍️ Comprar → 🗺️ Mapas y ven cuántas zonas son nuevas para ellos."
    - "📜 Quien lo usa ve esas zonas a color en su 🗺️ Mapa para siempre, y sus terrenos entran en su leyenda. Solo el color: los recursos, los nodos y el viaje directo se siguen ganando explorando. El pergamino se gasta al usarlo."
    - "🎒 Tus pergaminos: /pergaminos (también lo dice la 🎒 Mochila)."
  notes_en:
    - "🗺️ From 🧭 Explorer rank 15 you make map scrolls: 🗺️ Map → 🗺️ Scrolls → 🗺️ Make a scroll. It holds the zones you investigated yourself halfway or more in your 6 × 6 region (at least 6). It costs ⚡5 and 1 🦌 hide, and gives Explorer experience."
    - "🏛️ Sell it at the price you want in the 🏛️ Market (🏷️ Sell), from 1 🥉 to 1 🥇. Buyers find it in 🛍️ Buy → 🗺️ Maps and see how many zones are new for them."
    - "📜 Whoever uses it sees those zones in colour on their 🗺️ Map for ever, and their terrains join the legend. Only the colour: resources, nodes and direct travel are still earned by exploring. The scroll is spent when used."
    - "🎒 Your scrolls: /scrolls (the 🎒 Backpack says it too)."
