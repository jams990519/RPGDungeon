# --- D-115 / D-141: pieces only a 🎓 specialization makes ---
# Exclusive crafted gear: the crafted piece of the same slot, type and level (artesano_<type>_2 at level 5 and _13 at level 100)
# with every bonus × 1.05 (rounded to whole points) and one signature point; "spec" names the specialization whose recipe makes it.
# [ES] Equipo exclusivo de las 🎓 especializaciones (red-de-oficios.md §3: "recetas que solo ella hace"). Dos por especialización
# de equipo: una del nivel 5 (receta de rango 25, para usar apenas la eliges) y otra del nivel 100 (rango 100: lo mejor del juego en
# su línea, "para placas, ve con el Armero"). Cada una es la pieza de artesano de su ranura, tipo y nivel con cada bono × 1,05
# (redondeado a puntos enteros) y un punto propio (arco, espada, cuero y tela: +1 % de ataque; placas, malla y el sello de orfebre:
# +1 de defensa; el collar de gemas: +1 % de vida). Precio: el del artesano × 1,05; sus materiales siempre valen más que lo que paga
# el mercader (D-113). source: crafted, así tienen su ✒️ obra maestra (la arma el motor) y nunca salen en el botín. "spec" es
# informativo (la receta es la que decide quién la hace: content/professions.yaml, recetas con spec). IDs estables.
