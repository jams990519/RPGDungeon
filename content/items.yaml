# --- D-110 / D-113: gear tiers up to level 100 ---
# Loot pieces every 10 levels (tier 5 = level 10 ... tier 14 = level 100), one per slot and type, and crafted pieces of
# the same levels (artesano_<type>_4 ... _13). Crafted beats loot of its level; loot from level 10 is at most "raro".
# [ES] D-110 y D-113 (pasada de balance de clases y roles): equipo por niveles hasta el 100.
# - Botín: una pieza cada 10 niveles (tier 5 = nivel 10 ... tier 14 = nivel 100) en cada ranura y tipo, para que el equipo
#   siga mejorando hasta el 100. Crece parejo desde la épica del nivel 8: arma +1,8 puntos de ataque por tier, pecho +2 de
#   vida (y +0,2 de defensa), joya +1 de vida y +0,8 de ataque, cabeza/piernas/pies/manos menos. Del nivel 10 en adelante
#   el botín llega como mucho a 🔵 raro (D-113: los monstruos sueltan equipo de menos calidad).
# - Artesano: una pieza 🟣 épica por tier en arma, pecho y joya (las ranuras que hacen los oficios), con ~10 % más que el
#   botín de su nivel y un bono (vida en las armas, ataque en el pecho, defensa en la joya): lo mejor de cada nivel lo
#   fabrican los jugadores (D-113). Recetas en content/professions.yaml, rangos 55 a 100. Desde la fase 2 de la red de oficios
#   (D-115) también hay artesano de cabeza, manos, piernas y pies: sección al final del archivo.
# - Precio: botín 90 + 40 por tier en arma, pecho y joya (68 + 30 en las demás); artesano, 15 % más. Al mercader se vende a
#   la mitad (shop.sell_ratio): el de artesano siempre por menos que sus materiales (tests/test_balance_d110.py).
# Si cambias esto, revisa: tests/test_balance_d110.py y tests/test_gear.py; los números mueven el balance de todas las
# clases (registro en diseno/03-personaje/balance.md §7; medir con tools/balance_report.py).
