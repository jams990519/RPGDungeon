  emoji: "⚙️"
  kind: material
  price: 6
madera:
  name_key: item.madera
  emoji: "🪵"
  kind: material
  price: 2
piedra:
  name_key: item.piedra
  emoji: "🪨"
  kind: material
  price: 2
arcilla:
  name_key: item.arcilla
  emoji: "🏺"
  kind: material
  price: 2
fibra:
  name_key: item.fibra
  emoji: "🧵"
  kind: material
  price: 2

# Food (D-93, provisional): it goes to a settlement pantry. food = rations it is worth.
# [ES] Comida (D-93, provisional): se aporta a la despensa de tu campamento (desde nivel 3). El Claro no tiene (D-95).
# food = cuántas raciones vale cada unidad (1 ración = lo que come un residente activo en un día real).
# loot_amount = cuántas suelta un enemigo cuando sale en su botín (loot de enemies.yaml); sin esto, 1.
# Lo usan: engine/service/game.py (botín, mercader, 🌾 Aportar comida), engine/world/pantry.py (food_in).
# Si cambias esto, revisa: food mueve cuánto dura la despensa (balance.yaml pantry); el precio de las
# provisiones es el sumidero de monedas de emergencia (supervivencia-del-asentamiento.md §15.8).
carne:
  name_key: item.carne
  emoji: "🍖"
  kind: material             # [ES] se vende barata con "Vender materiales"; vale más en la despensa
  food: 2
  loot_amount: [1, 2]
  price: 2
provisiones:
  name_key: item.provisiones
  emoji: "🥖"
  kind: food                 # [ES] no es material: "Vender materiales" no la revende
  food: 1
  price: 15                  # [ES] cara a propósito: comida de emergencia del mercader (15 🥉 por ración; la carne se vende a 1)

# Professions phase 2, camp side (D-115): fish, cooked rations and the refined stone.
# [ES] Oficios, fase 2, lado del campamento (D-115): el 🐟 pescado (lo junta el 🎣 Pescador en las zonas con agua), las
# raciones que hace la 🍲 Cocina y el 🧱 sillar de la Cantería (content/professions.yaml).
# cooked: true = lo hizo la 🍲 Cocina: rinde más en la despensa con el beneficio de la Cocina del campamento (el pescado
# crudo, con el del 🎣 Pescador). Lo cocinado es kind: food: el mercader y el trueque no lo compran (va a la despensa).
# Lo usan: engine/service/game.py (_camp_feed, _recipe_view, _resources_view, obras y reparación de las defensas).
# Si cambias esto, revisa: food mueve cuánto dura la despensa (balance.yaml pantry); cada plato tiene que valer más
# raciones que lo crudo que lleva (tests/test_oficios_campamento.py); el sillar no debe dejar ganar monedas refinando.
pescado:
  name_key: item.pescado
  emoji: "🐟"
  kind: material             # [ES] como la carne: es comida (food), va a la despensa o a la 🍲 Cocina; 💱 Vender todo no la vende
  food: 1                    # [ES] 1 ración cruda (la carne, 2); el 🎣 Pescador del campamento le suma hasta 30 %
  price: 2
racion_campamento:
  name_key: item.racion_campamento
  emoji: "🍱"
  kind: food
  cooked: true
  food: 3                    # [ES] carne (2) + hierba → 3
  price: 3
pescado_asado:
  name_key: item.pescado_asado
  emoji: "🍢"
  kind: food
  cooked: true
  food: 3                    # [ES] 2 pescados (2) + leña → 3
  price: 3
guiso_cazador:
  name_key: item.guiso_cazador
  emoji: "🥘"
  kind: food
  cooked: true
  food: 10                   # [ES] 2 carnes y 2 pescados (6) + hierba → 10 (rango 25)
  price: 10
conserva:
  name_key: item.conserva
  emoji: "🥫"
  kind: food
  cooked: true
  food: 18                   # [ES] 3 carnes y 3 pescados (9) + tarro y salmuera → 18 (rango 50)
  price: 18
festin:
  name_key: item.festin
  emoji: "🍗"
  kind: food
  cooked: true
  food: 27                   # [ES] 4 carnes y 4 pescados (12) + hierbas y flor de luna → 27 (rango 75)
  price: 27
banquete:
  name_key: item.banquete
  emoji: "🍽️"
  kind: food
  cooked: true
  food: 45                   # [ES] 6 carnes y 6 pescados (18) + extracto y flores de luna → 45 (rango 100)
  price: 45
sillar:
  name_key: item.sillar
  emoji: "🧱"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio (se vende de a uno)
  price: 7                   # [ES] 3 piedras (2 c/u) + el trabajo, como el tablón

# Camp furniture (D-116): only 🪑 Carpentry makes it (content/professions.yaml). A member places it in their camp
# (🔨 Mejoras → 🔨 Obras → 🪑 Colocar); one of each piece per camp, for ever.
# [ES] Muebles del campamento (D-116): solo la 🪑 Carpintería los hace. Un miembro lo coloca en su campamento y queda para
# siempre: uno de cada mueble por campamento (un segundo igual no suma). effect: lo que suma al campamento, con los mismos
# nombres que las mejoras de content/camp_upgrades.yaml (members = lugares para miembros, defense = puntos de 🛡️ Defensa
# que leen las oleadas). El mercader no los compra (no son material). desc_key: qué hace, en una frase.
# Lo usan: engine/service/game.py (_furniture_effect, _works_view, _place_furniture, _resources_view).
# Si cambias esto, revisa: members mueve el cupo (_members_cap) y defense las oleadas (_camp_defense, _raid_weaken).
literas_roble:
  name_key: item.literas_roble
  desc_key: furniture.literas_roble
  emoji: "🛏️"
  kind: furniture
  effect: {members: 1}       # [ES] +1 lugar para un miembro (se suma al cupo de siempre, al del gremio y a las 🛖 Cabañas)
  price: 60
armero_roble:
  name_key: item.armero_roble
  desc_key: furniture.armero_roble
  emoji: "🗄️"
  kind: furniture
  effect: {defense: 1}       # [ES] +1 de 🛡️ Defensa (las 8 mejoras de defensa suman 11; con el armero, 12)
  price: 110

