  emoji: "🩻"
  kind: bandage              # [ES] D-111: la mejor cura sin toxicidad (Medicina rango 50, pide 🌸 flor de luna del herbolario)
  heal: 0.5
  toxicity: 0
  belt: true
  price: 30

