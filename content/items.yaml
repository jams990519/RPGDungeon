# Professions, phase 1 (D-109): materials gathered, skinned or refined, and what crafters make.
# [ES] Oficios, fase 1 (D-109): materiales que se recolectan, se sacan de las bestias o se refinan, y lo que fabrican
# los artesanos (catálogo de recetas en content/professions.yaml). Lo que sale de refinar vale en el mercader lo mismo
# que lo que entra (o apenas más): refinar no fabrica monedas. piel: la sueltan las bestias, como la carne (enemies.yaml).
# gema_bruta y flor_luna: raras, solo para el minero y el herbolario desde su rango (professions.yaml "rare").
# Lo usan: engine/service/game.py (recolectar, botín, estaciones, mercader, 📦 Recursos).
# Si cambias esto, revisa: IDs estables; los precios no deben dejar ganar monedas refinando (precio de salida × 0,5
# ≈ precio de entrada × 0,5).
piel:
  name_key: item.piel
  emoji: "🦌"
  kind: material
  loot_amount: [1, 2]        # [ES] como la carne: 1 o 2 cuando sale en el botín de una bestia
  price: 3
tablon:
  name_key: item.tablon
  emoji: "🟫"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 7                   # [ES] 3 maderas (2 c/u) + el trabajo
lingote:
  name_key: item.lingote
  emoji: "🔩"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 13                  # [ES] 2 piezas de metal (6 c/u) + el trabajo
extracto:
  name_key: item.extracto
  emoji: "🧴"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 10                  # [ES] 3 hierbas curativas (3 c/u) + el trabajo
tela_tejida:
  name_key: item.tela_tejida
  emoji: "🧣"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 7                   # [ES] 3 fibras (2 c/u) + el trabajo
cuero_curtido:
  name_key: item.cuero_curtido
  emoji: "🟤"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 7                   # [ES] 2 pieles (3 c/u) + el trabajo
gema_bruta:
  name_key: item.gema_bruta
  emoji: "💠"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 15                  # [ES] rara: el minero la encuentra desde el rango 10
flor_luna:
  name_key: item.flor_luna
  emoji: "🌸"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no lo vende: es trabajo de un oficio o un raro (se vende de a uno)
  price: 12                  # [ES] rara: el herbolario la encuentra desde el rango 10
pocion_mayor:
  name_key: item.pocion_mayor
  emoji: "🍷"
  kind: potion
  heal: 0.6                  # [ES] cura el 60 % de la vida (la de vida, 35 %)
  toxicity: 60               # [ES] una por pelea como mucho, junto con una de vida (tope de toxicidad 100)
  belt: true
  price: 18                  # [ES] solo la hace la Alquimia (rango 25): el mercader no la vende

unguento:
  name_key: item.unguento
  emoji: "🫙"
