# --- D-115, phase 2 (gear side): ✨ Enchanting essences ---
# [ES] Fase 2 de la red de oficios (D-115), lado del equipo: las esencias del ✨ Encantamiento. Salen de DESENCANTAR una pieza
# de equipo (la pieza se destruye: el gran sumidero de equipo de red-de-oficios.md §4) y se gastan al ENCANTAR una pieza.
# Cuántas da cada pieza y cuántas pide cada encantamiento: balance.yaml enchanting. keep: true = 💱 Vender todo no las vende.
# Precio bajo a propósito: desencantar nunca fabrica monedas (lo que dan las esencias en el mercader es siempre menos que lo
# que paga por la pieza; tests/test_oficios_equipo.py lo comprueba para cada pieza, con el beneficio del rango 100).
# Lo usan: engine/service/game.py (sección "enchanting": _disenchant, _enchant, _enchant_view), 📦 Recursos.
# Si cambias esto, revisa: IDs estables (las guardan las mochilas); subir el precio puede abrir la trampa de monedas.
esencia:
  name_key: item.esencia
  emoji: "✨"
  kind: material
  keep: true                 # [ES] 💱 Vender todo no la vende: es trabajo del ✨ Encantamiento
  price: 2                   # [ES] el mercader paga 1 🥉 (la mitad, nunca menos de 1)
esencia_mayor:
  name_key: item.esencia_mayor
  emoji: "🔮"
  kind: material
  keep: true                 # [ES] solo sale de piezas 🟣 épicas (las de artesano, las obras maestras, las del Guardián)
  price: 6                   # [ES] el mercader paga 3 🥉

# --- D-110 / D-113 / D-115: crafted head, hands, legs and feet ---
# Crafted pieces for the slots that only had loot: one per armor type and per gear tier (level 3, 5, 8, then every 10 up to
# 100), always better than loot of their level. Generated once from the loot pieces of the same slot, type and level.
# [ES] Equipo de artesano de cabeza, manos, piernas y pies (antes solo había botín en esas ranuras; la pasada de balance D-110 y
# D-113 dejó lo mejor de cada nivel en manos de los jugadores solo en arma, pecho y joya). Una pieza por tipo de armadura y por
# nivel de pieza: 3, 5, 8 (rangos 1, 25 y 50) y del 10 al 100 (rangos 55 a 100), con la curva del pecho de artesano:
#   - nivel 3, 5 y 8: lo mismo que el botín de su nivel y un bono chico;
#   - nivel 10 a 100: 🟣 épica, cada bono del botín de su nivel × 1,1 (redondeado) y un bono que el botín no tiene;
#   - el bono: +1 % de ataque en cabeza, piernas y pies (+2 % desde el nivel 60); +1 de defensa en las manos;
#   - precio: el del botín (nivel 3), × 1,11 (5 y 8) y × 1,15 (10 a 100), como el pecho de artesano.
# Telas → 🪡 Sastrería; cuero y malla → 🦺 Peletería; placas → 🔨 Herrería (recetas al final de content/professions.yaml).
# Nombres en content/locales/es_oficios_equipo.yaml. Una línea por pieza para que el archivo no crezca de más. Sus ✒️ obras
# maestras las arma el motor al cargar (engine/professions/rules.py masterwork_items; el bono de más por ranura está en
# balance.yaml masterwork.extra).
# Si cambias esto, revisa: tests/test_oficios_equipo.py (cada pieza tiene receta y supera al botín de su nivel),
# tests/test_balance_d110.py y tests/test_masterwork.py; los números mueven el balance de todas las clases (C-21).
