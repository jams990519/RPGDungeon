# Tunable numbers. Every change here goes to the balance log with its reason.
# [ES] Números de balance ajustables. Cada cambio se anota en el registro de balance con su motivo.
# Lo usan: engine/combat, engine/world, engine/service, engine/social (guild, D-97).

combat:
  stamina_max: 5          # [ES] Aguante máximo (fichas)
  crit_chance: 0.10
  crit_mult: 1.5
  damage_spread: [0.9, 1.1]
  partial_block: 0.3      # [ES] bloquear un golpe no bloqueable frena solo esto
  dodge_basic: 0.5        # [ES] 🌀 Esquivar básico: la mitad del daño
  flee_base: 0.55
  flee_per_initiative: 0.03
  flee_min: 0.2
  flee_max: 0.9
  toxicity_max: 100

travel:
  first_minutes: 1           # [ES] D-197 (confirmada): 1 minuto real por cuadro (10 cuadros = 10 minutos). Antes (D-78) 2 minutos las 2 primeras zonas
  steps_per_minute: 0        # [ES] D-197: 0 = cada zona tarda lo mismo, lejos o cerca. Con un número N, cada N zonas más lejos del Claro o de tu campamento sumaría 1 minuto (D-78 usaba 2: 2, 2, 3, 3, 4...)
  max_minutes: 20            # [ES] tope por zona si steps_per_minute vuelve a sumar minutos (con 0 no influye)
  level_per_lejania: 0.9     # [ES] nivel de la zona = 1 + Lejanía × esto

energy:                      # [ES] energía para toda acción fuera del combate (D-65, D-78)
  max: 50
  per_day: 40                # [ES] se recupera de a 1, repartido en el día (1 cada 36 min)
  per_move: 0                # [ES] D-190 (confirmada): moverse entre zonas no gasta energía, solo tiempo (antes 1 por zona, D-78). Subirlo vuelve a cobrar cada zona del viaje
  per_explore: 1             # [ES] cada exploración
  per_gather: 1              # [ES] cada recolección
  batch: [5, 10, 20, 40]     # [ES] D-87: cuánta energía gastar seguido al explorar o recolectar (más "todo"); moverse no va en lote
  version: 2                 # [ES] subirlo llena la energía de todos una vez (0.6.1: todos a 50). Nunca toca el progreso

invite:                      # [ES] invitar jugadores da energía (D-65): se paga apenas el invitado entra con el enlace y crea su héroe
  bonus_referrer: 1
  bonus_invited: 0
  reward_level: 1
  cap_factor: 2              # [ES] la energía extra puede llegar hasta 2 × el máximo

talents:                     # [ES] talentos por nivel (D-68, D-79): 1 punto por nivel en una especialización de tu clase
  # [ES] Puntos en una especialización para desbloquear sus 8 habilidades (D-79). Con todo en una sola,
  # la 4.ª llega al nivel 11, la 5.ª al 17, la 6.ª al 25, la 7.ª al 35 y la 8.ª al 47 (de 100 niveles).
  unlock: [1, 3, 6, 10, 16, 24, 34, 46]
  passive_cap: 50            # [ES] cuántos puntos por especialización cuentan para la mejora pasiva (tope +50 %)
  respec_cost_per_level: 10  # [ES] reiniciar la especialización cuesta 10 💰 por nivel (D-74)
  passive:                   # [ES] mejora por punto, según el rol (D-79: ~1 % por punto; antes 3 %, era demasiado)
    ataque: {attack: 0.01}               # [ES] +1 % de ataque por punto
    defensa: {hp: 0.0125, armor: 0.002}  # [ES] D-110: +1,25 % de vida por punto (antes 1 %) y +0,2 puntos de armadura por punto (nuevo) (+10 con 50 puntos, sin pasar gear.armor_cap). La defensa aguanta más a medida que sube; al nivel 6 (el Guardián) suma solo +1
    curacion: {hp: 0.0085, attack: 0.004} # [ES] repartido: +0,85 % de vida (D-110, antes 0,6 %) y +0,4 % de ataque: la curación es la que más vida deja al terminar
    soporte: {attack: 0.005, hp: 0.006}  # [ES] repartido: +0,5 % de ataque y +0,6 % de vida (D-110, antes 0,6 % y 0,4 %): el soporte queda entre el ataque y la defensa, también en la vida que le queda
  dual: {min_points: 10, cost_bags: 3}   # [ES] D-88: doble especialización: 10 puntos en tu especialización principal y 3 💰 bolsas

explore:
  minutes: 10
  encounter: 0.45
  item: 0.35                 # [ES] el resto es oro
  xp_per_step: 3             # [ES] pedido del dueño: explorar da experiencia en cada vuelta
  xp_full_zone: 15           # [ES] y un extra al dejar una zona explorada al 100 %
  around_radius: 1           # [ES] D-107: con tu zona al 100 %, explorar sigue con las casillas de alrededor (1 = las 8 vecinas) sin moverte
  arrival_encounter_scale: 1.0

explorer:                    # [ES] D-112 (confirmada): el oficio 🧭 Explorador (sube explorando) y lo que ve de más en el mapa según su rango (mapa-infinito-y-viaje.md §1.14). Su beneficio (+5 de exploración por vuelta al rango 100) está en content/professions.yaml. Números propuestos por Claude: se ajustan en la beta
  profession: explorador     # [ES] id del oficio en content/professions.yaml (estable: los héroes guardan su experiencia con este id)
  xp_per_step: 5             # [ES] experiencia de Explorador por cada vuelta de exploración...
  xp_full_zone: 6            # [ES] ...y un extra al dejar una zona al 100 %. Unos 6 por ⚡ en total, como refinar (6): rango 25 en ~3 semanas, 50 en ~3 meses, 100 en ~1 año dedicado (la curva es la de todos los oficios)
  ranks:                     # [ES] desde qué rango de Explorador se abre cada cosa (⚒️ Oficios muestra la lista)
    travel: 10               # [ES] ⏱️ 📒 Lugares lista hasta places_listed lugares con su tiempo, y el 🗺️ Mapa dice cuánto tardas a cada zona que marca (campamentos, guarida, tu campamento)
    recon: 10                # [ES] D-172: 🔭 Reconocer de lejos (/reconocer) las ❓ mazmorras y los 👹 campamentos hasta recon.range.recon zonas (1: las 8 vecinas)
    camps_near: 25           # [ES] 👹 ve los campamentos enemigos hasta near_radius zonas, aunque no los haya pisado
    infiltrate: 30           # [ES] 🕵️ Infiltrarse en un campamento enemigo
    recon_far: 30            # [ES] D-172: 🔭 Reconocer hasta recon.range.recon_far zonas (2)
    camps_all: 50            # [ES] 👹 ve los campamentos enemigos de todo su mapa (13 × 13, map_view.radius)
    recon_wide: 50           # [ES] D-172: 🔭 Reconocer hasta recon.range.recon_wide zonas (3)
    strength: 75             # [ES] 👹 ve desde el mapa la fuerza de cada campamento: cuántos enemigos quedan, de qué nivel y su jefe
    master: 100              # [ES] 🏅 título Gran Explorador
  base_sight: 1              # [ES] cualquiera ve los campamentos de su zona y de las 8 vecinas
  near_radius: 3             # [ES] desde el rango camps_near: hasta 3 zonas a la redonda (7 × 7)
  places_listed: 8           # [ES] desde el rango travel, 📒 Lugares lista hasta 8 lugares con su tiempo (sin ese rango, 3; los botones siguen siendo 3)
  map_lines: 4               # [ES] cuántos campamentos enemigos lista el mapa debajo de los cuadritos (los más cercanos)
  title: gran_explorador     # [ES] id del título del rango 100 (estable; se guarda en Hero.titles)
  stealth_max: 0.5           # [ES] D-172: 🥷 Sigilo nunca pasa de 50 % (el oficio da hasta 25 % al rango 100, perk stealth de content/professions.yaml, y la 🎓 🕵️ Infiltrado hasta 10 puntos más: 35 %)

recon:                       # [ES] D-172 (confirmada; números propuestos por Claude, se ajustan en la beta): 🔭 Reconocer de lejos con el 🧭 Explorador (mapa-infinito-y-viaje.md §1.14). Ves lo que hay en una ❓ mazmorra o un 👹 campamento enemigo sin ir: lo mismo que vería cualquiera que llegue ese día
  energy: 2                  # [ES] cada reconocimiento cuesta 2 ⚡ (no es una pelea, no te mueve y se puede hacer en medio de un lote). Uno por lugar y día
  range: {recon: 1, recon_far: 2, recon_wide: 3}   # [ES] hasta cuántas zonas a la redonda llega según el umbral de explorer.ranks que alcanzaste (10 → 1, 30 → 2, 50 → 3). Nunca tu propia zona: eso es 🕵️ Infiltrarse o entrar
  explorer_xp: 12            # [ES] experiencia de Explorador por reconocimiento: 6 por ⚡, como explorar (explorer.xp_per_step + xp_full_zone)
  hero_xp: 6                 # [ES] experiencia de héroe: la de 2 vueltas de explorar (explore.xp_per_step × 2), para que el ⚡ no rinda menos que explorando
  coins_per_level: 2         # [ES] premio en monedas: nivel del lugar × 2 🥉 (nivel 4: 8 🥉; nivel 40: 80 🥉), parecido a lo que dan 2 ⚡ de explorar en monedas. Sin objeto que se vende (P-120 sigue abierta)
  listed: 6                  # [ES] cuántos lugares lista la pantalla 🔭 (los más cercanos); botones: los 3 primeros sin reconocer hoy + ↩️ Volver

enemy_camps:                 # [ES] D-112 (confirmada): 👹 campamentos enemigos que cambian de lugar cada día (mapa-infinito-y-viaje.md §1.14). Números propuestos por Claude: se ajustan en la beta
  density: 0.03              # [ES] cada día, ~3 % de las zonas de Lejanía 2 o más tienen uno (en un mapa de 13 × 13, unos 4 o 5). Nunca en el Claro, la guarida ni el territorio de un campamento de jugadores, ni dos días seguidos en la misma zona. Cambiarlo mueve los campamentos del día
  min_lejania: 2             # [ES] desde qué Lejanía pueden salir
  garrison: [4, 8]           # [ES] cuántos enemigos tiene cada uno, contando al jefe (el último)
  level_bonus: 1             # [ES] la guarnición es del nivel de la zona + 1 (§6.2 de supervivencia: nunca más de + 2)
  chief_hp_mult: 1.8         # [ES] el jefe es el más fuerte del bioma, con 80 % más de vida...
  chief_attack_mult: 1.2     # [ES] ...y 20 % más de ataque: una versión élite, solo en esa pelea (la Noche de prueba usa 2,0 y 1,3, pensada para varios)
  fight_energy: 2            # [ES] cada pelea del asalto cuesta 2 ⚡, como una presa (D-108): ~22 de experiencia por ⚡ con el nivel + 1, y el cofre una vez por campamento. Nunca es automática (D-114)
  chest:                     # [ES] el cofre del que termina al jefe
    coins_per_level: 25      # [ES] monedas = nivel del campamento × 25 🥉 (nivel 4: 1 🥈; unas 15 peleas comunes)
    materials: [3, 5]        # [ES] unidades de los materiales que tiene la zona (según su peso)
    gear_chance: 0.5         # [ES] probabilidad de una pieza de equipo del nivel del campamento (el sorteo de botín de siempre, nunca equipo de artesano; las peleas comunes dan 15 %, y 10 % desde el nivel 10)
    xp: 60                   # [ES] experiencia del cofre, × (1 + 0,15 × (nivel − 1)) como matar (D-108)
  share:                     # [ES] lo que gana cada uno que peleó ahí ese día (ganó o perdió; huir no cuenta) cuando el campamento cae, menos el que lo termina (se lleva el cofre)
    coins_per_level: 8       # [ES] nivel × 8 🥉
    xp: 30                   # [ES] × (1 + 0,15 × (nivel − 1)): como una pelea más
  infiltrate:                # [ES] 🕵️ Infiltrarse (Explorador de rango explorer.ranks.infiltrate o más): no es una pelea
    energy: 3                # [ES] cuesta 3 ⚡
    detect_base: 0.45        # [ES] probabilidad de que te descubran en el rango 30...
    detect_per_rank: 0.005   # [ES] ...menos 0,5 puntos por cada rango más (rango 100: 10 %)...
    detect_min: 0.05         # [ES] ...y nunca menos de 5 %. Si te descubren, peleas con un guardia (a mano)
    explore_points: 10       # [ES] si sale bien, +10 % de exploración de esa zona (la única forma de explorarla mientras el campamento siga en pie)...
    explorer_xp: 15          # [ES] ...y 15 de experiencia de Explorador (5 por ⚡, como explorar). Una vez por campamento y día

dungeons:                    # [ES] D-164, D-170, D-171 (confirmadas): mazmorras para uno (mazmorras-y-bandas.md §0). Lugar fijo (semilla del mundo); lo de adentro cambia cada día: la familia que la llena (content/dungeons.yaml), su jefe, el camino y el botín. Números propuestos por Claude: se ajustan en la beta
  stretch: 6                 # [ES] el mapa se parte en tramos de 6 × 6 zonas; cada tramo tiene 2 o 3 entradas (D-181, D-182; en un mapa de 13 × 13, unas 10 a 12). Cambiarlo MUEVE las entradas (no borra nada: lo guardado es por héroe y por día)
  second_chance: 1.0         # [ES] D-181: todo tramo tiene una 2.ª entrada (antes 0.5: 1 o 2). Subirla solo agrega entradas: las que había no se mueven
  third_chance: 0.5          # [ES] D-181: probabilidad de una 3.ª entrada en el tramo ("2 o 3 por zona", entendido por tramo: E-126)
  min_lejania: 2             # [ES] desde qué Lejanía hay entradas (nunca en el Claro). Tampoco en la guarida ni en el territorio de un campamento de jugadores; un campamento enemigo en pie tapa la entrada ese día
  spacing: 1                 # [ES] dos entradas del mismo tramo nunca quedan pegadas (a 1 zona o menos)
  deep_share: 0.25           # [ES] 1 de cada 4 entradas es 🌀 profunda; las demás, 🕳️ chicas
  hint_radius: 2             # [ES] D-171: el 🗺️ Mapa marca ❓ una entrada si pisaste o estudiaste una zona a 2 o menos de ella; qué es (🕳️ o 🌀) lo sabes al pisar su zona o estudiarla desde la de al lado (explorar alrededor, D-107)
  level_bonus: 1             # [ES] la mazmorra es del nivel de su zona + 1, como los campamentos enemigos
  coin_unit: 4               # [ES] lo que suelta en monedas una pelea común de nivel 1, en promedio (4 🥉); sube 10 % por nivel como en el combate (coin_level_scale). Los cofres se cuentan en "peleas de monedas"
  coin_level_scale: 0.1      # [ES] el mismo 10 % por nivel que usa el combate para las monedas de cada victoria
  map_lines: 3               # [ES] cuántas entradas lista el 🗺️ Mapa debajo de los cuadritos (las más cercanas)
  small:                     # [ES] 🕳️ mazmorra chica (como los delves de Elder Scrolls Online): estructura fija, recompensa modesta
    rooms: 4                 # [ES] 4 salas y el jefe: 5 peleas, siempre las mismas cantidades (D-164)
    fight_energy: 2          # [ES] cada pelea cuesta 2 ⚡, como una presa o un asalto (D-108): 10 ⚡ toda la mazmorra. Nunca es automática (D-114)
    boss_hp_mult: 1.8        # [ES] el jefe: el más fuerte de la familia de hoy en ese nivel, con 80 % más de vida...
    boss_attack_mult: 1.2    # [ES] ...y 20 % más de ataque (como el jefe de un campamento enemigo)
    chest:                   # [ES] el cofre del jefe, una vez por mazmorra y día. Sin experiencia extra: la experiencia es la de las peleas (D-118)
      coin_fights: 1.5       # [ES] monedas de 1,5 peleas comunes de su nivel (nivel 4: 8 🥉; nivel 40: 29 🥉)
      materials: [1, 3]      # [ES] de 1 a 3 materiales de la familia de hoy (content/dungeons.yaml; D-165: también de otros oficios)
      gear_chance: 0.2       # [ES] 20 % de una pieza de equipo de su nivel de CUALQUIER clase y tipo (D-165: para vender a quien la use); nunca equipo de artesano
  deep:                      # [ES] 🌀 mazmorra profunda (como el Deep Dungeon de Final Fantasy XIV): pisos hacia abajo hasta donde aguantes. Son pisos de la mazmorra, no del mundo (D-58 sigue)
    enter_energy: 2          # [ES] entrar (una bajada nueva) cuesta 2 ⚡ además de la primera pelea
    fight_energy: 2          # [ES] cada pelea cuesta 2 ⚡, como en la chica
    two_fights_chance: 0.35  # [ES] desde el piso 2, cada piso tiene 1 pelea o, con esta probabilidad, 2 (sale del día: igual para todos)
    level_per_floor: 1       # [ES] cada piso más abajo, los enemigos suben 1 nivel...
    hp_per_floor: 0.05       # [ES] ...y tienen 5 % más de vida...
    attack_per_floor: 0.03   # [ES] ...y 3 % más de ataque por piso (piso 10: nivel + 9, +45 % de vida, +27 % de ataque)
    boss_every: 5            # [ES] cada 5 pisos, la última pelea es el jefe de la familia de hoy
    boss_hp_mult: 1.8        # [ES] el jefe de piso, encima de lo del piso: +80 % de vida...
    boss_attack_mult: 1.2    # [ES] ...y +20 % de ataque
    pot:                     # [ES] la bolsa de la bajada: se llena piso a piso y se cobra al salir
      coin_fights: 0.5       # [ES] cada piso despejado suma monedas de media pelea común de su nivel
      materials: 1           # [ES] y 1 material de la familia de hoy
      gear_chance: 0.3       # [ES] cada piso de jefe: 30 % de una pieza de cualquier clase y tipo (D-165)
    defeat_keep: 0.5         # [ES] si caes o huyes en una pelea, la bajada termina y te quedas con la mitad de la bolsa (lo que ganaste en cada pelea es tuyo igual). 🚪 Salir con lo ganado entre pelea y pelea se la lleva entera
    top_listed: 3            # [ES] cuántos muestra la lista 🏆 del día de cada mazmorra profunda

presence:                    # [ES] D-96 (provisional): ver a los otros jugadores de tu zona en 📍 Zona y cruzártelos al explorar o recolectar. Solo información: sin premio, sin pelea (mapa-infinito-y-viaje.md §1.13)
  minutes: 15                # [ES] un jugador "está" en la zona si tocó un botón en los últimos 15 min (o si su héroe explora, recolecta o duerme ahí, aunque tenga el chat cerrado)
  max_listed: 5              # [ES] cuántos nombres muestra 📍 Zona como mucho; el resto sale como "… y N más" (pantallas cortas, D-86)
  cross_chance: 0.15         # [ES] probabilidad, en cada vuelta de exploración o recolección sin pelea, de cruzarte con alguien que esté en tu zona (a cada uno, una vez por lote)

regen:
  hp_full_minutes: 240        # [ES] pedido del dueño: fuera de combate la vida vuelve sola, de 0 a llena en 4 horas
  downed_full_minutes: 500    # [ES] D-83: si caíste, mucho más lento (unas 8 horas) hasta llenar la vida, beber pociones o dormir en la posada

hero:
  start_gold: 10
  belt_slots: {pocion_vida: 3, venda: 2, pocion_mayor: 1, unguento: 2, botiquin: 1, vendaje_maestro: 1}     # [ES] cuánto cabe en el cinturón de cada cosa (D-109: 1 🍷 poción mayor, la hace la Alquimia; D-111: ungüentos, botiquín y vendaje de la Medicina)
  start_belt: {pocion_vida: 2, venda: 1}
  start_backpack: {pocion_vida: 2, venda: 2}
  backpack_capacity: 60      # [ES] D-87: espacio de la mochila (cada unidad ocupa 1; el cinturón y lo puesto no cuentan).
                             # [ES] D-90 (provisional): lo que encuentras nunca se pierde (botín, equipo, carne y hallazgos entran aunque pase de 60),
                             # [ES] pero con la mochila en 60 o más no se recolecta ni se compra hasta vender o usar cosas
  defeat_gold_loss: 0.1
  # [ES] Experiencia total para llegar al nivel N = base × (N − 1) ^ exponent (D-78). Con toda la energía
  # cada día, el nivel 100 llega en unos 2,5 años; quien juega menos tarda más. Nivel 10 en ~18 días, 20 en ~70.
  xp_formula: {base: 120, exponent: 2.35}
  xp_level_scale: 0.15       # [ES] D-108: la experiencia de matar y de recolectar sube 15 % por cada nivel de la zona o del enemigo (el mismo número que tenía el combate)
  max_level: 100             # [ES] D-78: 100 niveles por ahora

world:
  epoch: 2                   # [ES] NO TOCAR sin permiso explícito del dueño (D-64): subir este número BORRA el progreso de todos los jugadores. El reinicio a la época 2 fue el único autorizado

terrain:                     # [ES] D-186 (confirmada): el terreno del mapa es "como jugando Tetris": piezas de 4 zonas de distintas formas y colores, encajadas (engine/world/mapgen.py terrain_at, bloques de 4 × 4). Cambiar esto CAMBIA el terreno (enemigos y peligro) de zonas ya visitadas; los recursos no se mueven (D-185)
  climate_slope: 0.02        # [ES] cuánto se enfría cada zona hacia el norte (y positiva) y se calienta hacia el sur
  climate_strength: 3.0      # [ES] cuánto pesa el clima: los terrenos "cold" salen hasta 3 veces más al norte, los "hot" al sur

map_view:                    # [ES] el mapa de 🧭 Explorar → 🗺️ Mapa (pedido del dueño: tan ancho como el mensaje e igual de alto)
  radius: 6                  # [ES] 6 → 13 × 13 cuadritos; más de 6 puede partir las filas en teléfonos chicos (375 puntos)

resources:                   # [ES] D-87: regiones de recursos del mapa (cambiar escalas o umbrales mueve los recursos de un mundo ya creado)
  per_page: 8                # [ES] cuántos recursos muestra cada página de 📦 Recursos en la mochila
  region_scale: {madera: 5, piedra: 4, fibra: 3, hierba_curativa: 3, pieza_metal: 6, arcilla: 4}   # [ES] tamaño base de las manchas de cada recurso
  biome_bonus: 0.25          # [ES] cuánto ayuda el bioma (más madera en el bosque)
  threshold: 0.62            # [ES] desde qué fuerza un recurso aparece en la zona
  max_per_zone: 3            # [ES] una zona tiene de 1 a 3 recursos de base (los 6 de siempre: no cambian con D-180)
  fixed:                     # [ES] zonas con recursos fijos (no suman recursos del terreno ni nodos)
    "0:0": {madera: 1.0, fibra: 0.8}
  terrain:                   # [ES] D-180, D-183 (provisional; números propuestos por Claude): encima de los de base, cada zona suma recursos propios de su terreno (content/biomes.yaml "own"; catálogo de 10 a 15 por terreno). Sorteo propio: nunca mueve los de base
    add: [2, 3]              # [ES] cada zona suma 2 o 3 de los propios de su terreno...
    total: [4, 6]            # [ES] ...sin quedar con menos de 4 ni pasar de 6 recursos de tierra en total (con 1 de base suma 3; el agua va aparte)
    richness: [0.3, 1.0]     # [ES] riqueza de cada propio (cuánto sale al recolectar, como la de los de base)
    foreign_chance: 0.3      # [ES] D-185 (confirmada: "bastante aleatorio"; el número lo propuso Claude): cada recurso propio de la zona tiene 3 de 10 de salir del catálogo de OTRO terreno (árboles donde no deberían, sal en el bosque...)

exploration:                 # [ES] D-87: cada zona se explora por porcentaje
  per_step: [15, 30]         # [ES] cada exploración suma entre 15 % y 30 %
  reveal_at: [1, 20, 40, 60, 80, 100]   # [ES] con estos % se conoce el 1.º, 2.º, 3.º... recurso de la zona (D-183: hasta 6 de tierra; antes [1, 50, 100] para 3, y nadie conoce menos que antes); al 100 % se ve todo, también el 🐟 pescado (D-179: el mapa pinta el terreno, no el recurso)

stock:                       # [ES] D-87: los recursos de cada zona se agotan si se recolecta mucho, y vuelven con el tiempo
  per_unit: 0.02             # [ES] cada unidad recolectada baja el recurso un 2 % (50 unidades lo vacían)
  regen_per_hour: 0.02       # [ES] y vuelve un 2 % por hora (de vacío a lleno: unas 50 horas)
  min_yield: 0.15            # [ES] por debajo de esto, el recurso está agotado y no da nada

gather:                      # [ES] recolectar en la zona actual
  minutes: 8
  amount: [1, 3]             # [ES] unidades por recolección (más 1 cada 3 niveles de zona)
  encounter_scale: 0.4       # [ES] probabilidad de pelea = peligro del bioma × esto
  own_land_bonus: 1.5        # [ES] D-87: en el territorio de tu campamento recolectas un 50 % más
  xp_per_step: 14            # [ES] D-108: experiencia por recolección (× nivel de la zona, como matar): solo recolectando también se llega al nivel 100, al ritmo de explorar y cazar

nodes:                       # [ES] D-181 (confirmada) y D-184 (provisional; números propuestos por Claude, se ajustan en la beta): nodos de recursos del mapa (mapa-infinito-y-viaje.md §1.16). Lugar fijo (semilla del mundo), igual para todos; su tipo se descubre al llegar a su zona
  stretch: 6                 # [ES] el mapa se parte en tramos de 6 × 6 zonas (como las mazmorras)...
  count: [2, 3]              # [ES] ...y cada tramo tiene 2 o 3 nodos (D-171: "2 o 3 iconos de nodos por tramo"; en un mapa de 13 × 13, unos 10 a 12). Cambiar stretch, count o spacing MUEVE los nodos (lo descubierto queda guardado)
  spacing: 1                 # [ES] dos nodos nunca quedan pegados (a 1 zona o menos), tampoco entre tramos vecinos
  min_lejania: 1             # [ES] desde qué Lejanía hay nodos. Nunca en el Claro (ni en todo su territorio posible), la guarida del Guardián ni la entrada de una mazmorra; sí dentro del territorio de un campamento de jugadores (D-87: elegir zonas con buenos nodos)
  own_share: 0.6             # [ES] 6 de cada 10 nodos son de un recurso propio del terreno que trae la zona; los demás, del más fuerte de la zona (nunca del 🐟 pescado)
  yield_mult: 2.0            # [ES] E-124: cada unidad de su recurso que recolectas ahí vale 2 (rinde el doble)...
  stock_mult: 0.5            # [ES] ...y lo agota la mitad (cada recolección baja stock.per_unit × 0,5)...
  rare_chance: 0.05          # [ES] ...y cada vuelta de recolección ahí tiene 5 % de dar 1 material raro de su terreno (content/biomes.yaml node_rare: 💠 gema en bruto o 🌸 flor de luna), con sorteo propio
  hint_radius: 2             # [ES] el 🗺️ Mapa marca ✨ un nodo si recuerdas una zona a 2 o menos de él (como las cuevas); de qué es (el emoji de su recurso) lo sabes solo al LLEGAR a su zona (D-181), para siempre. Explorar alrededor y el 🔭 Reconocer no lo descubren (E-125 abierta)
  map_lines: 2               # [ES] cuántos nodos lista el 🗺️ Mapa debajo de los cuadritos (los más cercanos)

hunt:                        # [ES] D-106 (provisional): 🏹 Cazar en la zona (solo pelear: sin exploración ni recursos) y 🏹 Partida de caza con los miembros de tu campamento (cacerias.md §0). Números orientativos: se ajustan en la beta
  energy: 2                  # [ES] D-108 (confirmada): cada presa cuesta 2 de energía, así cazar da una experiencia por ⚡ parecida a explorar y recolectar (con 1, cazar llegaría al 100 el doble de rápido). La pelea en sí no gasta (D-78). No hay presas donde el bioma no tiene peligro (el Claro) ni en la guarida del Guardián
  party:                     # [ES] la partida de caza de un campamento de jugadores: solo suma un bono y una cuenta de presas; el combate sigue de 1 contra 1
    minutes: 30              # [ES] cuánto dura desde que se convoca (reloj perezoso: se cierra cuando un miembro del campamento juega después)
    bonus_per_companion: 0.10   # [ES] +10 % de experiencia y de probabilidad de botín en cada presa por cada otro cazador de la partida presente en la zona...
    bonus_cap: 0.30          # [ES] ...hasta +30 % (3 compañeros). Nunca toca las monedas
    prey_per_hunter: 3       # [ES] meta de presas entre todos = 3 × cazadores que se unieron (contando al menos 2)
    min_hunters: 2           # [ES] el premio del final pide al menos 2 cazadores: una partida de uno solo no lo da
    reward: {xp: 40, gold: 20}   # [ES] si juntan la meta, cada cazador con al menos 1 presa gana 40 de experiencia y 20 🥉 (chico: como una presa más)
  batch: [4, 10, 20, 40]     # [ES] D-114: con ⚔️ Peleas automáticas (⚙️ Opciones), cuánta energía gastar cazando en lote (más "todo"); cada presa cuesta hunt.energy, así 4 = 2 presas y 40 = 20
  batch_minutes: 16          # [ES] D-114: cuánto tarda cada presa del lote (8 min por ⚡, como recolectar). Cazar de a una presa, a mano, sigue siendo enseguida

settlement:                  # [ES] D-98: el Claro es el campamento base y NO crece. La etapa guardada queda fija (decide la posada y las zonas del Claro); "needs" ya no se usa y queda solo como historia. No borrar: los ids de etapa son estables
  stages:                    # [ES] lo que pide cada etapa para subir a la siguiente
    - {id: fogata, needs: {madera: 40, fibra: 30}}
    - {id: campamento, needs: {madera: 120, fibra: 80, piedra: 60}}
    - {id: aldea, needs: {madera: 300, piedra: 250, fibra: 150, pieza_metal: 40}}
    - {id: pueblo, needs: {madera: 700, piedra: 600, pieza_metal: 150, hierba_curativa: 100}}
    - {id: ciudad, needs: {madera: 1500, piedra: 1500, pieza_metal: 400, fibra: 600}}
    - {id: castillo, needs: {}}
  inn_discount_per_stage: 1  # [ES] cada etapa baja 1 💰 la posada (mínimo 1)

tutorial:                     # [ES] D-193: el tutorial viejo ya no se muestra ni avanza (lo reemplazó el camino guiado, bloque guide). Queda para leer Hero.tutorial de los héroes de antes: quien llegó a len(steps) lo terminó y se salta el camino básico (E-133). No borrar ni reordenar
  reward_gold: 5
  reward_xp: 20
  steps: [explore_claro, gather, sell, leave_claro, win_fight, heal, use_places]   # [ES] D-98: "sell" (vender al mercader) reemplazó a "donate" (la obra del Claro ya no existe); el índice de cada héroe no cambia

guide:                        # [ES] D-190 (confirmada) y D-193 (provisional): el camino guiado (pasos y avisos en content/guide.yaml, textos en es_guia.yaml). Números propuestos por Claude: se ajustan en la beta
  reward_gold: 5              # [ES] 🥉 de cada paso con premio (como el tutorial viejo): 10 pasos con premio = 50 🥉
  reward_xp: 20               # [ES] experiencia de cada paso con premio (× el acelerador de 💎): 10 pasos = 200, el nivel 2 (pide 120) y algo más
  veteran_level: 5            # [ES] E-133: un héroe de antes de la 0.29 con este nivel o más (o con el tutorial viejo terminado) se salta el camino básico, sin premio, y sigue recibiendo los avisos nuevos
  found_moves: 2              # [ES] D-190: zonas que hay que pisar fuera del Claro, después del camino básico, antes de "encontraste un buen lugar para tu campamento" (además, el lugar tiene que servir: camps.min_lejania, camps.min_distance)
  energy_low: 10              # [ES] el aviso ⚡ de energía baja sale la primera vez que te quedan esto o menos
  options_kills: 3            # [ES] el aviso ⚙️ de las peleas automáticas sale al llegar a esta cantidad de peleas ganadas (después del paso 🏹 Cazar)

camps:                       # [ES] campamentos que fundan los jugadores lejos del Claro (D-71)
  found_cost: {madera: 20, piedra: 10}
  known_neighbors: 4         # [ES] zonas conocidas de las 8 de alrededor para poder fundar
  min_lejania: 2             # [ES] no se funda pegado al Claro
  min_distance: 2            # [ES] distancia mínima a otro campamento
  stages:                    # [ES] D-87: nombre del campamento según su nivel, hasta castillo
    - {id: campamento, from_level: 1}
    - {id: aldea, from_level: 3}
    - {id: pueblo, from_level: 5}
    - {id: ciudad, from_level: 7}
    - {id: castillo, from_level: 9}
  members_base: 2             # [ES] D-84: miembros que caben en un campamento de nivel 1 (contando al fundador)
  members_per_level: 2        # [ES] cada nivel más deja entrar a 2 personas más
  grow_cost_per_level: {madera: 15, piedra: 10, fibra: 5}   # [ES] D-81: agrandar cuesta esto × el nivel actual; cada nivel suma 1 zona
  chests_from_level: 6       # [ES] D-92 (provisional): agrandar DESDE este nivel también cuesta 🪎 cofres (6→7 es el primero; ciudad y castillo)
  chests_per_level: 1        # [ES] cofres = esto × (nivel actual − chests_from_level + 1): 6→7 pide 1, 7→8 pide 2, 8→9 pide 3 (6 hasta castillo).
                             # [ES] Los paga de sus cofres (hero.chests) el miembro que agranda. Subirlo encarece mucho los campamentos grandes (cada cofre = 10 bolsas)

pantry:                      # [ES] D-93 (provisional): la despensa de los campamentos de jugadores, 1.ª parte de "construir no alcanza" (supervivencia-del-asentamiento.md §0.4, §7.2). El Claro no se mantiene: no tiene dueño (D-95). Números orientativos: se ajustan en la beta
  camp_from_level: 3         # [ES] los campamentos de jugadores, desde el nivel 3 (aldea): despensa chica, capa ligera (§7.2)
  ration_per_day: 1          # [ES] cada residente activo come 1 ración por día real (§4.2)
  active_hours: 24           # [ES] "activo" = tocó un botón en las últimas 24 horas; quien no juega no come (§15.3)
  active_refresh_minutes: 60 # [ES] cada cuánto se renueva la marca de "activo" de un héroe en el registro compartido (ahorra escrituras; margen de 1 hora)
  start_days: 7              # [ES] una despensa nueva empieza con 7 días de comida para todos los miembros del campamento (también al llegar el parche: nadie empieza castigado)
  states: {abundancia: 14, holgada: 7, justa: 3, escasez: 1, hambruna: 0}   # [ES] desde cuántos días enteros de comida rige cada estado; hambruna = menos de 1 día (el campamento no crece)
  xp_per_ration: 2           # [ES] experiencia por cada ración aportada a la despensa del campamento (como settlement.xp_per_unit por material)
  merit_per_ration: 1        # [ES] mérito por cada ración aportada (como la obra común: 1 por material)

raids:                       # [ES] D-99 (provisional): incursiones de los campamentos de jugadores, 2.ª parte de "construir no alcanza" (supervivencia-del-asentamiento.md §0.5, §7.2). El Claro nunca tiene: es el campamento base (D-95, D-98). Números orientativos: se ajustan en la beta
  from_level: 1              # [ES] D-105: desde que fundas el campamento (nivel 1) llega una oleada por semana, con aviso al fundarlo (antes: desde pueblo, nivel 5)
  per_week: 3                # [ES] D-154 (confirmada, entrevista E-38): oleadas por semana real (antes 1 cada 7 días; quizás 5 más adelante). El intervalo es 7 / per_week días (~2 días y 8 horas). Reloj perezoso: llega cuando un miembro juega después de esa hora
  window_minutes: 60         # [ES] cuánto dura el aviso: en ese tiempo cada miembro puede tocar 🛡️ Defender y pelear UNA vez
  grace_minutes: 15          # [ES] si al cerrar la ventana alguien sigue peleando, se lo espera hasta esto para que su pelea cuente
  required_share: 0.5        # [ES] victorias necesarias = la mitad de los miembros activos al llegar, redondeado hacia arriba...
  min_wins: 1                # [ES] ...y nunca menos de 1
  loss_share: 0.25           # [ES] si no alcanzan, la despensa pierde el 25 % de sus raciones y nada más (§7.2, §15)
  enemy_level_bonus: 1       # [ES] el enemigo es del bioma del campamento, con el nivel de su zona + 1 (§6.2: nunca más de + 2)
  defense_weaken_per_point: 0.04   # [ES] D-101: cada punto de 🛡️ Defensa de las mejoras les quita 4 % de vida y de ataque a los atacantes (11 puntos: 44 % menos). Vale también para la Noche de prueba
  defense_floor: 0.5         # [ES] nunca les quita más de la mitad: defender sigue siendo pelear
  night: {from_hour: 19, to_hour: 6, utc_offset_hours: -5}   # [ES] horas de noche para los 🔥 Braseros (+1 de defensa si la oleada llega de noche). Hora de América (UTC−5), provisional hasta que haya día y noche en el mundo
  reward: {xp: 80, gold: 30} # [ES] si se defiende, cada defensor gana 80 de experiencia y 30 🥉, además del premio normal de su pelea
  trial:                     # [ES] Noche de prueba: la incursión grande antes de castillo (§7.2). Si se pierde no se pierde nada
    to_level: 9              # [ES] crecer a este nivel pide haberla ganado (tiene que coincidir con castillo en camps.stages)
    required_share: 0.5      # [ES] la mitad de los miembros activos de hoy, redondeado hacia arriba...
    min_wins: 2              # [ES] ...y nunca menos de 2 victorias de miembros distintos: el castillo se gana en conjunto
    retry_days: 2            # [ES] si se pierde, se puede volver a convocar a los 2 días (§7.2)
    enemy_level_bonus: 2     # [ES] el enemigo más fuerte del bioma, con el nivel de la zona + 2 (el tope de §6.2)...
    enemy_hp_mult: 2.0       # [ES] ...el doble de vida...
    enemy_attack_mult: 1.3   # [ES] ...y 30 % más de ataque: una versión élite, solo en esa pelea
    reward: {xp: 200, gold: 100}   # [ES] si la ganan, cada defensor gana 200 de experiencia y 100 🥉 (1 🪙)

shop:                        # [ES] mercader del Claro
  sells: [pocion_vida, venda, provisiones]   # [ES] D-93: 🥖 provisiones, comida de emergencia cara (sumidero de monedas, §15.8)
  sell_ratio: 0.5            # [ES] compra materiales a la mitad de su precio
  weekly_cap: {provisiones: 20}   # [ES] D-125 (confirmada, entrevista E-09): cada jugador compra como mucho 20 🥖 provisiones por semana real; la despensa la llenan los oficios (cocina, caza, pesca). Se cuenta en el store "shop_week"

currency:                    # [ES] monedas (D-80, D-85, D-92): 3 comunes que se ganan, bolsas que se cosen, cofres que se arman, diamantes que se compran y credenciales de oficio
  rate: 100                  # [ES] 100 🥉 bronce = 1 🥈 plata; 100 🥈 = 1 🥇 oro. Hero.gold guarda TODO en bronce
  icons: {bronze: "🥉", silver: "🥈", gold: "🥇", bags: "💰", chests: "🪎", gems: "💎", cards: "🪪"}   # [ES] D-85: los iconos que eligió el dueño (🪎 cofre desde D-92; el 💵 billete no entra, P-73)
  bag_recipe: {fibra: 4, pieza_metal: 1}   # [ES] hilo (fibra) y un cierre de metal...
  bag_coins: 100             # [ES] ...más 1 🥈 de plata por bolsa: saca monedas y materiales del juego
  chest_recipe: {bags: 10, madera: 10, pieza_metal: 5}   # [ES] D-92 (provisional): un 🪎 cofre se arma en el Claro con 10 💰 bolsas (salen de hero.bags)
                             # [ES] y madera y metal de la mochila. Paga el crecimiento de los campamentos grandes (camps.chests_from_level). Sumidero grande:
                             # [ES] 1 cofre = 40 de fibra, 15 de metal, 10 de madera y 10 🥈 de plata
  banner_phase: beta         # [ES] el estandarte que se compra ahora es el de beta tester; después de la beta pasar a "premium"
  gem_shop:                  # [ES] D-43: con gemas solo cosméticos y aceleradores, nunca poder
    xp_boost: {gems: 100, xp_mult: 1.5, days: 7}   # [ES] +50 % de experiencia por 7 días (P-66)
    banner: {gems: 150}      # [ES] estandarte único al lado de tu nombre

gear:                        # [ES] equipo y botín (D-77). Capa simple: 7 ranuras, 4 tipos de armadura, 4 de arma; piezas cada 10 niveles hasta el 100 (D-110)
  slots: [arma, cabeza, armadura, manos, piernas, pies, joya]   # [ES] D-83: armadura = pecho
  off_type_factor: 0.5       # [ES] D-83: puedes ponerte lo que quieras; si no es de tu clase rinde la mitad
  armor_cap: 0.6             # [ES] la defensa total nunca pasa de 60 %
  armor_by_group:            # [ES] qué armadura usa cada clase (como en WoW)
    guerrero: placas
    paladin: placas
    caballero_muerte: placas
    cazador: malla
    chaman: malla
    evocador: malla
    picaro: cuero
    druida: cuero
    monje: cuero
    cazador_demonios: cuero
    bardo: cuero
    sacerdote: tela
    mago: tela
    brujo: tela
    nigromante: tela
  weapons_by_group:          # [ES] qué armas usa cada clase; la primera es la del equipo inicial
    guerrero: [espada]
    paladin: [espada, baston]
    caballero_muerte: [espada]
    cazador: [arco, daga]
    chaman: [baston]
    evocador: [baston]
    picaro: [daga, espada]
    druida: [baston, daga]
    monje: [baston, daga]
    cazador_demonios: [espada, daga]
    bardo: [espada, daga]
    sacerdote: [baston]
    mago: [baston]
    brujo: [baston]
    nigromante: [baston, daga]
  rarity_icon: {comun: "⚪", poco_comun: "🟢", raro: "🔵", epico: "🟣"}
  rarity_weight: {comun: 6, poco_comun: 3, raro: 1.2, epico: 0.4}   # [ES] lo raro sale menos
  drop_chance: 0.15          # [ES] probabilidad de soltar una pieza en cada victoria
  high_level_drop: {from_level: 10, chance: 0.10}   # [ES] D-110/D-113 (nuevo): contra enemigos desde el nivel 10 el botín suelta menos (10 % en vez de 15 %) y como mucho 🔵 raro; lo mejor de cada nivel lo fabrican los jugadores (items.yaml, equipo de artesano). Hasta el 9 sigue en 15 %: el artesano todavía no llega
  for_you_chance: 0.7        # [ES] de las piezas que caen, cuántas son de tu tipo (botín "para ti")
  level_window: [4, 1]       # [ES] piezas con nivel requerido entre (nivel del enemigo − 4) y (+1); si la ventana cae entre dos niveles de pieza (van cada 10 desde el 10, D-110), salen las del nivel de pieza más cercano por debajo (engine/hero/gear.py roll_gear)
  start_tier: 1              # [ES] equipo inicial: arma y armadura de tu tipo, nivel 1, ya puestas
  score: {attack: 1, hp: 1, armor: 2}   # [ES] D-115 (fase 2): el puntaje de una pieza para decir si es "⬆️ mejor" que la que llevas: ataque % + vida % + 2 × defensa
                             # [ES] (lo que la pieza te da de verdad: la mitad si no es de tu tipo, más su ✨ encantamiento). La defensa pesa doble: 1 punto de defensa
                             # [ES] quita daño en cada golpe. Es el mismo puntaje que ya usaba la comparación "⬆️/⬇️ Frente a lo que llevas" (engine/hero/gear.py gear_score)

inn:                         # [ES] posada del Claro: pagas, duermes y despiertas con la vida llena
  price: 4
  minutes: 5

guardian:                    # [ES] D-82: el primer Guardián de región (capa simple, en solitario por ahora)
  enemy: raigambre           # [ES] id en enemies.yaml (vida, golpes y fases)
  x: 5                       # [ES] su guarida: Lejanía 5, anillo II (mapa-infinito-y-viaje.md recomienda Lejanía 4-6)
  y: 2
  biome: bosque              # [ES] la guarida siempre es bosque, sea cual sea la semilla del mundo
  cooldown_hours: 24         # [ES] después de vencerlo, cada héroe espera esto para volver a desafiarlo (horas reales)
  repeat_gear_chance: 0.5    # [ES] victorias repetidas: probabilidad de una pieza de botín normal (en peleas comunes: gear.drop_chance)
  memento_source: guardian   # [ES] el Recuerdo se cambia por una pieza con este "source" en items.yaml

guild:                       # [ES] D-97 (provisional): el gremio de un campamento de jugadores (capa simple). Sus miembros son los del campamento. Números orientativos: se ajustan en la beta
  found_coins: 50            # [ES] crear el gremio cuesta 50 🥉 al fundador del campamento (sumidero chico)
  castle_min_level: 5        # [ES] para que el campamento pase a castillo (nivel 8 → 9) su gremio tiene que ser de nivel 5 o más...
  castle_min_members: 10     # [ES] ...y tener 10 miembros o más. Sin gremio, un campamento no llega a castillo
  levels:                    # [ES] cupo de miembros de cada nivel y lo que tienen que hacer entre todos, después de entrar, para subir al siguiente (~×1,6 por nivel). Lo que sobra pasa al nivel siguiente
    - {capacity: 4, needs: {explorations: 40, victories: 20, gathered: 100}}     # [ES] nivel 1 → 2
    - {capacity: 6, needs: {explorations: 65, victories: 32, gathered: 160}}     # [ES] nivel 2 → 3
    - {capacity: 8, needs: {explorations: 100, victories: 50, gathered: 260}}    # [ES] nivel 3 → 4
    - {capacity: 12, needs: {explorations: 165, victories: 80, gathered: 410}}   # [ES] nivel 4 → 5 (el mínimo para castillo)
    - {capacity: 16, needs: {explorations: 260, victories: 130, gathered: 650}}  # [ES] nivel 5 → 6
    - {capacity: 20, needs: {explorations: 420, victories: 210, gathered: 1050}} # [ES] nivel 6 → 7
    - {capacity: 25, needs: {explorations: 670, victories: 335, gathered: 1680}} # [ES] nivel 7 → 8
    - {capacity: 30, needs: {}}                                                  # [ES] nivel 8: el último por ahora. Solo se agregan niveles al final

upgrades:                    # [ES] D-101 (provisional): las 🔨 Mejoras de los campamentos de jugadores (catálogo, costos y efectos en content/camp_upgrades.yaml). El Claro no tiene: no crece (D-98). Números orientativos: se ajustan en la beta
  castle_min_built: 15       # [ES] para pasar del nivel 8 al 9 (castillo) el campamento necesita 15 mejoras construidas o más (hay 20). Se suma a la despensa, los 🪎 cofres y el gremio (D-97). Los castillos que ya existen siguen creciendo
  xp_per_unit: 1             # [ES] experiencia por cada material aportado a una obra o a un estudio del 📚 Conocimiento (las monedas no dan). La obra del Claro daba 2
  merit_per_unit: 1          # [ES] mérito por cada material aportado (como la obra común: 1 por material)
  open_shown: 3              # [ES] cuántas obras abiertas, con su barra de avance, muestra la pantalla 🔨 Mejoras (todas se ven en 🔨 Obras, de a 2 o 3 por página)

professions:                 # [ES] D-109: oficios encadenados, fase 1 (recolectar → refinar → fabricar; catálogo y recetas en content/professions.yaml). Sin tope de oficios (D-57). Números propuestos por Claude: se ajustan en la beta
  # [ES] Experiencia de oficio total para el rango R = base × (R − 1) ^ exponent. Rango 10: 729 · 25: 5.184 · 50: 21.609 · 100: 88.209.
  # [ES] Quien dedica toda su energía a un oficio de refinado o fabricación junta ~240 por día (6 por ⚡): rango 25 en ~3 semanas,
  # [ES] 50 en ~3 meses y 100 en ~1 año (profesiones.md §4: Gran Maestro en un año de juego constante). Recolectando, 1 por unidad.
  rank_formula: {base: 9, exponent: 2.0}
  max_rank: 100              # [ES] rango máximo de cada oficio (profesiones.md §4)
  trade_xp_per_coin: 1       # [ES] D-116: 💱 Comercio sube 1 de experiencia por cada 🥉 que cobras vendiendo (la venta base, sin el beneficio)
  gather_xp_per_unit: 1      # [ES] experiencia de oficio por unidad recolectada (o sacada de una bestia, el desollador)
  rank_yield: 0.003          # [ES] cada rango suma 0,3 % de sacar 1 unidad más por unidad recolectada o por vez refinada: rango 50 = 15 %, rango 100 = 30 %
  rare_chance: 0.05          # [ES] desde su rango (professions.yaml "rare", hoy 10), probabilidad por vuelta de recolección con materiales del oficio de encontrar el raro...
  rare_per_rank: 0.0015      # [ES] ...más esto por cada rango arriba de ese: rango 10 = 5 %, 50 = 11 %, 100 = 18,5 %
  hero_xp_per_energy: 20     # [ES] D-108: experiencia de héroe por cada ⚡ al refinar o fabricar, × (1 + 0,15 × (nivel − 1)), con nivel = el menor entre tu nivel
                             # [ES] y tu rango en ese oficio. Recolectar da 14 por ⚡ más las peleas (~20 en promedio): fabricar lleva al 100 en ~2 años, como los otros caminos
  camp_bonus: 0.10           # [ES] D-101: en las estaciones de tu campamento (🧵 Taller, 🔨 Herrería), +10 % de sacar 1 unidad más al refinar
  per_page: 2                # [ES] recetas por página en 🪚 Refinar y 🛠️ Fabricar cuando hay más de 3 (4 botones como mucho, D-75)
  make_batch: 5              # [ES] ya no se usa en la receta (D-189: make_amounts); queda por compatibilidad
  make_amounts: [1, 5, 10, 20]   # [ES] D-189 (confirmada): botoncitos de cantidad de cada receta, uno al lado del otro (más "Todo" si alcanza para más)

masterwork:                  # [ES] D-116 (confirmada): ✒️ obra maestra. Al fabricar una pieza de equipo puede salir exclusiva: mejor y con la firma de quien la hizo (profesiones.md §0.4). Números propuestos por Claude: se ajustan en la beta
  # [ES] La probabilidad crece pareja con el rango del oficio que fabrica (rango 50 = la mitad). La 🪑 Carpintería usa su beneficio
  # [ES] (content/professions.yaml perk {masterwork: 0.15}: hasta 15 % en sus arcos y bastones); los demás oficios que hacen equipo, esta base.
  base_chance: 0.05          # [ES] Herrería, Sastrería, Peletería y Joyería: hasta 5 % por pieza al rango 100 (rango 50: 2,5 %). Las pociones y los muebles nunca
  stat_bonus: 0.10           # [ES] la obra maestra da 10 % más en cada bono de la pieza (ataque 0,39 → 0,429)...
  extra:                     # [ES] ...y un bono más según la ranura (se suma): las armas ganan defensa (no la tienen), las armaduras ataque y las joyas vida
    arma: {armor: 0.01}      # [ES] +1 de defensa
    armadura: {attack: 0.02} # [ES] +2 % de ataque
    joya: {hp: 0.02}         # [ES] +2 % de vida
    cabeza: {attack: 0.01}   # [ES] D-115 (fase 2): cabeza, piernas y pies de artesano ganan +1 % de ataque (la mitad que el pecho: son piezas chicas)...
    piernas: {attack: 0.01}
    pies: {attack: 0.01}
    manos: {armor: 0.01}     # [ES] ...y las manos, que ya dan ataque y vida, +1 de defensa
  price_mult: 1.25           # [ES] el mercader paga 25 % más por una obra maestra que por la pieza normal. Con la probabilidad más alta (15 %) vender
                             # [ES] todo lo fabricado rinde en promedio ~3,7 % más; la pieza normal ya vale casi lo mismo que sus materiales (tests/test_masterwork.py)

specs:                       # [ES] D-115 y D-141 (confirmada): 🎓 especializaciones de oficio (red-de-oficios.md §3). Cada oficio tiene 3 (content/professions.yaml "specs"); una al rango 25, otra al 75, nunca las tres. Números propuestos por Claude: se ajustan en la beta
  slots_at: [25, 75]         # [ES] desde qué rango del oficio se abre cada lugar de especialización: la 1.ª al 25, la 2.ª al 75 (nunca una 3.ª: siempre hace falta otro jugador)
  mastery_xp: 7200           # [ES] dominio: la experiencia de oficio que ganas en ese oficio mientras tienes la especialización. Con 7.200 llega al 100 % (~1 mes dedicado, a ~240 por día) y su efecto
                             # [ES] crece parejo de 0 al valor completo. Cambiar de especialización es empezar de cero en la nueva (el dominio de la vieja queda guardado por si vuelves)
  recipe_mastery: 0.25       # [ES] las recetas exclusivas de una especialización se abren con 25 % de dominio (~1 semana dedicada) y el rango que pide la receta
  switch_cost: {base: 100, per_rank: 20}   # [ES] P-105 (recomendación: monedas que suben con el rango): cambiar una especialización por otra cuesta 100 🥉 + 20 🥉 por rango del oficio
                             # [ES] (rango 25: 6 🥈; 50: 11 🥈; 75: 16 🥈; 100: 21 🥈). Elegir la 1.ª (rango 25) y la 2.ª (rango 75) no cuesta nada
  per_page: 2                # [ES] oficios por página en 🎓 Especialización cuando hay más de 3 (4 botones como mucho, D-75)

auto_fight:                  # [ES] D-114 (confirmada): ⚙️ Opciones de cada jugador y peleas automáticas en los lotes (mapa-infinito-y-viaje.md §1.12.1). Números propuestos por Claude: se ajustan en la beta
  defaults: {fights: manual, retreat: 30, potions: true}   # [ES] lo que tiene cada héroe hasta que lo cambia (también los guardados antes): ✋ Manual (el lote se corta y peleas tú), retirarse con menos de 30 % de vida (D-119, entrevista E-02; antes 50), sí usar pociones
  retreat_choices: [30, 50, 70]   # [ES] 🩹 Retirarse con menos de: el botón va pasando por estos % de vida. Al terminar una pelea automática por debajo, el lote se corta; si una pelea sale con la vida ya por debajo, el héroe no pelea solo y la pelea te espera
  max_rounds: 60             # [ES] una pelea automática que no termina en 60 rondas se deja (sin premio ni castigo); el simulador juega 60 (120 contra el Guardián)
  policy:                    # [ES] la forma de jugar "básica pero atenta" (engine/combat/auto.py). La usa también tools/sim.py: cambiar un número cambia todos los números del simulador
    heal_below: 0.45         # [ES] con menos de 45 % de vida usa su habilidad de curar
    potion_below: 0.35       # [ES] con menos de 35 % bebe una poción del cinturón (si 🧪 Pociones está en sí)
    bandage_below: 0.30      # [ES] con menos de 30 % se pone una venda (solo jugando atento, como en las peleas automáticas)
    big_hit: 1.5             # [ES] un golpe avisado con más de 1,5 de potencia es "grande": lo corta, lo esquiva, lo bloquea o se escuda
    dodge_hit: 2.0           # [ES] contra un golpe de 2 o más sin respuesta en la barra, usa 🌀 Esquivar (atento)
    hot_below: 0.8           # [ES] renueva su curación lenta con menos de 80 %
    heal_late_below: 0.6     # [ES] si no hay nada mejor que hacer, se cura con menos de 60 %
    finisher_combo: 3        # [ES] remata con 3 puntos de combo o más

story:                       # [ES] D-117 (provisional): historia y rol, capa simple (historia-y-rol.md §1; misiones, personajes y encargos en content/story.yaml). Números propuestos por Claude: se ajustan en la beta
  xp_per_energy: 20          # [ES] experiencia de una misión por cada ⚡ que pide (story.yaml "energy"), × (1 + 0,15 × (nivel de la misión − 1)), como matar (D-108).
                             # [ES] Es lo mismo que da explorar por ⚡ (~20): mientras haces la historia rindes el doble, pero cada misión se cobra una sola vez.
                             # [ES] El Capítulo 1 (57 ⚡, ~1.500 de experiencia) y un origen (15-18 ⚡, ~400) suman ~1.900: un 16 % de lo que pide el nivel 8 (no es un atajo)
  task_xp_per_energy: 10     # [ES] los encargos del tablón pagan la mitad por ⚡ (se repiten cada día) y escalan con el nivel del héroe: 3 al día suman ~+15 % al ritmo de un día entero de juego
  task_coins_per_level: 0.1  # [ES] las monedas del encargo suben 10 % por nivel del héroe (como el oro de las peleas)
  camp_tasks: 2              # [ES] encargos de campamento por semana (entre todos los miembros); premio en story.yaml camp_tasks
  ranks:                     # [ES] rangos de reputación con cada facción: desde cuántos puntos rige cada uno. Ids estables (los premios de rango los usan)
    - {id: mal_visto, from: -1000000}   # [ES] menos de 0: la facción te mira con desconfianza (los personajes lo dicen); no quita nada
    - {id: desconocido, from: 0}
    - {id: conocido, from: 100}         # [ES] se llega en el Capítulo 1 con la facción que más ayudaste
    - {id: apreciado, from: 300}        # [ES] encargos: +10 por encargo, uno por facción al día → ~3-4 semanas
    - {id: honrado, from: 700}
    - {id: heroe, from: 1500}           # [ES] meta larga: varios meses de encargos con esa facción (el juego es largo por la historia, D-117)
  bio_max: 200               # [ES] largo máximo de la biografía que escribes con /bio (en caracteres)
  toast_max: 80              # [ES] largo máximo del brindis de /brindar
  journal_max: 200           # [ES] entradas que guarda el 📔 Diario de cada héroe (las más viejas se borran)
  journal_shown: 12          # [ES] entradas que muestra 📔 Diario (las últimas)
  card_shown: 5              # [ES] entradas en la tarjeta que ven los demás (/diario <nombre> y 📣 Mostrar)
  gesture_seconds: 60        # [ES] /saludar, /brindar y 📣 Mostrar: una vez por minuto como mucho (no llenar el chat de nadie)
  emblem_min_rank: 5         # [ES] desde qué rango de oficio aparece el emblema del oficio junto a tu nombre (🩺 Lyra)
  npc_page: 3                # [ES] personajes por página en 🧑 Personajes (4 botones como mucho, D-75)
  origin_page: 3             # [ES] orígenes por página al elegir el tuyo (4 botones como mucho)

enchanting:                  # [ES] D-115 (fase 2 de la red de oficios, lado del equipo; provisional): ✨ Encantamiento (profesiones.md §0.5). Desencantar destruye una pieza de equipo y da esencias (el gran sumidero de equipo); encantar gasta esencias y un material de otro oficio para darle a una pieza un bono chico. Números propuestos por Claude: se ajustan en la beta
  profession: encantamiento  # [ES] id del oficio en content/professions.yaml (su experiencia va en Hero.professions; su beneficio {disenchant} da hasta +30 % de esencias al rango 100)
  essence: esencia           # [ES] id de la ✨ esencia (content/items.yaml): sale de toda pieza desencantada
  major_essence: esencia_mayor   # [ES] id de la 🔮 esencia mayor: sale solo de piezas 🟣 épicas
  disenchant:
    energy: 1                # [ES] ⚡ por pieza desencantada (D-78: toda acción fuera del combate gasta energía), como refinar
    xp: 6                    # [ES] experiencia de oficio por pieza (6 por ⚡, como los demás oficios)
    by_rarity: {comun: 1, poco_comun: 2, raro: 3, epico: 4}   # [ES] ✨ esencias por pieza según su rareza...
    per_levels: 20           # [ES] ...+1 por cada 20 niveles de la pieza (una 🔵 rara del nivel 100 da 8; una 🟣 épica del nivel 100, 9)
    major_rarities: [epico]  # [ES] las piezas 🟣 épicas (artesano desde el nivel 8, ✒️ obras maestras, las del Guardián) dan además 1 🔮 esencia mayor
  enchant:
    energy: 2                # [ES] ⚡ por encantamiento, como fabricar una pieza
    xp: 12                   # [ES] experiencia de oficio por encantamiento
    essences: 3              # [ES] ✨ esencias que pide encantar una pieza...
    essences_per_levels: 10  # [ES] ...+1 por cada 10 niveles de la pieza (nivel 1: 3; nivel 50: 8; nivel 100: 13)
    major_from_level: 50     # [ES] las piezas de nivel 50 o más piden también 1 🔮 esencia mayor (sale solo de piezas épicas: el encantador necesita al artesano)
    material_per_levels: 50  # [ES] del material de cada encantamiento pide 1, +1 por cada 50 niveles de la pieza (nivel 100: 3)
  enchants:                  # [ES] uno por ranura (capa simple: la ranura decide cuál, el jugador no elige). El valor sale de tu rango al encantar, parejo de min (rango 1) a max (rango 100) en puntos enteros, y queda guardado
                             # [ES] en la pieza (Hero.gear_enchants). Con las 7 ranuras encantadas al rango 100: +6 % de ataque, +9 % de vida y +4 de defensa (la defensa nunca pasa gear.armor_cap)
    filo: {stat: attack, slots: [arma, manos], min: 0.01, max: 0.03, min_rank: 1, material: lingote}               # [ES] ⚔️ Filo: +1 % de ataque (rangos 1-25), +2 % (26-75), +3 % (76-100); pide 🔩 lingote (Fundición)
    vigor: {stat: hp, slots: [armadura, cabeza, piernas], min: 0.01, max: 0.03, min_rank: 1, material: extracto}   # [ES] ❤️ Vigor: +1 % de vida (1-25), +2 % (26-75), +3 % (76-100); pide 🧴 extracto (Destilación)
    guarda: {stat: armor, slots: [pies, joya], min: 0.01, max: 0.02, min_rank: 25, material: gema_bruta}           # [ES] 🛡️ Guarda: +1 de defensa (rangos 25-50), +2 (51-100); pide 💠 gema en bruto (Minero)

camp_professions:            # [ES] D-115/D-116 (confirmadas): oficios de la fase 2, lado del campamento (red-de-oficios.md §5; profesiones.md §0.4): 🎣 Pescador, 🍲 Cocina, Cantería y 🏗️ Construcción. Sus beneficios (content/professions.yaml "perk") valen para el campamento donde eres miembro, con el MEJOR rango entre sus miembros (no se suman). Números propuestos por Claude: se ajustan en la beta
  fish:                      # [ES] 🐟 el pescado de las zonas con agua (content/biomes.yaml "water": todo el pantano, 3 de cada 10 zonas de bosque y de pradera)
    resource: pescado        # [ES] id del pescado (items.yaml; lo junta el 🎣 Pescador, content/professions.yaml)
    richness: 0.5            # [ES] su peso en la zona (los recursos de tierra van de 0,3 a 1,0): en el pantano, ~1 de cada 4 unidades de una vuelta es pescado. Se agota y vuelve como los demás (stock)
  stone_items: [piedra, sillar]   # [ES] lo que cuenta como "piedra" para el beneficio de la Cantería (las obras piden 15 % menos al rango 100)
  build_profession: construccion  # [ES] id del oficio 🏗️ Construcción (estable: los héroes guardan su experiencia con este id)
  build_xp_per_unit: 1       # [ES] 🏗️ Construcción: experiencia de oficio por cada material crudo aportado a una obra o a la reparación de las defensas; un refinado (🟫 tablón, 🧱 sillar) vale lo crudo que lleva (3).
                             # [ES] Quien junta y aporta todo lo de un día (~150-300 unidades según su nivel) llega al rango 100 en ~1 a 1,5 años, como los demás oficios
  damage:                    # [ES] 🛠️ cada oleada semanal daña las defensas del campamento hasta que las reparen (nunca más que la 🛡️ Defensa construida; la Noche de prueba no daña)
    won: 1                   # [ES] defendida: −1 de 🛡️ Defensa
    lost: 2                  # [ES] perdida: −2 (además de la comida de raids.loss_share)
  repair_per_point: {tablon: 2, sillar: 2}   # [ES] reparar cada punto dañado pide 2 🟫 tablones y 2 🧱 sillares (Aserradero + Cantería: 12 de lo crudo y 4 ⚡ de refinar). Se aporta entre todos como una obra (🔨 Mejoras → 🔨 Obras → 🛠️ Reparar defensas); 🏗️ Construcción lo baja a la mitad al rango 100
