# Biomes of the infinite map (D-58). Travel time no longer depends on the biome (D-78: distance only).
# [ES] Biomas del mapa infinito. El tiempo de viaje ya no depende del bioma, solo de la distancia
# (D-78, balance.yaml travel). danger: probabilidad base de un encuentro al llegar.
# Lo usan: engine/world (generación y viaje), engine/service (encuentros).
# gather: qué se recolecta en ese bioma (material: peso).
# water (D-115, fase 2 de los oficios): qué parte de las zonas de ese bioma tiene agua (1.0 = todas): ahí también se pesca
#   🐟 pescado (engine/world/resources.py water_resources; su peso en balance.yaml camp_professions.fish). Sin "water", 0.
# terrain (D-186, confirmada): el mapa es "como jugando Tetris": piezas de 4 zonas encajadas (engine/world/mapgen.py
#   terrain_at). weight: cuánto sale cada terreno en el sorteo de cada pieza; climate: any, cold (sale más al norte) o hot
#   (más al sur). scatter (opcional): terreno que sale en zonas sueltas. Sin "terrain", no sale solo en el mapa (el Claro).
#   tier (0.28, D-188): la tanda en la que se agregó el terreno (sin tier, la 0). Cada pieza mira primero si le toca uno de
#   la tanda más nueva, con un sorteo propio; si no, sortea como antes. Un terreno nuevo va en una tanda nueva (la siguiente
#   a la más alta): así solo cambian las piezas que pasan a ser suyas, y las demás conservan su terreno, enemigos, recursos
#   propios y nodos. Meterlo en una tanda vieja cambiaría el terreno de casi todo el mapa.
#   Un terreno nuevo solo agrega su terrain y su color. Los recursos de tierra NO siguen al terreno (D-185): usan el bioma
#   clásico de antes (mapgen.classic_biome) con estos mismos gather. El agua (water) sí sigue al terreno que se ve.
# color (D-179, confirmada): con qué color se pinta el terreno en el 🗺️ Mapa (D-182: colores elegidos por Claude). Un terreno
#   nuevo solo agrega su color: la leyenda del mapa se arma sola. El color es el terreno, no promete recursos (D-180).
#   0.28 (D-188) usó 🟧 🟥 🟣 🟤 ⚫ 🔵; libres para terrenos nuevos: 🔴 🟠 🟡 ⚪. Un color nunca se repite
#   (tests/test_terrenos_nuevos.py) ni es el emoji de un recurso que puede tener nodo (el mapa lo pinta en su zona).
# own (D-180, D-183 provisional): los recursos propios del terreno. Su catálogo = los de base de "gather" + estos (10 a 15).
#   Cada zona suma 2 o 3 de estos (engine/world/resources.py terrain_resources; balance.yaml resources.terrain), hasta 4 a 6
#   recursos de tierra. Cada id es un objeto de content/items.yaml con su oficio de recolección ("gathers" de
#   content/professions.yaml), al menos una receta que lo usa, precio en el mercader y textos en content/locales/es_terrenos.yaml.
#   Pueden repetirse entre terrenos (setas en el bosque y el pantano). Agregar uno puede cambiar qué propios trae una zona.
# node_rare (D-184 provisional): el material raro que a veces da un nodo de recursos de ese terreno al recolectar
#   (balance.yaml nodes.rare_chance). El Claro no tiene nodos.
# Si cambias esto, revisa: cambiar un ID cambia el mapa ya generado; own cambia qué recursos del terreno trae cada zona
#   (tests/test_nodos_y_terrenos.py); color cambia cómo se ve el mapa (tests/test_resources.py); danger mueve cuántas peleas hay; water mueve dónde
#   se pesca (y cuánta comida llega a las despensas: 🎣 Pescador y 🍲 Cocina, tests/test_oficios_campamento.py).

claro:
  name_key: biome.claro
  color: "🔥"            # [ES] D-179: color del terreno en el 🗺️ Mapa (el Claro es un lugar y sigue con su 🔥)
  gather: {fibra: 3, madera: 2}
  emoji: "🔥"
  danger: 0.0
pradera:
  name_key: biome.pradera
  terrain: {weight: 3, climate: any}   # [ES] D-186: peso en el sorteo de cada mancha del tablero; climate: any / cold (más al norte) / hot (más al sur)
  color: "🟩"
  gather: {fibra: 4, hierba_curativa: 2, piedra: 1}
  own: [bayas, miel, mazorca, lino, tomillo, setas, raiz_amarga]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: flor_luna        # [ES] D-184: el raro que a veces da un nodo de este terreno
  water: 0.3            # [ES] D-115: 3 de cada 10 zonas tienen un río o una laguna (🐟 pescado)
  emoji: "🌾"
  danger: 0.25
bosque:
  name_key: biome.bosque
  terrain: {weight: 3, climate: any}
  color: "🟢"
  gather: {madera: 5, hierba_curativa: 2, fibra: 1}
  own: [resina, corteza, setas, bayas, miel, musgo, raiz_amarga]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: flor_luna        # [ES] D-184: el raro que a veces da un nodo de este terreno
  water: 0.3            # [ES] D-115: 3 de cada 10 zonas tienen un arroyo (🐟 pescado)
  emoji: "🌲"
  danger: 0.35
colinas:
  name_key: biome.colinas
  terrain: {weight: 2, climate: any}
  color: "🟫"
  gather: {piedra: 4, madera: 1, pieza_metal: 1}
  own: [carbon, sal, cuarzo, tomillo, mazorca, corteza, bayas]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: gema_bruta        # [ES] D-184: el raro que a veces da un nodo de este terreno
  emoji: "⛰️"
  danger: 0.3
pantano:
  name_key: biome.pantano
  terrain: {weight: 2, climate: any}
  color: "🟪"
  gather: {hierba_curativa: 4, fibra: 2}
  own: [juncos, nenufar, setas, musgo, raiz_amarga, lino, resina, corteza]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: flor_luna        # [ES] D-184: el raro que a veces da un nodo de este terreno
  water: 1.0            # [ES] D-115: todo el pantano es agua: en cada zona se pesca
  emoji: "🐸"
  danger: 0.45
montana:
  name_key: biome.montana
  terrain: {weight: 2, climate: any}
  color: "⬜"
  gather: {piedra: 4, pieza_metal: 2}
  own: [carbon, cuarzo, sal, hielo, flor_escarcha, musgo, tomillo, resina]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: gema_bruta        # [ES] D-184: el raro que a veces da un nodo de este terreno
  emoji: "🏔️"
  danger: 0.4
desierto:
  name_key: biome.desierto
  terrain: {weight: 2, climate: hot}
  color: "🟨"
  gather: {piedra: 2, pieza_metal: 1, fibra: 1}
  own: [arena, sal, cactus, datiles, cuarzo, tomillo, chatarra]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: gema_bruta        # [ES] D-184: el raro que a veces da un nodo de este terreno
  emoji: "🏜️"
  danger: 0.4
tundra:
  name_key: biome.tundra
  terrain: {weight: 2, climate: cold}
  color: "🟦"
  gather: {piedra: 2, madera: 1, pieza_metal: 1}
  own: [hielo, flor_escarcha, musgo, bayas, resina, corteza, carbon]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: gema_bruta        # [ES] D-184: el raro que a veces da un nodo de este terreno
  emoji: "❄️"
  danger: 0.4
ruinas:
  name_key: biome.ruinas
  terrain: {weight: 1, climate: any}   # [ES] D-186: también salen en piezas de Tetris, menos seguido (unas 6 de cada 100 zonas)
  color: "⬛"
  gather: {pieza_metal: 4, piedra: 2}
  own: [chatarra, cuarzo, carbon, setas, musgo, arena, corteza, raiz_amarga]   # [ES] D-180: los propios del terreno (catálogo de 10 con los de gather)
  node_rare: gema_bruta        # [ES] D-184: el raro que a veces da un nodo de este terreno
  emoji: "🏚️"
  danger: 0.5

# ---- 0.28 "terrenos nuevos" (D-185 confirmada: "puedes agregar cuantos colores quieras en cuanto a tipo de zona"; D-188
# provisional: cuáles, sus colores, pesos y números los propuso Claude). Solo datos: mapgen.terrain_at los sortea solos y la
# leyenda del 🗺️ Mapa se arma sola. Nunca deciden los recursos de base (siguen a mapgen.classic_biome, que no los devuelve).
# Cada uno sale menos que los clásicos (peso 1 a 1,5; el volcán 0,5), en la tanda 1: unas 3 de cada 10 piezas del mapa pasan a
# ser de un terreno nuevo y las otras quedan como estaban en la 0.27. Sus enemigos: los de content/enemies.yaml que llevan su
# id en "biomes" (elegidos de los terrenos parecidos, con 2 o más en cada franja de nivel; tests/test_terrenos_nuevos.py).
# [ES] Si cambias el peso o el clima de uno, cambia el terreno (enemigos y peligro) de zonas ya visitadas; nunca sus recursos de base.
selva:
  name_key: biome.selva
  terrain: {weight: 1.5, climate: hot, tier: 1}   # [ES] D-188: caliente y húmeda: sale más al sur
  color: "🟣"           # [ES] prima del 🟪 pantano (húmedo), como 🟢 bosque lo es de 🟩 pradera
  gather: {madera: 4, hierba_curativa: 3, fibra: 1}
  own: [datiles, bayas, miel, setas, resina, corteza, musgo, raiz_amarga]   # [ES] catálogo de 11 con los de gather
  node_rare: flor_luna
  water: 0.5            # [ES] la mitad de sus zonas tiene un río (🐟 pescado)
  emoji: "🦜"
  danger: 0.45
sabana:
  name_key: biome.sabana
  terrain: {weight: 1.5, climate: hot, tier: 1}   # [ES] D-188: caliente y seca: sale más al sur
  color: "🟧"
  gather: {fibra: 4, madera: 1, piedra: 1}
  own: [mazorca, lino, miel, tomillo, bayas, datiles, resina, cactus]   # [ES] catálogo de 11 con los de gather
  node_rare: flor_luna
  water: 0.2            # [ES] 2 de cada 10 zonas tienen un abrevadero (🐟 pescado)
  emoji: "🦒"
  danger: 0.3
volcan:
  name_key: biome.volcan
  terrain: {weight: 0.5, climate: any, tier: 1}   # [ES] D-188: raro (el que menos sale) y el más peligroso
  color: "🟥"
  gather: {piedra: 4, pieza_metal: 3}
  own: [obsidiana, carbon, sal, cuarzo, arena, musgo, tomillo, resina]   # [ES] catálogo de 10; 🖤 obsidiana es nueva (0.28) y es propia solo de aquí
  node_rare: gema_bruta
  emoji: "🌋"
  danger: 0.55
canon:
  name_key: biome.canon
  terrain: {weight: 1, climate: any, tier: 1}
  color: "🟤"           # [ES] primo de 🟫 colinas (roca)
  gather: {piedra: 4, pieza_metal: 1, arcilla: 1}
  own: [arena, sal, cuarzo, tomillo, cactus, carbon, chatarra, bayas]   # [ES] catálogo de 11 con los de gather
  node_rare: gema_bruta
  water: 0.4            # [ES] 4 de cada 10 zonas tienen el río del fondo del cañón (🐟 pescado)
  emoji: "🏞️"
  danger: 0.35
bosque_oscuro:
  name_key: biome.bosque_oscuro
  terrain: {weight: 1, climate: cold, tier: 1}    # [ES] D-188: bosque cerrado y frío: sale más al norte
  color: "⚫"           # [ES] primo de ⬛ ruinas (oscuro)
  gather: {madera: 5, hierba_curativa: 1, fibra: 1}
  own: [setas, musgo, raiz_amarga, corteza, resina, bayas, miel, carbon]   # [ES] catálogo de 11 con los de gather
  node_rare: flor_luna
  water: 0.3            # [ES] 3 de cada 10 zonas tienen un arroyo (🐟 pescado)
  emoji: "🦉"
  danger: 0.5
lago:
  name_key: biome.lago
  terrain: {weight: 1, climate: any, tier: 1}
  color: "🔵"           # [ES] el agua
  gather: {fibra: 3, hierba_curativa: 2, arcilla: 1}
  own: [juncos, nenufar, lino, musgo, arena, setas, bayas, raiz_amarga]   # [ES] catálogo de 11 con los de gather
  node_rare: flor_luna
  water: 1.0            # [ES] como el pantano: en cada zona se pesca
  emoji: "🦆"
  danger: 0.25
