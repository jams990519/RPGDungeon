# Biomes of the infinite map (D-58). travel_minutes = time to walk INTO a zone of this biome.
# [ES] Biomas del mapa infinito. travel_minutes: minutos a pie para entrar a una zona
# de ese bioma (sin caminos ni montura). danger: probabilidad base de un encuentro al llegar.
# Lo usan: engine/world (generación y viaje), engine/service (encuentros).
# gather: qué se recolecta en ese bioma (material: peso).
# Si cambias esto, revisa: cambiar un ID cambia el mapa ya generado; los minutos mueven el ritmo del juego.

claro:
  name_key: biome.claro
  gather: {fibra: 3, madera: 2}
  emoji: "🔥"
  travel_minutes: 5
  danger: 0.0
