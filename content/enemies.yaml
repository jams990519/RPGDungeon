# Enemies of version 0.1. Each move is announced one round before (the "aviso").
# [ES] Enemigos de la versión 0.1. Cada ataque se anuncia una ronda antes (el aviso),
# para que el jugador conteste con la respuesta justa.
# Lo usan: engine/enemies, engine/combat, engine/service (encuentros por bioma y nivel).
# Etiquetas de los ataques: blockable (se bloquea entero), dodgeable (se esquiva),
# interruptible (se corta con una interrupción si actúas antes).
# kind: hit (golpe, por defecto) | channel (no pega esta ronda; el siguiente golpe vale buff veces más).
# loot: id de objeto → probabilidad de soltarlo al ganar (cuántos: loot_amount del objeto en items.yaml, si no 1).
# D-93 (provisional): solo las bestias (lobos, jabalíes, ratas, osos, arañas, escorpiones, tortugas, víboras,
# mantis, caimanes) sueltan 🍖 carne (40-60 %, 1-2) para la despensa; humanoides, no muertos, hongos y limos no.
# D-109: toda bestia que suelta carne suelta también 🦌 piel (10 puntos menos de probabilidad que su carne, 1-2), que
# la Curtiduría convierte en cuero; ninguna otra la suelta. Una bestia nueva lleva las dos (tests/test_professions.py).
# Si cambias esto, revisa: los IDs son estables; los números mueven el balance (registro en diseno/03-personaje/balance.md §7; medir con tools/sim.py).
# La probabilidad de 🍖 carne mueve cuánta comida entra a las despensas (balance.yaml pantry; tests/test_pantry.py).

