# --- D-82: the first region Guardian (diseno/06-contenido/jefes.md) ---
# [ES] D-82: el primer Guardián de región, fijo en su guarida (balance.yaml guardian: x, y).
# boss: true = nunca sale al azar (biomes vacío), no escala con tu nivel (level_min = level_max)
# y no se puede huir (can_flee: false: el botón 🏃 Huir se vuelve 🌀 Esquivar, P-67).
# phases (campo opcional, solo jefes): al bajar su vida a "at" (fracción de la vida máxima), al final
# de esa ronda cambia su lista de golpes por "moves" y su ataque base se multiplica por attack_mult.
# El golpe ya avisado se cumple; solo cambia el aviso siguiente (engine/combat/engine.py).
# Un mismo id de golpe en varias fases debe tener el mismo power y tags (se busca por id; weight puede cambiar).
# gold: bronce de las victorias repetidas (la primera da el Recuerdo). loot: materiales.
# Si cambias esto, revisa: tests/test_boss.py y la tabla del simulador en jefes.md §6.
raigambre:
  name_key: enemy.raigambre.name
  boss: true
  can_flee: false
  biomes: []
  level_min: 6
  level_max: 6
  base: {hp: 400, attack: 21, armor: 0.15, initiative: 8}   # [ES] medido con el simulador (jefes.md §6)
  per_level: {}
  xp: 300
  gold: [100, 200]
  loot: {pieza_metal: 0.6, hierba_curativa: 0.6}
  moves:
    - {id: ramazo, weight: 3, power: 1.0, tags: [blockable, dodgeable]}
    - {id: pisoton, weight: 2, power: 1.7, tags: [blockable, interruptible]}
    - {id: canto_del_bosque, weight: 1, kind: channel, buff: 1.6, tags: [interruptible]}
  phases:
    - id: raices
      at: 0.66
      attack_mult: 1.15
      moves:
        - {id: ramazo, weight: 2, power: 1.0, tags: [blockable, dodgeable]}
        - {id: raices_atrapantes, weight: 2, power: 1.5, tags: [dodgeable]}
        - {id: lluvia_de_astillas, weight: 2, power: 1.4, tags: [blockable]}
        - {id: canto_del_bosque, weight: 1, kind: channel, buff: 1.6, tags: [interruptible]}
    - id: corazon
      at: 0.33
      attack_mult: 1.3
      moves:
        - {id: ramazo, weight: 2, power: 1.0, tags: [blockable, dodgeable]}
        - {id: golpe_de_ambar, weight: 2, power: 1.6, tags: [blockable]}
        - {id: furia_del_bosque, weight: 2, power: 2.3, tags: [dodgeable, interruptible]}

# --- D-108: the high-level bestiary (diseno/06-contenido/bestiario.md, "En el juego") ---
# [ES] D-108 (confirmada): cada camino llega al nivel 100 sin aburrir. Antes casi todos los enemigos llegaban
# hasta el nivel 16 y arriba solo quedaba el bandido errante. Desde aquí, cada bioma con peligro tiene al menos
# 2 enemigos propios (sin contar al bandido) en cada nivel de 2 a 100, en 7 franjas que se pisan:
# 1-15, 12-30, 25-45, 40-60, 55-75, 70-90 y 85-100 (tests/test_bestiary.py lo comprueba).
# Qué enemigo sale lo decide engine/world/encounters.py: uno del bioma de la zona cuya franja tiene el nivel de la
# zona (más allá de la última franja, los de la más cercana). Lo usan los encuentros y las incursiones.
# De dónde salen los números (para sumar otro enemigo sin medir todo de nuevo):
#   vida = 75 + 13 por nivel y ataque = 10 + 1,5 por nivel (la curva del bandido errante), por el molde de su
#   familia y por su franja. Moldes (vida × ataque, defensa, iniciativa): fiera 1,35 × 1,2, 0,05, 13 ·
#   bruto 1,42 × 1,05, 0,2, 6 · coraza 1,22 × 1,0, 0,38, 5 · veneno 1,05 × 1,18, 0,12, 12 ·
#   espectro 1,13 × 1,32, 0, 11 · soldado 1,35 × 1,1, 0,2, 9 · enjambre 0,95 × 1,2, 0, 15.
#   Franja: 1 (zonas bajas) 0,85 · 1 (niveles 6-17) 0,95 · 2: 1,0 · 3: 1,02 · 4: 1,04 · 5: 1,05 · 6: 1,06 · 7: 1,08.
#   xp = 34 · 40 · 42 · 42 · 43 · 43 · 44 · 44 según la franja, por el molde (bruto 1,12, coraza 1,08,
#   soldado 1,05, fiera 1,0, veneno y espectro 0,97, enjambre 0,9). Con hero.xp_level_scale, pelear y cazar
#   siguen llevando al nivel 100 en ~1,8 años con toda la energía (D-108; cuenta en balance.md §7).
#   gold y botín crecen con la franja; la gente (y los gigantes) suelta más monedas.
#   🍖 carne (D-93, 40-60 %): las bestias que se comen (animales, insectos grandes, reptiles, aves y dracónidos),
#   que a cambio sueltan menos monedas. No sueltan carne: gente, gigantes, no muertos, espectros, plantas,
#   elementales, constructos, feéricos, licántropos, enjambres de mosquitos, sanguijuelas, murciélagos y polillas.
#   Desde la franja 5 todos tienen 3 golpes o más: los brutos, los venenosos y los enjambres, un segundo golpe grande
#   (1,7 a 1,8) que pide otra respuesta; los demás, una carga que se interrumpe (las fieras de la franja 7, las dos).
# Medido con tools/sim.py (juego atento, cinturón lleno, equipo poco común): tabla en balance.md §7.
# Si cambias esto, revisa: tests/test_bestiary.py (cobertura, textos, peleas que se ganan), tests/test_raids.py
# (la Noche de prueba trae al más fuerte del bioma) y el ritmo de D-108 (progresion.md §1.2).

