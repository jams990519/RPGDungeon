# --- D-82: the first region Guardian (diseno/06-contenido/jefes.md) ---
# [ES] D-82: el primer Guardián de región, fijo en su guarida (balance.yaml guardian: x, y).
# boss: true = nunca sale al azar (biomes vacío), no escala con tu nivel (level_min = level_max)
# y no se puede huir (can_flee: false: el botón 🏃 Huir se vuelve 🌀 Esquivar, P-67).
# phases (campo opcional, solo jefes): al bajar su vida a "at" (fracción de la vida máxima), al final
# de esa ronda cambia su lista de golpes por "moves" y su ataque base se multiplica por attack_mult.
# El golpe ya avisado se cumple; solo cambia el aviso siguiente (engine/combat/engine.py).
# Un mismo id de golpe en varias fases debe tener el mismo power y tags (se busca por id; weight puede cambiar).
# gold: bronce de las victorias repetidas (la primera da el Recuerdo). loot: materiales.
# Si cambias esto, revisa: tests/test_boss.py y la tabla del simulador en jefes.md §6.
raigambre:
  name_key: enemy.raigambre.name
  boss: true
  can_flee: false
  biomes: []
  level_min: 6
  level_max: 6
  base: {hp: 400, attack: 21, armor: 0.15, initiative: 8}   # [ES] medido con el simulador (jefes.md §6)
  per_level: {}
  xp: 300
  gold: [100, 200]
  loot: {pieza_metal: 0.6, hierba_curativa: 0.6}
  moves:
    - {id: ramazo, weight: 3, power: 1.0, tags: [blockable, dodgeable]}
    - {id: pisoton, weight: 2, power: 1.7, tags: [blockable, interruptible]}
    - {id: canto_del_bosque, weight: 1, kind: channel, buff: 1.6, tags: [interruptible]}
  phases:
    - id: raices
      at: 0.66
      attack_mult: 1.15
      moves:
        - {id: ramazo, weight: 2, power: 1.0, tags: [blockable, dodgeable]}
        - {id: raices_atrapantes, weight: 2, power: 1.5, tags: [dodgeable]}
        - {id: lluvia_de_astillas, weight: 2, power: 1.4, tags: [blockable]}
        - {id: canto_del_bosque, weight: 1, kind: channel, buff: 1.6, tags: [interruptible]}
    - id: corazon
      at: 0.33
      attack_mult: 1.3
      moves:
        - {id: ramazo, weight: 2, power: 1.0, tags: [blockable, dodgeable]}
        - {id: golpe_de_ambar, weight: 2, power: 1.6, tags: [blockable]}
        - {id: furia_del_bosque, weight: 2, power: 2.3, tags: [dodgeable, interruptible]}
