# Chained professions, phase 1 (D-109): gather -> refine -> craft; phase 2, camp side (D-115). Only the simple layer.
#
# [ES]
# Para qué sirve: el catálogo de los ⚒️ Oficios: los 15 de la fase 1 (4 de recolección, 5 de refinado y 6 de
#     fabricación), la 🩺 Medicina, el 🧭 Explorador y el 💱 Comercio, y los 4 de la fase 2 del lado del campamento (D-115:
#     🎣 Pescador, 🍲 Cocina, 🗿 Cantería y 🏗️ Construcción), los títulos de rango, dónde están las estaciones y las
#     recetas (qué entra, qué sale, en qué estación, desde qué rango, cuánta energía cuesta y cuánta experiencia de oficio
#     da). Agregar una receta aquí la mete en el juego; su resultado tiene que existir en content/items.yaml y los textos
#     en content/locales/es.yaml o en un es_*.yaml (profession.<id>.name y .how para cada oficio; item.<id> para cada
#     objeto; los de la fase 2 están en es_oficios_campamento.yaml).
# Documento de diseño: diseno/07-economia/profesiones.md §0 (fase 1, D-109), §0.4 (beneficios que no son de combate,
#     D-116) y §4 (rangos); diseno/07-economia/red-de-oficios.md §5 (en qué orden entran, fase 2)
# Lo leen: engine/core/content.py (Content.professions), engine/professions/rules.py y engine/service/game.py
#     (sección "professions": _trade_gather, _trade_loot, _professions_view, _station_view, _recipe_view, _make)
# IDs: estables. Nunca se renombran, nunca se borran, nunca se reutilizan: los héroes guardan la experiencia de cada
#     oficio con su id (Hero.professions). Para retirar una receta se marca retired: true (deja de mostrarse).
# Campos de cada oficio:
#     emoji, name_key, how_key: lo que se muestra (cómo se sube, en una frase).
#     branch: gather (recolección), refine (refinado) o craft (fabricación).
#     gathers: materiales que junta al recolectar (sube 1 de experiencia de oficio por unidad: balance.yaml professions).
#     skins: materiales que saca de las bestias vencidas (el 🔪 Desollador: carne y piel del botín).
#     rare: {item, min_rank}: el material raro que puede encontrar al recolectar desde ese rango.
# Campos de cada receta:
#     profession: el oficio que la hace (y su estación: en la fase 1 cada oficio de refinado y fabricación tiene la suya).
#     inputs: materiales de la mochila por vez. output: lo que sale por vez (ids de items.yaml).
#     min_rank: rango del oficio desde el que se puede hacer. energy: ⚡ por vez (D-78: toda acción fuera del combate
#     gasta energía). xp: experiencia de oficio por vez. La experiencia de héroe sale de energy (balance.yaml professions).
#     spec (D-141, opcional): la 🎓 especialización que la hace exclusiva: solo la ve y la hace quien la tiene, con el rango
#     de la receta y balance.yaml specs.recipe_mastery de dominio.
#     variant (D-183, opcional): el material que la distingue de otra receta que hace lo mismo (las de los recursos de cada
#     terreno): el nombre de la receta lo muestra ("🧪 Poción de vida ×2 · con ⏳ Arena") para que los botones no se repitan.
# 🎓 Especializaciones (D-115, D-141; bloque "specs", debajo de "ranks"):
#     specs.<oficio>: las 3 especializaciones del oficio (red-de-oficios.md §2). Cada una: id (estable y único en todo el juego:
#     el héroe guarda las que tiene en Hero.prof_specs y su dominio en Hero.spec_xp), emoji y effects: una lista corta de
#     efectos con su valor al 100 % de dominio (crece parejo con el dominio). Tipos de efecto (engine/professions/rules.py
#     SPEC_KINDS): yield (unidad de más al recolectar, desollar, refinar o fabricar los items de la lista), find (hallar un
#     item por vuelta, por unidad desollada o por vez refinada del oficio de la especialización), masterwork (✒️ obra maestra de
#     más en las piezas de esas ranuras o tipos), perk (se suma a un beneficio de PERK_KEYS; roles limita a un rol), coins
#     (monedas de más en sales: goods, gear, barter o ecamp), enchant (puntos de más en esos encantamientos) y detect (menos
#     probabilidad de que te descubran al infiltrarte). Textos: spec.<id>.name y spec.<id>.desc en
#     content/locales/es_especializaciones.yaml. Un oficio nuevo suma las suyas aquí, sin tocar el motor.
# Si cambias esto, revisa:
#     - Casi toda receta de fabricación pide materiales de 2 oficios o más (D-109): tests/test_professions.py lo comprueba.
#     - Las cantidades mueven la demanda de cada material y el valor de cada oficio (registro de balance en
#       diseno/03-personaje/balance.md §7, "los oficios encadenados").
#     - El equipo fabricado (items.yaml, source: crafted) tiene que valer siempre algo más que el botín de su nivel (D-113:
#       lo mejor de cada nivel lo fabrican los jugadores; tests/test_balance_d110.py); nunca sale en el botín al azar (engine/hero/gear.py).
#     - D-110: las líneas de equipo tienen una receta por nivel de pieza hasta el 100, en los rangos 55 a 100 (al final del archivo).
#     - D-115 (fase 2, lado del equipo): cabeza, manos, piernas y pies también tienen equipo de artesano (208 recetas al final del
#       archivo, una línea cada una, con el id de la pieza que sale) y el ✨ Encantamiento es un oficio de rama propia (branch:
#       enchant): no tiene estación ni recetas aquí; desencanta y encanta desde 🛡️ Equipo (engine/service/game.py, sección
#       "enchanting"; números en balance.yaml enchanting; perk {disenchant} en PERK_KEYS de engine/professions/rules.py).
#     - Las estaciones del campamento dependen de los ids de content/camp_upgrades.yaml (taller, herreria).
#     - D-116: la ✒️ obra maestra. Toda pieza de equipo fabricada (source: crafted) tiene su gemela "<id>_obra" que arma el
#       motor al cargar (engine/professions/rules.py masterwork_items; números en balance.yaml masterwork). La probabilidad
#       sale del rango del oficio que fabrica: la 🪑 Carpintería usa su perk {masterwork}; los demás, masterwork.base_chance.
#       Las recetas de 🪑 muebles (literas_roble, armero_roble) dan objetos kind: furniture que se colocan en el campamento.
#     - D-115 fase 2, lado del campamento (sección propia al final de cada bloque): 🎣 Pescador (junta 🐟 pescado en las
#       zonas con agua), 🍲 Cocina (raciones para la despensa: items.yaml "cooked"), Cantería (🧱 sillar) y 🏗️
#       Construcción (oficio de servicio: sube aportando a las obras y reparando las defensas). Sus beneficios son de
#       campamento o castillo (fish_food, cook_food, stone_cost, build_cost, repair_cost): valen para el campamento con el
#       MEJOR rango entre sus miembros (engine/professions/rules.py camp_perks; balance.yaml camp_professions).
#       La 🍲 Cocina se hace en el Claro y en el 🔥 Fogón del campamento; la Cantería, en el Claro y en el 🧵 Taller.
#     - D-180 / D-183 (0.27): los recursos propios de cada terreno (content/biomes.yaml "own") los junta un oficio de
#       recolección ("gathers" de 🪓 Leñador, ⛏️ Minero y 🌿 Herbolario: su beneficio, su unidad de más y su raro valen para
#       ellos) y cada uno tiene al menos una receta (sección al final: refinados, ⚗️ Alquimia, 🩺 Medicina y 🍲 Cocina, con
#       "variant"). Un recurso nuevo sin oficio o sin receta rompe tests/test_nodos_y_terrenos.py.
#     - D-172: el perk {stealth} del 🧭 Explorador (🥷 Sigilo, en PERK_KEYS de engine/professions/rules.py) y el efecto perk stealth
#       de la 🎓 🕵️ Infiltrado los usa engine/service/game.py _stealth_chance (evitar una pelea al azar al explorar con ✋ Manual y
#       al llegar de un viaje), con el tope de balance.yaml explorer.stealth_max. Pruebas: tests/test_reconocimiento.py.

# Rank titles (design §4). [ES] Títulos de rango: desde qué rango rige cada uno (profesiones.md §4).
ranks:
  - {id: aprendiz, from: 1}
  - {id: oficial, from: 21}
  - {id: experto, from: 41}
  - {id: artesano, from: 61}
  - {id: maestro, from: 81}
  - {id: gran_maestro, from: 96}

# ---- D-115 / D-141: 🎓 profession specializations (3 per profession; one at rank 25, another at 75, never the three).
# [ES] Especializaciones de oficio (red-de-oficios.md §3; números en balance.yaml specs). "value" es el efecto con el 100 % de
# dominio (crece parejo desde 0 con la experiencia de oficio que ganas mientras la tienes). Los nombres vienen de la red de oficios
# §2; donde el material todavía no existe (carbón, papel, pergamino, seda, escudos, herramientas, venenos...), la especialización
# da hoy un efecto cercano en su línea y suma lo suyo cuando ese material o esa ranura entren al juego. El 💱 Comercio no tenía
# especializaciones en la tabla: las tres son propuesta de Claude. Las recetas exclusivas (spec: <id>) están en "recipes", después
# de las de Medicina. IDs estables: nunca se renombran ni se borran (retired: true para retirar una).
specs:
  # ---- Recolección: más de lo suyo, o un raro de más
  lenador:
    - {id: lenador_nobles, emoji: "🌳", effects: [{kind: yield, items: [tablon], value: 0.10}]}        # [ES] madera escogida: tus 🟫 tablones rinden más al aserrar
    - {id: lenador_carbon, emoji: "🔥", effects: [{kind: yield, items: [lingote], value: 0.10}]}       # [ES] leña y carbón para la fragua: tus 🔩 lingotes rinden más al fundir
    - {id: lenador_tala, emoji: "🪓", effects: [{kind: yield, items: [madera], value: 0.20}]}          # [ES] +20 % de sacar 🪵 madera de más
  minero:
    - {id: minero_metales, emoji: "⚙️", effects: [{kind: yield, items: [pieza_metal], value: 0.20}]}
    - {id: minero_gemas, emoji: "💠", effects: [{kind: find, items: [gema_bruta], value: 0.08}]}       # [ES] por vuelta en la que minas algo, aparte del raro de siempre
    - {id: minero_cantera, emoji: "🪨", effects: [{kind: yield, items: [piedra, arcilla], value: 0.20}]}
  herbolario:
    - {id: herbolario_medicinales, emoji: "🌿", effects: [{kind: yield, items: [hierba_curativa], value: 0.20}]}
    - {id: herbolario_flores, emoji: "🌸", effects: [{kind: find, items: [flor_luna], value: 0.08}]}
    - {id: herbolario_fibras, emoji: "🧵", effects: [{kind: yield, items: [fibra], value: 0.20}]}
  desollador:
    - {id: desollador_pieles, emoji: "🦌", effects: [{kind: yield, items: [piel], value: 0.20}]}
    - {id: desollador_carniceria, emoji: "🍖", effects: [{kind: yield, items: [carne], value: 0.20}]}
    - {id: desollador_trofeos, emoji: "🦴", effects: [{kind: find, items: [gema_bruta], value: 0.03}]}  # [ES] colmillos y cristales para la Joyería: por cada 🍖 o 🦌 que sacas
  explorador:
    - {id: explorador_cartografo, emoji: "🗺️", effects: [{kind: perk, key: explore, value: 3}]}        # [ES] +3 puntos de exploración por vuelta (la parte entera)
    - {id: explorador_rastreador, emoji: "🐾", effects: [{kind: coins, sales: [ecamp], value: 0.30}]}  # [ES] +30 % de monedas de los 👹 campamentos enemigos (cofre y parte)
    - {id: explorador_infiltrado, emoji: "🕵️", effects: [{kind: detect, value: 0.10}, {kind: perk, key: stealth, value: 0.10}]}   # [ES] −10 puntos de que te descubran al 🕵️ infiltrarte (sin bajar de detect_min) y, D-172, +10 puntos de 🥷 Sigilo (evitar peleas al explorar con ✋ Manual y al viajar; sin pasar balance.yaml explorer.stealth_max)
  # ---- Refinado: la del material principal rinde +15 %; las otras +5 % y algo de su línea
  aserradero:
    - {id: aserradero_nobles, emoji: "🟫", effects: [{kind: yield, items: [tablon], value: 0.15}]}
    - {id: aserradero_carbon, emoji: "🔥", effects: [{kind: yield, items: [tablon], value: 0.05}, {kind: yield, items: [lingote], value: 0.10}]}
    - {id: aserradero_papel, emoji: "📜", effects: [{kind: yield, items: [tablon], value: 0.05}, {kind: perk, key: explore, value: 1}]}
  fundicion:
    - {id: fundicion_hierro, emoji: "🔩", effects: [{kind: yield, items: [lingote], value: 0.15}]}
    - {id: fundicion_preciosos, emoji: "🪙", effects: [{kind: yield, items: [lingote], value: 0.05}, {kind: find, items: [gema_bruta], value: 0.03}]}
    - {id: fundicion_aleaciones, emoji: "⛓️", effects: [{kind: yield, items: [lingote], value: 0.05}, {kind: masterwork, types: [malla, placas], value: 0.02}]}
  destilacion:
    - {id: destilacion_extractos, emoji: "🧴", effects: [{kind: yield, items: [extracto], value: 0.15}]}
    - {id: destilacion_tintes, emoji: "🎨", effects: [{kind: yield, items: [extracto], value: 0.05}, {kind: masterwork, types: [tela, cuero], value: 0.02}]}
    - {id: destilacion_licores, emoji: "🍶", effects: [{kind: yield, items: [extracto], value: 0.05}, {kind: yield, items: [pocion_vida, pocion_mayor], value: 0.10}]}
  tejeduria:
    - {id: tejeduria_lino, emoji: "🌾", effects: [{kind: yield, items: [tela_tejida], value: 0.05}, {kind: yield, items: [venda], value: 0.10}]}
    - {id: tejeduria_lana, emoji: "🐑", effects: [{kind: yield, items: [tela_tejida], value: 0.15}]}
    - {id: tejeduria_seda, emoji: "🪡", effects: [{kind: yield, items: [tela_tejida], value: 0.05}, {kind: masterwork, types: [tela], value: 0.02}]}
  curtiduria:
    - {id: curtiduria_grueso, emoji: "🟤", effects: [{kind: yield, items: [cuero_curtido], value: 0.15}]}
    - {id: curtiduria_fino, emoji: "🧤", effects: [{kind: yield, items: [cuero_curtido], value: 0.05}, {kind: masterwork, types: [cuero], value: 0.02}]}
    - {id: curtiduria_pergamino, emoji: "📜", effects: [{kind: yield, items: [cuero_curtido], value: 0.05}, {kind: perk, key: explore, value: 1}]}
  # ---- Fabricación: ✒️ obra maestra de más en su línea y recetas exclusivas (o más rendimiento en sus remedios)
  carpinteria:
    - {id: carpinteria_arqueria, emoji: "🏹", effects: [{kind: masterwork, types: [arco], value: 0.05}]}      # [ES] exclusivas: espec_arco_1 y _2
    - {id: carpinteria_escudos, emoji: "🛡️", effects: [{kind: masterwork, types: [baston], value: 0.05}]}    # [ES] madera dura: bastones y, cuando exista su ranura, escudos; exclusiva: 🛡️ paveses_roble
    - {id: carpinteria_mobiliario, emoji: "🛒", effects: [{kind: perk, key: bag, value: 10}]}                 # [ES] un carro de mano: +10 de mochila; exclusiva: 🛒 carro_viveres
  herreria:
    - {id: herreria_armas, emoji: "⚔️", effects: [{kind: masterwork, types: [espada, daga], value: 0.05}]}  # [ES] exclusivas: espec_espada_1 y _2
    - {id: herreria_armero, emoji: "🛡️", effects: [{kind: masterwork, types: [placas], value: 0.05}]}      # [ES] exclusivas: espec_placas_1 y _2
    - {id: herreria_herramientas, emoji: "🔧", effects: [{kind: yield, items: [madera, piedra, pieza_metal, arcilla, hierba_curativa, fibra, carne, piel, bayas, setas, miel, mazorca, lino, juncos, nenufar, cactus, datiles, flor_escarcha, musgo, raiz_amarga, tomillo, resina, corteza, carbon, sal, cuarzo, arena, hielo, chatarra], value: 0.05}]}   # [ES] tus herramientas: +5 % en todo lo que recolectas o desuellas (D-183: también los recursos de cada terreno)
  peleteria:
    - {id: peleteria_cuero, emoji: "🦺", effects: [{kind: masterwork, types: [cuero], value: 0.05}]}       # [ES] exclusivas: espec_cuero_1 y _2
    - {id: peleteria_malla, emoji: "⛓️", effects: [{kind: masterwork, types: [malla], value: 0.05}]}      # [ES] exclusivas: espec_malla_1 y _2
    - {id: peleteria_talabarteria, emoji: "🎒", effects: [{kind: perk, key: bag, value: 10}]}             # [ES] alforjas y mochilas: +10 de mochila (las sillas de montar, con las monturas)
  sastreria:
    - {id: sastreria_tunicas, emoji: "🔮", effects: [{kind: masterwork, types: [tela], slots: [armadura], value: 0.05}]}                  # [ES] exclusivas: espec_tela_1 y _2
    - {id: sastreria_clima, emoji: "🧥", effects: [{kind: masterwork, types: [tela], slots: [cabeza, manos, piernas, pies], value: 0.05}]}   # [ES] el clima, cuando llegue
    - {id: sastreria_medico, emoji: "🩹", effects: [{kind: yield, items: [venda], value: 0.25}]}
  alquimia:
    - {id: alquimia_pociones, emoji: "🧪", effects: [{kind: yield, items: [pocion_vida, pocion_mayor], value: 0.20}]}
    - {id: alquimia_elixires, emoji: "🍷", effects: [{kind: perk, key: potion, value: 0.10}]}
    - {id: alquimia_venenos, emoji: "☠️", effects: [{kind: perk, key: attack, value: 0.02}]}              # [ES] veneno en tus armas: +2 % de ataque (los venenos para vender, más adelante)
  medicina:
    - {id: medicina_auxilios, emoji: "🩹", effects: [{kind: perk, key: bandage, value: 0.15}]}
    - {id: medicina_cirugia, emoji: "🩺", effects: [{kind: perk, key: heal, roles: [curacion], value: 0.10}]}
    - {id: medicina_farmacia, emoji: "💊", effects: [{kind: yield, items: [unguento, botiquin, vendaje_maestro], value: 0.20}]}
  joyeria:
    - {id: joyeria_gemas, emoji: "💎", effects: [{kind: masterwork, types: [joya], value: 0.05}]}          # [ES] exclusivas: espec_joya_gemas_1 y _2
    - {id: joyeria_orfebreria, emoji: "🪙", effects: [{kind: yield, items: [lingote], value: 0.10}]}       # [ES] exclusivas: espec_joya_oro_1 y _2
    - {id: joyeria_vidrieria, emoji: "🫙", effects: [{kind: yield, items: [pocion_vida, pocion_mayor], value: 0.10}]}   # [ES] frascos de vidrio para la Alquimia
  # ---- Servicio y artes arcanas
  comercio:
    - {id: comercio_abastecedor, emoji: "📦", effects: [{kind: coins, sales: [goods], value: 0.10}]}      # [ES] materiales al mercader del Claro
    - {id: comercio_tratante, emoji: "🛡️", effects: [{kind: coins, sales: [gear], value: 0.10}]}         # [ES] tu equipo viejo
    - {id: comercio_caravanero, emoji: "🐪", effects: [{kind: coins, sales: [barter], value: 0.10}]}      # [ES] el 💱 trueque del campamento (y las caravanas, cuando lleguen)
  encantamiento:
    - {id: encantamiento_armas, emoji: "⚔️", effects: [{kind: enchant, enchants: [filo], value: 0.01}]}           # [ES] +1 punto en ⚔️ Filo (antes de redondear)
    - {id: encantamiento_armaduras, emoji: "🛡️", effects: [{kind: enchant, enchants: [vigor, guarda], value: 0.01}]}
    - {id: encantamiento_desencantar, emoji: "💨", effects: [{kind: perk, key: disenchant, value: 0.20}]}
  # ---- Fase 2, lado del campamento (D-115): las del 🎣 Pescador, la 🍲 Cocina, la 🗿 Cantería y la 🏗️ Construcción.
  # [ES] Las agregó el líder al unir las dos ramas. Sus beneficios de campamento (mejor rango entre los miembros) no cambian;
  # la especialización suma a lo que hace cada uno con sus manos. La Construcción todavía no tiene obras por especialización:
  # hoy prepara mejor los materiales de su línea (efecto cercano, como Papel o Pergamino) y sumará lo suyo cuando lleguen.
  pescador:
    - {id: pescador_redes, emoji: "🕸️", effects: [{kind: yield, items: [pescado], value: 0.20}]}                       # [ES] +20 % de sacar 🐟 pescado de más
    - {id: pescador_perlas, emoji: "🦪", effects: [{kind: find, items: [gema_bruta], value: 0.05}]}                    # [ES] perlas: a veces una 💠 gema al pescar
    - {id: pescador_ahumado, emoji: "🔥", effects: [{kind: yield, items: [pescado_asado, conserva], value: 0.15}]}     # [ES] ahumado y salazón: tus platos de pescado rinden más
  cocina:
    - {id: cocina_guisos, emoji: "🍲", effects: [{kind: yield, items: [racion_campamento, guiso_cazador], value: 0.15}]}
    - {id: cocina_conservas, emoji: "🫙", effects: [{kind: yield, items: [conserva, pescado_asado], value: 0.15}]}
    - {id: cocina_banquetes, emoji: "🍗", effects: [{kind: yield, items: [festin, banquete], value: 0.15}]}
  canteria:
    - {id: canteria_sillares, emoji: "🧱", effects: [{kind: yield, items: [sillar], value: 0.15}]}
    - {id: canteria_tallado, emoji: "💠", effects: [{kind: yield, items: [sillar], value: 0.05}, {kind: find, items: [gema_bruta], value: 0.03}]}
    - {id: canteria_muros, emoji: "🏯", effects: [{kind: yield, items: [sillar], value: 0.05}, {kind: yield, items: [piedra], value: 0.10}]}
  construccion:
    - {id: construccion_madera, emoji: "🪵", effects: [{kind: yield, items: [tablon], value: 0.10}]}                   # [ES] obras de madera: tablones mejor preparados
    - {id: construccion_piedra, emoji: "🧱", effects: [{kind: yield, items: [sillar], value: 0.10}]}                   # [ES] obras de piedra
    - {id: construccion_fortificaciones, emoji: "🏰", effects: [{kind: yield, items: [lingote], value: 0.10}]}         # [ES] fortificaciones: herrajes y clavos

professions:
  # ---- Recolección: sube al recolectar (o al vencer bestias, el desollador)
  lenador:
    emoji: "🪓"
    name_key: profession.lenador.name
    how_key: profession.lenador.how
    branch: gather
    gathers: [madera, resina, corteza]       # [ES] D-183: también lo leñoso de cada terreno (💧 resina, 🍂 corteza)
    perk: {bag: 10}                          # [ES] D-111: +10 de espacio en la mochila al rango 100 (crece parejo con el rango)
  minero:
    emoji: "⛏️"
    name_key: profession.minero.name
    how_key: profession.minero.how
    branch: gather
    gathers: [piedra, pieza_metal, arcilla, carbon, sal, cuarzo, arena, hielo, chatarra, obsidiana]   # [ES] D-183: también lo mineral de cada terreno (0.28: 🖤 obsidiana del 🌋 volcán)
    rare: {item: gema_bruta, min_rank: 10}     # [ES] desde el rango 10 aparecen gemas en bruto al minar (las pide la Joyería)
    perk: {hp: 0.05}                         # [ES] D-111: +5 % de vida máxima al rango 100 (tanques)
  herbolario:
    emoji: "🌿"
    name_key: profession.herbolario.name
    how_key: profession.herbolario.how
    branch: gather
    gathers: [hierba_curativa, fibra, bayas, setas, miel, mazorca, lino, juncos, nenufar, cactus, datiles, flor_escarcha, musgo, raiz_amarga, tomillo]   # [ES] D-183: también las plantas, hongos y la miel de cada terreno
    rare: {item: flor_luna, min_rank: 10}      # [ES] desde el rango 10 aparecen flores de luna (pociones mayores, túnicas finas)
    perk: {regen: 0.20}                      # [ES] D-111: la vida vuelve sola un 20 % más rápido al rango 100
  desollador:
    emoji: "🔪"
    name_key: profession.desollador.name
    how_key: profession.desollador.how
    branch: gather
    skins: [carne, piel]                       # [ES] del botín de las bestias (las que sueltan carne, enemies.yaml)
    perk: {attack: 0.04}                     # [ES] D-111: +4 % de ataque al rango 100

  # ---- Exploración (D-112): sube explorando, no junta materiales
  explorador:
    emoji: "🧭"
    name_key: profession.explorador.name
    how_key: profession.explorador.how
    branch: explore                            # [ES] rama propia: sube con cada vuelta de exploración (balance.yaml explorer), no con materiales
    perk: {explore: 5, stealth: 0.25}          # [ES] D-112: +5 puntos de exploración por vuelta al rango 100 (1 cada 20 rangos); lo que ve en el mapa con el rango, en balance.yaml explorer.ranks.
                                               # [ES] D-172: 🥷 Sigilo, hasta 25 % al rango 100 (parejo con el rango) de evitar una pelea al azar al explorar con ✋ Manual y al llegar de un viaje; nunca en cacerías, asaltos, mazmorras, oleadas ni el Guardián

  # ---- Refinado: en una estación, gasta energía
  aserradero:
    emoji: "🪚"
    name_key: profession.aserradero.name
    how_key: profession.aserradero.how
    branch: refine
  fundicion:
    emoji: "🔥"
    name_key: profession.fundicion.name
    how_key: profession.fundicion.how
    branch: refine
  destilacion:
    emoji: "💧"
    name_key: profession.destilacion.name
    how_key: profession.destilacion.how
    branch: refine
  tejeduria:
    emoji: "🧶"
    name_key: profession.tejeduria.name
    how_key: profession.tejeduria.how
    branch: refine
  curtiduria:
    emoji: "🪣"
    name_key: profession.curtiduria.name
    how_key: profession.curtiduria.how
    branch: refine

  # ---- Fabricación: en una estación, gasta energía, pide materiales de 2 oficios o más
  carpinteria:
    emoji: "🪑"
    name_key: profession.carpinteria.name
    how_key: profession.carpinteria.how
    branch: craft
    perk: {masterwork: 0.15}                 # [ES] D-116: hasta 15 % de que cada arco o bastón que fabricas salga ✒️ obra maestra (exclusiva, mejor y con tu firma), parejo con el rango.
                                             # [ES] Reemplaza al +4 % de ataque con arco o bastón de D-111 (0.16-0.20). Además hace los 🪑 muebles del campamento (recetas abajo)
  herreria:
    emoji: "🔨"
    name_key: profession.herreria.name
    how_key: profession.herreria.how
    branch: craft
    perk: {armor: 0.03, armor_type: placas}            # [ES] D-111: +3 puntos de armadura con placas (sin pasar el tope)
  alquimia:
    emoji: "⚗️"
    name_key: profession.alquimia.name
    how_key: profession.alquimia.how
    branch: craft
    perk: {potion: 0.30}                     # [ES] D-111: las pociones curan un 30 % más
  sastreria:
