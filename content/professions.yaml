    perk: {fish_food: 0.30}                    # [ES] el 🐟 pescado crudo rinde 30 % más en la despensa del campamento al rango 100
  cocina:
    emoji: "🍲"
    name_key: profession.cocina.name
    how_key: profession.cocina.how
    branch: craft
    perk: {cook_food: 0.30}                    # [ES] lo cocinado (items.yaml "cooked") rinde 30 % más en la despensa del campamento al rango 100
  canteria:
    emoji: "🗿"
    name_key: profession.canteria.name
    how_key: profession.canteria.how
    branch: refine                             # [ES] 🪨 piedra → 🧱 sillar; como todo refinado, hasta 30 % de una unidad más por el rango
    perk: {stone_cost: 0.15}                   # [ES] 🏰 las obras del campamento piden 15 % menos piedra y sillar al rango 100
  construccion:
    emoji: "🏗️"
    name_key: profession.construccion.name
    how_key: profession.construccion.how
    branch: service                            # [ES] sube aportando a las 🔨 obras y a la reparación de las defensas (balance.yaml camp_professions.build_xp_per_unit)
    perk: {build_cost: 0.20, repair_cost: 0.50}   # [ES] 🏰 las mejoras piden 20 % menos materiales y reparar las defensas cuesta la mitad al rango 100

# Where the stations are. [ES] Dónde están las estaciones (en la fase 1, una por oficio de refinado y fabricación).
stations:
  # [ES] El Claro tiene todas las estaciones básicas (no crece, D-98, pero es donde empiezan todos)
  claro: [aserradero, fundicion, destilacion, tejeduria, curtiduria, carpinteria, herreria, alquimia, sastreria, peleteria, joyeria, medicina,
          cocina, canteria]                    # [ES] D-115 fase 2: 🍲 Cocina y Cantería
  # [ES] En tu campamento, cada mejora construida (ids de content/camp_upgrades.yaml) abre las suyas, con algo más de
  # rendimiento al refinar (balance.yaml professions.camp_bonus). No hay alambique todavía: destilar y la alquimia van
  # en el 🧵 Taller hasta que exista una mejora propia.
  camp:
    taller: [aserradero, tejeduria, curtiduria, destilacion, carpinteria, sastreria, peleteria, alquimia, medicina, canteria]   # [ES] D-115: + Cantería
    herreria: [fundicion, herreria, joyeria]
    fogon: [cocina]                            # [ES] D-115 fase 2: el 🔥 Fogón (nivel 1) ya sirve para cocinar en el campamento

