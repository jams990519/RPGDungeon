  # ---- Peletería: armaduras de cuero (cuero + tela) y de malla ligera (cuero + lingotes)
  jubon_cuero:
    profession: peleteria
    inputs: {cuero_curtido: 4, tela_tejida: 1}
    output: {artesano_cuero_1: 1}
    min_rank: 1
    energy: 2
    xp: 12
  cota_ligera:
    profession: peleteria
    inputs: {cuero_curtido: 2, lingote: 2}
