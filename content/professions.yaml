  # ---- Joyería: anillos y amuletos para la ranura de joya (lingote + gema en bruto)
  anillo_engarzado:
    profession: joyeria
    inputs: {lingote: 1, gema_bruta: 1}
    output: {artesano_joya_1: 1}
    min_rank: 1
    energy: 2
    xp: 12
  collar_gemas:
    profession: joyeria
    inputs: {lingote: 2, gema_bruta: 2}
    output: {artesano_joya_2: 1}
    min_rank: 25
    energy: 2
    xp: 12
  amuleto_artesano:
    profession: joyeria
    inputs: {lingote: 3, gema_bruta: 3}
    output: {artesano_joya_3: 1}
    min_rank: 50
    energy: 2
    xp: 12

  # ---- Medicina (D-111): ungüentos y botiquines (extracto + tela o cuero: dos ramas o más)
  unguento:
    profession: medicina
    inputs: {extracto: 1, tela_tejida: 1}
    output: {unguento: 2}
    min_rank: 1
    energy: 1
    xp: 6
  botiquin:
    profession: medicina
    inputs: {extracto: 2, tela_tejida: 1, cuero_curtido: 1}
    output: {botiquin: 1}
    min_rank: 25
    energy: 2
    xp: 12
  vendaje_maestro:
