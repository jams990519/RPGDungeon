    name_key: profession.encantamiento.name
    how_key: profession.encantamiento.how
    branch: enchant
    perk: {disenchant: 0.30}                   # [ES] profesiones.md §0.4: desencantar da hasta 30 % más esencias al rango 100 (parejo con el rango)
  # ---- D-115 phase 2, camp side. [ES] Fase 2, lado del campamento: sus beneficios son de campamento o castillo (D-116):
  # valen para el campamento donde eres miembro y rige el MEJOR rango entre sus miembros (no se suman).
