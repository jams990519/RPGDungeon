  # ---- D-115 phase 2, camp side: Cantería and 🍲 Cocina. [ES] Fase 2, lado del campamento.
  # Cantería (refinado, 1 ⚡, 6 de experiencia de oficio): 3 piedras → 1 sillar. Lo piden las mejoras desde el nivel 7
  # (content/camp_upgrades.yaml) y la reparación de las defensas (balance.yaml camp_professions.repair_per_point).
  sillar:
    profession: canteria
    inputs: {piedra: 3}
    output: {sillar: 1}
    min_rank: 1
    energy: 1
    xp: 6
  # 🍲 Cocina (fabricación): carne, pescado y hierbas → raciones para la despensa del campamento (items.yaml "cooked"; el
  # mercader no las compra). Cada plato vale más raciones que lo crudo que lleva: ×1,5 en el rango 1, ×1,75 en el 25, ×2 en
  # el 50, ×2,25 en el 75 y ×2,5 en el 100. 6 de experiencia de oficio por ⚡, como las demás. Toda receta pide 2 oficios o más.
  racion_campamento:
    profession: cocina
    inputs: {carne: 1, hierba_curativa: 1}                     # [ES] desollador + herbolario: 2 raciones crudas → 3
    output: {racion_campamento: 1}
    min_rank: 1
    energy: 1
    xp: 6
  pescado_asado:
    profession: cocina
    inputs: {pescado: 2, madera: 1}                            # [ES] pescador + leñador (la leña): 2 raciones crudas → 3
    output: {pescado_asado: 1}
    min_rank: 1
    energy: 1
    xp: 6
  guiso_cazador:
    profession: cocina
    inputs: {carne: 2, pescado: 2, hierba_curativa: 1}         # [ES] 6 raciones crudas → 10
    output: {guiso_cazador: 1}
    min_rank: 25
    energy: 2
    xp: 12
  conserva:
    profession: cocina
    inputs: {carne: 3, pescado: 3, arcilla: 1, extracto: 1}    # [ES] + minero (el tarro) y destilación (la salmuera): 9 → 18
    output: {conserva: 1}
    min_rank: 50
    energy: 2
    xp: 12
  festin:
    profession: cocina
    inputs: {carne: 4, pescado: 4, hierba_curativa: 2, flor_luna: 1}   # [ES] 12 → 27
    output: {festin: 1}
    min_rank: 75
    energy: 2
    xp: 12
  banquete:
    profession: cocina
    inputs: {carne: 6, pescado: 6, extracto: 2, flor_luna: 2}  # [ES] 18 → 45
    output: {banquete: 1}
    min_rank: 100
    energy: 2
    xp: 12

  # ---- D-180 / D-183 (0.27): the terrain resources. [ES] Los recursos propios de cada terreno: cada uno tiene al menos una
  # receta, en la capa ligera (D-44): otra forma de hacer lo de siempre, con "variant" para que el nombre no se repita. Los
  # refinados nunca dejan ganar monedas (lo que sale × 0,5 vale menos que lo que entra) y van DESPUÉS de los de siempre (lo crudo
  # que se aportó de más a una obra sigue contando con la receta vieja: engine/professions/rules.py refined_from). Las de 🍲 Cocina
  # llevan carne o pescado (lo cocinado vale más raciones que lo crudo) y 6 de experiencia de oficio por ⚡, como todas.
  tela_lino: {profession: tejeduria, variant: lino, inputs: {lino: 3}, output: {tela_tejida: 1}, min_rank: 1, energy: 1, xp: 6}
  tela_juncos: {profession: tejeduria, variant: juncos, inputs: {juncos: 2, fibra: 1}, output: {tela_tejida: 1}, min_rank: 1, energy: 1, xp: 6}
  lingote_carbon: {profession: fundicion, variant: carbon, inputs: {pieza_metal: 3, carbon: 1}, output: {lingote: 2}, min_rank: 1, energy: 1, xp: 6}      # [ES] el carbón de la fragua: 3 piezas dan 2 lingotes
  lingote_chatarra: {profession: fundicion, variant: chatarra, inputs: {chatarra: 3}, output: {lingote: 1}, min_rank: 1, energy: 1, xp: 6}
  cuero_corteza: {profession: curtiduria, variant: corteza, inputs: {piel: 3, corteza: 1}, output: {cuero_curtido: 2}, min_rank: 1, energy: 1, xp: 6}   # [ES] taninos de la corteza: 3 pieles dan 2 cueros
  extracto_raiz: {profession: destilacion, variant: raiz_amarga, inputs: {raiz_amarga: 2, hierba_curativa: 1}, output: {extracto: 1}, min_rank: 1, energy: 1, xp: 6}
  sillar_arena: {profession: canteria, variant: arena, inputs: {piedra: 2, arena: 1}, output: {sillar: 1}, min_rank: 1, energy: 1, xp: 6}                # [ES] mortero de arena: 2 piedras en vez de 3
  pocion_vida_arena: {profession: alquimia, variant: arena, inputs: {extracto: 1, arena: 1}, output: {pocion_vida: 2}, min_rank: 1, energy: 1, xp: 6}    # [ES] frasco de vidrio en vez de barro
  pocion_vida_resina: {profession: alquimia, variant: resina, inputs: {extracto: 1, resina: 1}, output: {pocion_vida: 2}, min_rank: 1, energy: 1, xp: 6}  # [ES] frasco sellado con resina
  pocion_mayor_nenufar: {profession: alquimia, variant: nenufar, inputs: {extracto: 2, arcilla: 1, nenufar: 2}, output: {pocion_mayor: 1}, min_rank: 25, energy: 1, xp: 8}        # [ES] sin 🌸 flor de luna
  pocion_mayor_escarcha: {profession: alquimia, variant: flor_escarcha, inputs: {extracto: 2, cuarzo: 1, flor_escarcha: 2}, output: {pocion_mayor: 1}, min_rank: 25, energy: 1, xp: 8}
  unguento_musgo: {profession: medicina, variant: musgo, inputs: {extracto: 1, musgo: 2}, output: {unguento: 2}, min_rank: 1, energy: 1, xp: 6}
  unguento_cactus: {profession: medicina, variant: cactus, inputs: {cactus: 2, tela_tejida: 1}, output: {unguento: 2}, min_rank: 1, energy: 1, xp: 6}     # [ES] el jugo del cactus calma las heridas
  botiquin_miel: {profession: medicina, variant: miel, inputs: {extracto: 1, miel: 2, tela_tejida: 1}, output: {botiquin: 1}, min_rank: 25, energy: 2, xp: 12}
  racion_setas: {profession: cocina, variant: setas, inputs: {carne: 1, setas: 1}, output: {racion_campamento: 1}, min_rank: 1, energy: 1, xp: 6}         # [ES] 2 raciones crudas → 3
  racion_bayas: {profession: cocina, variant: bayas, inputs: {carne: 1, bayas: 2}, output: {racion_campamento: 1}, min_rank: 1, energy: 1, xp: 6}
  pescado_sal: {profession: cocina, variant: sal, inputs: {pescado: 2, sal: 1}, output: {pescado_asado: 1}, min_rank: 1, energy: 1, xp: 6}
  pescado_mazorca: {profession: cocina, variant: mazorca, inputs: {pescado: 2, mazorca: 1}, output: {pescado_asado: 1}, min_rank: 1, energy: 1, xp: 6}
  guiso_tomillo: {profession: cocina, variant: tomillo, inputs: {carne: 2, pescado: 2, tomillo: 1}, output: {guiso_cazador: 1}, min_rank: 25, energy: 2, xp: 12}   # [ES] 6 raciones crudas → 10
  guiso_datiles: {profession: cocina, variant: datiles, inputs: {carne: 2, pescado: 2, datiles: 2}, output: {guiso_cazador: 1}, min_rank: 25, energy: 2, xp: 12}
  conserva_hielo: {profession: cocina, variant: hielo, inputs: {carne: 3, pescado: 3, sal: 1, hielo: 1}, output: {conserva: 1}, min_rank: 50, energy: 2, xp: 12}     # [ES] 9 → 18, sin tarro ni salmuera
