    emoji: "💱"
    name_key: profession.comercio.name
    how_key: profession.comercio.how
    branch: service                            # [ES] D-116: oficio de servicio: no da nada en combate, da dinero
    perk: {sell: 0.20}                         # [ES] D-116: +20 % de monedas al vender al mercader, al trueque o el equipo, al rango 100

  # ---- D-115, phase 2 (gear side): ✨ Enchanting. [ES] Fase 2 de la red de oficios, lado del equipo (red-de-oficios.md §2.3 y §4):
  # desencanta equipo viejo (lo destruye) en esencias y encanta las piezas con ellas. Rama propia "enchant": no usa estaciones ni
  # recetas de esta lista; sube desencantando (6 por vez, 1 ⚡) y encantando (12 por vez, 2 ⚡). Números en balance.yaml enchanting.
  encantamiento:
